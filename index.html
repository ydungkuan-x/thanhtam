s"},{"word":"diagnose","meaning":"to find out what illness a person has"},{"word":"artificial intelligence","meaning":"computer systems that can copy intelligent human behaviour"},{"word":"psychologist","meaning":"a person who studies the mind and helps people with mental problems"},{"word":"available","meaning":"able to be used or reached"},{"word":"in private","meaning":"without other people seeing or hearing"},{"word":"shortage","meaning":"a situation when there is not enough of something"},{"word":"effective","meaning":"producing the result you want"},{"word":"severe","meaning":"very serious or bad"}],"mcq_answers":{"1":"B","2":"C","3":"A","4":"A","5":"B","6":"B"},"media_url":"https://drive.google.com/file/d/1sRrjKbyufSL6BTv1-L7K0-rSnca01_0q/view","media_preview":"https://drive.google.com/file/d/1sRrjKbyufSL6BTv1-L7K0-rSnca01_0q/preview","media_type":"audio","id":"i13"},{"level":"Intermediate","index":14,"title":"Animals","audio_title":"African Elephants Call, Answer to Individual Names","source_url":"https://learningenglish.voanews.com/a/african-elephants-call-answer-to-individual-names/7651744.html","watch":"","page":193,"page_end":199,"before":"1. Which animals do you think are the most intelligent? Why?\n2. Does your pet (or a pet you know) react to its name?\n3. Guess: how do elephants communicate with each other over long distances?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. A new study finds that African elephants call each other by individual\n______________.\n2. The names are part of the low ______________ that elephants make.\n3. Elephants can hear these sounds over long distances across the ______________.\n4. Some ocean animals, such as the ______________, invent their own names when\nthey are very young.\n5. The birds called ______________ may also use names.\n6. The study was released in the publication Nature Ecology & ______________.\n7. Biologists used machine ______________ to find names in the recordings.\n8. The sounds were recorded in Samburu National Reserve and Amboseli National Park\nin ______________.\n9. The model found the elephant being called ______________ of the time.\n10. When they heard their names, the elephants moved their ears and lifted their\n______________.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. Why is the elephants’ behaviour surprising?\nA Very few animals call each other by individual names.\nB Elephants are usually silent.\nC Elephants are afraid of humans.\n2. What do scientists believe about animals that use names?\nA They live alone.\nB They often have complex social structures.\nC They are always very large.\n3. What ability do all the naming animals share?\nA They can understand human language.\nB They can learn to make new sounds throughout their lives.\nC They can see in the dark.\n4. How did the researchers check their results?\nA They taught elephants new names.\nB They played recordings to elephants and watched their reactions.\nC They asked zoo workers.\n5. What does Mickey Pardo say about elephants’ names?\nA Elephants use names in every call.\nB Elephants use names, but probably not in most of their communication.\nC Only young elephants use names.\n6. What does George Wittemyer mean by “cracked open the door a bit to the elephant\nmind”?\nA Scientists now understand everything about elephants.\nB Scientists have just begun to understand how elephants think.\nC Elephants can open doors.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. rare\na. to behave in a particular way because of something\nthat happens\n2. rumble\nb. the full set of sounds that can be heard or made\n3. individual\nc. a long, low, deep sound\n4. communication\nd. having many connected parts; complicated\n5. complex\ne. single and separate from others\n6. predict\nf. not happening or found very often\n7. react\ng. to say what will happen or what something is\n8. range\nh. to find the answer to a difficult problem\nWord / phrase\nMeaning\n9. incredible\ni. the act of sharing information with others\n10. crack\nj. extremely good or surprising","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. Snow is ______________ in Hà Nội, it almost never happens.\n2. We heard the ______________ of thunder in the distance.\n3. The teacher spoke to each ______________ student about their progress.\n4. Good ______________ is the key to a happy family.\n5. Bees live in a very ______________ society with different jobs.\n6. It’s hard to ______________ the weather in the mountains.\n7. How did your parents ______________ when you showed them your test results?\n8. Dogs can hear sounds that are outside the human hearing ______________.\n9. The view from the top of the mountain was ______________!\n10. After hours of trying, we finally ______________ the maths puzzle.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nThe main finding + why it is\nrare\nOther animals that use names\nHow the study was done (place,\nmethod, result)\nHow elephants reacted + what\nscientists still don’t know\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• Scientists have discovered that...\n• This is rare because...\nComparing\n• Like humans...\n• Other animals such as ... also...\nDescribing research\n• The researchers recorded...\n• They found that...\nFinishing\n• It shows that elephants are...\n• I was amazed that...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour younger cousin Bin sends you this voice message:\n“Guess what! We’re going to the safari park on Sunday! What’s the coolest fact you\nknow about elephants? I want to tell my friends!”\nRound 1: Record a voice reply to Bin (60-90 seconds). In your reply:\n• react with excitement\n• tell him the most interesting fact from the report, in simple words\n• add TWO more details (how scientists found out / how elephants reacted)\n• give him ONE thing to look for at the safari park\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nReacting\n• No way, that’s so cool!\n• Lucky you!\nTelling a fact\n• Okay, here’s an amazing fact: ...\n• Scientists found out that...\nAdding details\n• And guess what? ...\n• Also...\nEnding\n• Look out for...\n• Tell me what you see!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nnames \n \n6 \nEvolution \n \n2 \nrumbles \n“low rumbles” 7 \nlearning \n \n3 \nsavanna / savannah \n \n8 \nKenya \n \n4 \ndolphin \n \n9 \n28 percent / 28% \n \n5 \nparrots \n \n10 trunks","answer_l2":"1 A    2 B    3 B    4 B    5 B    6 B","answer_v1":"1 f    2 c    3 e    4 i    5 d    6 g    7 a    8 b    9 j    10 h","answer_v2":"1 rare    2 rumble    3 individual    4 communication    5 complex    6 predict    7 react    8 \nrange    9 incredible    10 cracked","answer_speaking":": Model summary \nScientists have discovered that African elephants call each other by individual names \nand answer when they hear their own name. This is rare in the animal world. The \nnames are part of the low rumbles that elephants use for long-distance \ncommunication across the savanna. Scientists think animals with complex social \nlives are more likely to use names. Like humans, dolphins and parrots also use \nnames, and all of these animals can learn new sounds throughout their lives. The \nresearchers recorded elephants in Kenya and used machine learning to predict which\nelephant was being called; it was right 28 percent of the time. When they played \nrecordings, the elephants reacted strongly to their own names, moving their ears and \nlifting their trunks. Some sounds are below the human hearing range, and scientists \nstill don’t know exactly which part is the name. As one scientist said, they have just \nbegun to crack the elephant mind. \nSpeaking Exercise 2: Model voice message \nNo way, a safari park? That’s so cool, lucky you! Okay, here’s an amazing fact for \nyour friends: elephants have names! Scientists found out that African elephants call \neach other by individual names, just like we do. They recorded lots of elephant \nsounds, deep, low rumbles, and a computer helped them find the names. And guess \nwhat? When the scientists played an elephant’s name, that elephant reacted, it moved \nits ears and lifted its trunk, like saying, ‘Who, me?’ At the park, look out for \nelephants making low sounds to each other, maybe they’re calling a friend! Tell me \nwhat you see!","flashcards":[{"word":"rare","meaning":"not happening or found very often"},{"word":"rumble","meaning":"a long, low, deep sound"},{"word":"individual","meaning":"single and separate from others"},{"word":"communication","meaning":"the act of sharing information with others"},{"word":"complex","meaning":"having many connected parts; complicated"},{"word":"predict","meaning":"to say what will happen or what something is"},{"word":"react","meaning":"to behave in a particular way because of something that happens"},{"word":"range","meaning":"the full set of sounds that can be heard or made"},{"word":"incredible","meaning":"extremely good or surprising"},{"word":"crack","meaning":"to find the answer to a difficult problem"}],"mcq_answers":{"1":"A","2":"B","3":"B","4":"B","5":"B","6":"B"},"media_url":"https://drive.google.com/file/d/1amGdRS1zMECX0Xft3Y_QUw7Xur7Hgob_/view","media_preview":"https://drive.google.com/file/d/1amGdRS1zMECX0Xft3Y_QUw7Xur7Hgob_/preview","media_type":"audio","id":"i14"},{"level":"Intermediate","index":15,"title":"Tourism","audio_title":"Too Much Tourism?","source_url":"https://learningenglish.voanews.com/a/too-much-tourism/4118421.html","watch":"","page":200,"page_end":206,"before":"1. Which places in Vietnam are very crowded with tourists? When?\n2. What are the good and bad effects of tourism on a town?\n3. Have you heard the word “overtourism”? What do you think it means?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. Venice, Italy, is planning to bar some large passenger ______________.\n2. Barcelona, Spain, has placed restrictions on ______________.\n3. “Overtourism” means too many tourists visiting at ______________.\n4. Taleb Rifai called the anti-tourist slogans “a wake-up ______________”.\n5. The number of tourist trips is expected to reach ______________ by 2030.\n6. In 2016 there were about ______________ tourist trips.\n7. Tourism provides about ______________ of the world’s GDP.\n8. Ecuador limits visitors to the Galapagos Islands to ______________ a year.\n9. Dubrovnik, in Croatia, is considering a limit of ______________ visitors a day.\n10. Prague has a program that sends visitors “off the beaten ______________”.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. What is the report mainly about?\nA the cheapest places to visit in Europe\nB how cities are dealing with too many tourists\nC why tourists prefer Asia\n2. What does Jonathan Keates say about Venice?\nA The crowds are interfering with life in the city.\nB Venice needs more tourists.\nC Tourists should stay in hotels only.\n3. Why is the number of tourists growing?\nA Cheap airline tickets and more travel from China.\nB Hotels are giving free rooms.\nC More people are working from home.\n4. What is Taleb Rifai’s main point?\nA Tourism should be stopped.\nB Growth is not the enemy, but tourism must be sustainable and responsible.\nC Only rich people should travel.\n5. Why does the report mention Greenwich and Richmond?\nA They are the most crowded places in London.\nB London is encouraging tourists to visit less crowded areas.\nC They banned tourists.\n6. What do experts say at the end?\nA One big law will solve the problem.\nB There is no single solution, but simple changes can help.\nC Cities should close their museums.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. restriction\na. more and more\n2. rental\nb. a rule that limits what people can do\n3. slogan\nc. to become much stricter about stopping something\n4. off the beaten track\nd. the place someone is travelling to\n5. promote\ne. to stop something from happening in the normal\nway\n6. destination\nf. able to continue without causing damage to the\nenvironment or people\n7. sustainable\ng. a home or thing that you pay to use for a period of\ntime\n8. interfere with\nh. to help something become popular or successful\nWord / phrase\nMeaning\n9. crack down on\ni. far away from the places most tourists go\n10. increasingly\nj. a short phrase that is easy to remember, used to get\nattention","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. There are new ______________ on how many people can climb the mountain each\nday.\n2. We stayed in a holiday ______________ near the beach instead of a hotel.\n3. The protesters held signs with ______________ like “Our city, not your\nplayground”.\n4. We found a quiet village ______________, with no other tourists.\n5. The city is using social media to ______________ its night markets.\n6. Đà Nẵng has become a popular ______________ for families.\n7. Using refillable water bottles is a more ______________ way to travel.\n8. Loud music from the bar ______________ my sleep.\n9. The police are ______________ illegal parking near the old town.\n10. Young people are ______________ choosing to travel alone.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat is overtourism? Which\ncities are taking action?\nWhy tourism is growing + why\nit matters (numbers)\nRifai’s opinion\nSolutions from different places\n(3)\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• This report is about..., which means...\n• For example, Venice...\nCauses and numbers\n• The number of tourist trips is expected to...\n• One reason is...\nSolutions\n• Some places are limiting...\n• Others are trying to...\nFinishing\n• Experts say there is no single...\n• I think Vietnam should...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour foreign friend Emma, who is visiting Vietnam next month, writes:\n“I want to see Hội An, but I read online that it’s super crowded. Any tips for being a\ngood tourist and avoiding the crowds?”\nRound 1: Record a voice message to Emma (60-90 seconds). In your message:\n• welcome her and react to her plan\n• explain the idea of overtourism briefly (use the report)\n• give TWO tips for avoiding crowds or being a responsible tourist\n• suggest ONE place off the beaten track, and finish warmly\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nWelcoming\n• That’s great news!\n• You’re going to love it.\nExplaining\n• Some places have a problem called...\n• Basically, it means...\nTips\n• Try to go early in the morning...\n• It’s a good idea to...\nFinishing\n• Let me know if you need anything!\n• Can’t wait to see you!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nships \n \n6 \n1.2 billion \n \n2 \napartment rentals \n“apartment \nrentals” \n7 \n10 percent / 10% \n \n3 \nonce \n \n8 \n100,000 / 100000 \n \n4 \ncall \n \n9 \n4,000 / 4000 \n \n5 \n1.8 billion \n \n10 track","answer_l2":"1 B    2 A    3 A    4 B    5 B    6 B","answer_v1":"1 b    2 g    3 j    4 i    5 h    6 d    7 f    8 e    9 c    10 a","answer_v2":"1 restrictions    2 rental    3 slogans    4 off the beaten track    5 promote    6 destination    \n7 sustainable    8 interfered with    9 cracking down on    10 increasingly","answer_speaking":": Model summary \nThis report is about overtourism, which means too many tourists in one place at once. \nEuropean cities are increasingly taking action: Venice plans to stop some big ships, \nand Barcelona has put restrictions on apartment rentals. A man from a Venice \ncharity says crowds interfere with life in the city. A UN tourism leader called anti-\ntourist slogans a wake-up call. The number of tourist trips is expected to rise from \n1.2 billion in 2016 to 1.8 billion by 2030, mainly because of cheap flights and more \nChinese travellers, and tourism is about 10 percent of the world’s economy. He says \ngrowth isn’t the enemy, but tourism must be sustainable. Some places limit visitors, \nthe Galapagos allows 100,000 a year, while Prague and London promote areas off \nthe beaten track, and Barcelona is cracking down on illegal rentals. Experts say \nthere is no single answer for each destination, but simple changes can help. \nSpeaking Exercise 2: Model voice message \nHi Emma! That’s great news, you’re going to love Hội An. You’re right, it can get \nreally crowded. Some places in the world have a problem called overtourism, \nbasically, too many tourists at the same time, which makes life hard for local people. \nSo here are my tips. Try to visit the old town early in the morning, before the tour \nbuses arrive, or on a weekday. And it’s a good idea to stay in a small family\nhomestay and eat at local places, so your money helps the community. If you want \nsomewhere off the beaten track, cycle to Trà Quế vegetable village nearby, it’s \nquiet and beautiful. Let me know if you need anything. Can’t wait to see you!\nPHẦN 3: ADVANCED","flashcards":[{"word":"restriction","meaning":"a rule that limits what people can do"},{"word":"rental","meaning":"a home or thing that you pay to use for a period of time"},{"word":"slogan","meaning":"a short phrase that is easy to remember, used to get attention"},{"word":"off the beaten track","meaning":"far away from the places most tourists go"},{"word":"promote","meaning":"to help something become popular or successful"},{"word":"destination","meaning":"the place someone is travelling to"},{"word":"sustainable","meaning":"able to continue without causing damage to the environment or people"},{"word":"interfere with","meaning":"to stop something from happening in the normal way"},{"word":"crack down on","meaning":"to become much stricter about stopping something"},{"word":"increasingly","meaning":"more and more"}],"mcq_answers":{"1":"B","2":"A","3":"A","4":"B","5":"B","6":"B"},"media_url":"https://drive.google.com/file/d/1VF--04QWe1JfmU6u3K8myB96F_zGCN5k/view","media_preview":"https://drive.google.com/file/d/1VF--04QWe1JfmU6u3K8myB96F_zGCN5k/preview","media_type":"audio","id":"i15"},{"level":"Advanced","index":1,"title":"Education","audio_title":"Grit: The power of passion and perseverance","source_url":"https://youtube.com/watch?v=H14bBuluwB8","watch":"The whole talk (about 6 min 10 s)","page":209,"page_end":217,"before":"1. Who was the best student in your class at school? Were they the most intelligent,\nor the hardest-working?\n2. Is it more important for a school to measure intelligence or effort? Why?\n3. Think of a time you gave up on something. What would have helped you\ncontinue?","listening1":"Exercise 1. Read the notes first. Then watch the talk and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nFrom teacher to psychologist\n• At 27, she left a demanding job in (1) ______________\n• She taught (2) ______________ math in New York City public schools\n• She noticed that IQ was not the only difference between her best and worst\nstudents\nWhere she studied grit\n• West Point Military Academy: which (3) ______________ would stay and which\nwould drop out\n• The National (4) ______________: which children would go furthest\n• Private companies: which salespeople would keep their jobs and make the most\n(5) ______________\nWhat grit is\n• Grit = passion and (6) ______________ for very long-term goals\n• Grit is living life like a (7) ______________, not a sprint\n• Chicago study: thousands of high school (8) ______________ filled in grit\nquestionnaires\n• Grittier students were more likely to (9) ______________\nHow to build grit\n• The best idea so far: the “growth mindset”, developed at Stanford by (10)\n______________","listening2":"Exercise 2. Watch the talk again without stopping and then answer Questions 1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nApart from cadets, spellers and salespeople, which TWO other groups does she mention?\nA rookie teachers in tough neighbourhoods\nB university professors\nC high school students in Chicago\nD professional footballers\nE hospital nurses\nQuestions 3-4. Choose TWO letters, A-E.\nIn the Chicago study, grit still predicted graduation even when the researchers matched\nstudents on which TWO things?\nA family income\nB number of brothers and sisters\nC standardized test scores\nD height and weight\nE hours spent on sport\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. Why did she leave the classroom and go to graduate school?\nA She was tired of marking homework.\nB She believed education needed a better understanding of students’ motivation and\npsychology.\nC Her school closed down.\nD She wanted a higher salary.\n6. What does she say about the relationship between talent and grit?\nA Talented people are usually the grittiest.\nB Talent does not make you gritty; the two are often unrelated or even inversely\nrelated.\nC Grit is a kind of talent you are born with.\nD Gritty people are always less intelligent.\n7. How does she answer the question of how to build grit in children?\nA She gives a five-step programme.\nB She honestly admits that science knows very little about it.\nC She says only parents can build grit.\nD She recommends more tests.\n8. According to the growth mindset research, children who learn how the brain grows\nin response to challenge\nA get higher IQ scores immediately.\nB are more likely to keep going when they fail.\nC stop worrying about failure completely.\nD prefer easier tasks.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. perseverance\na. something that shows what is likely to happen\n2. stamina\nb. continuing to try to do something even when it is\ndifficult\nExpression\nMeaning\n3. predictor\nc. to leave a school or course before finishing it\n4. drop out\nd. the belief that your abilities can improve with\neffort\n5. follow through on\ne. likely to experience something bad\n6. inversely related\nf. the ability to keep going for a long time\n7. growth mindset\ng. connected in such a way that when one increases,\nthe other decreases\n8. struggle\nh. to finish something you have promised or started\n9. at risk of\ni. a promise or decision to do something\n10. commitment\nj. to try very hard but find something difficult","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. Grit is passion and ______________ for very long-term\ngoals.\nPERSEVERE\n2. Grit was a significant ______________ of success.\nPREDICT\n3. Education needs a ______________ and psychological\nunderstanding of students.\nMOTIVATE\n4. Grit is usually ______________ to talent.\nRELATE\n5. Many talented people don’t keep their ______________.\nCOMMIT\n6. IQ was not the only difference; some of the smartest\nstudents were ______________.\nSTRUGGLE\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. Many talented people don’t finish what they promised to\ndo.\nFOLLOW\nMany talented people don’t ____________________________ their commitments.\n8. Grit matters most for students who might leave school\nearly.\nRISK\nGrit matters most for students who are ____________________________.\n9. She believed every student could learn the material if they\nworked hard enough.\nEFFORT\nShe believed every student could learn the material\n____________________________.\n10. Scientists don’t know much about how to build grit.\nLITTLE\nScience knows ____________________________ how to build grit.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nThe speaker’s background and\nwhat she noticed as a teacher\nThe groups she studied (at least\n3)\nHer definition of grit (2 images)\nPlan\nYour keywords\nThe Chicago study and its result\nHow we might build grit + my\nreaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker’s central claim is that...\n• She came to this idea when she was teaching...\nReporting research\n• In every setting she studied, one factor stood out: ...\n• Even after controlling for..., grittier students were still...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour younger cousin Bảo sends you this message:\n“Failed my maths test AGAIN 😞 I’m just not a maths person. I’m going to drop\nmaths and choose an easier subject next year.”\nRound 1: Record a voice reply (90-120 seconds). In your reply:\n• show you understand how he feels\n• challenge the idea of being “not a maths person”, using ideas from the talk\n• explain what a growth mindset is in simple words\n• suggest ONE concrete plan for the next month\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nEmpathising\n• Oh no, that must be really disappointing.\n• I know how frustrating it is when...\nChallenging gently\n• I’m not sure there’s such a thing as a maths person, though.\n• Funnily enough, I watched a talk about this.\nExplaining\n• Basically, a growth mindset means...\n• Your brain actually gets stronger when...\nSuggesting a plan\n• What if you tried... for a month?\n• Why not focus on the topics you find hardest?","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nmanagement \nconsulting \n \n6 \nperseverance \n \n2 \nseventh-grade / \nseventh grade \n“seventh \ngrade math” \n7 \nmarathon \n \n3 \ncadets \n \n8 \njuniors \n \n4 \nSpelling Bee \n \n9 \ngraduate \n \n5 \nmoney \n \n10 Carol Dweck","answer_l2":"1-2 A, C (any order)    3-4 A, C (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 b    2 f    3 a    4 c    5 h    6 g    7 d    8 j    9 e    10 i","answer_v2":"Part A: 1 perseverance    2 predictor    3 motivational    4 unrelated    5 commitments    6 \nstruggling   |   Part B: 7 follow through on    8 at risk of dropping out    9 with enough \neffort    10 very little about","answer_speaking":": Model summary (2-minute version) \nThe speaker’s central claim is that grit, not just intelligence, is what predicts success. \nShe came to this idea when she was teaching seventh-grade maths in New York and\nnoticed that some of her smartest students were struggling, while others with \nordinary IQs did very well. So she became a psychologist and studied people in tough \nsituations: cadets at West Point, children in the National Spelling Bee, new teachers \nin difficult schools and salespeople. In every setting, one factor stood out, and it \nwasn’t IQ or good looks. It was grit, which she defines as passion and perseverance \nfor very long-term goals. It means having stamina and living life like a marathon, not \na sprint. In a study of thousands of high school students in Chicago, grittier students \nwere more likely to graduate, even after controlling for family income and test \nscores, so grit is a strong predictor, especially for students at risk of dropping out. \nInterestingly, talent doesn’t make you gritty; the two are often inversely related. She \nadmits we know little about building grit, but the growth mindset seems promising. \nWhat struck me most was her honesty about what science doesn’t know. \nSpeaking Exercise 2: Model voice reply \nOh no, Bảo, that must be really disappointing, and I know how frustrating it is when \nyou work and still fail. But I’m not sure there’s such a thing as a ‘maths person’, \nhonestly. Funnily enough, I watched a talk by a psychologist who studies success. \nShe found that the people who do best aren’t always the most talented; they’re the \nones with grit, which means they keep going for a long time, even after setbacks. She \nalso talked about a ‘growth mindset’. Basically, your brain actually gets stronger \nwhen you struggle with something hard, so failing a test doesn’t mean you can’t do \nmaths. It means you haven’t learned it yet. So what if you tried this for one month: \nevery evening, spend twenty minutes only on the type of question you got wrong. \nDon’t drop maths yet. Give yourself a real chance first. I can help you on Sundays if \nyou like!","flashcards":[{"word":"perseverance","meaning":"continuing to try to do something even when it is difficult"},{"word":"stamina","meaning":"the ability to keep going for a long time"},{"word":"predictor","meaning":"something that shows what is likely to happen"},{"word":"drop out","meaning":"to leave a school or course before finishing it"},{"word":"follow through on","meaning":"to finish something you have promised or started"},{"word":"inversely related","meaning":"connected in such a way that when one increases, the other decreases"},{"word":"growth mindset","meaning":"the belief that your abilities can improve with effort"},{"word":"struggle","meaning":"to try very hard but find something difficult"},{"word":"at risk of","meaning":"likely to experience something bad"},{"word":"commitment","meaning":"a promise or decision to do something"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1on-KS4VzSadRFrwYiQyRohKKkh_hFrvB/view","media_preview":"https://drive.google.com/file/d/1on-KS4VzSadRFrwYiQyRohKKkh_hFrvB/preview","media_type":"video","id":"a1"},{"level":"Advanced","index":2,"title":"Work & Careers","audio_title":"Why some of us don't have one true calling","source_url":"https://youtube.com/watch?v=4sZdcB6bjI8","watch":"From “A multipotentialite is someone...” (about\n06:02) until she says “That is where you’ll do your best work.”\n(about 11:41)","page":218,"page_end":226,"before":"1. What did you want to be when you were a child? Do you still want to do that\njob?\n2. Is it better to be an expert in one thing or to be good at many things? Why?\n3. Do you think people will have one career or several careers in the future?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nWhat a multipotentialite is\n• Someone with many interests and (1) ______________\n• Other names: a polymath or a (2) ______________ person\n• Barbara Sher calls them “(3) ______________”\nSuperpower 1: idea synthesis\n• Idea (4) ______________ = combining two or more fields to create something\nnew\n• Sha Hwang and Rachel Binx founded Meshu, which makes custom (5)\n______________ inspired by geography\n• Innovation happens at the (6) ______________ between fields\nSuperpower 2: rapid learning\n• Multipotentialites are used to being (7) ______________\n• Nora Dunn was a child concert (8) ______________, so she now types very fast\nSuperpower 3: adaptability\n• (9) ______________ = being able to become whatever you need to be in a\nsituation\n• Fast Company called it the most important skill of the (10) ______________","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO jobs has Nora Dunn had?\nA concert pianist (as a child)\nB financial planner\nC lawyer\nD architect\nE nurse\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO kinds of work does Abe Cajudo do?\nA video director\nB Kickstarter consultant\nC doctor\nD chef\nE airline pilot\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. How is multipotentiality often seen in our culture, according to the speaker?\nA as a rare talent to be celebrated\nB as a limitation or a problem to overcome\nC as a normal stage for teenagers\nD as an advantage only for artists\n6. Why does she say pursuing an interest is rarely a waste of time?\nA because you can always return to it later\nB because you take skills with you into every new area\nC because employers like long CVs\nD because hobbies make you rich\n7. What does she say about teams of specialists and multipotentialites?\nA They usually argue too much.\nB Specialists should always lead them.\nC The specialist goes deep and the multipotentialite brings breadth, which makes a\nstrong team.\nD They only work well in technology companies.\n8. What is her main message?\nA Everyone should become a multipotentialite.\nB Accept the way you are naturally wired and build a life around it.\nC Choose one career as early as possible.\nD Specialists are more successful.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. creative pursuit\na. someone who is starting to learn something\n2. synthesis\nb. the place where two things meet or cross\n3. intersection\nc. a wide range of knowledge or interests\nExpression\nMeaning\n4. rapid\nd. the combination of separate ideas into a new\nwhole\n5. beginner\ne. able to be used in different situations\n6. transferable\nf. to accept something willingly and with enthusiasm\n7. adaptability\ng. in great detail\n8. breadth\nh. an artistic or imaginative activity you spend time\non\n9. in depth\ni. happening very quickly\n10. embrace\nj. the ability to change to suit new conditions","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. Fast Company named ______________ the most\nimportant skill of the 21st century.\nADAPT\n2. A lot of ______________ happens where different fields\nmeet.\nINNOVATE\n3. Many skills are ______________ from one job to another.\nTRANSFER\n4. Multipotentialites bring ______________ to a team.\nBROAD\n5. ______________ go deep into one area.\nSPECIAL\n6. Idea ______________ means combining fields to create\nsomething new.\nSYNTHESISE\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. New ideas often appear where two fields meet.\nINTERSECTION\nNew ideas often appear ____________________________ two fields.\n8. They don’t mind starting something new with no\nexperience.\nBEGINNERS\nThey are ____________________________.\n9. You should accept the way you are naturally made.\nEMBRACE\nYou should ____________________________.\n10. She has never been able to choose just one career.\nSETTLE\nShe has never been able to ____________________________.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nWhat a multipotentialite is (+\nother names)\nSuperpower 1 + example\nSuperpower 2 + example\nSuperpower 3 + example\nPlan\nYour keywords\nSpecialists vs multipotentialites\n+ my reaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker argues that people with many interests are not...\n• She calls them...\nListing\n• The first superpower is..., which means...\n• A good example of this is...\n• Last but not least...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour friend Ngân sends you this message:\n“My parents say I keep changing my mind: music, then coding, now photography.\nThey say I’ll never have a real career. Maybe they’re right? 😔”\nRound 1: Record a voice reply (90-120 seconds). In your reply:\n• reassure her, without dismissing her parents’ worries\n• explain the idea of a multipotentialite and ONE superpower\n• suggest how she could combine two of her interests\n• end on an encouraging note\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nReassuring\n• I don’t think there’s anything wrong with you at all.\n• I can see why your parents are worried, though.\nExplaining\n• There’s actually a word for people like you: ...\n• One of their superpowers is...\nSuggesting\n• What if you combined... and...?\n• You could start by...\nEncouraging\n• The world needs people like you!\n• Go for it!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \ncreative pursuits \n \n6 \nintersections \n \n2 \nRenaissance \nRenaissance \nperson \n7 \nbeginners \n \n3 \nscanners \n \n8 \npianist \n \n4 \nsynthesis \n \n9 \nAdaptability \n \n5 \njewelry / jewellery \n \n10 21st century","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 C    8 B","answer_v1":"1 h    2 d    3 b    4 i    5 a    6 e    7 j    8 c    9 g    10 f","answer_v2":"Part A: 1 adaptability    2 innovation    3 transferable    4 breadth    5 Specialists    6 \nsynthesis   |   Part B: 7 at the intersection of    8 used to being beginners    9 embrace your \ninner wiring    10 settle on one career","answer_speaking":": Model summary (2-minute version) \nThe speaker argues that people with many interests are not flawed; they are what she \ncalls multipotentialites, people with many interests and creative pursuits. Other \nnames for them are polymaths, Renaissance people or, as Barbara Sher says, \nscanners. Our culture often treats this as a limitation, but she says they have three \nsuperpowers. The first is idea synthesis: combining fields to create something new. A\ngood example is Meshu, a company that combines maps and design to make \njewellery. Innovation happens at the intersections. The second is rapid learning. \nMultipotentialites are used to being beginners, and their skills are transferable: a \nformer child pianist became the fastest typist she knows, and her sales experience \nhelps her pitch to editors. The third is adaptability, which Fast Company called the \nmost important skill of the twenty-first century. She also says specialists who work in \ndepth and multipotentialites who bring breadth make excellent teams. Her message \nis to embrace the way you are wired. What struck me most was that switching \ninterests is not a waste of time. \nSpeaking Exercise 2: Model voice reply \nHey Ngân, I don’t think there’s anything wrong with you at all, although I can see \nwhy your parents are worried. They just want you to be safe. But I watched a talk \nabout people exactly like you. There’s actually a word for them: multipotentialites, \npeople with lots of interests. The speaker says they have special strengths. One of \nthem is combining different fields to create something new, which is where a lot of \ninnovation happens. And nothing you learn is wasted, because your skills move with \nyou. So what if you combined your interests? You could make short music videos \nwith your photography and build your own website to show them. That’s three skills \nin one project, and it could even become a career. The world needs people like you, \nso go for it!","flashcards":[{"word":"creative pursuit","meaning":"an artistic or imaginative activity you spend time on"},{"word":"synthesis","meaning":"the combination of separate ideas into a new whole"},{"word":"intersection","meaning":"the place where two things meet or cross"},{"word":"rapid","meaning":"happening very quickly"},{"word":"beginner","meaning":"someone who is starting to learn something"},{"word":"transferable","meaning":"able to be used in different situations"},{"word":"adaptability","meaning":"the ability to change to suit new conditions"},{"word":"breadth","meaning":"a wide range of knowledge or interests"},{"word":"in depth","meaning":"in great detail"},{"word":"embrace","meaning":"to accept something willingly and with enthusiasm"}],"mcq_answers":{"5":"B","6":"B","7":"C","8":"B"},"media_url":"https://drive.google.com/file/d/1bt_h6mhVNUJdrEt3p-ORqjUkXZ8XIvVB/view","media_preview":"https://drive.google.com/file/d/1bt_h6mhVNUJdrEt3p-ORqjUkXZ8XIvVB/preview","media_type":"video","id":"a2"},{"level":"Advanced","index":3,"title":"Health","audio_title":"How to live to be 100+","source_url":"https://youtube.com/watch?v=I-jk9ni4XWk","watch":"From “But first I’d like to debunk some common\nmyths” (about 01:44) until he says “That’s called the grandmother\neffect.” (about 07:13)","page":227,"page_end":234,"before":"1. Do you know anyone who is over 90? What is their lifestyle like?\n2. Which is more important for a long life: your genes or your lifestyle?\n3. How are older people treated in Vietnam compared with other countries?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nMyth 1: if you try hard, you can live to 100\n• Only about one in (1) ______________ Americans lives to be 100\n• We are not programmed for longevity\nMyth 2: treatments can stop ageing\n• Our bodies have 35 trillion (2) ______________\n• They renew themselves about once every (3) ______________\n• A 65-year-old is ageing about (4) ______________ times faster than a 12-year-\nold\n• The body can last about 90 years, but US life expectancy is only (5)\n______________\nThe first Blue Zone: Sardinia\n• An island off the coast of (6) ______________; the highlands of the Nuoro\nprovince\n• About (7) ______________ more centenarians than in America\n• Bread made from (8) ______________; grass-fed cheese high in omega-3s\n• Cannonau wine, with three times the (9) ______________ of other wines\n• Older people living close to their families gain extra years: the “(10)\n______________”","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO examples of permanent damage to the body does the speaker give?\nA brain cells that die without oxygen\nB knee cartilage damaged by playing tennis too hard\nC hair turning grey\nD losing weight too quickly\nE sleeping too little\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO things are true of the Sardinian highlanders?\nA Many of them were shepherds.\nB 102-year-olds still ride their bikes to work.\nC They eat a lot of red meat every day.\nD They moved there from mainland Italy recently.\nE Most of them live alone.\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. Why does he say humans are “not programmed for longevity”?\nA Our genes stop working at 50.\nB Evolution stops caring about us once we have had children and grandchildren.\nC Modern food is too unhealthy.\nD We don’t exercise enough.\n6. What does his example of copying a cassette tape show?\nA Old music sounds better.\nB Each time our cells renew themselves, small errors build up.\nC Technology can slow down ageing.\nD Cells copy themselves perfectly.\n7. How are older people treated in Sardinia?\nA They are sent to care homes.\nB They are respected and even celebrated, for example on calendars in bars.\nC They have to work until they die.\nD They are ignored by younger people.\n8. What does he say about the US compared with Sardinia?\nA Older Americans are more active.\nB American society seems to value people most at around age 24.\nC Americans live longer but less happily.\nD Americans have more centenarians.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. longevity\na. increasing faster and faster\n2. centenarian\nb. to increase gradually\n3. debunk\nc. physical strength and energy\n4. life expectancy\nd. consisting mainly of plants rather than meat\nExpression\nMeaning\n5. deprive of\ne. a person who is 100 years old or older\n6. build up\nf. the number of years a person is likely to live\n7. exponentially\ng. far away from other places and people\n8. plant-based\nh. to take away something that someone needs\n9. vigour\ni. to show that a belief is false\n10. isolated\nj. long life","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. Researchers study the secrets of ______________.\nLONG\n2. Life ______________ in the US is only 78.\nEXPECT\n3. Sardinia has about ten times more ______________ than\nAmerica.\nCENTURY\n4. The culture was ______________ from the rest of Europe\nfor centuries.\nISOLATE\n5. The damage builds up ______________.\nEXPONENT\n6. Even at 102, they live with extraordinary\n______________.\nVIGOROUS\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. I want to show that some popular beliefs about ageing are\nfalse.\nDEBUNK\nI want to ____________________________ about ageing.\n8. To reach 100, you also need to be lucky with your genes.\nLOTTERY\nTo reach 100, you also have to ____________________________.\n9. The damage slowly increases over the years.\nBUILDS\nThe damage ____________________________ over the years.\n10. If you stop oxygen reaching the brain, its cells die.\nDEPRIVE\nIf you ____________________________ oxygen, its cells die.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nThe speaker’s project and main\naim\nMyth 1 + evidence\nMyth 2 + evidence (cells,\nnumbers)\nSardinia: diet and lifestyle\nSardinia: the role of older\npeople + my reaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker studies places where people live...\n• He begins by debunking two myths: ...\nUsing numbers\n• According to the figures he gives...\n• That’s roughly ... times more than...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour aunt sends you this message in the family group chat:\n“We’re thinking of moving Grandpa into a care home in the city. He’s 82 and lives\nalone in the village. It would be easier for everyone. What do you all think?”\nRound 1: Record a voice reply for the family group (90-120 seconds). In your reply:\n• respond respectfully and acknowledge why the family is worried\n• use ONE or TWO ideas from the talk about older people and family\n• suggest ONE alternative or compromise\n• end warmly\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nRespectful opening\n• I completely understand why you’re worried about Grandpa.\n• It’s a really difficult decision.\nUsing evidence\n• I watched a talk about places where people live to 100.\n• One thing they have in common is...\nSuggesting\n• What if, instead, we...?\n• Maybe we could take turns to...\nEnding warmly\n• Whatever we decide, let’s ask Grandpa first.\n• Love you all.","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \n5,000 \n \n6 \nItaly\nQ \nAnswer \nNote \nQ \nAnswer \nNote \n2 \ncells \n \n7 \n10 times / ten times \n \n3 \neight years / 8 years \n \n8 \ndurum wheat \n \n4 \n125 \n \n9 \npolyphenols \n \n5 \n78 \n \n10 grandmother effect","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 j    2 e    3 i    4 f    5 h    6 b    7 a    8 d    9 c    10 g","answer_v2":"Part A: 1 longevity    2 expectancy    3 centenarians    4 isolated    5 exponentially    6 \nvigour / vigor   |   Part B: 7 debunk some common myths    8 win the genetic lottery    9 \nbuilds up    10 deprive your brain of","answer_speaking":": Model summary (2-minute version) \nThe speaker studies Blue Zones, places where people live much longer than average, \nto find the best lifestyle for longevity. He begins by debunking two myths. The first \nis that trying hard will get you to 100. In fact, only about one in five thousand \nAmericans becomes a centenarian, because we are not programmed to live that long; \nto get there, you also need lucky genes. The second myth is that treatments can stop \nageing. Our cells renew themselves about every eight years, and each time, small \nmistakes build up exponentially, like copying a cassette tape again and again. That’s \nwhy a 65-year-old ages much faster than a child. Still, the body could last about \nninety years, while American life expectancy is only 78, so we are losing about \ntwelve good years. His first Blue Zone is the Sardinian highlands, a culture isolated\nfor centuries, where men often live to 100 with real vigour. They eat a plant-based \ndiet, drink red wine full of polyphenols and treat older people with great respect. \nLiving near family adds years, which he calls the grandmother effect. What struck me \nmost was that respect itself can help people live longer. \nSpeaking Exercise 2: Model voice reply \nHi everyone. I completely understand why you’re worried about Grandpa; living \nalone at 82 isn’t easy. But I watched a talk by an explorer who studies places where \npeople often live to 100, and one thing really stayed with me. In those places, older \npeople stay close to their families and are respected, and apparently that alone can \nadd four to six years to their lives. He calls it the grandmother effect. I’m worried that \na care home in the city might make Grandpa feel cut off from everything he knows. \nWhat if, instead, one of us visited him every weekend, and we found a neighbour to \ncheck on him during the week? Or he could come and stay with us for part of the \nyear. Whatever we decide, let’s ask Grandpa first. Love you all.","flashcards":[{"word":"longevity","meaning":"long life"},{"word":"centenarian","meaning":"a person who is 100 years old or older"},{"word":"debunk","meaning":"to show that a belief is false"},{"word":"life expectancy","meaning":"the number of years a person is likely to live"},{"word":"deprive of","meaning":"to take away something that someone needs"},{"word":"build up","meaning":"to increase gradually"},{"word":"exponentially","meaning":"increasing faster and faster"},{"word":"plant-based","meaning":"consisting mainly of plants rather than meat"},{"word":"vigour","meaning":"physical strength and energy"},{"word":"isolated","meaning":"far away from other places and people"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1F1lBcksY46o_78SRe6Z5BPip4NXqoCD4/view","media_preview":"https://drive.google.com/file/d/1F1lBcksY46o_78SRe6Z5BPip4NXqoCD4/preview","media_type":"video","id":"a3"},{"level":"Advanced","index":4,"title":"Environment","audio_title":"We can recycle plastic","source_url":"https://youtube.com/watch?v=RD07GkmM2fc","watch":"From “The good news is we are starting...” (about\n02:48) until he says “...make more sustainable products.” (about\n07:59)","page":235,"page_end":242,"before":"1. What happens to the plastic you put in the bin at home?\n2. Why do you think most plastic is not recycled?\n3. Should rich countries send their waste to poorer countries? Why / why not?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nThe problem\n• Europe has recycling (1) ______________ that require responsible recycling\n• Over (2) ______________ of metals are recovered when products reach a\nrecycler\n• Less than 10% of plastics are recovered; he thinks it is closer to (3)\n______________\n• Most plastic is (4) ______________ or sent to landfill\n• Plastics are hard to separate because they have overlapping (5) ______________\nLow-cost recycling\n• In developing countries, people earn as little as (6) ______________ a day\nsorting our waste\n• He calls this “environmental (7) ______________”\n• In a Mumbai slum, plastics are stored on the (8) ______________\n• The “burn and (9) ______________” technique identifies plastics by their smell\nHis solution\n• He started working on the problem about 20 years ago in his (10)\n______________","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO properties make metals easy to separate from each other?\nA density\nB magnetic properties\nC smell\nD age\nE price\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO advantages of his plants does the speaker mention?\nA They use 80 to 90 percent less energy than making new plastic.\nB They can make any type of plastic they are fed.\nC They need no workers.\nD They are powered by the sun.\nE They are free to build.\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. Why does so much waste from the developed world end up in developing countries?\nA Developing countries have better technology.\nB Metals are easy to recover by hand, so recycling there is cheap.\nC It is illegal to recycle in Europe.\nD Developing countries pay for it.\n6. What is the main problem with the way plastics are recycled in places like Mumbai?\nA It is too slow.\nB It doesn’t result in much real recycling and harms people and the environment.\nC It uses too much water.\nD It is too expensive.\n7. What does the speaker say about chemical plants that make plastic from oil?\nA They are better for the environment.\nB They cost several hundred million dollars and make only one type of plastic.\nC They will soon close down.\nD They use recycled plastic.\n8. What is the speaker’s overall message?\nA We should stop using plastic completely.\nB Plastic can be recycled in a way that is both sustainable and economic.\nC Only governments can solve the plastic problem.\nD Metals are more useful than plastics.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. landfill\na. to get back something useful\n2. incinerate\nb. cheap\n3. recover\nc. partly covering the same area or range\n4. end-of-life\nd. to burn something completely\nExpression\nMeaning\n5. overlapping\ne. able to continue without harming the environment\n6. extract\nf. strong-smelling smoke or gas\n7. low-cost\ng. digging materials such as metal out of the ground\n8. sustainable\nh. a place where waste is buried in the ground\n9. mining\ni. to take something out, often with effort\n10. fumes\nj. no longer working or useful","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. Products must be recycled ______________.\nRESPONSIBLE\n2. We need a more ______________ way to make plastics.\nSUSTAIN\n3. The ______________ of plastics is very low.\nRECOVER\n4. Burning plastic has serious ______________ effects.\nENVIRONMENT\n5. Plastics have very similar ______________.\nDENSE\n6. Workers try to ______________ the metals by hand.\nEXTRACTION\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. Most plastic is either burned or buried.\nINCINERATED\nMost plastic is ____________________________.\n8. We are starting to get materials back from the things we\nthrow away.\nRECOVER\nWe are starting to ____________________________ our end-of-life stuff.\n9. Plastics are worth several times more than steel.\nVALUABLE\nPlastics are ____________________________ than steel.\n10. Our customers save a huge amount of CO2.\nSAVINGS\nOur customers enjoy ____________________________.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nThe speaker’s main argument\nMetals vs plastics: the numbers\nWhy plastics are hard to\nseparate\nWhat happens in developing\ncountries\nHis solution and its benefits +\nmy reaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker argues that plastic, unlike metal...\n• The main reason is that...\nContrasting\n• Whereas over 90% of metals are..., only...\n• On the other hand...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour classmate posts this in the class group chat:\n“Why bother sorting plastic at school? It all ends up in the same truck anyway.\nRecycling plastic is just a myth 🙄”\nRound 1: Record a voice reply for the group (90-120 seconds). In your reply:\n• agree partly with your classmate\n• use TWO facts from the talk\n• explain why sorting still matters\n• suggest ONE action the class could take\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nAgreeing partly\n• You’ve got a point: a lot of plastic isn’t recycled.\n• That’s partly true, but...\nUsing facts\n• I watched a talk by a recycling engineer.\n• Apparently...\nExplaining\n• The thing is...\n• That’s why it matters that...\nSuggesting\n• What if our class...?\n• We could ask the school to...","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \npolicies \n \n6 \na dollar / one dollar / \n$1 \n \n2 \n90 percent / 90% \n \n7 \narbitrage \n \n3 \n5 percent / 5% \n \n8 \nroofs / rooftops \n \n4 \nincinerated \n \n9 \nsniff \n \n5 \ndensities \n \n10 garage","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 h    2 d    3 a    4 j    5 c    6 i    7 b    8 e    9 g    10 f","answer_v2":"Part A: 1 responsibly    2 sustainable    3 recovery    4 environmental    5 densities    6 \nextract   |   Part B: 7 incinerated or landfilled    8 recover materials from    9 several times \nmore valuable    10 huge CO2 savings","answer_speaking":": Model summary (2-minute version) \nThe speaker argues that plastic, unlike metal, is rarely recycled, but that this can \nchange. Thanks to recycling policies in places like Europe, we are starting to recover \nmaterials from end-of-life products. However, whereas over 90 percent of metals are \nrecovered, less than 10 percent of plastics are; most are incinerated or sent to \nlandfill. The main reason is that plastics are hard to separate: their densities overlap, \nthey have similar electrical and magnetic properties, and they can be any colour. \nBecause metals are easy to extract by hand, a lot of waste is shipped to developing \ncountries for low-cost recycling, where people earn as little as a dollar a day, burn \nplastics to reach the metals and even burn and sniff them to identify the type, \nbreathing in toxic fumes. He calls this environmental arbitrage. His solution, which \nhe calls above-ground mining, separates plastics by type and grade, uses 80 to 90 \npercent less energy than making new plastic, and offers a sustainable alternative. \nWhat struck me most was that plastic is actually more valuable than steel, yet we \nthrow it away.\nSpeaking Exercise 2: Model voice reply \nHey, you’ve got a point: a lot of plastic really isn’t recycled. But I watched a talk by a \nrecycling engineer, and it’s not that plastic can’t be recycled; it’s that it’s hard to \nseparate. Apparently, over 90 percent of metal gets recovered, but only about 5 to 10 \npercent of plastic does, mostly because different plastics look and behave so \nsimilarly. His company sorts them by type and grade and turns them into new plastic \nusing up to 90 percent less energy. The thing is, that only works if the plastic is \ncollected separately in the first place. That’s why sorting still matters. What if our \nclass asked the school which company collects our waste and what really happens to \nit? If it all goes into one truck, we could ask them to change that. Let’s at least find \nout before we give up!","flashcards":[{"word":"landfill","meaning":"a place where waste is buried in the ground"},{"word":"incinerate","meaning":"to burn something completely"},{"word":"recover","meaning":"to get back something useful"},{"word":"end-of-life","meaning":"no longer working or useful"},{"word":"overlapping","meaning":"partly covering the same area or range"},{"word":"extract","meaning":"to take something out, often with effort"},{"word":"low-cost","meaning":"cheap"},{"word":"sustainable","meaning":"able to continue without harming the environment"},{"word":"mining","meaning":"digging materials such as metal out of the ground"},{"word":"fumes","meaning":"strong-smelling smoke or gas"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1eLvt0qI5zjsPyDlCzJ8LKGgSoSCGCG5q/view","media_preview":"https://drive.google.com/file/d/1eLvt0qI5zjsPyDlCzJ8LKGgSoSCGCG5q/preview","media_type":"video","id":"a4"},{"level":"Advanced","index":5,"title":"Technology","audio_title":"Connected, but alone?","source_url":"https://youtube.com/watch?v=t7Xr3AsBEK4","watch":"From about 01:40, when she moves on to 2012 and\nher daughter Rebecca at 20, until she says “...for mere\nconnection.” (about 07:25)","page":243,"page_end":251,"before":"1. How many times a day do you check your phone? Do you check it while talking\nto people?\n2. Is texting a good replacement for talking face to face? Why / why not?\n3. Have you ever felt lonely while surrounded by people?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nLife in 2012\n• Her daughter Rebecca is now (1) ______________ and at college\n• They both sleep with their (2) ______________\n• Her new book is based on 15 years of research and hundreds of (3)\n______________\nWhat she has seen\n• People text and email during corporate (4) ______________\n• Parents text at breakfast and (5) ______________\n• People even text at (6) ______________\n• We are getting used to being “(7) ______________”\nWhy we hide from conversation\n• A 50-year-old businessman says he no longer has (8) ______________\n• The “(9) ______________ effect”: not too close, not too far, just right\n• An 18-year-old says that someday he’d like to learn how to have a (10)\n______________","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO things do people do during classes and presentations, according to the\nspeaker?\nA shopping\nB going on Facebook\nC sleeping\nD eating\nE phoning their parents\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO reasons explain why people prefer texting and email to talking?\nA You can present yourself as you want to be.\nB In conversation, you can’t control what you are going to say.\nC Texting is cheaper than talking.\nD Phones have bad sound quality.\nE Nobody has time to meet.\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. What does she say the devices in our pockets change?\nA only how fast we work\nB not just what we do, but who we are\nC only how we shop\nD only how children learn\n6. What does the 50-year-old businessman prefer to do?\nA have long lunches with colleagues\nB do things on his BlackBerry instead of talking to people\nC work from home\nD travel for meetings\n7. What does “alone together” mean in the talk?\nA living alone but visiting friends\nB being physically with others while our attention is somewhere else\nC working in a team online\nD enjoying time alone\n8. What is her main concern in this part of the talk?\nA Phones are too expensive.\nB We are giving up real conversation and accepting simple connection instead.\nC Teenagers don’t use phones enough.\nD Technology is bad for our eyes.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. device\na. to improve a photo by making small changes\n2. self-reflection\nb. to change or remove parts of something\n3. customise\nc. careful thought about your own feelings and\nbehaviour\nExpression\nMeaning\n4. colleague\nd. needing a lot of time, energy or attention\n5. in real time\ne. complicated and difficult to deal with\n6. edit\nf. happening now, without delay\n7. retouch\ng. to change something to suit your own needs\n8. messy\nh. to give up something valuable for something else\n9. demanding\ni. a person you work with\n10. sacrifice\nj. a machine or tool designed for a particular job","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. It causes problems in our ______________ with each\nother.\nRELATE\n2. Our capacity for ______________ is at risk.\nREFLECT\n3. Children complain that they don’t get their parents’ full\n______________.\nATTEND\n4. We sacrifice conversation for mere ______________.\nCONNECT\n5. Human relationships are rich, messy and\n______________.\nDEMAND\n6. An 18-year-old told her he would like to learn\n______________ one day.\nCONVERSE\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. Her book is based on research she has done over the last\n15 years.\nRESEARCH\nHer book is based on ____________________________.\n8. We give up conversation and accept simple connection\ninstead.\nSACRIFICE\nWe ____________________________ mere connection.\n9. In a conversation, things happen now and you can’t\ncontrol what you say.\nREAL\nConversation takes place ____________________________, so you can’t control it.\n10. People want to decide exactly where their attention goes.\nCONTROL\nPeople want to ____________________________ where their attention goes.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nThe speaker’s main claim\nExamples of how we use\ndevices (at least 3)\nWhat “alone together” means\nPlan\nYour keywords\nThe businessman and the 18-\nyear-old\nWhy we prefer texting + my\nreaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker argues that our devices...\n• She has spent 15 years...\nGiving examples\n• For instance, people now...\n• One person she interviewed...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour friend Khoa sends you this message:\n“Family dinner tonight was SO boring. Everyone just scrolled their phones. My mum\nsays that’s normal now. Is it?”\nRound 1: Record a voice reply (90-120 seconds). In your reply:\n• sympathise and share your own experience\n• explain ONE or TWO ideas from the talk\n• suggest ONE realistic rule his family could try\n• end in a friendly way\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nSympathising\n• Ugh, I know exactly what you mean.\n• Same at my house, honestly.\nExplaining\n• I watched a talk by a psychologist who calls this...\n• Her point is that...\nSuggesting\n• What if your family tried...?\n• Maybe start small, like...\nFriendly ending\n• Let me know how it goes!\n• Good luck!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \n20 / twenty \n \n6 \nfunerals \n \n2 \ncellphones / phones \n \n7 \nalone together \n \n3 \ninterviews \n \n8 \ncolleagues \n \n4 \nboard meetings \n \n9 \nGoldilocks \n \n5 \ndinner \n \n10 conversation","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 j    2 c    3 g    4 i    5 f    6 b    7 a    8 e    9 d    10 h","answer_v2":"Part A: 1 relationships    2 self-reflection    3 attention    4 connection    5 demanding    6 \nconversation   |   Part B: 7 15 years of research    8 sacrifice conversation for    9 in real \ntime    10 be in control of","answer_speaking":": Model summary (2-minute version) \nThe speaker argues that our devices are changing not only what we do but who we \nare. She has spent fifteen years interviewing hundreds of people. For instance, people \nnow text during board meetings, shop and check Facebook during classes, text at \nbreakfast and dinner, and even at funerals. She calls this being alone together: people \nwant to be with each other but also elsewhere, and they want to customise their lives \nso they only pay attention to what interests them. This damages our relationships and \nour capacity for self-reflection. One businessman told her he no longer has \ncolleagues, because everyone prefers email. People like the Goldilocks effect: \nkeeping others not too close and not too far. An eighteen-year-old even said he’d like \nto learn conversation someday, but not now. Why? Because conversation happens in \nreal time and you can’t control it, while online you can edit, delete and retouch \nyourself. Real relationships are messy and demanding, so we sacrifice conversation \nfor mere connection. What struck me most was the teenager who wants to learn \nconversation ‘someday’. \nSpeaking Exercise 2: Model voice reply \nUgh, Khoa, I know exactly what you mean. Same at my house, honestly. But I \nwatched a talk by a psychologist who calls this being ‘alone together’: everyone’s at \nthe same table, but their minds are somewhere else. Her point is that we prefer \ntexting because we can control it, while real conversation is messy and unpredictable. \nBut that messiness is actually how we connect with people, and even how we \nunderstand ourselves. So I don’t think it’s ‘normal’ in a good way. What if your\nfamily tried a simple rule, like a phone basket in the kitchen during dinner, just three \nnights a week to start? You could even suggest everyone shares one funny thing from \ntheir day. It might feel weird at first, but it could make dinner way less boring. Let \nme know how it goes!","flashcards":[{"word":"device","meaning":"a machine or tool designed for a particular job"},{"word":"self-reflection","meaning":"careful thought about your own feelings and behaviour"},{"word":"customise","meaning":"to change something to suit your own needs"},{"word":"colleague","meaning":"a person you work with"},{"word":"in real time","meaning":"happening now, without delay"},{"word":"edit","meaning":"to change or remove parts of something"},{"word":"retouch","meaning":"to improve a photo by making small changes"},{"word":"messy","meaning":"complicated and difficult to deal with"},{"word":"demanding","meaning":"needing a lot of time, energy or attention"},{"word":"sacrifice","meaning":"to give up something valuable for something else"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1cwpsEIV7H3We-XISCSuKXPkssXEVZI46/view","media_preview":"https://drive.google.com/file/d/1cwpsEIV7H3We-XISCSuKXPkssXEVZI46/preview","media_type":"video","id":"a5"},{"level":"Advanced","index":6,"title":"Media & Advertising","audio_title":"Beware online “filter bubbles”","source_url":"https://youtube.com/watch?v=4w48Ip-KPRs","watch":"From the beginning (00:00) until he says\n“...information junk food.” (about 06:00)","page":252,"page_end":260,"before":"1. Where do you usually get your news: social media, websites, TV or newspapers?\n2. Have you noticed that apps show you more of what you already like? Is that\ngood or bad?\n3. Do you ever read opinions that you disagree with? Why / why not?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nA worrying quote\n• Mark Zuckerberg: a (1) ______________ dying in your front yard may be more\nrelevant to you than people dying in Africa\n• The speaker grew up in a very rural area in (2) ______________\nWhat he noticed online\n• He is progressive but likes to hear what (3) ______________ are thinking\n• Facebook removed them because he clicked on his liberal friends’ (4)\n______________ more\nGoogle’s personalisation\n• Google looks at (5) ______________ signals, even when you are logged out\n• For example: your computer, your browser and your (6) ______________\n• Two friends searched for “(7) ______________” and got very different results\n• Daniel’s results had nothing about the (8) ______________\nWhat’s wrong with the bubble\n• Netflix: films like (9) ______________ arrive quickly, while serious films wait\n• Instead of a balanced diet, we may end up with information (10)\n______________","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO news organisations does he say were personalising or experimenting with\npersonalisation?\nA Yahoo News\nB The New York Times\nC CNN\nD Al Jazeera\nE The Guardian\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO films does he give as examples of what we “should” watch but keep putting\noff?\nA Waiting for Superman\nB Rashomon\nC Ace Ventura\nD Iron Man\nE Titanic\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. Why does he say there is “no standard Google” any more?\nA Google has stopped working in some countries.\nB Everyone gets search results tailored to them.\nC Google results are now paid for.\nD Google changes its design every year.\n6. What is a “filter bubble”?\nA a tool that blocks advertising\nB your own personal, unique world of information online, created by algorithms\nC a group of friends on social media\nD a type of computer virus\n7. What is the main danger of the filter bubble?\nA It makes the internet slower.\nB You don’t decide what gets in, and you don’t see what gets left out.\nC It costs users money.\nD It shows too much news.\n8. What does the Netflix example show?\nA People only watch new films.\nB There is a struggle between what we want now and who we want to be in the\nfuture.\nC Netflix has too many serious films.\nD Algorithms can choose better films than people.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. relevant\na. a person or thing that controls who or what gets\naccess\n2. personalised\nb. made to suit a particular person or purpose\n3. algorithm\nc. connected with what you hope to become\nExpression\nMeaning\n4. tailored\nd. to remove something so that it does not appear\n5. edit out\ne. impossible to see\n6. invisible\nf. a set of rules a computer follows to make decisions\n7. impulsive\ng. giving equal attention to all sides\n8. aspirational\nh. designed or changed for one particular person\n9. balanced\ni. acting suddenly without thinking carefully\n10. gatekeeper\nj. connected with what is happening or being\ndiscussed","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. The web is now highly ______________.\nPERSONAL\n2. A squirrel may be more ______________ to you than\npeople in Africa.\nRELEVANCE\n3. The filter bubble is ______________; you don’t know it\nis there.\nVISION\n4. We need a ______________ information diet.\nBALANCE\n5. Algorithms often favour our ______________ selves.\nIMPULSE\n6. He was ______________ to find his conservative friends\nhad disappeared.\nSURPRISE\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. Facebook quietly removed his conservative friends from\nhis news feed.\nEDITED\nFacebook quietly ____________________________ of his news feed.\n8. Everyone now gets different search results.\nSTANDARD\nThere is ____________________________ any more.\n9. The news is increasingly made to suit each reader.\nTAILORED\nThe news is increasingly ____________________________.\n10. You don’t choose which information reaches you.\nGETS\nYou don’t decide ____________________________.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in yo
