ve.google.com/file/d/1mi9ua3AGjYHEFhEcVqRcdQIiZYE2PUPQ/preview","media_type":"video","id":"b10"},{"level":"Beginner","index":11,"title":"Hobbies","audio_title":"Talking about creativity, Real Easy English","source_url":"https://youtu.be/s8YxQkCCwAc?t=27","watch":"From 00:27 to 03:54 (from “Hello Beth, how are\nyou today?” to “But watch this space!”)","page":71,"page_end":76,"before":"1. What do you like doing in your free time?\n2. Are you a creative person? Why / Why not?\n3. Is there a new hobby you would like to try?","listening1":"Exercise 1. Read the table first. Then watch and complete the table.\nWrite ONE WORD ONLY for each answer.\nWho / when\nCreative things\nAt work (both)\nThey come up with ideas for new series. Editing (1)\n______________ is creative.\nGeorgie, at school\nShe did (2) ______________ as a class.\nGeorgie, now\nShe sometimes uses colouring (3) ______________.\nWho / when\nCreative things\nBeth, now\nShe is making a patchwork (4) ______________ for a\nfriend’s baby. She uses a sewing (5) ______________.\nThe colours are blue, white and (6) ______________.\nBeth, in the future\nShe would like to take up (7) ______________.\nGeorgie, why?\nCreative hobbies are (8) ______________, they help\nyou forget stress.","listening2":"Exercise 2. Watch the whole segment again without stopping. Who says or does\nthis, Georgie or Beth? Put a tick (✓).\nWho says or thinks this?\nGeorgie\nBeth\n1. chose colours that are good for a boy or a girl\n2. is making a blanket for a friend’s baby\n3. did photography at school\n4. sometimes enjoys colouring in\n5. knows someone who teaches ceramics classes\n6. did ceramics as a child for fun\n7. has no ideas for a new hobby yet","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. creative\na. to start a new hobby\n2. come up with\nb. a machine for making clothes or joining fabric\n3. have a good eye\nc. to think of an idea\n4. colouring book\nd. helping you feel calm and relaxed\n5. sewing machine\ne. good at making new things and having ideas\n6. take up\nf. to stop thinking about something worrying\n7. therapeutic\ng. a book of pictures that you add colours to\n8. take your mind off\nh. to be good at seeing what looks nice","vocab2":"Exercise 2. Complete the sentences with words and phrases from the word box.\nChange the form if necessary.\nWORD BOX\ncreative | come up with | have a good eye | colouring book | sewing machine |\ntake up | therapeutic | take your mind off\n1. My sister is very ______________, she paints, sings and writes stories.\n2. We need to ______________ an idea for the class party.\n3. Your photos are beautiful! You really ______________ for colours.\n4. My grandmother made this áo dài with her old ______________.\n5. I want to ______________ the guitar this summer.\n6. Gardening is very ______________ for me. It makes me feel calm.\n7. Playing football helps me ______________ my exams.\n8. Today, many adults buy ______________ to relax.","speaking1":"Exercise 1. Are you more like Georgie or Beth? Compare yourself with the\nspeakers.\nStep 1: Make notes (5 minutes). Complete the table. Write keywords about Georgie and\nBeth from the video, and then about you.\nGeorgie\nBeth\nMe\nCreative at school / as a child?\nCreative hobby now?\nA hobby to try in the future?\nWhy are creative hobbies good?\nStep 2: Record (45-60 seconds). Talk about each row and say who you are more like.\nStep 3: Listen and improve. Listen to your recording. Did you use at least 3 new words?\nRecord again and try to pause less.\nUSEFUL LANGUAGE\nComparing\n• Like Georgie, I...\n• Unlike Beth, I don’t...\nHobbies\n• When I was a child, I used to...\n• These days, I...\nFuture\n• I’d like to take up...\n• I want to try...\nConclusion\n• So, I’m more like... because...","speaking2":"Exercise 2. IELTS Speaking Part 1. Answer the questions about hobbies.\nStep 1: Prepare (3 minutes). Write 2-3 keywords for each question.\nQuestion\nYour keywords\n1. What do you like doing in your\nfree time?\n2. Did you have a hobby when you\nwere a child?\n3. Is there a hobby you would like\nto take up?\n4. Do you think creative hobbies\nare good for people? Why?\nStep 2: Record. Answer each question in 2-3 sentences. Use at least 3 words from\nVocabulary Exercise 1.\nStep 3: Listen and improve. Listen. Did you give a reason or an example for each\nanswer? Record again.\nUSEFUL LANGUAGE\nFree time\n• In my free time, I usually...\n• I’m really into...\nPast\n• When I was a kid, I used to...\nFuture\n• I’d love to take up... because...\nOpinion\n• Yes, I think they’re therapeutic.\n• They help you take your mind off...","answer_l1":"Q \nAnswer \nNote \n1 \nvideos \n \n2 \nphotography \n \n3 \nbooks \n \n4 \nquilt \nsquares of fabric sewn together \n5 \nmachine \n \n6 \norange \n“blues and whites and orange-y”\nQ \nAnswer \nNote \n7 \nceramics \nmaking pots, mugs and plates \n8 \ntherapeutic","answer_l2":"1 Beth    2 Beth    3 Georgie    4 Georgie    5 Beth    6 Beth    7 Georgie","answer_v1":"1 e    2 c    3 h    4 g    5 b    6 a    7 d    8 f","answer_v2":"1 creative    2 come up with    3 have a good eye    4 sewing machine    5 take up    6 \ntherapeutic    7 take my mind off    8 colouring books","answer_speaking":": Model answer \nLike Georgie, I did something creative at school, I drew pictures in my art class. \nUnlike Beth, I can’t use a sewing machine. These days, I don’t have a creative \nhobby, but sometimes I take photos with my phone. My friends say I have a good \neye. In the future, I’d like to take up painting. I agree with Georgie that creative \nhobbies are therapeutic, they help you take your mind off work. So I’m more like \nGeorgie. \nSpeaking Exercise 2: Model answers \n1. In my free time, I usually listen to music or go to a café with friends. \n2. Yes, when I was a kid, I used to draw a lot. I had lots of colouring books. \n3. I’d love to take up ceramics, because I want to make my own mugs. \n4. Yes, I think they’re therapeutic. They help you relax and take your mind off \nyour problems.","flashcards":[{"word":"creative","meaning":"good at making new things and having ideas"},{"word":"come up with","meaning":"to think of an idea"},{"word":"have a good eye","meaning":"to be good at seeing what looks nice"},{"word":"colouring book","meaning":"a book of pictures that you add colours to"},{"word":"sewing machine","meaning":"a machine for making clothes or joining fabric"},{"word":"take up","meaning":"to start a new hobby"},{"word":"therapeutic","meaning":"helping you feel calm and relaxed"},{"word":"take your mind off","meaning":"to stop thinking about something worrying"}],"mcq_answers":{},"media_url":"https://drive.google.com/file/d/1fjfqfhgtxCEp0aVaD9TZOxk2syW2sdy6/view","media_preview":"https://drive.google.com/file/d/1fjfqfhgtxCEp0aVaD9TZOxk2syW2sdy6/preview","media_type":"video","id":"b11"},{"level":"Beginner","index":12,"title":"Sleep & Health","audio_title":"Naps: Good for your brain? BBC News Review","source_url":"https://youtu.be/Tefu_NvcC0k?t=153","watch":"From 02:33 to 05:15 (from “Now, again, we’re\ntalking about naps...” to “...being able to take naps regularly.”)","page":77,"page_end":82,"before":"1. Do you take a nap after lunch? How long?\n2. How do you feel after a short nap? And after a long nap?\n3. Guess: are naps good or bad for your health?","listening1":"Exercise 1. Read the notes first. Then watch and complete the notes.\nWrite ONE WORD ONLY for each answer.\nHeadline 2, naps and the brain\n• A study says naps can help our brains perform (1) ______________.\n• A “sharp” brain is (2) ______________ and can think quickly.\n• People who always have a quick answer have a sharp (3) ______________.\n• Practising English every (4) ______________ keeps your language skills sharp.\nHeadline 3, short naps and long naps\n• The headline is from the Daily (5) ______________.\n• Long naps can be connected with (6) ______________.\n• Shorter naps can reduce the risk of high blood (7) ______________.\n• “Hinder” means to make things harder or (8) ______________.","listening2":"Exercise 2. Watch the whole segment again without stopping. Tick (✓) True or\nFalse.\nStatement\nTrue\nFalse\n1. Headline 2 and Headline 3 talk about the same study.\n2. In “a sharp brain”, the word “sharp” is used as a metaphor.\n3. The presenters say regular naps can keep your brain working\nwell.\n4. Headline 3 says that all naps are good for your health.\n5. “Hinder” is the opposite of “help”.\n6. People use the word “hinder” a lot in everyday spoken English.\n7. One presenter says having to work makes it difficult to take\nnaps regularly.","vocab1":"Exercise 1. Match the words (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. nap\na. the chance that something bad will happen\nWord / phrase\nMeaning\n2. headline\nb. awake and quick to notice things\n3. study\nc. a piece of research\n4. sharp\nd. a short sleep during the day\n5. alert\ne. able to think quickly; clever\n6. hinder\nf. to make something harder or worse\n7. obesity\ng. the title of a news story, in big letters\n8. risk\nh. being very overweight in a way that is bad for your\nhealth","vocab2":"Exercise 2. Help or hinder? Complete the sentences with the correct form of help or\nhinder.\n1. A short nap after lunch can ______________ you feel more alert.\n2. Loud music can ______________ your studying.\n3. Drinking coffee late at night ______________ my sleep.\n4. Doing exercise every day ______________ me sleep better.\n5. Heavy rain ______________ the football match yesterday.\n6. My friends ______________ me with my English homework last week.\n7. Using your phone in bed can ______________ a good night’s sleep.\n8. Reading a book before bed ______________ me relax.","speaking1":"Exercise 1. IELTS Speaking Part 1. Answer the questions about sleep and naps.\nStep 1: Prepare (3 minutes). Write 2-3 keywords for each question.\nQuestion\nYour keywords\n1. Do you often take naps? When?\n2. How do you feel after a nap?\n3. Is it common to take a nap at\nlunchtime in Vietnam?\n4. What helps you sleep well, and\nwhat hinders your sleep?\nStep 2: Record. Answer each question in 2-3 sentences. Use “sharp”, “alert”, “help” or\n“hinder”.\nStep 3: Listen and improve. Listen. Did you add a reason or an example to each\nanswer? Record again.\nUSEFUL LANGUAGE\nHabits\n• I usually take a short nap after lunch.\n• I hardly ever take naps because...\nFeelings\n• After a short nap, I feel alert and sharp.\n• After a long nap, I feel...\nHelp / hinder\n• ... helps me sleep well.\n• ... really hinders my sleep.","speaking2":"Exercise 2. Voice message: advice about naps\nSITUATION\nYour friend Huy sends you this message:\n“I sleep for two hours every afternoon, but I still feel tired, and then I can’t sleep at\nnight 😴 What should I do?”\nRound 1: Record a voice message to Huy (45-60 seconds). In your message:\n• show that you understand how he feels\n• explain what the news says about short and long naps\n• give TWO tips\n• finish in a friendly way\nRound 2: Record the message again in 45 seconds, without notes.\nUSEFUL LANGUAGE\nUnderstanding\n• Oh no, that sounds tiring!\n• I know how you feel.\nReporting the news\n• I watched a news report about naps.\n• It said that short naps can..., but long naps...\nTips\n• Why don’t you...?\n• Try to...\n• Don’t...\nFinishing\n• Sleep well!\n• Let me know if it helps!","answer_l1":"Q \nAnswer \nNote \n1 \nbetter \n \n2 \nalert \n \n3 \nmind \n“a sharp mind” \n4 \nday \n \n5 \nExpress \nCapital letter: the Daily Express (a UK \nnewspaper) \n6 \nobesity \nCheck the spelling. \n7 \npressure \nhigh blood pressure \n8 \nworse","answer_l2":"Q \nAnswer \nNote \n1 \nFalse \nHeadline 3 is about “a different study”. \n2 \nTrue \n \n3 \nTrue \n \n4 \nFalse \nShorter naps can help, but longer naps can \nbe unhelpful. \n5 \nTrue \n \n6 \nFalse \nIt’s “not that common in spoken English”.\nQ \nAnswer \nNote \n7 \nTrue \n“Having to work hinders me being able to \ntake naps regularly.”","answer_v1":"1 d    2 g    3 c    4 e    5 b    6 f    7 h    8 a","answer_v2":"1 help    2 hinder    3 hinders    4 helps    5 hindered    6 helped    7 hinder    8 helps","answer_speaking":": Model answers \n1. Yes, I often take a short nap after lunch, for about 20 minutes. \n2. After a short nap, I feel alert and sharp, so I can study well in the afternoon. \n3. Yes, it’s very common. Many offices and schools in Vietnam have a lunch break, \nand people sleep at their desks. \n4. A cool room and no phone help me sleep well. Coffee in the evening really \nhinders my sleep. \nSpeaking Exercise 2: Model voice message \nHi Huy! Oh no, that sounds tiring! I watched a news report about naps yesterday. It \nsaid that short naps can keep your brain sharp, but long naps can hinder your health. \nSo two hours is too long! Why don’t you try a short nap, maybe 20 minutes? Use an \nalarm. And don’t nap after four o’clock, or you won’t sleep at night. Let me know if \nit helps. Sleep well!","flashcards":[{"word":"nap","meaning":"a short sleep during the day"},{"word":"headline","meaning":"the title of a news story, in big letters"},{"word":"study","meaning":"a piece of research"},{"word":"sharp","meaning":"able to think quickly; clever"},{"word":"alert","meaning":"awake and quick to notice things"},{"word":"hinder","meaning":"to make something harder or worse"},{"word":"obesity","meaning":"being very overweight in a way that is bad for your health"},{"word":"risk","meaning":"the chance that something bad will happen"}],"mcq_answers":{},"media_url":"https://drive.google.com/file/d/11M-R4BXxf6i0Tg8OR-fi1Vf-sndD-0Xq/view","media_preview":"https://drive.google.com/file/d/11M-R4BXxf6i0Tg8OR-fi1Vf-sndD-0Xq/preview","media_type":"video","id":"b12"},{"level":"Beginner","index":13,"title":"Money","audio_title":"How to start spending, saving, and giving better, David Delisle, TEDxVictoria","source_url":"https://youtu.be/EG8V8UIXXQM?t=358","watch":"From 05:58 to 07:33 (from “And then second, save\nfor freedom.” to “...you can still start today.”)","page":83,"page_end":88,"before":"1. Do you save money? What do you save for?\n2. What do you spend most of your money on?\n3. When you were a child, did you get lì xì at Tết? What did you do with it?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nwatch and complete the sentences.\nWrite ONE WORD AND/OR A NUMBER for each answer.\n1. The speaker says we should save for ______________.\n2. Parents often tell kids to save and then ask, “What do you plan to ______________?”\n3. Saving to buy something bigger is still ______________, “just with a little more\nsuspense”.\n4. Some people save out of ______________, but that never brings joy.\n5. Saving means a small ______________ today, so you can have freedom tomorrow.\n6. He asked Will and Noah to save ______________% of the money he gave them.\n7. At first, Will and Noah were ______________.\n8. If you didn’t start saving yesterday, you can still start ______________.","listening2":"Exercise 2. Watch the whole segment again without stopping. Choose the correct\nletter, A, B or C.\n1. What “drives” the speaker “crazy”?\nA Children spend all their money.\nB Parents ask children what they will buy right after telling them to save.\nC Children don’t want to save.\n2. What does “save out of fear” mean?\nA save because you are afraid to spend\nB save because you want a big present\nC save money for other people\n3. What is saving, for the speaker?\nA keeping money in a box at home\nB letting your money grow and work for you\nC buying cheaper things\n4. Why did he ask Will and Noah to save 20%?\nA because they had to\nB because they wanted to buy a bigger toy\nC because it’s the first step to having the freedom to say yes to what matters","vocab1":"Exercise 1. Match the words (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. save\na. to use money badly, on things you don’t need\n2. spend\nb. not sure that something is true or a good idea\n3. waste\nc. to keep money so you can use it later\n4. suspense\nd. being able to choose what you want to do\n5. fear\ne. the feeling of waiting and not knowing what will\nhappen\n6. sacrifice\nf. to use money to buy things\n7. freedom\ng. the feeling of being afraid\n8. skeptical\nh. giving up something you want now for something\nbetter later","vocab2":"Exercise 2. Money maths and money words.\nA. Complete the sentences with the correct number.\n1. 20% of 100,000 VND is ______________ VND.\n2. Lan gets 1,000,000 VND a month. If she saves 20%, she saves ______________\nVND.\n3. Minh saves 10% of 300,000 VND. He saves ______________ VND.\n4. Hoa earns 12,000,000 VND a month. She saves 20%. That’s ______________ VND.\nB. Choose the correct word.\n5. I (save / spend) about 50,000 VND on bubble tea every week.\n6. Don’t (waste / save) your money on things you don’t need.\n7. I want to (save / waste) money for a trip to Đà Lạt.\n8. He bought a jacket and never wore it. What a (waste / freedom) of money!","speaking1":"Exercise 1. Give your opinion. Is saving 20% a good idea for young people?\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nMy opinion (yes / no / it depends)\nReason 1 + example\nReason 2 + example\nWhat I save for / would like to\nsave for\nWords from this unit I will use\nStep 2: Record (45-60 seconds). Look only at your notes and record yourself on your\nphone.\nStep 3: Listen and improve. Listen to your recording. Did you use at least 3 new words?\nRecord again and try to pause less.\nUSEFUL LANGUAGE\nOpinion\n• I think saving 20% is a good idea because...\n• In my opinion, it’s too much for...\nReasons\n• First... Second...\n• For example, if you get..., you can save...\nFrom the talk\n• The speaker says that saving gives you freedom.\n• He thinks saving out of fear...\nFinishing\n• So, I believe...","speaking2":"Exercise 2. Voice message: advice about lì xì\nSITUATION\nYour cousin Khoa (15 years old) sends you this message:\n“I got 2,000,000 VND lì xì this Tết!!! 🤑 I want to buy a new game and some\nsneakers today. Good idea?”\nRound 1: Record a voice message to Khoa (45-60 seconds). In your message:\n• say something nice about his lì xì\n• tell him about the idea of saving 20% from the talk\n• do the maths: how much can he save, and how much can he spend?\n• finish in a friendly way\nRound 2: Record the message again in 45 seconds, without notes.\nUSEFUL LANGUAGE\nStarting\n• Wow, lucky you!\n• That’s a lot of money!\nThe idea\n• I watched a talk about money.\n• The speaker says we should save for freedom.\nMaths\n• 20% of 2,000,000 is...\n• So you can still spend...\nFinishing\n• It’s up to you, of course!\n• Have fun, but don’t waste it!","answer_l1":"Q \nAnswer \nNote \n1 \nfreedom \n \n2 \nbuy \n \n3 \nspending \n“That’s still spending, just with a little \nmore suspense.” \n4 \nfear \n \n5 \nsacrifice \n \n6 \n20 / twenty \n \n7 \nskeptical \nBritish spelling: sceptical \n8 \ntoday","answer_l2":"1 B    2 A    3 B    4 C","answer_v1":"1 c    2 f    3 a    4 e    5 g    6 h    7 d    8 b","answer_v2":"A: 1 20,000    2 200,000    3 30,000    4 2,400,000.   B: 5 spend    6 waste    7 save    8 \nwaste","answer_speaking":": Model answer \nI think saving 20% is a good idea for young people, but it depends on how much \nmoney you have. First, if you save a little every month, you have freedom later. For\nexample, if you get 1,000,000 VND a month, you can save 200,000 and in a year you \nhave 2,400,000, enough for a trip. Second, it stops you from wasting money on \nthings you don’t need. The speaker says we shouldn’t save out of fear, and I agree. \nIt’s a small sacrifice today for something better tomorrow. \nSpeaking Exercise 2: Model voice message \nHi Khoa! Wow, lucky you, that’s a lot of money! I watched a talk about money \nyesterday. The speaker says we should save for freedom, not just spend everything \ntoday. He says save 20%. So, 20% of 2,000,000 is 400,000. Put that in the bank, and \nyou can still spend 1,600,000 on your game and sneakers. Then later you have money \nfor something you really want. It’s up to you, of course! Have fun, but don’t waste it!","flashcards":[{"word":"save","meaning":"to keep money so you can use it later"},{"word":"spend","meaning":"to use money to buy things"},{"word":"waste","meaning":"to use money badly, on things you don’t need"},{"word":"suspense","meaning":"the feeling of waiting and not knowing what will happen"},{"word":"fear","meaning":"the feeling of being afraid"},{"word":"sacrifice","meaning":"giving up something you want now for something better later"},{"word":"freedom","meaning":"being able to choose what you want to do"},{"word":"skeptical","meaning":"not sure that something is true or a good idea"}],"mcq_answers":{"1":"B","2":"A","3":"B","4":"C"},"media_url":"https://drive.google.com/file/d/1zvoYGfvgewOCeXHyKX2lh9i9KXHyfo0X/view","media_preview":"https://drive.google.com/file/d/1zvoYGfvgewOCeXHyKX2lh9i9KXHyfo0X/preview","media_type":"video","id":"b13"},{"level":"Beginner","index":14,"title":"Technology","audio_title":"Bans on social media and phones: what’s the evidence? What in the World","source_url":"https://youtu.be/b4jTc1YpEgM?t=51","watch":"From 00:51 to 04:16 (from “So I thought if we’re\ngoing to be talking about teenagers and their phones...” to\n“...phone use and screen time is just consistently rising.”)","page":89,"page_end":94,"before":"1. How many hours a day do you think you use your phone?\n2. What apps do you use the most?\n3. Should students be allowed to use phones at school?","listening1":"Exercise 1. Read the notes first. Then watch and complete the notes.\nWrite ONE WORD AND/OR A NUMBER for each answer.\nThe presenters check their phones\n• First presenter’s screen time: (1) ______________ hours and 14 minutes a day\n• Second presenter’s screen time: three hours (2) ______________ minutes, but usually\nnearly five\n• The second presenter has time limits on most apps: after 15 or (3) ______________\nminutes a day,\n• the phone says, “You have reached your time (4) ______________.”\n• Most used apps for both: WhatsApp and (5) ______________\nThe numbers\n• Adults over 18 use their phones for almost (6) ______________ hours a day.\n• Total screen time for 11- to 14-year-olds: about (7) ______________ hours a day\n• Nearly (8) ______________ of teens say they use the internet almost constantly.","listening2":"Exercise 2. Watch the whole segment again without stopping. Choose the correct\nletter, A, B or C.\n1. What does one presenter usually do when the phone shows the weekly screen time?\nA reads it carefully\nB quickly closes it, feeling scared and ashamed\nC shares it with friends\n2. What does the second presenter do when an app reaches its time limit?\nA presses “ignore limit”\nB closes the app\nC turns off the phone\n3. Why does the second presenter think “three hours 29” is strange?\nA It’s much higher than usual.\nB It’s lower than usual.\nC It’s the same as the first presenter’s.\n4. What does the data show?\nA Screen time is going down.\nB Screen time is the same as before.\nC Phone use and screen time keep rising.","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. screen time\na. a message on your phone that tells you something\nnew happened\n2. settings\nb. all the time\n3. time limit\nc. the part of the phone where you can change how it\nworks\n4. app\nd. the time you spend looking at a phone, TV or\ncomputer\n5. notification\ne. to move up and down on a screen to see more\n6. scroll\nf. the usual or normal amount\n7. average\ng. a program on your phone, e.g. WhatsApp\n8. constantly\nh. the most time you are allowed to use something","vocab2":"Exercise 2. Complete the story with words from the word box. Change the form if\nnecessary.\nWORD BOX\nsettings | screen time | average | app | time limit | notification | constantly | scroll\nLast night, Minh opened the (1) ______________ on his phone and checked his (2)\n______________. It was six hours a day! That’s more than the (3) ______________ for\nadults. His most-used (4) ______________ is TikTok, so he set a (5) ______________ of\none hour. He also turned off his (6) ______________, because his phone was beeping (7)\n______________. Now he spends less time (8) ______________ in bed.","speaking1":"Exercise 1. Check your phone like the presenters. Then report your screen time.\nStep 1: Make notes (5 minutes). Open Settings then Screen time (iPhone) or Digital\nWellbeing (Android). Write keywords.\nPlan\nYour keywords\nMy daily screen time\nMy top 2-3 apps\nIs it more or less than the average?\nHow I feel about it\nOne change I will make\nStep 2: Record (45-60 seconds). Look only at your notes and record yourself on your\nphone.\nStep 3: Listen and improve. Listen to your recording. Did you use at least 3 new words?\nRecord again and try to pause less.\nUSEFUL LANGUAGE\nNumbers\n• My screen time is about... hours a day.\n• That’s more / less than the average.\nApps\n• My most-used apps are... and...\n• I spend most of my time scrolling on...\nFeelings\n• I’m really surprised / a bit ashamed.\n• It makes me feel...\nChange\n• From now on, I’m going to set a time limit on...\n• I’ll turn off notifications for...","speaking2":"Exercise 2. Short discussion: phones at school\nShould phones be banned in schools?\nIn your answer:\n• give your opinion\n• give TWO reasons with examples\n• say ONE good point of the other side\n• finish with your opinion again\nRound 1: You have 1 minute to make notes. Then talk for 1 minute.\nRound 2: Work with a partner who has the opposite opinion. Take turns, and answer\neach other’s reasons.\nUSEFUL LANGUAGE\nOpinion\n• I think phones should / shouldn’t be banned because...\nReasons\n• First, students can’t... when their phones are constantly beeping.\n• Second, phones are useful for...\nOther side\n• Some people say..., and that’s true, but...\nFinishing\n• So, in my opinion...","answer_l1":"Q \nAnswer \nNote \n1 \n4 / four \n“four hours and 14 minutes” \n2 \n29 \n \n3 \n20 / twenty \n \n4 \nlimit \n \n5 \nInstagram \nCapital letter \n6 \n5 / five \n \n7 \n9 / nine \nfigure from the US Centers for Disease \nControl and Prevention \n8 \nhalf","answer_l2":"1 B    2 A    3 B    4 C","answer_v1":"1 d    2 c    3 h    4 g    5 a    6 e    7 f    8 b","answer_v2":"1 settings    2 screen time    3 average    4 app    5 time limit    6 notifications    7 \nconstantly    8 scrolling","answer_speaking":": Model answer \nMy screen time is about five hours a day. That’s a bit more than the average for \nadults. My most-used apps are Zalo, Facebook and TikTok, and I spend a lot of time \nscrolling on TikTok before bed. I’m really surprised, and a bit ashamed. From now \non, I’m going to set a time limit of 30 minutes on TikTok, and I’ll turn off \nnotifications for Facebook. \nSpeaking Exercise 2: Model talk \nI think phones should be banned in class, but not in the whole school. First, students \ncan’t concentrate when their phones are constantly beeping with notifications. For \nexample, my friend always checks Facebook in class. Second, at break time, students \nshould talk and play together, not scroll. Some people say phones are useful for \nlooking up words, and that’s true, but teachers can use the school computers. So, in \nmy opinion, phones should stay in students’ bags during lessons.","flashcards":[{"word":"screen time","meaning":"the time you spend looking at a phone, TV or computer"},{"word":"settings","meaning":"the part of the phone where you can change how it works"},{"word":"time limit","meaning":"the most time you are allowed to use something"},{"word":"app","meaning":"a program on your phone, e.g. WhatsApp"},{"word":"notification","meaning":"a message on your phone that tells you something new happened"},{"word":"scroll","meaning":"to move up and down on a screen to see more"},{"word":"average","meaning":"the usual or normal amount"},{"word":"constantly","meaning":"all the time"}],"mcq_answers":{"1":"B","2":"A","3":"B","4":"C"},"media_url":"https://drive.google.com/file/d/1j6w3uaAFNy4F8Pb7Jsxuzs7p2AUuYkpo/view","media_preview":"https://drive.google.com/file/d/1j6w3uaAFNy4F8Pb7Jsxuzs7p2AUuYkpo/preview","media_type":"video","id":"b14"},{"level":"Beginner","index":15,"title":"Learning languages","audio_title":"Learning a language? Speak it like you’re playing a video game, Marianna Pascal, TEDxPenangRoad","source_url":"https://youtu.be/Ge7c7otG2mk?t=379","watch":"From 06:19 to 12:00 (from “I want to share with\nyou a real, true example...” to “...like a computer game.”)","page":95,"page_end":100,"before":"1. How do you feel when you speak English with a foreigner?\n2. Are you afraid of making mistakes when you speak English? Why?\n3. Which is more important: perfect grammar or being understood?","listening1":"Exercise 1. Read the notes first. Then watch and complete the notes.\nWrite ONE WORD AND/OR A NUMBER for each answer.\nStory 1, in the pharmacy\n• The speaker’s (1) ______________ said she should get omega.\n• The sales rep panicked because she had to speak to a (2) ______________ speaker.\n• The sales rep spoke very (3) ______________ and went around in circles.\n• The girl behind the (4) ______________ had a low English level, but she showed no\nfear.\n• The girl said: “EPA for heart. DHA for (5) ______________.”\nEnglish in the world today\n• For every native speaker, there are (6) ______________ non-native speakers.\n• Only (7) ______________% of English conversations are between two native\nspeakers.\nStory 2, the barbecue\n• A Japanese engineer helped by saying: “Ah! Cheese... (8) ______________!”","listening2":"Exercise 2. Watch the whole segment again without stopping. Choose the correct\nletter, A, B or C.\n1. Why did the speaker need help in the pharmacy?\nA She couldn’t find the shelf.\nB There were too many kinds of omega.\nC The omega was too expensive.\n2. Why wasn’t the sales rep helpful?\nA She focused on herself and getting her English right.\nB She didn’t know anything about omega.\nC She didn’t want to talk to customers.\n3. What did the girl behind the counter focus on?\nA her grammar\nB the person she was talking to and getting a result\nC speaking like a native speaker\n4. According to the speaker, English today is...\nA an art to be mastered.\nB a tool to use to get a result.\nC a language that belongs to native speakers.\n5. At the barbecue, what did the French engineer want to know?\nA if the Korean engineer wanted a cheese hot dog\nB where the cheese was on the table\nC if the Korean engineer could cook","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. pharmacy\na. something wrong, e.g. in grammar\n2. native speaker\nb. a shop where you buy medicine\n3. judge\nc. something you use to do a job\n4. mistake\nd. working well; doing what you want it to do\n5. effective\ne. a person who speaks a language as their first\nlanguage\n6. communicator\nf. what you get at the end; the outcome\n7. tool\ng. to form an opinion about someone, often a bad one\n8. result\nh. a person who shares ideas and information with\nothers","vocab2":"Exercise 2. Advice for English learners. Complete the tips with words from\nVocabulary Exercise 1. Change the form if necessary.\n1. Don’t be afraid of making ______________. Everybody makes them!\n2. Most people won’t ______________ you, they just want to understand you.\n3. Think of English as a ______________, not an art.\n4. When you speak, focus on getting a ______________.\n5. You don’t need to sound like a ______________.\n6. A good ______________ always thinks about the listener.\n7. Short, simple sentences can be very ______________.\n8. Practise English in real life, for example, buy something at a ______________ when\nyou travel.","speaking1":"Exercise 1. Retell ONE of the two stories (the pharmacy or the barbecue) in your\nown words.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhich story? Where?\nWho was there?\nWhat was the problem?\nHow was it solved?\nWhat does the story show?\nStep 2: Record (60 seconds). Look only at your notes and record yourself on your\nphone.\nStep 3: Listen and improve. Listen to your recording. Did you use at least 3 new words?\nRecord again and try to pause less.\nUSEFUL LANGUAGE\nStarting\n• The speaker tells a story about...\n• One day, she was in a...\nThe problem\n• She didn’t know which...\n• The Korean engineer didn’t understand...\nThe solution\n• Then, the girl behind the counter / a Japanese engineer said...\nThe message\n• This shows that English is just a tool to get a result.","speaking2":"Exercise 2. Mini talk: when English helped me\nDescribe a time you used English to solve a problem.\nYou should say:\n• when and where it was\n• who you talked to\n• what the problem was\n• how you felt and what the result was\nRound 1: You have 1 minute to make notes. Then talk for 1-2 minutes.\nRound 2: If you have never done this, imagine it: helping a tourist in your city who is\nlost.\nUSEFUL LANGUAGE\nStarting\n• I’d like to talk about a time when...\n• It was last year, in...\nThe problem\n• A tourist asked me...\n• I needed to..., but...\nUsing English\n• My English wasn’t perfect, but I...\n• I used simple words and...\nResult and feelings\n• In the end...\n• I felt really proud because...","answer_l1":"Q \nAnswer \nNote \n1 \ndoctor \n \n2 \nnative \n \n3 \nquickly \n \n4 \ncounter \n \n5 \nbrain \n \n6 \n5 / five \n \n7 \n4 / four \n96% of conversations involve non-native \nspeakers. \n8 \nintegrator \na funny, made-up way to say “inside”","answer_l2":"1 B    2 A    3 B    4 B    5 A","answer_v1":"1 b    2 e    3 g    4 a    5 d    6 h    7 c    8 f","answer_v2":"1 mistakes    2 judge    3 tool    4 result    5 native speaker    6 communicator    7 effective    \n8 pharmacy","answer_speaking":": Model retelling \nThe speaker tells a story about a pharmacy. Her doctor said she should get omega, \nbut there were many kinds, and she didn’t know which one to buy. First, she asked a\nsales rep with very good English. But the woman was afraid of making mistakes in \nfront of a native speaker, so she spoke very quickly and went around in circles. Then \nthe speaker asked the girl behind the counter. Her English was simple, but she said, \n“EPA for heart, DHA for brain.” Problem solved! This shows that English is just a \ntool to get a result. \nSpeaking Exercise 2: Model talk \nI’d like to talk about a time when English helped me. It was last summer, in Hội An. \nA tourist from Germany asked me how to get to the Japanese Bridge. He looked lost \nand worried. My English wasn’t perfect, and I made some mistakes, but I used \nsimple words and my hands. I said, “Go straight, turn left, five minutes.” In the end, I \nwalked with him. He was very happy and said “thank you” many times. I felt really \nproud, because I was an effective communicator, not perfect, but I got a result.\nPHẦN 2: INTERMEDIATE","flashcards":[{"word":"pharmacy","meaning":"a shop where you buy medicine"},{"word":"native speaker","meaning":"a person who speaks a language as their first language"},{"word":"judge","meaning":"to form an opinion about someone, often a bad one"},{"word":"mistake","meaning":"something wrong, e.g. in grammar"},{"word":"effective","meaning":"working well; doing what you want it to do"},{"word":"communicator","meaning":"a person who shares ideas and information with others"},{"word":"tool","meaning":"something you use to do a job"},{"word":"result","meaning":"what you get at the end; the outcome"}],"mcq_answers":{"1":"B","2":"A","3":"B","4":"B","5":"A"},"media_url":"https://drive.google.com/file/d/1DaSVVdcbMlYr7ZajbiICvHVW6YQV5o0P/view","media_preview":"https://drive.google.com/file/d/1DaSVVdcbMlYr7ZajbiICvHVW6YQV5o0P/preview","media_type":"video","id":"b15"},{"level":"Intermediate","index":1,"title":"Sleep & Health","audio_title":"Five Tips to Get Better Sleep","source_url":"https://learningenglish.voanews.com/a/7585004.html","watch":"","page":102,"page_end":108,"before":"1. How many hours do you usually sleep on a school night?\n2. What do you usually do in the last hour before you go to bed?\n3. Guess: what five tips for better sleep will the report give? Write three ideas.","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. Nearly ______________ of adults in the United States do not get enough sleep.\n2. Adults are advised to sleep between seven and ______________ hours a night.\n3. Two common reasons for poor sleep are stress and ______________.\n4. The first tip is to create a ______________ before you go to bed.\n5. This quiet time should start about ______________ before bedtime.\n6. During this time, you should not check email, pay ______________ or do\nhousework.\n7. If you are hungry at night, choose a small snack with protein or ______________.\n8. Caffeine can stay in your body for up to ______________.\n9. Light from screens can stop the body from making ______________, a hormone that\nhelps us sleep.\n10. You should see a doctor if you have had trouble sleeping for more than\n______________.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. What is the main purpose of the report?\nA to explain why people dream\nB to give practical advice for sleeping better\nC to compare sleep habits in different countries\n2. Which of these is given as a reason why many people sleep badly?\nA a culture that values being productive\nB uncomfortable beds and pillows\nC noisy neighbours\n3. What do the experts suggest doing in the hour before bed?\nA finishing the housework so you can relax later\nB checking your messages one last time\nC doing something enjoyable, such as reading a book\n4. What does the report say about meals?\nA Have your main meal in the early evening.\nB Skip dinner if you want to sleep well.\nC Eat a big meal just before you go to bed.\n5. How does alcohol affect sleep?\nA It helps you sleep through the whole night.\nB It makes you more likely to wake up in the middle of the night.\nC It has no effect if you drink only a little.\n6. When should you see a doctor?\nA as soon as you have one bad night\nB only if you sleep less than five hours a night\nC when poor sleep lasts more than a month or affects your work or mood","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. unproven\na. to start sleeping\n2. fall asleep\nb. a small amount of food you eat between meals\n3. anxiety\nc. made from the whole seed of a plant, e.g. brown\nbread\n4. housework\nd. the people you love most, e.g. family and close\nfriends\n5. loved ones\ne. the way you feel at a particular time, e.g. happy or\nangry\n6. snack\nf. the natural system in your body that tells you when\nto sleep and wake up\n7. whole grain\ng. a feeling of worry and nervousness\nWord / phrase\nMeaning\n8. sleep cycle\nh. jobs like cleaning, washing and cooking in the\nhome\n9. internal clock\ni. the stages your body repeats again and again\nduring a night’s sleep\n10. mood\nj. not yet shown to be true or to work","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. I always feel a lot of ______________ before a big exam, so I do some breathing\nexercises.\n2. My little brother can ______________ anywhere, even on a noisy bus!\n3. On Sundays my family shares the ______________: I do the washing-up and my\nsister cleans the floor.\n4. Be careful with ______________ ways to lose weight that you see on social media.\n5. When I feel stressed, I spend time with my ______________. It always makes me\nfeel better.\n6. If I’m hungry at 10 p.m., I have a light ______________, like a banana or some nuts.\n7. ______________ bread keeps you full for longer than white bread.\n8. Flying to another continent can confuse your ______________, so you feel wide\nawake at 3 a.m.\n9. Drinking alcohol in the evening can disturb your normal ______________.\n10. Don’t talk to my dad before his morning coffee, he’s always in a bad\n______________!","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat is the report about? How\nbig is the problem?\nThe five tips (one keyword\neach)\nWhen should you see a doctor?\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• This VOA Learning English report is about...\n• According to the report, nearly...\nListing tips\n• The first tip is to...\n• Second... / Another tip is to...\n• The report also says we should avoid...\nGiving reasons\n• ...because...\n• This is important because...\nFinishing\n• Finally, if..., you should...\n• Overall, the main message is that...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour friend Minh sends you this message:\n“Ugh, I can’t sleep again 😩 I go to bed at midnight but I’m still awake at 2. I\nusually scroll on my phone in bed, and I always have a coffee milk tea after dinner.\nAny advice?”\nRound 1: Record a voice message to Minh (60-90 seconds). In your message:\n• show that you understand how he feels\n• point out TWO of his habits that may be causing the problem, and explain why (use\nideas from the report)\n• give at least TWO practical tips\n• tell him when he should see a doctor, and finish in a friendly way\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nShowing you understand\n• Oh no, that sounds awful.\n• I know how frustrating it is when...\nPointing out a problem\n• I think the problem might be...\n• The thing is...\n• That’s because...\nGiving tips\n• Why don’t you...?\n• Maybe try to...\n• It might be better to...\nFinishing\n• If it doesn’t get better...\n• Hope you sleep better tonight!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \none-third \nA hyphenated \nword counts \nas one word. \n“a third” is \nalso correct. \n6 \nbills \nMust be plural \n2 \nnine / 9 \n \n7 \nhealthy fats \nExamples in \nthe report: \ncheese, \nalmonds, \npeanut butter \n3 \nanxiety \nCheck the \nspelling. \n8 \n10 hours / ten hours \n \n4 \nbuffer zone \nA quiet, \nrelaxing time \nbetween your \nbusy day and \nsleep \n9 \nmelatonin \nCheck the \nspelling. \n5 \none hour / an hour \n“1 hour” is \nalso correct. \n10 one month / a month","answer_l2":"1 B    2 A    3 C    4 A    5 B    6 C","answer_v1":"1 j    2 a    3 g    4 h    5 d    6 b    7 c    8 i    9 f    10 e","answer_v2":"1 anxiety    2 fall asleep    3 housework    4 unproven    5 loved ones    6 snack    7 Whole \ngrain    8 internal clock    9 sleep cycles    10 mood","answer_speaking":": Model summary \nThis VOA Learning English report is about how to sleep better. It says that nearly \none-third of American adults don’t get enough sleep, often because of stress, anxiety \nand a culture that values being productive. Experts say we should avoid unproven \nmethods and try five simple tips. First, create a buffer zone of about an hour before \nbed: no email or housework, just something relaxing, like reading or spending time \nwith your loved ones. Second, watch what you eat. Have dinner in the early evening \nand, if you get hungry later, have a small snack. Third, avoid caffeine and alcohol, \nbecause alcohol disturbs your sleep cycles. Fourth, limit technology, because light \nfrom screens confuses your internal clock. Finally, if you still can’t fall asleep after \na month, see a doctor, especially if it affects your work or your mood. \nSpeaking Exercise 2: Model voice message \nHey Minh! Oh no, that sounds awful, I know how frustrating it is when you just can’t \nfall asleep. I listened to a report about this, and I think two of your habits might be \nthe problem. First, that milk tea after dinner. It has caffeine, and caffeine can stay in \nyour body for up to ten hours! Maybe switch to water or a warm drink without \ncaffeine. Second, your phone. The light from the screen confuses your internal \nclock, so try to put it away about an hour before bed. Read a book or chat with your \nloved ones instead. And if you get hungry, just have a light snack, like a few\nalmonds. If you still can’t sleep after a month, it’s worth seeing a doctor. Hope you \nsleep better tonight!","flashcards":[{"word":"unproven","meaning":"not yet shown to be true or to work"},{"word":"fall asleep","meaning":"to start sleeping"},{"word":"anxiety","meaning":"a feeling of worry and nervousness"},{"word":"housework","meaning":"jobs like cleaning, washing and cooking in the home"},{"word":"loved ones","meaning":"the people you love most, e.g. family and close friends"},{"word":"snack","meaning":"a small amount of food you eat between meals"},{"word":"whole grain","meaning":"made from the whole seed of a plant, e.g. brown bread"},{"word":"sleep cycle","meaning":"the stages your body repeats again and again during a night’s sleep"},{"word":"internal clock","meaning":"the natural system in your body that tells you when to sleep and wake up"},{"word":"mood","meaning":"the way you feel at a particular time, e.g. happy or angry"}],"mcq_answers":{"1":"B","2":"A","3":"C","4":"A","5":"B","6":"C"},"media_url":"https://drive.google.com/file/d/1tUFOQD6Sz6FGuIrlCPxpg5PEjkicRpkK/view","media_preview":"https://drive.google.com/file/d/1tUFOQD6Sz6FGuIrlCPxpg5PEjkicRpkK/preview","media_type":"audio","id":"i1"},{"level":"Intermediate","index":2,"title":"Social Media","audio_title":"Study: Around Half of US Teens Always Online","source_url":"https://learningenglish.voanews.com/a/7902911.html","watch":"","page":109,"page_end":115,"before":"1. How many hours a day do you spend online? What do you do most?\n2. Which three apps do you open most often?\n3. Guess: what share of American teenagers say they are online “almost\nconstantly”?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. Nearly ______________ of American teenagers say they are online almost all the\ntime.\n2. The information comes from a report by the Pew ______________.\n3. The most popular platform among teens is still ______________.\n4. Nearly ______________ of the teens visit YouTube every day.\n5. Use of X fell to 17 percent. The platform was bought by ______________ in 2022.\n6. The number of teens using ______________ went up, from 17 to 23 percent.\n7. ______________ recently passed a law that bans children under 16 from social\nnetworks.\n8. Some people worry that this kind of ban could ______________ some children.\n9. Girls are more likely than boys to use ______________ almost constantly.\n10. The report was based on a survey of ______________ teenagers.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. What is the report mainly about?\nA how often teens use different online platforms\nB why teens should stop using their phones\nC how parents control their children’s screen time\n2. Why might TikTok and Snapchat use have dropped a little?\nA The apps became more expensive.\nB Kids had more time to see friends in person after the pandemic.\nC Many schools banned the apps.\n3. Which platform had the biggest drop in teenage users?\nA Reddit\nB Snapchat\nC X\n4. What does the report say about Reddit?\nA The number of teen users stayed the same.\nB It is now more popular than YouTube.\nC It is mostly used by girls.\n5. What is still unclear about Australia’s new law?\nA who wrote the law\nB how the government will make people follow it\nC when the law was passed\n6. Which group was most likely to use TikTok almost constantly?\nA white teenagers\nB Black and Hispanic teenagers\nC teenage boys","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. constantly\na. a person’s general health and happiness\n2. platform\nb. to make sure that people obey a rule or law\n3. app\nc. to become less strict or less serious\n4. isolate\nd. even though something is true\n5. despite\ne. to separate someone from other people\n6. decline\nf. asking many people the same questions to collect\ninformation\n7. well-being\ng. all the time, without stopping\n8. enforce\nh. a fall in number or amount\nWord / phrase\nMeaning\n9. survey\ni. a website or app that provides a service, e.g.\nYouTube\n10. ease (up)\nj. a program on a phone that does a particular job","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. My sister checks her phone ______________, even during dinner!\n2. TikTok is the ______________ my classmates use most for short videos.\n3. There’s a free ______________ that reminds me to drink water every hour.\n4. Spending too much time alone in your room can ______________ you from your\nfamily.\n5. ______________ the rain, we still went to the football match.\n6. There has been a small ______________ in the number of students who read paper\nbooks.\n7. Sleep, food and friendship are all important for your ______________.\n8. It is hard for schools to ______________ a no-phone rule during break time.\n9. Our class did a ______________ to find out how many hours we spend online each\nday.\n10. After the exams, the pressure finally began to ______________.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat is the report about?\nWhere do the numbers come\nfrom?\nPopular platforms (3 facts with\nnumbers)\nWhat is happening in Australia?\nDifferences between groups\n(girls/boys, other groups)\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• This report is about how much time American teenagers spend online.\n• The information comes from...\nGiving numbers\n• Around / nearly / about ... percent of teens...\n• ...went up from ... to ... / fell from ... to ...\nComparing\n• ...is still the most popular...\n• Girls are more likely to... while boys...\nFinishing\n• Overall, the report shows that...\n• Personally, I think...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour cousin’s mum (your aunt) sends you this voice message:\n“Hi sweetie! Bảo is on his phone all day, TikTok, YouTube, games... I’m thinking of\ntaking his phone away completely until the summer. Do you think that’s a good\nidea?”\nRound 1: Record a voice reply to your aunt (60-90 seconds). In your reply:\n• say how many teens are online almost constantly, using one fact from the report\n• give ONE reason why taking the phone away completely might not work\n• suggest TWO more practical rules (e.g. phone-free times or places)\n• finish politely and kindly\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nResponding politely\n• Thanks for asking me, Auntie.\n• I totally understand why you’re worried.\nUsing a fact\n• I heard a report that said nearly half of teens...\n• Apparently...\nSuggesting\n• Maybe you could...\n• What about a rule like...?\n• It might work better if...\nFinishing\n• I hope that helps!\n• I can talk to him too, if you like.","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nhalf \n \n6 \nWhatsApp \nOwned by \nMeta \n2 \nResearch Center \n \n7 \nAustralia \n \n3 \nYouTube \n \n8 \nisolate \n \n4 \n75 percent / 75% \n \n9 \nTikTok \n \n5 \nElon Musk \n \n10 1,391 / 1391","answer_l2":"1 A    2 B    3 C    4 A    5 B    6 B","answer_v1":"1 g    2 i    3 j    4 e    5 d    6 h    7 a    8 b    9 f    10 c","answer_v2":"1 constantly    2 platform    3 app    4 isolate    5 Despite    6 decline    7 well-being    8 \nenforce    9 survey    10 ease","answer_speaking":": Model summary \nThis report is about how much time American teenagers spend online. The \ninformation comes from a survey of 1,391 teens by the Pew Research Center. It\nfound that nearly half of them say they are online constantly. YouTube is still the \nmost popular platform: around 90 percent of teens use it, and nearly 75 percent visit \nit every day. TikTok and Snapchat had a small decline, maybe because pandemic \nrules eased and kids could meet friends again. X had the biggest fall, but the \nmessaging app WhatsApp grew. The report also mentions Australia, which has \nbanned children under 16 from social networks, although it is not clear how the \ngovernment will enforce the law, or whether it might isolate some children. Girls are \nmore likely to use TikTok all the time, while boys prefer YouTube. Overall, despite \nworries about young people’s well-being, teens are still online a lot. \nSpeaking Exercise 2: Model voice message \nHi Auntie! Thanks for asking me, I totally understand why you’re worried. I actually \nheard a report that said nearly half of American teens are online constantly, so Bảo \nisn’t the only one! I’m just not sure taking his phone away completely will work. He \nuses it to talk to his friends, so he might feel isolated, and he might just find another \nscreen. Maybe you could try a couple of simple rules instead. For example, no \nphones at dinner, and the phone stays in the living room after ten o’clock. You could \nalso agree on one app limit together, so he feels it’s fair. I hope that helps, and I can \ntalk to him too, if you like!","flashcards":[{"word":"constantly","meaning":"all the time, without stopping"},{"word":"platform","meaning":"a website or app that provides a service, e.g. YouTube"},{"word":"app","meaning":"a program on a phone that does a particular job"},{"word":"isolate","meaning":"to separate someone from other people"},{"word":"despite","meaning":"even though something is true"},{"word":"decline","meaning":"a fall in number or amount"},{"word":"well-being","meaning":"a person’s general health and happiness"},{"word":"enforce","meaning":"to make sure that people obey a rule or law"},{"word":"survey","meaning":"asking many people the same questions to collect information"},{"word":"ease (up)","meaning":"to become less strict or less serious"}],"mcq_answers":{"1":"A","2":"B","3":"C","4":"A","5":"B","6":"B"},"media_url":"https://drive.google.com/file/d/1QCi_IJmEKn43Uwo5v6ZPEFA38y_t-89Q/view","media_preview":"https://drive.google.com/file/d/1QCi_IJmEKn43Uwo5v6ZPEFA38y_t-89Q/preview","media_type":"audio","id":"i2"},{"level":"Intermediate","index":3,"title":"Environment","audio_title":"World Produces 52 Million Metric Tons of Plastic Pollution Yearly","source_url":"https://learningenglish.voanews.com/a/7777411.html","watch":"","page":116,"page_end":122,"before":"1. What plastic things did you use and throw away yesterday?\n2. What happens to the rubbish in your town after it is collected?\n3. Guess: does most plastic pollution come from rich countries or from developing\ncountries?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. Every year, the world creates about ______________ metric tons of plastic pollution.\n2. More than two-thirds of this plastic comes from the Global ______________, a term\nfor developing countries.\n3. The researchers work at the University of ______________ in Britain.\n4. They studied waste in more than ______________ cities and towns.\n5. The study did not look at plastic that goes into ______________ or is properly\nburned.\n6. For ______________ of the world’s population, the government fails to collect and\ndispose of waste.\n7. The city that released the most plastic pollution was ______________.\n8. ______________ produces more plastic pollution than any other country.\n9. The United States ranks ______________ in plastic pollution.\n10. Final talks on a plastic pollution treaty were planned for November in\n______________.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. The comparison with Central Park and the Empire State Building is used to show\nA where most plastic waste is found.\nB how huge the amount of plastic pollution is.\nC how clean New York City is.\n2. Why do some regions produce so much plastic pollution, according to the study?\nA People there buy more plastic than anyone else.\nB Waste is often not collected or disposed of properly.\nC Factories there make most of the world’s plastic.\n3. What does Costas Velis, the lead writer, say about blame?\nA The Global South should not be blamed for the problem.\nB Rich countries are the only ones responsible.\nC Nobody can be responsible for plastic pollution.\n4. What do outside experts criticise about the study?\nA It used too few cities.\nB It looks at pollution instead of how much plastic is produced.\nC It was paid for by plastic companies.\n5. What does the United Nations expect to happen to plastic production?\nA It will fall by half.\nB It will stay about the same.\nC It will rise from about 400 million to more than 1.1 billion metric tons.\n6. What is the main message of the report?\nA Plastic pollution is only a problem in big cities.\nB Recycling has solved most of the problem.\nC Plastic pollution is enormous, and better waste management is only part of the\nanswer.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. landfill\na. to get rid of something you do not want\n2. dispose of\nb. to guess an amount using the information you have\n3. dump\nc. a formal written agreement between countries\n4. emit\nd. to throw something away carelessly, in the wrong\nplace\n5. treaty\ne. a place where rubbish is buried under the ground\nWord / phrase\nMeaning\n6. binding\nf. to be one of the causes of something\n7. contribute to\ng. to send something out into the air or the\nenvironment\n8. lack of\nh. to be blamed for something and expected to fix it\n9. estimate\ni. that must be obeyed because it is a legal agreement\n10. be held responsible\nj. not having enough of something","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. Our town’s ______________ is almost full, so the city is building a new one.\n2. Please ______________ old batteries at the special box in the supermarket.\n3. Some people ______________ their rubbish by the river at night.\n4. Burning plastic can ______________ dangerous gases.\n5. The countries signed a ______________ to protect the ocean.\n6. Because the agreement is legally ______________, every country must follow it.\n7. Too many single-use bags ______________ plastic pollution.\n8. A ______________ rubbish bins on the beach means people leave their waste on the\nsand.\n9. Experts ______________ that the clean-up will take ten years.\n10. Companies that make plastic should also ______________ for the waste.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nThe main finding (number +\ncomparison)\nWhere the pollution comes from\nand why\nThe worst city and country;\nwhere the US and Britain rank\nCriticism of the study + the\ntreaty\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• A new study says that...\n• To give you an idea of how big this is...\nExplaining causes\n• The main reason is that...\n• This happens because...\nGiving another view\n• However, some experts say...\n• Critics argue that...\nFinishing\n• Overall, the report suggests that...\n• In my opinion...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour class group chat. Your classmate Linh writes:\n“Guys, the school wants each class to suggest ONE way to cut plastic waste this\nterm. Can someone send a voice note with an idea? We need to vote on Friday!”\nRound 1: Record a voice note for the group (60-90 seconds). In your note:\n• share ONE shocking fact from the report\n• suggest ONE practical idea for your class or school\n• explain how it would work and why it would help\n• ask the group to vote or reply\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nGetting attention\n• Hi everyone! Did you know that...?\n• I heard something crazy about plastic...\nSuggesting\n• How about we...?\n• My idea is to...\n• We could...\nExplaining\n• That way...\n• It would help because...\nEnding\n• What do you think?\n• Vote for it on Friday if you like it!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \n52 million \nUnit: metric \ntons \n6 \n15 percent / 15% \n \n2 \nSouth \n \n7 \nLagos \nin Nigeria\nQ \nAnswer \nNote \nQ \nAnswer \nNote \n3 \nLeeds \n \n8 \nIndia \n \n4 \n50,000 / 50000 \n \n9 \n90th \n \n5 \nlandfills \n \n10 South Korea","answer_l2":"1 B    2 B    3 A    4 B    5 C    6 C","answer_v1":"1 e    2 a    3 d    4 g    5 c    6 i    7 f    8 j    9 b    10 h","answer_v2":"1 landfill    2 dispose of    3 dump    4 emit    5 treaty    6 binding    7 contribute to    8 \nlack of    9 estimate    10 be held responsible","answer_speaking":": Model summary \nA new study says that the world creates about 52 million metric tons of plastic \npollution every year, enough to fill New York’s Central Park as high as the Empire \nState Building. Researchers from the University of Leeds studied more than 50,000 \ncities and towns. They only counted plastic in the open environment, not plastic in a \nlandfill. More than two-thirds of the pollution comes from the Global South. The \nmain reason is a lack of waste services: for 15 percent of the world’s population, the \ngovernment doesn’t collect or dispose of rubbish, so people burn it or dump it. \nLagos is the worst city, and India is the worst country, while the US is 90th. \nHowever, critics say the study doesn’t look at how much plastic is produced, so \ncompanies may not be held responsible. Many countries agreed to make a legally \nbinding treaty, but plastic production is still expected to grow a lot.\nSpeaking Exercise 2: Model voice message \nHi everyone! Did you know the world creates about 52 million tons of plastic \npollution every year? A big part of the problem is plastic that people dump or burn \nbecause nobody collects it. So here’s my idea: a ‘bring your own bottle and box’ \nweek every month. Everyone brings a water bottle and a lunch box, and the canteen \ngives a small discount if you don’t take a plastic bag or cup. That way we use less \nsingle-use plastic, and less of it ends up in a landfill. We could also put a sign by the \ncanteen showing how many cups we saved each week, it would be fun to see the \nnumber grow. What do you think? Vote for it on Friday if you like it!","flashcards":[{"word":"landfill","meaning":"a place where rubbish is buried under the ground"},{"word":"dispose of","meaning":"to get rid of something you do not want"},{"word":"dump","meaning":"to throw something away carelessly, in the wrong place"},{"word":"emit","meaning":"to send something out into the air or the environment"},{"word":"treaty","meaning":"a formal written agreement between countries"},{"word":"binding","meaning":"that must be obeyed because it is a legal agreement"},{"word":"contribute to","meaning":"to be one of the causes of something"},{"word":"lack of","meaning":"not having enough of something"},{"word":"estimate","meaning":"to guess an amount using the information you have"},{"word":"be held responsible","meaning":"to be blamed for something and expected to fix it"}],"mcq_answers":{"1":"B","2":"B","3":"A","4":"B","5":"C","6":"C"},"media_url":"https://drive.google.com/file/d/1LXaPNcvBWPw0wEoq7MOyNvs_BIyAi6gx/view","media_preview":"https://drive.google.com/file/d/1LXaPNcvBWPw0wEoq7MOyNvs_BIyAi6gx/preview","media_type":"audio","id":"i3"},{"level":"Intermediate","index":4,"title":"Work","audio_title":"US Workers Secretly Take ‘Workations’","source_url":"https://learningenglish.voanews.com/a/7642462.html","watch":"","page":123,"page_end":129,"before":"1. Would you like to work or study from a beach or the mountains? Why / why not?\n2. What could go wrong if you work while you are on holiday?\n3. The word “workation” is made from two words. Which two?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. The word “workation” combines “work” and “______________”.\n2. Some people want to escape the busy, stressful life called the “______________”.\n3. A study by the company Mews found that about ______________ of employees had\nworked from a vacation place without telling their employer.\n4. The OnePoll study asked 1,000 American travelers and 1,000 American\n______________.\n5. ______________ of employed Americans said they would use vacation travel as a\nchance to work remotely.\n6. Rudi Riekstins says productivity goes up by ______________ on average when\npeople are happier.\n7. Some hotels offer workation specials, especially during ______________.\n8. The Gray Havens Inn in Georgetown, Maine, has ______________ rooms.\n9. One in six Gen Z workers used a false online background of a ______________ to\nfool their employer.\n10. Some employers allow workations as long as employees get their ______________\ndone.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. Why did workations become more popular?\nA Hotels became cheaper after the pandemic.\nB Remote work during the pandemic made people rethink their lives.\nC Companies started paying for workers’ holidays.\n2. According to Rudi Riekstins, how can workations help employers?\nA Happier workers are more productive and creative.\nB Workers take fewer holidays.\nC Companies can close their offices.\n3. Why does the Bayfront Marin House offer workation services?\nA The owner wanted to sell her cottages.\nB The owner knows from experience what remote workers need.\nC The town asked hotels to help remote workers.\n4. Why did the Gray Havens Inn create its special program?\nA to attract more younger travelers\nB to keep out business travelers\nC to fill its rooms in summer\n5. What does the report say about Gen Z workers?\nA They never work on vacation.\nB Many hide their workations from their employers.\nC Most of them work in hotels.\n6. What question does Riekstins think employers should ask?\nA How can we stop workers from traveling?\nB Which hotels give the best discounts?\nC Are workers happy, and are they still getting the job done?","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. remote\na. a small house, often used for holidays\n2. rat race\nb. to allow something\n3. hospitality\nc. to increase or improve something\n4. stimulate\nd. the business of hotels, restaurants and serving\nguests\n5. boost\ne. without other people knowing\n6. cottage\nf. done from a place away from the main office\nWord / phrase\nMeaning\n7. attract\ng. how much work is done in a period of time\n8. secretly\nh. to make someone feel excited, interested and full\nof energy\n9. productivity\ni. a stressful, competitive way of life, especially at\nwork\n10. permit\nj. to make someone want to come to a place","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. Since the pandemic, my mum has had a ______________ job, she works from our\nliving room.\n2. My uncle left the ______________ in the city and opened a small café by the sea.\n3. My sister studies ______________ because she wants to manage a hotel.\n4. Travelling to new places always ______________ my imagination.\n5. The new café hopes the festival will ______________ business.\n6. We rented a little ______________ near the lake for the summer.\n7. The museum offers free entry on Sundays to ______________ more families.\n8. He ______________ played games on his phone during the online meeting.\n9. Short breaks every hour can improve your ______________.\n10. Our school doesn’t ______________ students to use phones in class.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat is a workation? Why did\nit become popular?\nNumbers from the studies (2-3)\nTwo hotels and what they offer\nGen Z and secret workations;\nthe employer’s view\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• This report is about a new trend called...\n• The word ... combines...\nGiving numbers\n• One study found that about ... percent...\n• According to another study...\nExamples\n• For example, a hotel in ... offers...\n• Another one...\nFinishing\n• The report suggests that employers should...\n• I think workations are... because...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour older brother Huy sends you this message:\n“My company lets me work remotely for two weeks. I’m thinking of working from Đà\nLạt and NOT telling my boss. Good idea or bad idea? Be honest!”\nRound 1: Record a voice message to Huy (60-90 seconds). In your message:\n• say what you think of his plan\n• give ONE possible benefit of a workation (use the report)\n• give ONE risk of doing it secretly\n• suggest what he should do, and finish in a friendly way\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nGiving your opinion\n• Honestly, I think...\n• It sounds great, but...\nBenefits\n• The good thing is that...\n• Apparently, happier workers are...\nRisks\n• What if your boss finds out?\n• The problem is...\nAdvising\n• Why don’t you just ask...?\n• If I were you, I’d...","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nvacation \n \n6 \n70 percent / 70% \n \n2 \nrat race \n \n7 \nslower times \n \n3 \n29 percent / 29% \n \n8 \n13 / thirteen \n \n4 \nhotel workers \n \n9 \nhome office \n \n5 \n52 percent / 52% \n \n10 work","answer_l2":"1 B    2 A    3 B    4 A    5 B    6 C","answer_v1":"1 f    2 i    3 d    4 h    5 c    6 a    7 j    8 e    9 g    10 b","answer_v2":"1 remote    2 rat race    3 hospitality    4 stimulates    5 boost    6 cottage    7 attract    8 \nsecretly    9 productivity    10 permit","answer_speaking":": Model summary \nThis report is about a new trend called the workation, which combines ‘work’ and \n‘vacation’. During the pandemic, many people started doing remote work, and they \nbegan to rethink their lives. Some wanted to escape the rat race and have more \ncontrol. A study by the hospitality company Mews found that about 29 percent of \nemployees had worked from a vacation place secretly, without telling their \nemployers, and another study found that 52 percent would like to work while \ntraveling. A trainer, Rudi Riekstins, says travel stimulates people and that happier \nworkers have higher productivity. Hotels also use workations to boost business: one \nin Florida rents rooms and beach cottages with a good workspace, and a small inn in \nMaine has a special deal to attract younger remote workers. Finally, the report says \nsome employers permit workations as long as the work gets done. \nSpeaking Exercise 2: Model voice message \nHey Huy! Honestly, working from Đà Lạt sounds amazing, I’m a bit jealous! I heard \na report that said people are often more creative and productive when they travel, \nbecause a new place stimulates you. But doing it secretly? That part worries me. \nWhat if your boss calls a video meeting and sees the mountains behind you? Or what \nif the internet is slow and you miss a deadline? It could really damage his trust in \nyou. Why don’t you just ask him? Lots of companies permit workations as long as \nthe work gets done. If I were you, I’d tell him your plan and promise to keep normal \noffice hours. Good luck, and bring me back some strawberries!","flashcards":[{"word":"remote","meaning":"done from a place away from the main office"},{"word":"rat race","meaning":"a stressful, competitive way of life, especially at work"},{"word":"hospitality","meaning":"the business of hotels, restaurants and serving guests"},{"word":"stimulate","meaning":"to make someone feel excited, interested and full of energy"},{"word":"boost","meaning":"to increase or improve something"},{"word":"cottage","meaning":"a small house, often used for holidays"},{"word":"attract","meaning":"to make someone want to come to a place"},{"word":"secretly","meaning":"without other people knowing"},{"word":"productivity","meaning":"how much work is done in a period of time"},{"word":"permit","meaning":"to allow something"}],"mcq_answers":{"1":"B","2":"A","3":"B","4":"A","5":"B","6":"C"},"media_url":"https://drive.google.com/file/d/1tMyqFwPafYfJ3lCu6aFC1rjFXP59R_sP/view","media_preview":"https://drive.google.com/file/d/1tMyqFwPafYfJ3lCu6aFC1rjFXP59R_sP/preview","media_type":"audio","id":"i4"},{"level":"Intermediate","index":5,"title":"Education","audio_title":"Study Looks at How 15-year-olds Learn English","source_url":"https://learningenglish.voanews.com/a/7514595.html","watch":"","page":130,"page_end":136,"before":"1. Where do you see or hear English outside school every week?\n2. Do you learn more English from school or from the internet? Why?\n3. Which skill is hardest for you: reading, listening, speaking or writing?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. Today’s students have a lot of ______________ to English outside the classroom.\n2. The study was supported by the OECD and looked at teenagers in ______________\ncountries.\n3. The researchers visited schools and ______________ English lessons.\n4. The findings will support the PISA test in ______________.\n5. In 2025, PISA will measure the English skills of students in ______________\ncountries for the first time.\n6. Students in ______________ said it is easier to search for information in English\nonline.\n7. Half of the students in the ______________ said they always use English with digital\ntools.\n8. Christa Rawkins says online platforms are not necessarily ______________ students\nEnglish.\n9. Children in cities used English more in daily life than children in ______________.\n10. Teachers said students struggled most with writing and ______________.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. What are teachers unsure about?\nA whether students enjoy English lessons\nB whether digital exposure improves students’ spoken English\nC whether textbooks are too expensive\n2. How do teens mostly use English on social media?\nA to communicate with people, not to sit down and study\nB to take online English courses\nC to practise grammar exercises\n3. What worried a teacher in Finland?\nA Students were watching too many films.\nB Students might think they don’t need to study English.\nC Students preferred Finnish websites.\n4. What is the “disconnect” the researchers describe?\nA Students cannot get online at school.\nB English outside school is about communicating, but school English feels like\ngrammar.\nC Teachers and parents disagree about homework.\n5. Which example of unfairness (inequity) is given?\nA Some schools have more English teachers.\nB Boys get more speaking practice than girls.\nC Wealthy families can pay for travel, camps and private lessons.\n6. Why might students find speaking difficult?\nA They have no speaking lessons at all.\nB They may lack self-confidence and practise reading and listening more.\nC Their teachers only speak their first language.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. exposure\na. the reason or wish to do something\n2. digital\nb. belief in your own abilities\n3. obvious\nc. to go beyond the normal limits of something\n4. transcend\nd. to become familiar with something after a while\n5. inequity\ne. easy to see or understand\n6. motivation\nf. to find something very difficult to do\nWord / phrase\nMeaning\n7. self-confidence\ng. connected with the countryside, not the city\n8. struggle\nh. an unfair difference between people or groups\n9. rural\ni. the experience of seeing or hearing something\noften\n10. get used to\nj. connected with computers and the internet","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. Watching cartoons in English gave my little brother lots of ______________ to the\nlanguage.\n2. Our school now uses ______________ textbooks on tablets.\n3. It’s ______________ that she loves music, she sings all day!\n4. Good stories ______________ borders and languages.\n5. Some students have fast internet at home and others don’t, that’s an\n______________.\n6. Winning the speaking contest gave me a lot of ______________ to keep practising.\n7. Joining the drama club helped me build my ______________.\n8. Many learners ______________ with English pronunciation at first.\n9. My grandparents live in a ______________ area, far from the nearest town.\n10. At first the teacher’s accent was hard to follow, but I soon ______________ it.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words
