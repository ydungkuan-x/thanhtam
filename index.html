ur own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nThe speaker’s main warning\nThe Facebook example\nThe Google example (57\nsignals, Egypt)\nWhat a filter bubble is and why\nit is dangerous\nPlan\nYour keywords\nThe Netflix example + my\nreaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker warns that the internet is becoming...\n• He first noticed this when...\nExplaining a concept\n• What he means by a filter bubble is...\n• The problem is that...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour friend Linh sends you this message:\n“I only follow pages I agree with. Why should I see stuff that annoys me? My feed,\nmy rules 😎”\nRound 1: Record a voice reply (90-120 seconds). In your reply:\n• accept that she has a point\n• explain the idea of a filter bubble using ONE example from the talk\n• explain why seeing other views can help her\n• suggest ONE easy change to her feed\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nAccepting a point\n• Fair enough, nobody likes being annoyed.\n• I get it, it’s your feed.\nExplaining\n• The thing is, your feed is already filtered for you.\n• There’s a name for this: ...\nPersuading\n• If you never see the other side...\n• It’s a bit like eating only dessert.\nSuggesting\n• Why not follow just one or two...?\n• You could try...","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nsquirrel \n \n6 \nlocation \n \n2 \nMaine \n \n7 \nEgypt \n \n3 \nconservatives \n \n8 \nprotests \n \n4 \nlinks \n \n9 \nIron Man \n \n5 \n57 \n \n10 junk food","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 j    2 h    3 f    4 b    5 d    6 e    7 i    8 c    9 g    10 a","answer_v2":"Part A: 1 personalised / personalized    2 relevant    3 invisible    4 balanced    5 impulsive    \n6 surprised   |   Part B: 7 edited them out    8 no standard Google    9 tailored for each \nreader / tailored to each reader    10 what gets in","answer_speaking":": Model summary (2-minute version) \nThe speaker warns that the internet is becoming personalised in a way that is \ninvisible to us. He first noticed this when the conservative friends he liked hearing \nfrom disappeared from his Facebook feed. Facebook had edited them out because he \nclicked on his liberal friends’ links more often. Google does something similar: its \nalgorithms look at 57 signals, such as your location and browser, so there is no \nstandard Google any more. When two of his friends searched for Egypt, one got lots \nof news about the protests and the other got nothing about them. News sites are also \nbeing tailored to each reader. What he means by a filter bubble is your own personal \nworld of information online. The problem is that you don’t decide what gets in, and \nyou can’t see what is left out. Algorithms tend to favour our impulsive selves over \nour aspirational selves, like Netflix sending us light comedies instead of serious \nfilms. So instead of a balanced information diet, we get junk food. The new \ngatekeepers must show us what is relevant but also what is important. What struck \nme most was that the filtering happens without us knowing. \nSpeaking Exercise 2: Model voice reply \nFair enough, Linh, nobody likes being annoyed by their feed. But the thing is, your \nfeed is already filtered for you, even before you choose anything. I watched a talk \nabout this; the speaker calls it a ‘filter bubble’. Apps look at what you click and \nslowly hide everything else. He said two friends searched Google for the same thing, \nEgypt, and only one of them saw news about the protests happening there! If you \nonly ever see people who agree with you, you start thinking everyone thinks like you, \nand that’s not true. It’s a bit like eating only dessert. Tasty, but not very healthy. Why \nnot follow just one or two good pages with a different view? You don’t have to agree \nwith them, just know what they’re saying. It might even make you better at arguing \nyour side!","flashcards":[{"word":"relevant","meaning":"connected with what is happening or being discussed"},{"word":"personalised","meaning":"designed or changed for one particular person"},{"word":"algorithm","meaning":"a set of rules a computer follows to make decisions"},{"word":"tailored","meaning":"made to suit a particular person or purpose"},{"word":"edit out","meaning":"to remove something so that it does not appear"},{"word":"invisible","meaning":"impossible to see"},{"word":"impulsive","meaning":"acting suddenly without thinking carefully"},{"word":"aspirational","meaning":"connected with what you hope to become"},{"word":"balanced","meaning":"giving equal attention to all sides"},{"word":"gatekeeper","meaning":"a person or thing that controls who or what gets access"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/17nRMNEwllmjV7xrYehJznYPfmS_z3CSV/view","media_preview":"https://drive.google.com/file/d/17nRMNEwllmjV7xrYehJznYPfmS_z3CSV/preview","media_type":"video","id":"a6"},{"level":"Advanced","index":7,"title":"Culture & Globalisation","audio_title":"Where is home?","source_url":"https://youtube.com/watch?v=3m6dV7Xo3Vc","watch":"From “Where do you come from?” (about 00:12)\nuntil he says “You can’t take anything for granted.” (about 05:50)","page":261,"page_end":269,"before":"1. Where is “home” for you: a city, a house, a group of people, or something else?\n2. Would you like to live in another country one day? Why / why not?\n3. Do young people today feel more “global” than their grandparents did?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nWhere he comes from\n• He is Indian by blood, but India has more than (1) ______________ dialects\n• He has lived in the US for (2) ______________ but has never had a US passport\n• His US card calls him a “permanent (3) ______________”\n• He has lived in Japan for (4) ______________ on a tourist visa\nWhat home means\n• Home has less to do with a piece of soil and more to do with a piece of (5)\n______________\n• Home could be the (6) ______________ you carry with you everywhere\nLosing a house\n• A (7) ______________ destroyed his family house and everything in it\n• He spent the night on a friend’s floor with only a (8) ______________\nThe numbers\n• About (9) ______________ people live in countries that are not their own\n• Together, they would be the (10) ______________ largest nation on Earth","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nIn which TWO cities does he say children are already more international than he was?\nA Hong Kong\nB Sydney\nC Paris\nD Tokyo\nE Mumbai\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO facts about the US president at the time does he mention?\nA He was half Kenyan.\nB He was partly raised in Indonesia.\nC He was born in Canada.\nD He speaks five languages.\nE He lived in Japan.\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. How did his grandparents’ sense of identity differ from people’s today?\nA They travelled more than we do.\nB Their identity was decided at birth; today we can choose it.\nC They had no sense of home.\nD They lived in many different countries.\n6. How did losing his house make him feel in the end?\nA completely lost\nB strangely free, because home was something he carried inside him\nC angry at the government\nD keen to buy a bigger house\n7. What point does he make with the example of Toronto?\nA Toronto is the most expensive city in Canada.\nB In some cities, the average person was born in another country.\nC Toronto has the most tourists.\nD People in Toronto never travel.\n8. What does he mean by “You can’t take anything for granted”?\nA Everything is expensive today.\nB In a mixed, moving world, nothing about identity is simple or fixed any more.\nC You should always carry your passport.\nD Travel is dangerous.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. ancestry\na. a form of a language spoken in one area\n2. dialect\nb. to accept something without questioning it\n3. permanent\nc. the top layer of earth in which plants grow\n4. take for granted\nd. a country and its people\nExpression\nMeaning\n5. identity\ne. the people in your family who lived a long time\nbefore you\n6. liberating\nf. to be greater in number than\n7. soil\ng. who or what a person is\n8. outnumber\nh. making you feel free\n9. assign\ni. lasting for ever or for a very long time\n10. nation\nj. to give someone a particular role or thing","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. He has Indian ______________ but has never lived in\nIndia.\nANCESTOR\n2. His card says he is a ______________ alien.\nPERMANENCE\n3. Losing everything was strangely ______________.\nLIBERATE\n4. Our grandparents’ ______________ was decided for them\nat birth.\nIDENTIFY\n5. The number of people living outside their home country is\ngrowing ______________.\nRAPID\n6. Today, home is more a matter of ______________.\nCHOOSE\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. After so many years, he feels he deserves to call Japan\nhome.\nEARNED\nHe feels he ____________________________ to call Japan home.\n8. Soon there will be more people living abroad than\nAmericans.\nOUTNUMBER\nSoon people living abroad ____________________________.\n9. Home is less about a place on the map.\nSOIL\nHome has less to do with ____________________________.\n10. Nothing about where people come from is simple any\nmore.\nGRANTED\nYou can’t ____________________________ any more.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nWhy “Where do you come\nfrom?” is hard for him\nHis connections to India,\nEngland, the US and Japan\nHis idea of what home is\nPlan\nYour keywords\nThe wildfire story\nThe global numbers + my\nreaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker struggles to answer the question...\n• For him, home is not...\nTelling a story\n• At one point...\n• As a result...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nAn exchange student in your class, Mia, sends you this message:\n“My mum’s German, my dad’s Brazilian and I grew up in Singapore. Everyone asks\nwhere I’m from and I never know what to say 😅 Is that weird?”\nRound 1: Record a voice reply (90-120 seconds). In your reply:\n• reassure her that it is not weird\n• share ONE or TWO ideas or facts from the talk\n• suggest how she could answer the question next time\n• say something positive about her background\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nReassuring\n• Not weird at all, honestly.\n• Loads of people feel the same.\nSharing evidence\n• I watched a talk by a writer who...\n• Apparently, about 220 million people...\nSuggesting\n• Next time, you could just say...\n• Maybe say where your home is, not where you’re from.\nBeing positive\n• That’s such a cool mix!\n• You’ve got three cultures to draw on.","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \n22,000 \n \n6 \nsongs \n \n2 \n48 years \n \n7 \nwildfire \n \n3 \nalien \n \n8 \ntoothbrush \n \n4 \n25 years \n \n9 \n220 million \n \n5 \nsoul \n \n10 fifth \n5th","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 e    2 a    3 i    4 b    5 g    6 h    7 c    8 f    9 j    10 d","answer_v2":"Part A: 1 ancestry    2 permanent    3 liberating    4 identity    5 rapidly    6 choice   |   Part \nB: 7 has earned the right    8 will outnumber Americans    9 a piece of soil    10 take \nanything for granted","answer_speaking":": Model summary (2-minute version) \nThe speaker struggles to answer the question ‘Where do you come from?’. He has \nIndian ancestry but has never lived in India, where there are thousands of dialects. \nHe was born and educated in England, has lived in the US for 48 years as a \n‘permanent alien’ and has spent 25 years in Japan on a tourist visa, which he feels \nhas earned him the right to call it home. For him, home is not a piece of soil but a \npiece of soul: the people you love, the songs you carry with you. At one point, a\nwildfire destroyed his family house, and he slept on a friend’s floor with only a \ntoothbrush. As a result, he realised that home was inside him, which was liberating. \nHe argues that our grandparents’ identity was assigned at birth, while today we can \nchoose it. About 220 million people live outside their own countries, which would \nmake them the fifth largest nation, and they may soon outnumber Americans. \nThat’s why we can’t take anything for granted. What struck me most was the idea \nof home as something you carry rather than somewhere you live. \nSpeaking Exercise 2: Model voice reply \nNot weird at all, Mia, honestly. Loads of people feel exactly the same. I watched a \ntalk by a travel writer who has Indian parents, grew up in England, lives in the US \nand has spent years in Japan, and he can’t answer that question either! Apparently, \nabout 220 million people live outside the country they were born in, so you’re \ndefinitely not alone. He said home has less to do with a piece of land and more to do \nwith a piece of your soul: the people you love and the things you carry with you. So \nnext time, maybe you could say where your home is, not where you’re from, or just \ntell the whole story. People will probably find it really interesting. And honestly, \nthat’s such a cool mix. You’ve got three cultures to draw on!","flashcards":[{"word":"ancestry","meaning":"the people in your family who lived a long time before you"},{"word":"dialect","meaning":"a form of a language spoken in one area"},{"word":"permanent","meaning":"lasting for ever or for a very long time"},{"word":"take for granted","meaning":"to accept something without questioning it"},{"word":"identity","meaning":"who or what a person is"},{"word":"liberating","meaning":"making you feel free"},{"word":"soil","meaning":"the top layer of earth in which plants grow"},{"word":"outnumber","meaning":"to be greater in number than"},{"word":"assign","meaning":"to give someone a particular role or thing"},{"word":"nation","meaning":"a country and its people"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1ijiOxkMJy0xmz86LPKG4zt14UJDYeqZ5/view","media_preview":"https://drive.google.com/file/d/1ijiOxkMJy0xmz86LPKG4zt14UJDYeqZ5/preview","media_type":"video","id":"a7"},{"level":"Advanced","index":8,"title":"Crime & Law","audio_title":"A prosecutor's vision for a better justice system","source_url":"https://youtube.com/watch?v=Wg7cxCrfqTc","watch":"From “In the fall of 2009,” (about 05:46) until he\nsays “...makes perfect sense.” (about 11:44)","page":270,"page_end":278,"before":"1. Should young people who commit minor crimes go to prison? Why / why not?\n2. What are the alternatives to prison for first-time offenders?\n3. Can a criminal record affect someone’s future? How?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nChristopher’s case\n• The story began in the fall of (1) ______________\n• Christopher, 18, stole (2) ______________ laptops from the store where he\nworked\n• He sold them (3) ______________\n• He was charged with 30 counts of (4) ______________ theft\nThe prosecutor’s choice\n• The speaker was (5) ______________ years old at the time\n• Prosecutors are judged on their convictions and (6) ______________\n• A record would make it hard to get a job, an education or stable (7)\n______________\n• He could reduce the charges to a (8) ______________ or drop the case\nWhat happened next\n• About (9) ______________ of the computers were returned\n• Today Christopher works as a manager at a large (10) ______________ in\nBoston","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO things did Christopher have to do instead of going to court?\nA community service\nB write an essay\nC pay a large fine\nD move to another city\nE wear an electronic tag\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO things did Christopher do after that?\nA applied to college\nB got financial aid\nC joined the army\nD opened his own shop\nE became a lawyer\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. What worried Christopher most when he was first in court?\nA losing his job\nB the possibility of going to prison\nC what his friends would think\nD paying the money back\n6. Why does the speaker say a criminal record would be so harmful for Christopher?\nA Records are very expensive to remove.\nB It would close doors to work, education and a home for the rest of his life.\nC It would make him famous in a bad way.\nD It would stop him travelling abroad.\n7. How did Christopher respond when they met again years later?\nA He asked for money.\nB He hugged the speaker and thanked him.\nC He didn’t recognise him.\nD He was still angry.\n8. What is the main point of this story?\nA Prosecutors should be stricter.\nB Prosecutors have the power to help young people change, instead of ruining their\nlives.\nC Shops should protect their laptops better.\nD Banks should hire more ex-offenders.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. prosecutor\na. to help someone return to a normal, useful life\n2. felony\nb. the state of being kept in prison\n3. misdemeanor\nc. responsible for your actions and expected to\nexplain them\nExpression\nMeaning\n4. conviction\nd. a serious crime\n5. criminal record\ne. an official statement accusing someone of a crime\n6. charge\nf. a less serious crime\n7. arraign\ng. an official list of the crimes a person has\ncommitted\n8. incarceration\nh. a lawyer who tries to prove in court that someone\nis guilty\n9. rehabilitate\ni. to bring someone to court to answer a charge\n10. accountable\nj. a decision in court that someone is guilty","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. He faced thirty counts of felony ______________.\nTHIEF\n2. Prosecutors are often judged by the number of\n______________ they get.\nCONVICT\n3. Mass ______________ has huge costs for society.\nINCARCERATE\n4. The aim is to hold young people ______________\nwithout ruining their lives.\nACCOUNT\n5. A record makes ______________ very difficult.\nEMPLOY\n6. The programme helps to ______________ young\noffenders.\nREHABILITATION\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. What scared him most was the possibility of going to\nprison.\nJAIL\nWhat scared him most was ____________________________.\n8. A conviction would have left him with a criminal record.\nRECORD\nA conviction would have ____________________________.\n9. Prosecutors are measured by the number of people they\nconvict.\nCONVICTIONS\nProsecutors are measured ____________________________.\n10. We should hold young people responsible without\ndestroying their future.\nINSTEAD\nWe should hold young people responsible ____________________________.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nWho Christopher was and what\nhe did\nThe charges and his main worry\nThe speaker’s options and how\nprosecutors are judged\nPlan\nYour keywords\nWhat he decided and what\nChristopher had to do\nChristopher today + my\nreaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker tells the story of...\n• Instead of..., he decided to...\nExplaining consequences\n• If he had been convicted...\n• As a result...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nA neighbour says this to you in the lift:\n“Did you hear? The teenager from floor 7 was caught stealing from the supermarket.\nKids like that should be locked up. It’s the only way they learn!”\nRound 1: Reply to your neighbour politely (90-120 seconds, as a voice recording). In\nyour reply:\n• respond politely and show you understand the concern\n• tell the story of Christopher briefly\n• explain why a criminal record can make things worse\n• suggest ONE alternative way to hold the teenager responsible\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nPolite disagreement\n• I understand why you feel that way.\n• I’m not sure prison is the answer, though.\nTelling a story\n• I heard about a prosecutor in Boston who...\n• In the end...\nExplaining\n• The problem with a criminal record is that...\n• Once you have one, it’s very hard to...\nSuggesting\n• Maybe something like... would work better.\n• He could still pay for what he did by...","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \n2009 \n \n6 \ntrial wins \n \n2 \n30 \n \n7 \nhousing \n \n3 \nonline \n \n8 \nmisdemeanor\nQ \nAnswer \nNote \nQ \nAnswer \nNote \n4 \nfelony \n \n9 \n75 percent / 75% \n \n5 \n29 \n \n10 bank","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 h    2 d    3 f    4 j    5 g    6 e    7 i    8 b    9 a    10 c","answer_v2":"Part A: 1 theft    2 convictions    3 incarceration    4 accountable    5 employment    6 \nrehabilitate   |   Part B: 7 potential jail time    8 given him a criminal record    9 by their \nconvictions    10 instead of ruining them / instead of ruining their future","answer_speaking":": Model summary (2-minute version) \nThe speaker, a former prosecutor, tells the story of Christopher, an eighteen-year-old \nwho stole thirty laptops from the store where he worked and sold them online. He \nwas charged with thirty felonies, and what scared him most was going to jail. The \nspeaker explains that prosecutors are usually judged on their convictions and trial \nwins, so the easy choice was to prosecute. But he realised that a criminal record \nwould stop Christopher getting a job, an education or stable housing. Instead of \nprosecuting, he decided not to arraign him at all. Christopher had to return the \ncomputers, do community service and write an essay about what he had done. As a \nresult, he applied to college, got financial aid and graduated. Today he’s a manager at \na big bank in Boston. The speaker argues that we can hold young people accountable \nand rehabilitate them, rather than adding to mass incarceration. What struck me \nmost was that one person’s decision completely changed Christopher’s life.\nSpeaking Exercise 2: Model voice reply \nI understand why you feel that way. Stealing is wrong, and he should definitely face \nthe consequences. I’m not sure prison is the answer, though. I heard about a \nprosecutor in Boston who had a case like this: an eighteen-year-old who stole thirty \nlaptops from his workplace. Instead of sending him to court, the prosecutor made him \nreturn the computers, do community service and write an essay. In the end, the young \nman went to college and now he’s a manager at a bank! The problem with a criminal \nrecord is that once you have one, it’s very hard to get a job or even rent a flat, so \npeople often end up committing more crimes. Maybe something like working at the \nsupermarket for a few weekends would work better. He could still pay for what he \ndid, but without ruining his whole future.","flashcards":[{"word":"prosecutor","meaning":"a lawyer who tries to prove in court that someone is guilty"},{"word":"felony","meaning":"a serious crime"},{"word":"misdemeanor","meaning":"a less serious crime"},{"word":"conviction","meaning":"a decision in court that someone is guilty"},{"word":"criminal record","meaning":"an official list of the crimes a person has committed"},{"word":"charge","meaning":"an official statement accusing someone of a crime"},{"word":"arraign","meaning":"to bring someone to court to answer a charge"},{"word":"incarceration","meaning":"the state of being kept in prison"},{"word":"rehabilitate","meaning":"to help someone return to a normal, useful life"},{"word":"accountable","meaning":"responsible for your actions and expected to explain them"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/186TCrF6Ven4tomBvvP06W7M_JU2AkPec/view","media_preview":"https://drive.google.com/file/d/186TCrF6Ven4tomBvvP06W7M_JU2AkPec/preview","media_type":"video","id":"a8"},{"level":"Advanced","index":9,"title":"Cities & Urbanisation","audio_title":"Why buses represent democracy in action","source_url":"https://youtube.com/watch?v=j3YjeARuilI","watch":"From the beginning (00:00) until he says “...equally\nimportant to those who have cars.” (about 06:00)","page":279,"page_end":287,"before":"1. How do most people travel around your city? Is it easy to get around?\n2. Should cities spend more money on roads for cars or on public transport? Why?\n3. Is it pleasant to walk in your city? What would make it better?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nWhat an advanced city is\n• Mobility is very different from other problems because it is about (1)\n______________\n• An advanced city is not one where even the poor use cars, but where the (2)\n______________ use public transport\n• In Amsterdam, more than (3) ______________ of trips are made by bicycle\n• The Netherlands has a higher income per person than the (4) ______________\nDemocracy and road space\n• All citizens are equal before the (5) ______________\n• A bus with 100 people has a right to (6) ______________ more road space than a\ncar\n• In Bogotá, TransMilenio buses run in (7) ______________\n• In Guangzhou, the bus system carries more passengers than all the metro lines in\n(8) ______________ except one\nPedestrians\n• In many cities, pedestrians are treated like (9) ______________ citizens\n• We should give priority to (10) ______________ over roads for cars","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO things does he say all children deserve?\nA green spaces\nB swimming pools\nC private cars\nD smartphones\nE big houses\nQuestions 3-4. Choose TWO letters, A-E.\nMobility spending competes with spending on which TWO other things?\nA housing\nB schools\nC the army\nD advertising\nE airports\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. What does he mean when he says buses passing cars stuck in traffic are “democracy\nat work”?\nA Bus drivers are elected.\nB The public good is put before private interest.\nC Buses are cheaper than cars.\nD Everyone can drive a bus.\n6. What point does he make about votes for women?\nA Women use buses more than men.\nB Things that seem normal today, like equal rights, were not normal not so long\nago.\nC Women were the first to use TransMilenio.\nD Women’s votes changed transport policy.\n7. What is special about the Guangzhou bus system?\nA It is free for everyone.\nB It carries a huge number of passengers at a fraction of the cost of a metro.\nC It only runs at night.\nD It uses electric buses only.\n8. What example does he give of a city ignoring pedestrians?\nA a road with no traffic lights\nB a new elevated road built with no sidewalk\nC a park closed at night\nD a bus stop with no seats","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. equity\na. something that is more important than other things\n2. mobility\nb. fairness, with everyone treated equally\n3. public good\nc. the ability to move around easily\nExpression\nMeaning\n4. prevail\nd. a person who is walking, not driving\n5. exclusive lane\ne. something that benefits everyone in society\n6. at a fraction of the cost\nf. a part of the road only certain vehicles can use\n7. pedestrian\ng. the path for walking at the side of a road\n(pavement in British English)\n8. sidewalk\nh. a situation where roads are too full of traffic\n9. priority\ni. to win or be accepted in the end\n10. congestion\nj. for a very small part of the usual price","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. Transport is a question of ______________ between rich\nand poor.\nEQUAL\n2. Cities must improve the ______________ of all citizens.\nMOBILE\n3. Traffic ______________ wastes hours every day.\nCONGESTED\n4. ______________ should be treated as first-class citizens.\nPEDESTRIAN\n5. Buses should have ______________ over private cars.\nPRIOR\n6. Bus lanes are a clear ______________ principle.\nDEMOCRACY\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. A bus with 100 passengers deserves 100 times more\nspace.\nRIGHT\nA bus with 100 passengers ____________________________ 100 times more space.\n8. The good of everyone must win over private interest.\nPREVAILS\nDemocracy means the public good ____________________________.\n9. The system carries huge numbers of people for much less\nmoney.\nFRACTION\nThe system carries huge numbers of people ____________________________ the\ncost.\n10. People who walk matter just as much as people who\ndrive.\nEQUALLY\nPedestrians are ____________________________ drivers.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nThe speaker’s definition of an\nadvanced city\nAmsterdam and the Netherlands\nEquality and road space (bus vs\ncar)\nPlan\nYour keywords\nTransMilenio and Guangzhou\nPedestrians and sidewalks + my\nreaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker, a former mayor, argues that...\n• For him, an advanced city is...\nComparing\n• Compared with a car, a bus...\n• Whereas......\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour city has asked residents for opinions. A friend posts:\n“The city wants to turn one car lane on our main road into a bus-only lane. Traffic is\nalready terrible! This is crazy, right? 😤”\nRound 1: Record a voice reply (90-120 seconds). In your reply:\n• acknowledge your friend’s frustration\n• explain the idea of “equity” in transport using the talk\n• use ONE real example (Bogotá or Guangzhou)\n• suggest what residents could ask the city for\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nAcknowledging\n• I totally get it, traffic here is a nightmare.\n• Nobody wants to sit in a jam for longer.\nExplaining\n• There’s a really interesting argument from...\n• His point is that a bus with 80 people...\nGiving an example\n• In Bogotá, for instance...\n• In Guangzhou...\nSuggesting\n• Maybe we could ask the city to...\n• It’d be worth asking for...","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nequity \n \n6 \n100 times \n \n2 \nrich \n \n7 \nexclusive lanes \n \n3 \n30 percent / 30% \n \n8 \nChina \n \n4 \nUnited States / US \n \n9 \nthird-class \ncitizens \n5 \nlaw \n \n10 sidewalks","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 b    2 c    3 e    4 i    5 f    6 j    7 d    8 g    9 a    10 h","answer_v2":"Part A: 1 equity    2 mobility    3 congestion    4 Pedestrians    5 priority    6 democratic   |   \nPart B: 7 has a right to    8 prevails over private interest    9 at a fraction of    10 equally \nimportant to","answer_speaking":": Model summary (2-minute version) \nThe speaker, a former mayor of Bogotá, argues that urban transport is about equity, \nnot just mobility. For him, an advanced city is not one where even the poor use cars, \nbut one where the rich use public transport. Amsterdam is a good example: over 30 \npercent of trips there are made by bicycle, even though the Netherlands is a very rich \ncountry. Since all citizens are equal before the law, a bus carrying a hundred people \nshould have a hundred times more road space than a car. That’s why he built \nexclusive lanes for buses in Bogotá. When buses speed past cars stuck in congestion, \nit shows that the public good prevails over private interest, which he calls \ndemocracy at work. In Guangzhou, a similar bus system carries more people than \nalmost any metro line in China, at a fraction of the cost. Finally, he says \npedestrians are treated as third-class citizens, and that sidewalks should have \npriority over roads. What struck me most was the idea that a bus lane is a symbol of \ndemocracy. \nSpeaking Exercise 2: Model voice reply \nI totally get it, traffic here is a nightmare, and nobody wants to sit in a jam for longer. \nBut there’s a really interesting argument from a former mayor of Bogotá. His point is \nthat a bus with eighty people has a right to eighty times more road space than a car \nwith one person, because everyone is equal. In Bogotá, for instance, they gave buses \ntheir own lanes, and now the buses fly past the cars. In Guangzhou, a bus system like \nthis carries more people than most metro lines in China, for much less money. So if \nmore people take the bus, traffic might actually get better in the long run. Maybe we\ncould ask the city to add more buses at the same time, and better bus stops, so people \nactually switch. Then it’s not just a lane; it’s a real alternative.","flashcards":[{"word":"equity","meaning":"fairness, with everyone treated equally"},{"word":"mobility","meaning":"the ability to move around easily"},{"word":"public good","meaning":"something that benefits everyone in society"},{"word":"prevail","meaning":"to win or be accepted in the end"},{"word":"exclusive lane","meaning":"a part of the road only certain vehicles can use"},{"word":"at a fraction of the cost","meaning":"for a very small part of the usual price"},{"word":"pedestrian","meaning":"a person who is walking, not driving"},{"word":"sidewalk","meaning":"the path for walking at the side of a road (pavement in British English)"},{"word":"priority","meaning":"something that is more important than other things"},{"word":"congestion","meaning":"a situation where roads are too full of traffic"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1PSJWGNOKDSURJLA7jJcUcETwF0kjQT4_/view","media_preview":"https://drive.google.com/file/d/1PSJWGNOKDSURJLA7jJcUcETwF0kjQT4_/preview","media_type":"video","id":"a9"},{"level":"Advanced","index":10,"title":"Family & Relationships","audio_title":"For parents, happiness is a very high bar","source_url":"https://youtube.com/watch?v=DOgsYATbV-s","watch":"From “So how did we get here?” (about 04:35)\nuntil she says “...who walks them to school every morning?”\n(about 10:01)","page":288,"page_end":296,"before":"1. How was your childhood different from your parents’ childhood?\n2. Do parents today put more pressure on their children than in the past? Why?\n3. Who does most of the housework and childcare in families you know?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nChildren in the past\n• Children used to work on farms and in factories, mills and (1) ______________\n• They were seen as economic (2) ______________\n• During the Progressive Era, child (3) ______________ was banned\n• School became children’s (4) ______________\n• Children went from being useful to being “economically worthless but\nemotionally (5) ______________”\nChildren’s work becomes parents’ work\n• Parents now feel responsible for extracurricular activities and (6)\n______________\n• A woman in (7) ______________ said: “Homework is the new dinner.”\n• Mothers today spend more time with their children than they did in (8)\n______________\nAnxiety about the future\n• When she was a child, people said she should learn (9) ______________\n• Now parents are told their children should learn (10) ______________","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nIn the old “reciprocal arrangement”, which TWO things did parents give children?\nA food\nB shelter\nC pocket money\nD university fees\nE computers\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO activities does she list as things parents now feel children must do?\nA chess\nB team sports\nC cooking\nD farming\nE sewing\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. What did children give parents in return in the past?\nA love and respect only\nB their income and help with the family’s work\nC nothing at all\nD care in old age only\n6. What does “Homework is the new dinner” mean?\nA Families eat while doing homework.\nB Homework has become the main activity middle-class families do together in the\nevening.\nC Children no longer eat dinner.\nD Homework is served after dinner.\n7. Why do middle-class parents pour so much time and money into their children?\nA because they have more free time than before\nB because they are anxious about how to prepare children for an uncertain future\nC because schools ask them to\nD because children demand it\n8. What new source of tension does she describe at the end of the segment?\nA arguments with teachers\nB arguments between parents about who does which childcare tasks\nC arguments with grandparents\nD arguments about money","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. asset\na. given and received in return\n2. reciprocal\nb. someone or something that is useful or valuable\n3. ban\nc. a rushed, panicked hurry\nExpression\nMeaning\n4. extracurricular\nd. all the people who work in a country or company\n5. priceless\ne. done outside normal school lessons\n6. pour into\nf. too valuable to have a price\n7. anxiety\ng. to officially forbid something\n8. division of labour\nh. to give a lot of money, time or effort to something\n9. workforce\ni. a feeling of worry about what might happen\n10. mad dash\nj. the way work is shared between people","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. Children used to be economic ______________ for their\nfamilies.\nASSET\n2. Children are now economically ______________ but\nemotionally priceless.\nWORTH\n3. Parents feel deep ______________ about their children’s\nfuture.\nANXIOUS\n4. Most women are now in paid ______________.\nEMPLOY\n5. The old arrangement was ______________: both sides\ngave something.\nRECIPROCATE\n6. Child labour was ______________ during the Progressive\nEra.\nBAN\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. Doing homework together has replaced family dinner.\nNEW\nHomework is ____________________________.\n8. Middle-class parents give much more time and money to\ntheir children.\nPOUR\nMiddle-class parents ____________________________ into their children.\n9. Most mothers now have jobs outside the home.\nWORKFORCE\nMost mothers are now ____________________________.\n10. Parents hope that one activity will turn out to be worth it.\nPAYS\nParents hope that ____________________________.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nHow children were seen in the\npast\nThe change in the Progressive\nEra\nWhy children’s work became\nparents’ work (homework,\nactivities)\nPlan\nYour keywords\nParents’ anxiety about the\nfuture (Japanese / Mandarin)\nTension between parents + my\nreaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker explains how...\n• In the past, children were...; today...\nDescribing change\n• Over time...\n• This shift meant that...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour older sister, a busy mum, sends you this message:\n“I signed Bin up for piano, swimming, English AND maths class. He’s 7. Everyone\nelse’s kids do the same. But he cries every Sunday night. Am I doing too much?”\nRound 1: Record a voice reply (90-120 seconds). In your reply:\n• respond kindly, without judging her\n• share ONE or TWO ideas from the talk\n• give your honest opinion on Bin’s schedule\n• suggest ONE practical change\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nKind opening\n• You’re clearly a really caring mum.\n• It’s so hard to know what’s right.\nSharing ideas\n• I watched a talk by a journalist who...\n• She says parents today feel...\nGiving an opinion\n• Honestly, I think...\n• If he cries every Sunday, maybe...\nSuggesting\n• What if you let him choose...?\n• Maybe drop one and see how he feels.","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nmines \n \n6 \nhomework \n \n2 \nassets \n \n7 \nTexas \n \n3 \nlabor / labour \n \n8 \n1965 \n \n4 \nwork \n \n9 \nJapanese \n \n5 \npriceless \n \n10 Mandarin","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 b    2 a    3 g    4 e    5 f    6 h    7 i    8 j    9 d    10 c","answer_v2":"Part A: 1 assets    2 worthless    3 anxiety    4 employment    5 reciprocal    6 banned   |   \nPart B: 7 the new dinner    8 pour more time and resources    9 in the workforce    10 one \neffort pays off","answer_speaking":": Model summary (2-minute version) \nThe speaker explains how parenting became so stressful. In the past, children worked \non farms and in factories and mines; they were economic assets, and the arrangement\nwas reciprocal: parents gave food and shelter, and children gave their labour. Over \ntime, child labour was banned, and school became children’s work. As a result, \nchildren went from economically useful to economically worthless but emotionally \npriceless. This shift meant that parents took on new jobs, like extracurricular \nactivities and homework. One mother told her that homework is the new dinner. \nMiddle-class parents pour more time and money into their children than ever, \nbecause of anxiety about an uncertain future. When the speaker was young, everyone \nsaid learn Japanese; now it’s Mandarin, chess, team sports, anything that might pay \noff. At the same time, most women are now in the workforce, so couples argue about \nthe division of labour: who makes lunch, who walks the kids to school. What struck \nme most was how ‘homework is the new dinner’ describes so many families I know. \nSpeaking Exercise 2: Model voice reply \nHey sis, you’re clearly a really caring mum, and it’s so hard to know what’s right \nwhen everyone else is doing the same. I watched a talk by a journalist who writes \nabout parenting. She says parents today feel huge pressure to prepare their kids for a \nfuture nobody can predict, so they pour more and more into activities, just in case one \nof them pays off. That’s completely understandable. But honestly, I think four classes \na week is a lot for a seven-year-old. If he cries every Sunday night, maybe he’s \ntelling you he’s tired. What if you let him choose the two he enjoys most and drop the \nothers for a while? He’d still learn, and he’d have time to just play, which is \nimportant too. And you’d get a bit of your weekend back!","flashcards":[{"word":"asset","meaning":"someone or something that is useful or valuable"},{"word":"reciprocal","meaning":"given and received in return"},{"word":"ban","meaning":"to officially forbid something"},{"word":"extracurricular","meaning":"done outside normal school lessons"},{"word":"priceless","meaning":"too valuable to have a price"},{"word":"pour into","meaning":"to give a lot of money, time or effort to something"},{"word":"anxiety","meaning":"a feeling of worry about what might happen"},{"word":"division of labour","meaning":"the way work is shared between people"},{"word":"workforce","meaning":"all the people who work in a country or company"},{"word":"mad dash","meaning":"a rushed, panicked hurry"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1wRjRd7-xZmGBKpEgfYEMmU8CPk-xESUI/view","media_preview":"https://drive.google.com/file/d/1wRjRd7-xZmGBKpEgfYEMmU8CPk-xESUI/preview","media_type":"video","id":"a10"},{"level":"Advanced","index":11,"title":"Money & Consumerism","audio_title":"Less stuff, more happiness","source_url":"https://youtube.com/watch?v=L8YJtvHGeUU","watch":"The whole talk (about 5 min 50 s)","page":297,"page_end":305,"before":"1. How many things do you own that you haven’t used in the last year?\n2. Does buying new things make people happier? For how long?\n3. Would you prefer a big house far from the city centre or a small flat in the\ncentre? Why?","listening1":"Exercise 1. Read the notes first. Then watch the talk and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nThe problem with stuff\n• Americans have about (1) ______________ the living space they had 50 years\nago\n• Personal storage is a $22 billion industry, with 2.2 billion (2) ______________\n• Our stuff leads to credit card (3) ______________ and huge environmental\nfootprints\n• Our happiness levels have (4) ______________\nThe joys of less\n• Think of a student dorm room, a hotel room, a small boat or a (5)\n______________ trip\nThe LifeEdited project\n• He crowdsourced the design of a (6) ______________-square-foot apartment in\nManhattan\n• The competition received over (7) ______________ entries\n• Buying a smaller flat saved him about (8) ______________\nThree rules\n• Rule 1: edit (9) ______________\n• Rule 2: small is sexy\n• Rule 3: make things multifunctional, e.g. a coffee table that grows to seat (10)\n______________","listening2":"Exercise 2. Watch the talk again without stopping and then answer Questions 1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO things did he want his small apartment to have?\nA a home office\nB space for guests\nC a swimming pool\nD a garden\nE a garage\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO ways of saving space does he recommend?\nA digitising books, films and music\nB buying things that nest or stack\nC renting a storage unit\nD building an extra floor\nE moving to the countryside\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. What does he suggest about a shirt you have never worn?\nA Keep it in case you need it.\nB Get rid of it.\nC Wear it once and then decide.\nD Store it in a storage unit.\n6. What is his point about the six-burner stove?\nA Big stoves are cheaper to run.\nB We buy things for occasions that rarely happen; most people only use three\nburners.\nC Cooking at home saves money.\nD Small kitchens are dangerous.\n7. How does he describe what the smaller apartment means for his life?\nA He feels cramped and unhappy.\nB He has less debt, lower bills and more freedom.\nC He spends more time cleaning.\nD He has to work more hours.\n8. What does he suggest people could do when they next move house?\nA Buy a bigger place.\nB Consider a smaller space, e.g. 1,000 square feet instead of 1,500.\nC Rent instead of buying.\nD Move to another country.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. consumerism\na. having several different uses\n2. clutter\nb. money paid for electricity, water and gas\n3. edit\nc. a lot of things in an untidy state\nExpression\nMeaning\n4. ruthlessly\nd. to remove things you don’t need from a place\n5. footprint\ne. to change something into a digital form\n6. crowdsource\nf. in a very firm way, without letting feelings stop\nyou\n7. multifunctional\ng. a way of life based on buying lots of goods\n8. utility bills\nh. to get ideas or work from a large group of people\nonline\n9. digitise\ni. the effect a person or activity has on the\nenvironment\n10. declutter\nj. to remove what is not needed","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. Furniture should be ______________.\nFUNCTION\n2. Our happiness levels have ______________ in the same\nperiod.\nFLAT\n3. He ______________ the design of his apartment.\nCROWD\n4. We should ______________ our books and music.\nDIGITAL\n5. Personal storage is a fast-growing ______________.\nINDUSTRIAL\n6. Our ______________ has a huge environmental footprint.\nCONSUME\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. We have three times as much living space as fifty years\nago.\nTRIPLE\nWe have ____________________________ we had fifty years ago.\n8. Choosing the smaller flat meant he paid $200,000 less.\nSAVED\nChoosing the smaller flat ____________________________.\n9. Be very strict about getting rid of things you don’t need.\nRUTHLESSLY\nYou need to ____________________________.\n10. The coffee table gets bigger so that ten people can sit at it.\nSEAT\nThe coffee table ____________________________.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nThe problem: how much space\nand stuff we have\nThe costs: money, environment,\nhappiness\nThe LifeEdited apartment\nThe three rules + examples\nPlan\nYour keywords\nHis final suggestion + my\nreaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker argues that having less...\n• He backs this up with...\nGiving advice\n• His first rule is to...\n• In other words...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour flatmate Huy sends you this message:\n“Big sale this weekend! I’m going to buy a bigger sofa, a second TV and a new\nwardrobe for our flat. It’ll make the place way nicer! 🛋️”\nRound 1: Record a voice reply (90-120 seconds). In your reply:\n• respond positively to his wish to improve the flat\n• share ONE or TWO ideas from the talk\n• point out ONE practical problem with his plan\n• suggest a better alternative\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nPositive start\n• I love that you want to make the flat nicer!\n• Good idea to sort the place out.\nSharing ideas\n• I watched a talk by a guy who lives in...\n• His rule is...\nPointing out a problem\n• The only thing is...\n• I’m worried we’ll end up...\nSuggesting\n• How about we first...?\n• Maybe we could get something that...","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nthree times / 3 times \n \n6 \n420\nQ \nAnswer \nNote \nQ \nAnswer \nNote \n2 \nsquare feet \n \n7 \n300 \n \n3 \ndebt \n \n8 \n$200,000 \n \n4 \nflatlined \n \n9 \nruthlessly \n \n5 \ncamping \n \n10 10 / ten","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 g    2 c    3 j    4 f    5 i    6 h    7 a    8 b    9 e    10 d","answer_v2":"Part A: 1 multifunctional    2 flatlined    3 crowdsourced    4 digitise / digitize    5 industry    \n6 consumption   |   Part B: 7 triple the space    8 saved him $200,000    9 edit ruthlessly    \n10 grows to seat ten","answer_speaking":": Model summary (2-minute version) \nThe speaker argues that having less stuff can make us happier. He backs this up with \nsome striking figures: Americans have three times more living space than fifty years \nago, and still they rent storage units, which is a 22-billion-dollar industry. All this \nconsumerism leads to credit card debt and a huge environmental footprint, but our \nhappiness has flatlined. In other words, we’re surrounded by clutter that doesn’t \nhelp. So he crowdsourced the design of a tiny 420-square-foot apartment in \nManhattan that could still fit a home office, guests and a dinner for ten. Buying a \nsmaller flat saved him 200,000 dollars and lowered his utility bills. His first rule is to \nedit ruthlessly: if you’ve never worn a shirt, get rid of it. His second is that small is \nsexy: buy things that nest and stack, and digitise books and films. His third is to\nmake things multifunctional, like a coffee table that becomes a dining table. What \nstruck me most was that less space can actually mean more freedom. \nSpeaking Exercise 2: Model voice reply \nI love that you want to make the flat nicer, Huy! But I watched a talk by a guy who \nlives in a tiny flat in New York, and it made me think. He says we keep buying more \nstuff, but it doesn’t actually make us happier; it just costs money and takes up space. \nHis rule is: if you don’t really need it, don’t buy it. The only thing is, our living room \nis already pretty small, and I’m worried a bigger sofa and a wardrobe will make it \nfeel cramped. Do we even watch two TVs? How about we first get rid of things we \ndon’t use, like that old printer and the boxes under the table? Then maybe we could \nget one piece that does two jobs, like a sofa bed for when friends stay over. We’d \nsave money too!","flashcards":[{"word":"consumerism","meaning":"a way of life based on buying lots of goods"},{"word":"clutter","meaning":"a lot of things in an untidy state"},{"word":"edit","meaning":"to remove what is not needed"},{"word":"ruthlessly","meaning":"in a very firm way, without letting feelings stop you"},{"word":"footprint","meaning":"the effect a person or activity has on the environment"},{"word":"crowdsource","meaning":"to get ideas or work from a large group of people online"},{"word":"multifunctional","meaning":"having several different uses"},{"word":"utility bills","meaning":"money paid for electricity, water and gas"},{"word":"digitise","meaning":"to change something into a digital form"},{"word":"declutter","meaning":"to remove things you don’t need from a place"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1Hu_Kdi0To2WTIkOX1T6l399bNQihiBzr/view","media_preview":"https://drive.google.com/file/d/1Hu_Kdi0To2WTIkOX1T6l399bNQihiBzr/preview","media_type":"video","id":"a11"},{"level":"Advanced","index":12,"title":"Science & Space","audio_title":"What I learned from going blind in space","source_url":"https://youtube.com/watch?v=Zo62S0ulqhA","watch":"From “And I was outside on my first spacewalk”\n(about 07:50) until he says “...never would have happened.”\n(about 13:35)","page":306,"page_end":313,"before":"1. Would you like to go into space? What would worry you most?\n2. What are you afraid of? Is that fear reasonable?\n3. Is space exploration worth the money? Why / why not?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nGoing blind in space\n• During his first spacewalk, his (1) ______________ eye suddenly went blind\n• In space, (2) ______________ don’t fall; they form a ball of liquid\n• The liquid moved across his (3) ______________ into his other eye, so he was\ncompletely blind\nFear vs danger: spiders\n• There are about (4) ______________ species of spiders in the world\n• In British Columbia, only (5) ______________ species is venomous\n• Black widows have bold (6) ______________ and build webs low down\n• The female sometimes eats the (7) ______________\n• If you walk through (8) ______________ spider webs, you’ll change your fear of\nspiders\nHow astronauts prepare\n• He spent thousands of hours practising (9) ______________\n• The cause of the eye problem was the (10) ______________ solution used on the\nvisor","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO ways of training for spacewalks does he mention?\nA practising underwater\nB using virtual reality\nC flying fighter jets\nD running marathons\nE climbing mountains\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO people helped him during or after the problem?\nA Scott Parazynski\nB Jeff\nC Neil Armstrong\nD his wife\nE a doctor on Earth\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. Why didn’t he panic when he went blind?\nA He didn’t realise he was blind.\nB He had practised so many emergencies that he knew what to do.\nC Houston told him not to worry.\nD He was already inside the station.\n6. What is his main point about spiders?\nA Spiders are dangerous and should be avoided.\nB Perceived danger and real danger are often different.\nC Black widows are common everywhere.\nD Only children are afraid of spiders.\n7. How did his eye eventually get better?\nA He returned to the station immediately.\nB His crying diluted the substance until he could see again.\nC A doctor gave him eye drops.\nD The sun dried his eyes.\n8. What did NASA do after the incident?\nA stopped all spacewalks\nB changed the anti-fog solution so it wouldn’t sting\nC made astronauts wear glasses\nD built a new space station","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. spacewalk\na. to make a liquid weaker by adding more liquid\n2. venomous\nb. a possible future event that you plan for\n3. perceived danger\nc. unable to work or move normally\n4. actual danger\nd. how dangerous something seems to be\nExpression\nMeaning\n5. reflex\ne. how dangerous something really is\n6. incapacitated\nf. activity outside a spacecraft while in space\n7. dilute\ng. an action you do automatically without thinking\n8. contingency\nh. the clear front part of a helmet\n9. visor\ni. a group of animals or plants of the same type\n10. species\nj. able to inject poison by biting or stinging","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. Only one ______________ of spider in British Columbia\nis venomous.\nSPECIAL\n2. The ______________ danger is often greater than the real\ndanger.\nPERCEIVE\n3. He was almost completely ______________.\nCAPACITY\n4. Astronauts practise every possible ______________.\nEMERGE\n5. There is a big difference between danger and\n______________.\nFEARFUL\n6. The tears ______________ the substance in his eye.\nDILUTION\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. Without gravity, tears just stay on your eye.\nFALL\nWithout gravity, tears ____________________________.\n8. Practice changes the way you react without thinking.\nRETRAIN\nPractice helps you ____________________________.\n9. Real danger is not the same as being afraid.\nDIFFERENT\nDanger is ____________________________.\n10. The crying made the substance weaker.\nDILUTED\nThe crying ____________________________.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nWhat happened on his first\nspacewalk\nWhy tears are a problem in\nspace\nThe spider example: danger vs\nfear\nHow astronauts train for\nproblems\nThe cause and the lesson + my\nreaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker describes a moment when...\n• He uses this story to show that...\nExplaining\n• The reason was that...\n• The lesson is that...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour friend Trang sends you this message:\n“I got the job offer abroad! 🎉 But I’m terrified of flying and I’ve never lived alone.\nMaybe I should just say no...”\nRound 1: Record a voice reply (90-120 seconds). In your reply:\n• congratulate her\n• explain the difference between perceived danger and actual danger\n• use ONE example from the talk\n• suggest ONE way she could prepare so she feels less afraid\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nCongratulating\n• Congratulations! That’s huge!\n• I’m so proud of you.\nExplaining\n• I watched a talk by an astronaut who...\n• He says there’s a difference between...\nGiving an example\n• Take spiders, for example: ...\n• He even went blind in space and...\nSuggesting\n• What if you practised...?\n• You could prepare by...","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nleft \n \n6 \nmarkings \n \n2 \ntears \n \n7 \nmale \n \n3 \nnose \n \n8 \n100 \n \n4 \n50,000 \n \n9 \nunderwater \n \n5 \none \n“1” \n10 anti-fog","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 f    2 j    3 d    4 e    5 g    6 c    7 a    8 b    9 h    10 i","answer_v2":"Part A: 1 species    2 perceived    3 incapacitated    4 emergency    5 fear    6 diluted   |   \nPart B: 7 don’t fall / do not fall    8 retrain your reflexes    9 different from fear    10 \ndiluted the gunk","answer_speaking":": Model summary (2-minute version) \nThe speaker describes a moment on his first spacewalk when his left eye suddenly \nwent blind. In space, tears don’t fall, so the liquid formed a ball that moved across his \nnose into his other eye, and he couldn’t see at all. He uses this story to show the \ndifference between perceived danger and actual danger. Take spiders: there are \nabout 50,000 species, but very few are venomous, and in British Columbia only one \nis. If you learn about them and walk through a hundred webs, your fear changes. \nSimilarly, astronauts spend thousands of hours practising every contingency, \nunderwater and in virtual reality, which retrains their reflexes. So even though he \nwas nearly incapacitated, he stayed calm, talked to Houston and kept crying until the \ntears diluted the substance. The reason was the anti-fog solution on his visor, which \nNASA later changed. The lesson is that preparation turns fear into calm action. What \nstruck me most was that being blind in space didn’t make him panic. \nSpeaking Exercise 2: Model voice reply \nCongratulations, Trang! That’s huge, and I’m so proud of you. I get that it’s scary, \nthough. I watched a talk by an astronaut who went blind during a spacewalk! He says \nthere’s a difference between how dangerous something feels and how dangerous it \nreally is. Take spiders, for example: most people are scared of them, but in many \nplaces almost none are actually dangerous. Flying is the same; it feels scary, but it’s\none of the safest ways to travel. He also said the way to beat fear is to prepare. He \npractised emergencies so many times that when something went wrong, he just \nstayed calm. So what if you prepared step by step? You could take a short flight \nbefore you go, and practise cooking and paying bills on your own for a month. I \nreally think you should say yes!","flashcards":[{"word":"spacewalk","meaning":"activity outside a spacecraft while in space"},{"word":"venomous","meaning":"able to inject poison by biting or stinging"},{"word":"perceived danger","meaning":"how dangerous something seems to be"},{"word":"actual danger","meaning":"how dangerous something really is"},{"word":"reflex","meaning":"an action you do automatically without thinking"},{"word":"incapacitated","meaning":"unable to work or move normally"},{"word":"dilute","meaning":"to make a liquid weaker by adding more liquid"},{"word":"contingency","meaning":"a possible future event that you plan for"},{"word":"visor","meaning":"the clear front part of a helmet"},{"word":"species","meaning":"a group of animals or plants of the same type"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1DmcQzyXOakLgig9iMX2cZWNUMzjWgAMR/view","media_preview":"https://drive.google.com/file/d/1DmcQzyXOakLgig9iMX2cZWNUMzjWgAMR/preview","media_type":"video","id":"a12"},{"level":"Advanced","index":13,"title":"Arts & Creativity","audio_title":"Your elusive creative genius","source_url":"","watch":"From the part about ancient Greece and Rome\n(about 06:15) until the end of the story about the poet Ruth Stone\n(about 12:00)","page":314,"page_end":322,"before":"1. Where do you think creative ideas come from?\n2. Do artists suffer more than people in other jobs? Why might that be?\n3. Have you ever had a great idea suddenly, without trying? What happened?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nCreativity in the ancient world\n• People believed creativity came from a divine (1) ______________\n• The Greeks called these spirits “(2) ______________”\n• The philosopher (3) ______________ believed he had a daemon who spoke\nwisdom to him\n• The Romans called this spirit a “(4) ______________”, which lived in the walls\nof the artist’s studio\nWhat changed\n• The (5) ______________ put the individual human at the centre of the universe\n• Saying someone “is” a genius is like asking them to swallow the (6)\n______________\n• This way of thinking has lasted about (7) ______________ years\nRuth Stone\n• An American poet, still writing in her (8) ______________\n• She grew up working in the fields in rural (9) ______________\n• Sometimes she caught a poem by its (10) ______________ and pulled it back\ninto her body","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nAccording to the speaker, which TWO benefits did the ancient idea of a “genius” give\nartists?\nA It protected them from too much pride.\nB They were not totally blamed if their work failed.\nC It made them rich.\nD It made them famous during their lifetime.\nE It allowed them to work less.\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO things could happen to Ruth Stone’s poems?\nA If she missed one, it went to find another poet.\nB Sometimes a poem came out backwards, from the last word to the first.\nC She dreamed all of them at night.\nD Her daughter wrote them down for her.\nE They always arrived when she was at her desk.\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. Why does the speaker think the Renaissance view of creativity was a mistake?\nA It gave artists too little money.\nB It put too much pressure on individual artists to be the source of everything.\nC It stopped people from making art.\nD It made art too religious.\n6. What did Ruth Stone have to do when she felt a poem coming?\nA call a friend\nB run to find a pencil and paper before it passed\nC go to sleep\nD sit in the fields and wait\n7. What does the speaker admit about changing people’s ideas?\nA It will be easy.\nB She can’t undo 500 years of thinking in one 18-minute talk.\nC Only scientists can do it.\nD Nobody wants to change.\n8. What is her main idea in this part of the talk?\nA Only geniuses should become artists.\nB It may be healthier for artists to see creativity as something they receive rather\nthan something they are.\nC Artists should stop working when they feel pressure.\nD Ancient artists were more talented.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. elusive\na. a way of thinking that focuses on human values\nand abilities\n2. divine\nb. a channel through which something passes\n3. attendant spirit\nc. difficult to find, catch or achieve\nExpression\nMeaning\n4. narcissism\nd. coming from God or a god\n5. take credit for\ne. a person’s mind and deepest feelings\n6. rational\nf. to accept praise for something\n7. humanism\ng. based on reason and logic\n8. intact\nh. too much interest in and admiration for yourself\n9. psyche\ni. a spirit that stays near a person and helps them\n10. conduit\nj. complete and not damaged","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. People believed creativity came from a ______________\nsource.\nDIVINITY\n2. The genius protected the artist from ______________.\nNARCISSIST\n3. The Renaissance brought ______________ humanism.\nREASON\n4. Creative inspiration can be very ______________.\nELUDE\n5. Artists today carry a heavy psychological\n______________.\nBURDENSOME\n6. Some poems arrived ______________ and intact.\nPERFECT\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. If your work was brilliant, you couldn’t accept all the\npraise.\nCREDIT\nIf your work was brilliant, you couldn’t ____________________________.\n8. The poem arrived complete and undamaged.\nINTACT\nThe poem arrived ____________________________.\n9. She had to run very fast to find a pencil.\nRUN\nShe had to ____________________________ to find a pencil.\n10. It’s like asking a person to take in all of the sun’s power.\nSWALLOW\nIt’s like asking a person ____________________________.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nHow the Greeks and Romans\nsaw creativity\nWhy that idea protected artists\nWhat changed in the\nRenaissance and why it was a\nproblem\nThe story of Ruth Stone\nPlan\nYour keywords\nHer main idea + my reaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker suggests that we rethink...\n• In ancient times, people believed...\nContrasting past and present\n• Back then...; nowadays...\n• This changed when...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour friend Duy, who writes songs, sends you this message:\n“I haven’t written anything good in 3 months. Maybe I was never really talented.\nThinking of quitting music completely 😞”\nRound 1: Record a voice reply (90-120 seconds). In your reply:\n• show you understand how he feels\n• share the ancient idea of a “genius” from the talk\n• explain how this idea might take pressure off him\n• suggest ONE way to keep going\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nUnderstanding\n• Three months is a long time, I get it.\n• That sounds really frustrating.\nSharing an idea\n• I watched a talk by a writer who...\n• In ancient Rome, people believed...\nTaking off pressure\n• So it’s not all on you.\n• Maybe the ideas just haven’t arrived yet.\nSuggesting\n• What if you just showed up every day and...?\n• Why not try...","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nspirit \n \n6 \nsun \n \n2 \ndaemons \n \n7 \n500 \n \n3 \nSocrates \n \n8 \n90s / nineties \n \n4 \ngenius \n \n9 \nVirginia \n \n5 \nRenaissance \n \n10 tail","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 c    2 d    3 i    4 h    5 f    6 g    7 a    8 j    9 e    10 b","answer_v2":"Part A: 1 divine    2 narcissism    3 rational    4 elusive    5 burden    6 perfectly   |   Part \nB: 7 take all the credit    8 perfect and intact    9 run like hell    10 to swallow the sun","answer_speaking":": Model summary (2-minute version) \nThe speaker suggests that we rethink where creativity comes from. In ancient times, \npeople believed it came from a divine spirit outside the person. The Greeks called \nthese spirits daemons; Socrates even believed one spoke wisdom to him. The Romans \ncalled this attendant spirit a genius, which lived in the walls of the artist’s studio. \nThis protected artists from narcissism, because they couldn’t take all the credit for \nbrilliant work, and also from blame if the work failed. This changed during the \nRenaissance, when rational humanism put the individual at the centre of everything. \nSince then, we say someone is a genius instead of has a genius, which puts a huge \nweight on a fragile human psyche, like asking them to swallow the sun. To show \nanother way, she tells the story of Ruth Stone, a poet who felt poems coming towards \nher across the fields and had to run to catch them. Sometimes a poem arrived perfect \nand intact. The artist becomes a conduit rather than the source. What struck me most \nwas the idea that missed poems go looking for another poet. \nSpeaking Exercise 2: Model voice reply \nThree months is a long time, Duy, I get it, and it sounds really frustrating. But please \ndon’t quit yet. I watched a talk by a writer who says the problem might be how we \nthink about talent. In ancient Rome, people believed every artist had a ‘genius’, a \nkind of spirit that brought them ideas. If the work was great, the artist didn’t take all \nthe credit; if it was bad, it wasn’t completely their fault. So it’s not all on you. Maybe \nthe ideas just haven’t arrived yet, and that doesn’t mean you were never talented. \nWhat if you just showed up every day, picked up your guitar for twenty minutes and \nplayed, even if nothing good came out? That way, when the next idea does come, \nyou’ll be ready to catch it. I still listen to your old songs, you know!","flashcards":[{"word":"elusive","meaning":"difficult to find, catch or achieve"},{"word":"divine","meaning":"coming from God or a god"},{"word":"attendant spirit","meaning":"a spirit that stays near a person and helps them"},{"word":"narcissism","meaning":"too much interest in and admiration for yourself"},{"word":"take credit for","meaning":"to accept praise for something"},{"word":"rational","meaning":"based on reason and logic"},{"word":"humanism","meaning":"a way of thinking that focuses on human values and abilities"},{"word":"intact","meaning":"complete and not damaged"},{"word":"psyche","meaning":"a person’s mind and deepest feelings"},{"word":"conduit","meaning":"a channel through which something passes"}],"mcq_answers":{"5":"B","6
