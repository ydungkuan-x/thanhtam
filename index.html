a ra lời khen","example":"Giving compliments can encourage people.","exampleVi":"Khen ngợi có thể động viên mọi người.","topic":"Cụm từ hữu ích","source":"starter","ipa":"/ɡɪvɪŋ kɑmpləmɛnts/"},{"id":"base-200","term":"arrogant","pos":"adj","meaning":"kiêu ngạo, tự cao","example":"He sounds arrogant sometimes.","exampleVi":"Đôi khi anh ấy nghe có vẻ kiêu ngạo.","topic":"Cụm từ hữu ích","source":"starter","ipa":"/ɛɹəɡənt/"},{"id":"base-201","term":"self-conceited","pos":"adj","meaning":"tự phụ (ít thông dụng)","example":"He acts in a self-conceited way.","exampleVi":"Anh ấy cư xử một cách tự phụ.","topic":"Cụm từ hữu ích","source":"starter","ipa":"/sɛlf-kənsitəd/"},{"id":"base-202","term":"if my memory serves me right","pos":"idiom","meaning":"nếu tôi nhớ không nhầm","example":"If my memory serves me right, we met last year.","exampleVi":"Nếu tôi nhớ không nhầm, chúng ta gặp nhau năm ngoái.","topic":"Cụm từ hữu ích","source":"starter","ipa":"/ɪf maɪ mɛmɚi sɝvz mi ɹaɪt/"},{"id":"base-203","term":"nonstop","pos":"adv/adj","meaning":"không ngừng","example":"I studied for two hours nonstop.","exampleVi":"Tôi học liên tục hai tiếng.","topic":"Cụm từ hữu ích","source":"starter","ipa":"/nɑnstɑp/"},{"id":"base-204","term":"opportunity","pos":"n","meaning":"cơ hội","example":"This course is a great opportunity.","exampleVi":"Khóa học này là một cơ hội tuyệt vời.","topic":"Cụm từ hữu ích","source":"starter","ipa":"/ɑpɚtunəti/"},{"id":"base-205","term":"approval","pos":"n","meaning":"sự phê duyệt","example":"He received approval for his application.","exampleVi":"Anh ấy được chấp thuận hồ sơ.","topic":"Cụm từ hữu ích","source":"starter","ipa":"/əpɹuvəl/"},{"id":"base-206","term":"compliment","pos":"n/v","meaning":"lời khen; khen ngợi","example":"My teacher gave me a compliment.","exampleVi":"Giáo viên đã khen tôi.","topic":"Cụm từ hữu ích","source":"starter","ipa":"/kɑmpləmɛnt/"},{"id":"base-207","term":"improve myself","pos":"v phrase","meaning":"phát triển bản thân","example":"I want to improve myself every day.","exampleVi":"Tôi muốn phát triển bản thân mỗi ngày.","topic":"Cụm từ hữu ích","source":"starter","ipa":"/ɪmpɹuv maɪsɛlf/"}];
const STORIES = [{"id":"morning-commute","emoji":"☀️","title":"A busy morning","description":"Bữa sáng, đường đi làm và một ngày làm việc bận rộn · A2","targets":["toast","spread butter on","mug","cheer me up","catch a bus","commuting time","traffic jam","crowded","dive into my work","handle","a word of encouragement"],"lines":[{"en":"This morning, I ate two slices of toast and drank a mug of coffee.","vi":"Sáng nay, tôi ăn hai lát bánh mì nướng và uống một cốc cà phê."},{"en":"A good breakfast can cheer me up before a busy day.","vi":"Một bữa sáng ngon có thể khiến tôi vui hơn trước một ngày bận rộn."},{"en":"I left home early to catch a bus to work.","vi":"Tôi rời nhà sớm để kịp bắt xe buýt đi làm."},{"en":"My commuting time was longer because of a traffic jam.","vi":"Thời gian đi làm của tôi lâu hơn vì kẹt xe."},{"en":"The bus was crowded, but I still got to work on time.","vi":"Xe buýt rất đông, nhưng tôi vẫn đến nơi làm việc đúng giờ."},{"en":"When I arrived at the office, I dived into my work and tried to handle requests carefully.","vi":"Khi đến văn phòng, tôi bắt tay ngay vào việc và cố gắng xử lý các yêu cầu cẩn thận."},{"en":"A word of encouragement from my colleague made me feel better.","vi":"Một lời động viên từ đồng nghiệp khiến tôi cảm thấy khá hơn."}]},{"id":"grocery-shopping","emoji":"🛒","title":"A trip to the supermarket","description":"Từ giỏ hàng đến quầy thanh toán · A2–B1","targets":["shopping basket","aisle","dairy section","on sale","bargain","a dozen eggs","barcode","scan","bag up","almost done"],"lines":[{"en":"After work, I stopped at a supermarket and picked up a shopping basket.","vi":"Sau giờ làm, tôi ghé siêu thị và lấy một giỏ mua hàng."},{"en":"I walked down the first aisle to look for cereal and crackers.","vi":"Tôi đi dọc lối đầu tiên để tìm ngũ cốc và bánh quy mặn."},{"en":"The milk was on sale in the dairy section, so I bought two bottles.","vi":"Sữa đang giảm giá ở khu sản phẩm sữa, nên tôi mua hai chai."},{"en":"I also needed a dozen eggs and some fresh fruit.","vi":"Tôi cũng cần một tá trứng và một ít trái cây tươi."},{"en":"A packet of biscuits was a real bargain.","vi":"Một gói bánh quy có giá rất hời."},{"en":"At the checkout counter, the cashier scanned the barcode on each item.","vi":"Tại quầy thanh toán, thu ngân quét mã vạch của từng món hàng."},{"en":"I bagged up my groceries and thought, 'I'm almost done for today.'","vi":"Tôi cho đồ mua vào túi và nghĩ: 'Hôm nay mình sắp xong mọi việc rồi.'"}]},{"id":"dinner-time","emoji":"🍲","title":"Cooking dinner at home","description":"Nấu ăn, mô tả kết cấu và đồ ăn nóng · A2–B1","targets":["apron","flip","piping hot","bean sprouts","ladle","texture","delicious","wash up","sponge","rinse off"],"lines":[{"en":"In the evening, I put on an apron and started cooking dinner.","vi":"Buổi tối, tôi đeo tạp dề và bắt đầu nấu bữa tối."},{"en":"I made soup with vegetables and some bean sprouts.","vi":"Tôi nấu súp với rau củ và một ít giá đỗ."},{"en":"The soup was piping hot, so I let it cool for a moment.","vi":"Món súp nóng hổi, nên tôi để nó nguội bớt một lúc."},{"en":"I used a ladle to serve the soup to my family.","vi":"Tôi dùng vá múc súp cho gia đình."},{"en":"Everyone liked the texture and said the meal was delicious.","vi":"Mọi người thích kết cấu món ăn và nói rằng bữa tối rất ngon."},{"en":"After dinner, I had to wash up and wipe the table.","vi":"Sau bữa tối, tôi phải rửa bát và lau bàn."},{"en":"I used a sponge and rinsed off the soap with water.","vi":"Tôi dùng miếng bọt biển và xả sạch xà phòng bằng nước."}]},{"id":"flower-and-fruit","emoji":"💐","title":"Flowers for my mother","description":"Mua hoa và trái cây ở chợ · A2","targets":["florist","bouquet","arrange","go well with","tangerine","passion fruit","wrinkly","bunch of grapes","spiky","durian"],"lines":[{"en":"On Saturday morning, I visited a florist near my home.","vi":"Sáng thứ Bảy, tôi ghé một tiệm hoa gần nhà."},{"en":"I bought a bouquet of flowers for my mother.","vi":"Tôi mua một bó hoa tặng mẹ."},{"en":"I wanted to arrange the flowers in a vase because the colours went well with our living room.","vi":"Tôi muốn cắm hoa vào bình vì màu hoa hợp với phòng khách."},{"en":"Then I bought a few tangerines and a bunch of grapes.","vi":"Sau đó tôi mua vài quả quýt và một chùm nho."},{"en":"I also saw some passion fruit with wrinkly skin.","vi":"Tôi còn thấy vài quả chanh dây có lớp vỏ nhăn nheo."},{"en":"A durian was on the next table, and its shell looked very spiky.","vi":"Một quả sầu riêng nằm ở bàn kế bên, và vỏ của nó trông rất nhiều gai nhọn."},{"en":"I carried everything home and felt happy with my little gifts.","vi":"Tôi mang tất cả về nhà và thấy vui với những món quà nhỏ."}]},{"id":"my-weekly-routine","emoji":"📘","title":"My plan to learn English","description":"Thói quen, công việc và động lực học tiếng Anh · A2–B1","targets":["daily routine","discipline","repetition","repetitive","enhance","improve myself","opportunity","encourage","not my cup of tea","in fact"],"lines":[{"en":"I work full-time, so I need a simple daily routine to learn English.","vi":"Tôi làm việc toàn thời gian, nên tôi cần một thói quen học tiếng Anh đơn giản mỗi ngày."},{"en":"My job can be repetitive, but I still want to improve myself after work.","vi":"Công việc của tôi đôi khi lặp lại, nhưng tôi vẫn muốn phát triển bản thân sau giờ làm."},{"en":"I believe repetition and discipline help me remember new words.","vi":"Tôi tin rằng sự lặp lại và tính kỷ luật giúp tôi nhớ các từ mới."},{"en":"Reading short stories can enhance my vocabulary.","vi":"Đọc truyện ngắn có thể cải thiện vốn từ vựng của tôi."},{"en":"Learning long word lists is not my cup of tea.","vi":"Học thuộc những danh sách từ dài không phải cách tôi thích."},{"en":"In fact, I learn better when I use words to describe my real life.","vi":"Thực ra, tôi học tốt hơn khi dùng từ để miêu tả cuộc sống thật của mình."},{"en":"My teacher encourages me to practise a little every day, and I see it as an opportunity to grow.","vi":"Giáo viên động viên tôi luyện tập một chút mỗi ngày, và tôi xem đó là cơ hội để phát triển."}]}];
</script>
<script>
'use strict';
const STORAGE_KEY = 'vocabGardenIELTS.v2';
const DEFAULT_STATE = {customWords:[],reviews:{},activity:{},notes:{},storyNotes:{},settings:{goal:12}};
const SECTION_NAMES = {dashboard:'Tổng quan',library:'Kho từ vựng',flashcards:'Flashcards',practice:'Bài tập',stories:'Câu chuyện',add:'Thêm từ mới'};
let view='dashboard', state=loadState(), selectedId=STARTER_WORDS[0].id, libraryFilters={q:'',topic:'Tất cả',status:'Tất cả'};
let flash={mode:'today',ids:[],index:0,revealed:false,done:0}, quiz={customOnly:false,mode:'choice',wordId:null,options:[],selected:null,answered:false,total:0,correct:0,lastIds:[],typed:''}, storyIndex=null, showStoryVi=true;
let toastTimeout;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');return x && typeof x==='object'?{...structuredClone(DEFAULT_STATE),...x,settings:{...DEFAULT_STATE.settings,...(x.settings||{})}}:structuredClone(DEFAULT_STATE)}catch{return structuredClone(DEFAULT_STATE)}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch{toast('Không lưu được tự động. Hãy xuất JSON để sao lưu dữ liệu.')}}
function today(){const x=new Date();return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}
function allWords(){return [...STARTER_WORDS,...state.customWords]}
function byId(id){return allWords().find(x=>x.id===id)}
function review(w){return state.reviews[w.id]||{seen:0,wrong:0,correct:0,interval:0,due:0,level:0}}
function isMastered(w){let r=review(w);return r.level>=3 && r.correct>=3}
function due(w){let r=review(w);return r.seen>0 && r.due<=Date.now()}
function topicNames(){return [...new Set(allWords().map(w=>w.topic))]}
function countReviewToday(){return state.activity[today()]?.reviewed||0}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove('show'),3100)}
function navigate(next){view=next;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===next));$('breadcrumb').textContent=SECTION_NAMES[next]?.toUpperCase()||'MY LEARNING SPACE';if(next==='flashcards'&&!flash.ids.length)resetFlash();if(next==='practice'&&!quiz.wordId)nextQuiz();render();window.scrollTo({top:0,behavior:'smooth'})}
function speak(text,rate=.91){if(!('speechSynthesis' in window)){toast('Trình duyệt này chưa hỗ trợ đọc tiếng Anh.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-US'&&/female|aria|jenny|samantha|google/i.test(v.name))||voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showCount(n){return new Intl.NumberFormat('vi-VN').format(n)}
function topicsProgress(){return topicNames().map(t=>{const words=allWords().filter(w=>w.topic===t);return {topic:t,total:words.length,learned:words.filter(w=>review(w).seen>0).length,mastered:words.filter(isMastered).length}})}
function topErrors(){return allWords().filter(w=>review(w).wrong>0).sort((a,b)=>review(b).wrong-review(a).wrong).slice(0,8)}
function recordReview(w,quality,kind='flash'){
  const r={...review(w)};r.seen++;if(quality===0){r.wrong++;r.level=Math.max(0,(r.level||0)-1);r.interval=0;r.due=Date.now()+10*60*1000}else if(quality===1){r.correct++;r.level=Math.max(1,r.level||0);r.interval=1;r.due=Date.now()+24*60*60*1000}else if(quality===2){r.correct++;r.level=(r.level||0)+1;r.interval=r.interval>=3?Math.min(45,Math.ceil(r.interval*1.7)):3;r.due=Date.now()+r.interval*864e5}else if(quality===3){r.correct++;r.level=(r.level||0)+2;r.interval=r.interval>=5?Math.min(60,Math.ceil(r.interval*2)):7;r.due=Date.now()+r.interval*864e5}
  r.last=today();state.reviews[w.id]=r;
  if(!state.activity[today()])state.activity[today()]={reviewed:0,correct:0,quiz:0};state.activity[today()].reviewed++;if(quality>0)state.activity[today()].correct++;if(kind==='quiz')state.activity[today()].quiz++;saveState()
}
function pageHeader(kicker,title,desc){return `<div class="kicker">${esc(kicker)}</div><h1 class="page-title">${esc(title)}</h1><p class="subtitle">${esc(desc)}</p>`}
function render(){const views={dashboard:renderDashboard,library:renderLibrary,flashcards:renderFlash,practice:renderPractice,stories:renderStories,add:renderAdd};$('app').innerHTML=views[view](); if(view==='library')renderLibraryList(); if(view==='stories'&&storyIndex!==null)renderStoryLines();}
function renderDashboard(){const all=allWords();const learned=all.filter(w=>review(w).seen>0).length,mastered=all.filter(isMastered).length,dues=all.filter(due).length,goal=state.settings.goal||12, progress=Math.min(100,Math.round(countReviewToday()/goal*100));let top=topErrors();const topics=topicsProgress();return `
  <section class="hero"><div><div class="kicker">YOUR PERSONAL VOCAB SPACE</div><h1 class="page-title">Grow your words.<br>Grow your confidence.</h1><p>Học từ vựng qua tình huống đời thường, nghe phát âm, tự đặt câu và ôn lại đúng lúc. Bắt đầu từ 10 từ mỗi ngày nhé!</p><div class="hero-actions"><button class="btn primary" data-action="go" data-target="flashcards">Ôn từ hôm nay →</button><button class="btn" data-action="go" data-target="stories">📖 Học qua câu chuyện</button></div></div><div class="hero-visual"><span class="big">🌿</span><strong>Keep growing</strong><small>One word at a time.</small></div></section>
  <div class="stats"><div class="surface stat"><span class="stat-icon">▦</span><small>Tổng số từ</small><strong>${all.length}</strong><span>${topicNames().length} chủ đề</span></div><div class="surface stat"><span class="stat-icon">◉</span><small>Đã học</small><strong>${learned}</strong><span>${all.length?Math.round(learned/all.length*100):0}% bộ từ</span></div><div class="surface stat"><span class="stat-icon">✦</span><small>Ghi nhớ tốt</small><strong>${mastered}</strong><span>qua nhiều lần ôn đúng</span></div><div class="surface stat"><span class="stat-icon">↺</span><small>Cần ôn lại</small><strong>${dues}</strong><span>từ đến lịch ôn</span></div></div>

function filteredWords(){const q=libraryFilters.q.trim().toLocaleLowerCase('vi');return allWords().filter(w=>{if(libraryFilters.topic!=='Tất cả'&&w.topic!==libraryFilters.topic)return false;const r=review(w);if(libraryFilters.status==='Chưa học'&&r.seen>0)return false;if(libraryFilters.status==='Đã học'&&r.seen===0)return false;if(libraryFilters.status==='Hay sai'&&r.wrong===0)return false;if(libraryFilters.status==='Đến lịch ôn'&&!due(w))return false;return !q||[w.term,w.meaning,w.topic,w.example].some(v=>String(v).toLocaleLowerCase('vi').includes(q))})}
function renderLibrary(){return `${pageHeader('YOUR WORD COLLECTION','Kho từ vựng','Tìm theo chủ đề, đọc nghĩa, nghe phát âm và ghi câu của riêng bạn.')}<div class="filters"><div class="searchbar"><span class="mag">⌕</span><input class="input" id="searchWords" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt..." value="${esc(libraryFilters.q)}" aria-label="Tìm từ" /></div><select class="input" id="topicFilter" aria-label="Lọc theo chủ đề"><option>Tất cả</option>${topicNames().map(t=>`<option ${t===libraryFilters.topic?'selected':''}>${esc(t)}</option>`).join('')}</select><select class="input" id="statusFilter" aria-label="Lọc theo tiến độ">${['Tất cả','Chưa học','Đã học','Hay sai','Đến lịch ôn'].map(s=>`<option ${libraryFilters.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="word-layout"><section class="surface"><div class="between" style="padding:17px 22px;border-bottom:1px solid var(--stroke)"><strong style="font-size:14px">Danh sách từ vựng</strong><span id="wordCount" class="counter"></span></div><div class="word-list" id="wordList"></div></section><div id="detailHolder"></div></div>`}
function renderLibraryList(){const words=filteredWords();$('wordCount').textContent=`${words.length} từ`;if(words.length&&!words.some(w=>w.id===selectedId))selectedId=words[0].id;$('wordList').innerHTML=words.length?words.map(w=>`<button class="word-item ${selectedId===w.id?'selected':''}" data-action="select-word" data-id="${esc(w.id)}"><span class="circle">${review(w).seen>0?'✓':'A'}</span><span class="word-main"><strong>${esc(w.term)}</strong><p>${esc(w.meaning)}</p></span><span class="word-pos">${esc(w.pos||'phrase')}</span></button>`).join(''):'<div class="empty">Không tìm thấy từ phù hợp.<br>Thử đổi bộ lọc nhé.</div>';$('detailHolder').innerHTML=words.length?renderWordDetail(byId(selectedId)):'<section class="surface pad empty">Chọn một từ để xem chi tiết.</section>'}
function renderWordDetail(w){if(!w)return '';const r=review(w);return `<section class="surface pad word-detail"><div class="between"><span class="tag">${esc(w.topic)}</span><span class="badge">${r.seen?`${r.seen} lần ôn`:'CHƯA HỌC'}</span></div><div class="detail-term">${esc(w.term)}</div><div class="detail-ipa">${esc(w.ipa||'Chưa tìm được IPA')} · ${esc(w.pos||'phrase')}${w.ipaNote?`<div class="auto-meta">${esc(w.ipaNote)}</div>`:''}</div><button class="btn light" data-action="speak" data-value="${esc(w.term)}">🔊 Nghe từ vựng</button><div style="margin-top:22px;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:800">Nghĩa tiếng Việt</div><div style="font-size:21px;font-weight:750;margin:4px 0 0">${esc(w.meaning)}</div><div class="detail-example"><div class="between" style="margin-bottom:7px"><span class="kicker" style="font-size:10px">EXAMPLE IN CONTEXT</span><button class="btn sm ghost" title="Đọc câu ví dụ" data-action="speak" data-value="${esc(w.example||w.term)}">🔊 Nghe câu</button></div><div class="en">${esc(w.example||'Hãy tự thêm ví dụ cho từ này.')}</div>${w.exampleVi?`<div class="vi">${esc(w.exampleVi)}</div>`:''}${w.exampleNote?`<div class="auto-meta">${esc(w.exampleNote)}</div>`:''}</div><div class="form-row"><label for="wordNote">Câu của tôi / ghi chú học từ</label><textarea class="input textarea" style="min-height:84px" id="wordNote" placeholder="Tự đặt 1 câu tiếng Anh để nhớ từ...">${esc(state.notes[w.id]||'')}</textarea></div><div class="row"><button class="btn primary sm" data-action="save-note" data-id="${esc(w.id)}">Lưu câu của tôi</button><button class="btn sm" data-action="speak" data-value="${esc(state.notes[w.id]||w.example||w.term)}">🔊 Nghe câu</button>${w.source==='custom'?`<button class="btn sm light" data-action="learn-custom">◈ Ôn từ tự thêm</button><button class="btn sm" data-action="edit-word" data-id="${esc(w.id)}">✎ Sửa từ</button><button class="btn sm warn" data-action="delete-word" data-id="${esc(w.id)}">Xóa từ</button>`:''}</div>${r.wrong?`<p class="aside-tip">Từ này bạn đã sai ${r.wrong} lần. Hãy đọc lại ví dụ rồi thử đặt một câu khác nhé.</p>`:''}</section>`}
function chooseFlashWords(mode){const all=allWords();let list;if(mode==='today'){const overdue=all.filter(due).sort((a,b)=>review(a).due-review(b).due);const unseen=all.filter(w=>review(w).seen===0);const later=all.filter(w=>review(w).seen>0&&!due(w));list=[...overdue,...unseen,...later].slice(0,15)}else if(mode==='new'){list=all.filter(w=>review(w).seen===0).slice(0,15)}else if(mode==='custom'){list=state.customWords.slice().reverse().slice(0,20)}else if(mode==='errors'){list=all.filter(w=>review(w).wrong>0).sort((a,b)=>review(b).wrong-review(a).wrong).slice(0,15)}else list=shuffle(all).slice(0,15);return list.map(w=>w.id)}
function resetFlash(){flash.ids=chooseFlashWords(flash.mode);flash.index=0;flash.revealed=false;flash.done=0}
function renderFlash(){const w=byId(flash.ids[flash.index]);return `${pageHeader('ACTIVE RECALL','Flashcards & ôn lặp lại','Nhìn từ → đoán nghĩa → lật thẻ → chọn mức độ nhớ. Lịch ôn tự điều chỉnh sau mỗi lượt.')}<div class="between" style="margin-bottom:20px"><div class="mode">${[['today','Học hôm nay'],['new','Từ chưa học'],['custom','Từ tự thêm'],['errors','Từ hay sai'],['random','Ngẫu nhiên']].map(([key,label])=>`<button class="${flash.mode===key?'active':''}" data-action="flash-mode" data-mode="${key}">${label}</button>`).join('')}</div><span class="counter">${flash.done} / ${flash.ids.length} thẻ</span></div><div class="flash-wrap">${w?`<div class="flash-card" role="button" tabindex="0" id="flashCard" aria-label="Lật thẻ học từ vựng" data-action="reveal-flash"><div class="kicker">${esc(w.topic)}</div><div class="word">${esc(w.term)}</div><div class="muted" style="font-size:13px">${esc(w.ipa||'')}</div>${flash.revealed?`<div class="meaning">${esc(w.meaning)}</div><div class="example">“${esc(w.example||w.term)}”</div><div style="font-size:12px;color:var(--muted)">${esc(w.exampleVi||'')}</div>`:`<div class="reveal-hint">Nhấn vào thẻ hoặc nút bên dưới để xem đáp án</div>`}</div><div class="row" style="justify-content:center;margin:16px 0"><button class="btn" data-action="speak" data-value="${esc(w.term)}">🔊 Phát âm</button><button class="btn" data-action="speak-slow" data-value="${esc(w.example||w.term)}">🐢 Nghe chậm</button>${!flash.revealed?'<button class="btn primary" data-action="reveal-flash">Hiện nghĩa →</button>':''}</div>${flash.revealed?`<div class="rating"><button class="btn warn" data-action="rate-flash" data-grade="0">😕 Quên rồi</button><button class="btn" data-action="rate-flash" data-grade="1">🧐 Khó nhớ</button><button class="btn light" data-action="rate-flash" data-grade="2">🙂 Nhớ được</button><button class="btn primary" data-action="rate-flash" data-grade="3">🌟 Rất dễ</button></div>`:'<div class="muted" style="text-align:center;font-size:12px">Bạn nên tự đoán nghĩa trước khi lật thẻ.</div>'}`:`<section class="surface pad" style="text-align:center;padding:50px 25px"><div style="font-size:55px">🎉</div><h2>${flash.ids.length?'Hoàn thành lượt học!':'Không có từ trong nhóm này'}</h2><p class="muted">${flash.ids.length?'Các từ đã được cập nhật lịch ôn tiếp theo.':'Bạn có thể chọn chế độ khác để luyện tiếp.'}</p><div class="row" style="justify-content:center"><button class="btn primary" data-action="restart-flash">Làm lượt tiếp theo</button><button class="btn" data-action="go" data-target="practice">Chuyển sang bài tập →</button></div></section>`}</div>`}
function quizPool(){return allWords().filter(w=>w.meaning && !/^Chưa có nghĩa/i.test(w.meaning) && (!quiz.customOnly||w.source==='custom'))}
function nextQuiz(){const pool=quizPool();if(!pool.length){quiz.wordId=null;return}let eligible=pool.filter(w=>!quiz.lastIds.includes(w.id));if(!eligible.length)eligible=pool;const ranked=shuffle(eligible).sort((a,b)=>(review(b).wrong>0?1:0)-(review(a).wrong>0?1:0));const w=ranked[0];quiz.wordId=w.id;quiz.options=shuffle([w,...shuffle(pool.filter(x=>x.id!==w.id&&x.meaning!==w.meaning)).slice(0,3)]);quiz.lastIds.push(w.id);if(quiz.lastIds.length>8)quiz.lastIds.shift();quiz.selected=null;quiz.answered=false;quiz.typed=''}
function renderPractice(){const w=byId(quiz.wordId);return `${pageHeader('PRACTICE MAKES PROGRESS','Bài tập nhớ từ','Luyện nhận nghĩa và dịch ngược từ tiếng Việt sang tiếng Anh. Những từ làm sai sẽ được ưu tiên xuất hiện lại.')}<div class="between" style="margin-bottom:19px"><div class="mode"><button class="${quiz.mode==='choice'?'active':''}" data-action="quiz-mode" data-mode="choice">Chọn nghĩa</button><button class="${quiz.mode==='translate'?'active':''}" data-action="quiz-mode" data-mode="translate">Viết từ tiếng Anh</button></div><div class="row"><button class="btn sm ${quiz.customOnly?'primary':'light'}" data-action="quiz-pool">${quiz.customOnly?'✓ Chỉ từ tự thêm':'Luyện từ tự thêm'}</button><span class="counter">Đúng ${quiz.correct} / ${quiz.total} câu</span></div></div><section class="surface pad quizbox">${!w?'<p>Hãy thêm từ vựng để bắt đầu.</p>':`<div class="between"><span class="badge">${esc(w.topic)}</span><button class="btn sm ghost" data-action="speak" data-value="${esc(w.term)}">🔊 Nghe</button></div><div class="kicker" style="margin-top:23px">${quiz.mode==='choice'?'CHỌN NGHĨA ĐÚNG':'VIẾT CỤM TIẾNG ANH TƯƠNG ỨNG'}</div><div class="quiz-question">${esc(quiz.mode==='choice'?w.term:w.meaning)}</div>${quiz.mode==='choice'?`<div class="choices">${quiz.options.map(opt=>`<button ${quiz.answered?'disabled':''} class="choice ${quiz.answered?(opt.id===w.id?'correct':opt.id===quiz.selected?'incorrect':''):''}" data-action="quiz-choice" data-id="${esc(opt.id)}">${esc(opt.meaning)}</button>`).join('')}</div>`:`<div class="form-row" style="margin-top:25px"><label>Gõ từ/cụm từ bạn nhớ được:</label><input class="input" id="quizTyped" autocomplete="off" autocapitalize="off" spellcheck="false" ${quiz.answered?'disabled':''} value="${esc(quiz.typed)}" placeholder="Ví dụ: catch a bus" /></div><button class="btn primary" data-action="check-typed" ${quiz.answered?'disabled':''}>Kiểm tra câu trả lời</button>`}${quiz.answered?`<div class="feedback ${quiz.selected!==w.id?'bad function checkAnswer(correct){const w=byId(quiz.wordId);if(!w||quiz.answered)return;quiz.answered=true;quiz.selected=correct?w.id:'wrong';quiz.total++;if(correct)quiz.correct++;recordReview(w,correct?1:0,'quiz');render()}
function normalize(s){return String(s??'').toLocaleLowerCase('en').replace(/[’‘]/g,"'").replace(/[^a-z0-9\s'-]/g,'').replace(/\s+/g,' ').trim()}
function highlightLine(text,targets){let remaining=text,output='';let sorted=targets.slice().sort((a,b)=>b.length-a.length);while(remaining){let earliest=null;for(const t of sorted){const found=remaining.toLowerCase().indexOf(t.toLowerCase());if(found!==-1&&(!earliest||found<earliest.index||(found===earliest.index&&t.length>earliest.target.length)))earliest={index:found,target:t}}if(!earliest){output+=esc(remaining);break}output+=esc(remaining.slice(0,earliest.index));const actual=remaining.slice(earliest.index,earliest.index+earliest.target.length);const term=allWords().find(w=>w.term.toLowerCase()===earliest.target.toLowerCase());output+=term?`<button class="highlight" data-action="open-word" data-id="${esc(term.id)}" title="Xem nghĩa và ví dụ">${esc(actual)}</button>`:esc(actual);remaining=remaining.slice(earliest.index+earliest.target.length)}return output}

function classifyTopic(term,englishDefinition='',example='',vietnamese=''){

async function combinedIpa(term){const list=term.toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[];if(list.length<2||list.length>6)return '';
 const segments=await Promise.all(list.map(async item=>{let phonetic=IPA_HELPERS[item];if(!phonetic){const known=STARTER_WORDS.find(w=>w.term.toLowerCase()===item&&w.ipa);if(known)phonetic=known.ipa.replace(/^\/+|\/+$/g,'')}
  if(!phonetic){const d=await dictionaryLookup(item);phonetic=d?.ipa?.replace(/^\/+|\/+$/g,'')||''}
  return phonetic||'';
 }));
 return segments.some(p=>!p)?'':'/'+segments.join(' ')+'/';
}
async function enrichTerm(term,provided={}){
 const normalized=normalize(term);if(!normalized||normalized.length>120)throw Error('Từ tiếng Anh không hợp lệ');
 const key=normalized+'|'+JSON.stringify([provided.meaning||'',provided.example||'']);if(enrichmentCache.has(key))return {...enrichmentCache.get(key)};
 const dict=await dictionaryLookup(term);const exampleInfo=dict?.example?{example:cleanText(dict.example),note:''}:generateExample(term,dict?.pos||provided.pos);
 let draft={term:term.trim(),meaning:provided.meaning||'',ipa:provided.ipa||dict?.ipa||'',pos:provided.pos||dict?.pos||(term.includes(' ')?'phrase':''),example:provided.example||exampleInfo.example,exampleVi:provided.exampleVi||'',topic:provided.topic||'',ipaNote:'',exampleNote:provided.example? '':exampleInfo.note,definition:dict?.definition||''};
 if(!draft.ipa&&term.split(/\s+/).length>1){const combined=await combinedIpa(term);if(combined){draft.ipa=combined;draft.ipaNote='IPA ghép từ các từ thành phần (ước lượng, không phải phiên âm chính thức của cả cụm).'}}
 const missingMeaning=!draft.meaning,missingVi=!draft.exampleVi;
 const [meaning,exampleVi]=await Promise.all([missingMeaning?translateToVi(term):Promise.resolve(''),missingVi?translateToVi(draft.example):Promise.resolve('')]);
 if(missingMeaning)draft.meaning=meaning;if(missingVi)draft.exampleVi=exampleVi;
 const selection=classifyTopic(term,draft.definition,draft.example,draft.meaning);if(!draft.topic)draft.topic=selection.topic;draft.confident=selection.confident;
 draft.partial=!draft.meaning||!draft.ipa||!draft.exampleVi;
 enrichmentCache.set(key,draft);return {...draft};
}
function getWordForm(){return {term:$('termInput')?.value||'',meaning:$('meaningInput')?.value||'',pos:$('posInput')?.value||'',ipa:$('ipaInput')?.value||'',example:$('exInput')?.value||'',exampleVi:$('exViInput')?.value||'',topic:$('topicInput')?.value||''}}
function putEnriched(draft){const map={meaning:'meaningInput',pos:'posInput',ipa:'ipaInput',example:'exInput',exampleVi:'exViInput',topic:'topicInput'};
 for(const [field,id] of Object.entries(map)){const target=$(id);if(!target)continue;
  if(!target.value.trim()&&draft[field]){target.value=draft[field];autoLastFields[id]=draft[field]}
 }
 if($('ipaInput'))$('ipaInput').dataset.ipaNote=draft.ipaNote||'';
 if($('exInput'))$('exInput').dataset.exampleNote=draft.exampleNote||'';
}
function scheduleAutoFill(value){if(editingId)return;clearTimeout(autoLookupTimer);autoLookupSeq++;
 for(const [id,previous] of Object.entries(autoLastFields)){const field=$(id);if(field&&field.value===previous)field.value=''}autoLastFields={};
 if(!value.trim()){autoStatus('Nhập từ tiếng Anh để bắt đầu tra tự động.');return}
 autoStatus('Sẵn sàng tìm IPA, nghĩa, ví dụ và chủ đề cho “'+value.trim()+'”.');
 autoLookupTimer=setTimeout(()=>autoFillOne(false),1050);
}
async function autoFillOne(saveAfter=false){clearTimeout(autoLookupTimer);const term=$('termInput')?.value.trim()||'';if(!term)return;
 const existing=allWords().find(w=>normalize(w.term)===normalize(term));if(existing&&!editingId){autoStatus(`Từ “${term}” đã có trong kho. Bạn có thể vào Kho từ để học hoặc sửa nếu là từ tự thêm.`,'ok');if(saveAfter)openWord(existing.id);return}
 const sequence=++autoLookupSeq;const provided=getWordForm();const button=$('saveWordButton');autoStatus('Đang tra từ điển và dịch ví dụ…','loading');if(button&&saveAfter){button.disabled=true;button.textContent='Đang tự tạo dữ liệu…'}
 try{const draft=await enrichTerm(term,provided);
  if(sequence!==autoLookupSeq||!$('termInput')||normalize($('termInput').value)!==normalize(term))return;
  putEnriched(draft);
  const missing=[!$('meaningInput').value.trim()?'nghĩa tiếng Việt':null,!$('ipaInput').value.trim()?'IPA':null,!$('exViInput').value.trim()?'dịch ví dụ':null].filter(Boolean);
  const msg=missing.length?`Đã gợi ý chủ đề và điền dữ liệu tìm được. Chưa có: ${missing.join(', ')}. Hãy kiểm tra hoặc bổ sung thủ công.`:`✓ Đã tự điền IPA, nghĩa, ví dụ, dịch ví dụ và chủ đề. Hãy xem lại nếu từ có nhiều nghĩa.`;
  autoStatus(msg,missing.length?'normal':'ok');
  if(saveAfter)commitWord();
 }catch(error){autoStatus('Không thể tự tra lúc này. Bạn có thể thử lại khi có mạng hoặc nhập thủ công.','error');if(saveAfter)commitWord();}
 finally{if(sequence===autoLookupSeq&&button){button.disabled=false;button.textContent=editingId?'Lưu chỉnh sửa':'✨ Tự tạo & lưu vào kho'}}
}
function commitWord(){const current=getWordForm();if(!current.term.trim()){autoStatus('Vui lòng nhập từ tiếng Anh.','error');return}
 if(!current.meaning.trim()){autoStatus('Chưa có nghĩa tiếng Việt, nên chưa lưu để tránh tạo flashcard sai. Bạn có thể điền nghĩa rồi bấm lưu.','error');return}
 if(editingId){const index=state.customWords.findIndex(w=>w.id===editingId);if(index<0){editingId=null;autoStatus('Không tìm thấy mục từ cần sửa.','error');return}
  const duplicate=allWords().some(w=>w.id!==editingId&&normalize(w.term)===normalize(current.term));if(duplicate){autoStatus('Tên từ này đã có trong kho.','error');return}
  state.customWords[index]={...state.customWords[index],...current,ipaNote:$('ipaInput').dataset.ipaNote||'',exampleNote:$('exInput').dataset.exampleNote||''};
  selectedId=editingId;editingId=null;
 }else{const id=addWord({...current,ipaNote:$('ipaInput').dataset.ipaNote||'',exampleNote:$('exInput').dataset.exampleNote||''});
  if(id==='duplicate'){autoStatus('Từ đã tồn tại trong kho.','error');return}if(id==='invalid'){autoStatus('Cần nhập từ và nghĩa trước khi lưu.','error');return}selectedId=id;
 }
 saveState();flash.ids=[];quiz.wordId=null;toast('✓ Đã lưu vào Kho từ! Từ sẽ xuất hiện trong Flashcards và Bài tập.');libraryFilters={q:'',topic:'Tất cả',status:'Tất cả'};navigate('library')
}
async function saveAutoWord(){clearTimeout(autoLookupTimer);const form=getWordForm();if(!form.term.trim())return;
 if(editingId){commitWord();return}
 const missing=!form.meaning||!form.example||!form.exampleVi||!form.ipa||!form.topic;
 if(missing)await autoFillOne(true);else commitWord();
}
function clearWordForm(){editingId=null;clearTimeout(autoLookupTimer);autoLookupSeq++;autoLastFields={};const form=$('addWordForm');form?.reset();if($('ipaInput'))$('ipaInput').dataset.ipaNote='';if($('exInput'))$('exInput').dataset.exampleNote='';if($('wordFormTitle'))$('wordFormTitle').textContent='Tạo một từ mới';if($('saveWordButton'))$('saveWordButton').textContent='✨ Tự tạo & lưu vào kho';autoStatus('Nhập từ tiếng Anh để bắt đầu tra tự động.');$('termInput')?.focus()}
function editWord(id){const w=byId(id);if(!w||w.source!=='custom')return;editingId=id;autoLookupSeq++;clearTimeout(autoLookupTimer);navigate('add');const map={term:'termInput',meaning:'meaningInput',pos:'posInput',ipa:'ipaInput',example:'exInput',exampleVi:'exViInput',topic:'topicInput'};for(const [key,input]of Object.entries(map))$(input).value=w[key]||'';$('ipaInput').dataset.ipaNote=w.ipaNote||'';$('exInput').dataset.exampleNote=w.exampleNote||'';$('wordFormTitle').textContent='Chỉnh sửa từ đã lưu';$('saveWordButton').textContent='✓ Lưu chỉnh sửa';autoStatus('Bạn đang sửa từ đã lưu. Tiến độ học của từ này sẽ được giữ nguyên.','ok')}
function extractBulkRows(text){const lines=String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);let header=null;const rows=[];
 for(const line of lines){const delimiter=line.includes('|')?'|':line.includes('\t')?'\t':line.includes(';')?';':null;let cols=delimiter?splitCSV(line,delimiter):[line];
  if(!header&&/^(word|term|từ|tu vung|vocabulary)$/i.test(cols[0].trim())){header=cols.map(v=>normalize(v));continue}
  let word;if(header&&cols.length>1){const pick=keys=>{const idx=header.findIndex(x=>keys.some(v=>x.includes(v)));return idx<0?'':cols[idx]||''};word={term:pick(['word','term','từ','vocab']),meaning:pick(['meaning','nghĩa','nghia']),example:pick(['example','ví dụ']),topic:pick(['topic','chủ đề']),ipa:pick(['ipa']),pos:pick(['pos','loại']),exampleVi:pick(['dịch','translation'])};}
  else word={term:cols[0]||'',meaning:cols[1]||'',example:cols[2]||'',topic:cols[3]||'',ipa:cols[4]||'',pos:cols[5]||'',exampleVi:cols[6]||''};
  if(word.term?.trim())rows.push(word);
 }
 return rows;
}
async function autoBulkImport(){if(bulkBusy)return;const rows=extractBulkRows($('bulkInput')?.value||'');if(!rows.length){bulkStatus('Hãy dán ít nhất một từ tiếng Anh.','error');return}if(rows.length>35){bulkStatus('Mỗi lượt tối đa 35 từ để tránh hết hạn mức dịch. Hãy chia danh sách thành các lượt nhỏ.','error');return}
 bulkBusy=true;const button=$('autoBulkBtn');if(button)button.disabled=true;
 let ok=0,duplicate=0,invalid=0,partial=0;const failed=[];const accepted=[];
 try{for(let i=0;i<rows.length;i++){
  const w=rows[i],term=w.term.trim();bulkStatus(`Đang tự phân tích ${i+1}/${rows.length}: ${term} · Đã thêm ${ok} từ`);
  if(allWords().some(x=>normalize(x.term)===normalize(term))){duplicate++;continue}
  try{const draft=await enrichTerm(term,w);if(!draft.meaning){invalid++;failed.push(term);continue}
   const result=addWord(draft);if(result==='invalid'){invalid++;failed.push(term)}else if(result==='duplicate')duplicate++;else{ok++;accepted.push(term);if(draft.partial)partial++;saveState()}
  }catch{invalid++;failed.push(term)}
 }
 if(ok){flash.ids=[];quiz.wordId=null;}
 bulkStatus(`✓ Đã thêm ${ok} từ vào kho · ${duplicate} từ trùng · ${invalid} từ cần bổ sung${partial?' · '+partial+' từ còn thiếu IPA/dịch ví dụ':''}.${failed.length?' Chưa lưu: '+failed.join(', ')+'.':''}`,invalid?'normal':'ok');
 if(ok){$('bulkInput').value=failed.join('\n');toast(`Đã thêm ${ok} từ vào kho!`)}
 }finally{bulkBusy=false;if(button)button.disabled=false}
}

function openWord(id){if(!byId(id))return;selectedId=id;libraryFilters.q='';libraryFilters.topic='Tất cả';libraryFilters.status='Tất cả';navigate('library')}
function eventClick(e){const el=e.target.closest('[data-action],[data-nav]');if(!el)return;if(el.dataset.nav){navigate(el.dataset.nav);return}let w;switch(el.dataset.action){
case 'go':navigate(el.dataset.target);break;
case 'speak':e.stopPropagation();speak(el.dataset.value);break;
case 'speak-slow':e.stopPropagation();speak(el.dataset.value,.74);break;
case 'open-word':e.stopPropagation();openWord(el.dataset.id);break;
case 'select-word':selectedId=el.dataset.id;renderLibraryList();break;
case 'save-note':state.notes[el.dataset.id]=$('wordNote').value;saveState();toast('Đã lưu câu của bạn.');break;
case 'delete-word':w=byId(el.dataset.id);if(w?.source==='custom'&&confirm(`Xóa từ "${w.term}"?`)){state.customWords=state.customWords.filter(x=>x.id!==w.id);delete state.reviews[w.id];delete state.notes[w.id];saveState();toast('Đã xóa từ.');render()}break;
case 'flash-mode':flash.mode=el.dataset.mode;resetFlash();render();break;
case 'restart-flash':resetFlash();render();break;
case 'reveal-flash':if(!flash.revealed){flash.revealed=true;render()}break;
case 'rate-flash':w=byId(flash.ids[flash.index]);if(w){recordReview(w,Number(el.dataset.grade));flash.index++;flash.done++;flash.revealed=false;render()}break;
case 'quiz-mode':quiz.mode=el.dataset.mode;nextQuiz();render();break;
case 'quiz-pool':quiz.customOnly=!quiz.customOnly;quiz.lastIds=[];quiz.total=0;quiz.correct=0;nextQuiz();render();break;
case 'learn-custom':flash.mode='custom';resetFlash();navigate('flashcards');break;
case 'quiz-custom':quiz.customOnly=true;quiz.lastIds=[];nextQuiz();navigate('practice');break;
case 'quiz-choice':if(!quiz.answered)checkAnswer(el.dataset.id===quiz.wordId);break;
case 'check-typed':if(!quiz.answered){quiz.typed=$('quizTyped')?.value||'';checkAnswer(normalize(quiz.typed)===normalize(byId(quiz.wordId)?.term))}break;
case 'next-quiz':nextQuiz();render();break;
case 'open-story':storyIndex=Number(el.dataset.index);showStoryVi=true;render();window.scrollTo({top:0,behavior:'smooth'});break;
case 'back-stories':storyIndex=null;render();break;
case 'toggle-story-vi':showStoryVi=!showStoryVi;render();break;
case 'save-story-note':state.storyNotes[el.dataset.id]=$('storyNote').value;saveState();toast('Đã lưu bài viết của bạn.');break;
case 'speak-story-note':speak($('storyNote')?.value.trim()||'Please write your own sentences first.');break;
case 'auto-fill':autoFillOne(false);break;
case 'auto-bulk':autoBulkImport();break;
case 'clear-word':clearWordForm();break;
case 'speak-current-example':speak($('exInput')?.value||$('termInput')?.value||'');break;
case 'edit-word':editWord(el.dataset.id);break;
case 'bulk-add':{const result=parseBulk($('bulkInput').value);toast(`Đã thêm ${result.ok} từ · Trùng ${result.duplicate} · Bỏ qua ${result.invalid}.`);if(result.ok)$('bulkInput').value='';break}
case 'export-json':exportData();break;
case 'import-file':$('fileImport').click();break;
case 'reset-data':if(confirm('Bạn có chắc muốn xóa tiến độ và TẤT CẢ từ tự thêm? Hãy xuất JSON trước khi đặt lại.')){state=structuredClone(DEFAULT_STATE);saveState();toast('Đã đặt lại dữ liệu.');navigate('dashboard')}break;
}}
document.addEventListener('click',eventClick);
document.addEventListener('input',e=>{if(e.target.id==='termInput')scheduleAutoFill(e.target.value);if(e.target.id==='searchWords'){libraryFilters.q=e.target.value;renderLibraryList()}else if(e.target.id==='quizTyped'){quiz.typed=e.target.value}});
document.addEventListener('change',e=>{if(e.target.id==='topicFilter'){libraryFilters.topic=e.target.value;renderLibraryList()}if(e.target.id==='statusFilter'){libraryFilters.status=e.target.value;renderLibraryList()}if(e.target.id==='goal'){state.settings.goal=Number(e.target.value);saveState();render()}});
document.addEventListener('keydown',e=>{if(e.target.id==='quizTyped'&&e.key==='Enter'){e.preventDefault();if(!quiz.answered){quiz.typed=e.target.value;checkAnswer(normalize(quiz.typed)===normalize(byId(quiz.wordId)?.term))}}if(e.target.id==='flashCard'&&(e.key===' '||e.key==='Enter')){e.preventDefault();if(!flash.revealed){flash.revealed=true;render()}}});
document.addEventListener('submit',e=>{if(e.target.id!=='addWordForm')return;e.preventDefault();saveAutoWord()});
$('fileImport').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const content=await file.text();let message;if(file.name.toLowerCase().endsWith('.json'))message=importBackup(JSON.parse(content));else{const r=parseBulk(content);message=`Đã nhập ${r.ok} từ; trùng ${r.duplicate}; lỗi ${r.invalid}.`}toast(message);if(view!=='add')render()}catch(err){toast('Không đọc được file: '+(err?.message||'Định dạng không hợp lệ'))}finally{e.target.value=''}});
$('todayLabel').textContent=new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'short',year:'numeric'}).format(new Date());
render();

</script>
