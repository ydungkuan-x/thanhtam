":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/16-E2Ae-No8-p9eq8GJogiE4WvaAT54TV/view","media_preview":"https://drive.google.com/file/d/16-E2Ae-No8-p9eq8GJogiE4WvaAT54TV/preview","media_type":"video","id":"a13"},{"level":"Advanced","index":14,"title":"Sport","audio_title":"Are athletes really getting faster, better, stronger?","source_url":"https://youtube.com/watch?v=8COaMKbNrX0","watch":"From the beginning (00:00) until he says “...due to\ntechnology.” (about 06:05)","page":323,"page_end":331,"before":"1. Do you think today’s athletes are better than those of 50 years ago? Why?\n2. How much does equipment matter in sport compared with talent and training?\n3. Which sport do you enjoy watching? Has it changed over time?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nHow much faster?\n• The 2012 Olympic marathon winner would have beaten the 1904 winner by\nnearly (1) ______________\n• Jesse Owens won the 100 metres in (2) ______________\n• Against Usain Bolt, Owens would still have been about (3) ______________\nbehind\nThe role of the track\n• Bolt ran on a special (4) ______________ designed to help him run fast\n• Owens ran on (5) ______________, which waste more energy\n• Owens dug holes for his feet with a gardening (6) ______________\n• On the same surface, Owens would have been within one (7) ______________ of\nBolt\nThe mile\n• Roger Bannister ran the first sub-four-minute mile in (8) ______________\n• Cinder tracks make runners about (9) ______________ slower\n• The 1904 marathon winner was given (10) ______________ and brandy during\nthe race","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO changes in swimming does he mention?\nA the flip turn\nB gutters that reduce waves in the pool\nC longer pools\nD heated water\nE shorter races\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO facts about Roger Bannister does he give?\nA He ran on cinder tracks.\nB He trained about 45 minutes a day.\nC He was a professional athlete.\nD He used special shoes.\nE He ran in the 2012 Olympics.\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. What was the main reason for the improvement in Bolt’s time compared with\nOwens’?\nA Bolt trained harder.\nB Better technology, such as tracks and starting blocks.\nC Bolt was much taller.\nD Owens was unwell.\n6. What did the cycling organisation (UCI) decide in 2000?\nA to ban all bikes made of carbon\nB that one-hour records had to use equipment similar to 1972\nC to make races shorter\nD to let riders use any bike they wanted\n7. What did this decision show about the cycling one-hour record?\nA Cyclists were getting much stronger.\nB Nearly all of the improvement had come from technology.\nC The 1972 record was a mistake.\nD Modern bikes are slower.\n8. Why does he mention that Bannister skipped some medical school lectures?\nA to show he was lazy\nB to show that he trained very little compared with modern athletes\nC to explain why he became a doctor\nD to show that medicine helped him","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. outpace\na. shaped to move easily through the air\n2. technology\nb. one long step when walking or running\n3. stride\nc. to go faster than someone\nExpression\nMeaning\n4. surface\nd. new equipment and methods developed through\nscience\n5. absorb\ne. a force that slows something moving through air or\nwater\n6. amateur\nf. to take in energy or liquid\n7. savvy\ng. the top layer of something, such as a track\n8. record\nh. doing something for pleasure, not as a job\n9. drag\ni. having practical knowledge and good judgement\n10. aerodynamic\nj. the best result ever achieved","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. Most of the improvement in cycling was\n______________.\nTECHNOLOGY\n2. Bannister was an ______________ who trained before\nlectures.\nAMATEUR\n3. Modern bikes are much more ______________.\nAERODYNAMICS\n4. Full-body suits reduce ______________ in the water.\nDRAG\n5. The new track was designed to help athletes run\n______________.\nFAST\n6. Gutters at the edge of the pool make the water\n______________.\nCALM\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. On the same track, Owens would have been only one step\nbehind Bolt.\nSTRIDE\nOn the same track, Owens would have been ____________________________ Bolt.\n8. Cinders take in more of the runner’s energy.\nABSORB\nCinders ____________________________.\n9. Almost all the improvement happened because of better\nequipment.\nDUE\nAlmost all the improvement was ____________________________.\n10. Today’s athletes know much more about drugs.\nSAVVIER\nToday’s athletes are ____________________________.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nThe question the speaker asks\nOwens vs Bolt: what the track\nchanged\nBannister and the mile\nSwimming and cycling\nexamples\nPlan\nYour keywords\nHis conclusion so far + my\nreaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker questions whether...\n• At first glance...; however...\nUsing figures\n• If you adjust for......\n• The difference drops to...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour uncle, a big football fan, says this at a family dinner:\n“Players today are soft! In my day, footballers were tougher and better. These young\nstars only win because of fancy boots and science!”\nRound 1: Reply to your uncle (90-120 seconds, as a voice recording). In your reply:\n• respond respectfully and agree with part of what he says\n• use TWO examples from the talk about technology in sport\n• point out ONE thing that technology cannot explain\n• end with a friendly comment\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nRespectful agreement\n• You’ve actually got a point there, Uncle.\n• Technology does make a big difference.\nUsing examples\n• I watched a talk that showed...\n• For example...\nPointing out limits\n• But technology can’t explain everything.\n• Players still need...\nFriendly ending\n• Maybe we can watch an old match together?\n• Let’s see who wins on Saturday!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \n1.5 hours \n“nearly an \nhour and a \nhalf” \n6 \ntrowel \n \n2 \n1936 \n \n7 \nstride \n \n3 \n14 feet \n \n8 \n1954 \n \n4 \ncarpet \n \n9 \n1.5 percent / 1.5% \n \n5 \ncinders \n \n10 rat poison","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 c    2 d    3 b    4 g    5 f    6 h    7 i    8 j    9 e    10 a","answer_v2":"Part A: 1 technological    2 amateur    3 aerodynamic    4 drag    5 faster    6 calmer   |   \nPart B: 7 within one stride of    8 absorb more energy / absorb energy    9 due to \ntechnology    10 savvier about drugs","answer_speaking":": Model summary (2-minute version) \nThe speaker questions whether athletes are really getting faster, better and stronger. \nAt first glance, the numbers are amazing: the 2012 marathon winner would have \nbeaten the 1904 winner by nearly an hour and a half, and Usain Bolt would outpace \nJesse Owens by about fourteen feet. However, Owens ran on cinders, a surface that\nabsorbs more energy, while Bolt ran on a special track. If you adjust for the track, \nOwens would have been within one stride of Bolt. Similarly, Roger Bannister ran the \nfirst four-minute mile on cinders as an amateur who trained for only 45 minutes a \nday. In swimming, the flip turn, gutters and full-body suits that reduce drag made a \nhuge difference. The clearest example is cycling: when the UCI made riders use \n1972-style bikes instead of aerodynamic ones, the hour record improved by only a \ntiny amount, so almost all the progress was due to technology. What struck me most \nwas that a gardening trowel was once part of a sprinter’s equipment. \nSpeaking Exercise 2: Model voice reply \nYou’ve actually got a point there, Uncle. Technology does make a big difference. I \nwatched a talk that showed exactly this. For example, Usain Bolt ran on a special \ntrack that helps you run faster, while Jesse Owens in 1936 ran on cinders, and he \neven used a gardening tool to dig holes for his feet! If they’d run on the same surface, \nOwens would have been just one step behind. And in cycling, when riders had to use \nold-style bikes, the record hardly improved at all. But technology can’t explain \neverything. Players today train much more scientifically, they’re fitter, and the game \nis much faster. And there are just more people playing, so the best are really the best. \nStill, I bet the old players were tough! Maybe we can watch an old match together \nand compare?","flashcards":[{"word":"outpace","meaning":"to go faster than someone"},{"word":"technology","meaning":"new equipment and methods developed through science"},{"word":"stride","meaning":"one long step when walking or running"},{"word":"surface","meaning":"the top layer of something, such as a track"},{"word":"absorb","meaning":"to take in energy or liquid"},{"word":"amateur","meaning":"doing something for pleasure, not as a job"},{"word":"savvy","meaning":"having practical knowledge and good judgement"},{"word":"record","meaning":"the best result ever achieved"},{"word":"drag","meaning":"a force that slows something moving through air or water"},{"word":"aerodynamic","meaning":"shaped to move easily through the air"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1fNAdEXzfDSTFqUMWTI1klVWKK1FReZiS/view","media_preview":"https://drive.google.com/file/d/1fNAdEXzfDSTFqUMWTI1klVWKK1FReZiS/preview","media_type":"video","id":"a14"},{"level":"Advanced","index":15,"title":"Food & Agriculture","audio_title":"Why not eat insects?","source_url":"https://youtube.com/watch?v=O6GimGZz6a8","watch":"From “Now the situation in the world is going to\nchange” (about 06:10) until he asks “...why not eat insects?”\n(about 11:20)","page":332,"page_end":340,"before":"1. Have you ever eaten insects? Would you try them?\n2. Why do you think people in richer countries eat more meat?\n3. How can the world produce enough food for everyone in the future?","listening1":"Exercise 1. Read the notes first. Then watch the segment and complete the notes.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\nA changing world\n• The world population will grow to about (1) ______________ by 2050\n• The FAO says we need about (2) ______________ more agricultural production\n• As people get richer, they eat more (3) ______________\nMeat consumption\n• In the developed world, about 80 kg per person per year; in the US, about (4)\n______________ kg\n• In China, it rose from 20 kg to (5) ______________ kg in 20 years\n• Pigs are so closely related to us that they share our diseases, e.g. classical (6)\n______________\nWhy insects are better\n• 10 kg of feed gives 1 kg of beef, but (7) ______________ of locust meat\n• Insects produce much less (8) ______________ and greenhouse gas\n• 1 kg of grasshoppers has as many calories as 10 hot dogs or six (9)\n______________\n• The speaker was a (10) ______________ for a long time","listening2":"Exercise 2. Watch the segment again without stopping and then answer Questions\n1-8.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO countries together make up about one third of the world’s population?\nA China\nB India\nC the United States\nD Brazil\nE Indonesia\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO environmental advantages of insects does he mention?\nA less manure\nB fewer greenhouse gases\nC they clean rivers\nD they need no water at all\nE they grow on trees\nQuestions 5-8. Choose the correct letter, A, B, C or D.\n5. What is his first point about why insects are better than livestock?\nA They taste better.\nB They are so distantly related to us that they are unlikely to share our diseases.\nC They are cheaper in shops.\nD They grow bigger.\n6. What happened in the Netherlands in the 1990s?\nA Insects were banned.\nB An outbreak of classical swine fever led to millions of pigs being killed.\nC Meat became very cheap.\nD Farmers started eating insects.\n7. How does insect meat compare nutritionally with conventional meat?\nA It has no protein.\nB It is similar in protein, fat and vitamins.\nC It is much higher in sugar.\nD It has more fat than beef.\n8. What is the speaker’s overall argument?\nA Everyone should become vegetarian.\nB Insects are an efficient, healthy and sustainable source of protein for a growing\nworld.\nC Meat production should be banned.\nD Only poor countries should eat insects.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nExpression\nMeaning\n1. livestock\na. the amount of something that is used or eaten\n2. consumption\nb. connected only through a very old common\nancestor\n3. feed\nc. farm animals such as cows, pigs and chickens\nExpression\nMeaning\n4. efficient\nd. a substance in food that builds muscle\n5. manure\ne. producing good results without wasting resources\n6. greenhouse gas\nf. food given to farm animals\n7. outbreak\ng. animal waste, often used on fields\n8. nutritious\nh. a gas that traps heat in the atmosphere\n9. distantly related\ni. containing substances that help you grow and stay\nhealthy\n10. protein\nj. a sudden start of a disease","vocab2":"Exercise 2. Word formation and paraphrase\nPart A. Complete each sentence with the correct form of the word in capitals.\n1. Meat ______________ is rising fast in developing\ncountries.\nCONSUME\n2. Insects are much more ______________ at turning feed\ninto meat.\nEFFICIENCY\n3. Insect meat is just as ______________ as beef.\nNUTRITION\n4. We need 70% more ______________ production.\nAGRICULTURE\n5. There was a serious ______________ of swine fever.\nBREAK\n6. Insect farming is better for the ______________.\nENVIRONMENTAL\nPart B. Complete the second sentence so that it means the same as the first. Use the word\nin capitals and write 2-5 words.\n7. There will be a third more people to feed.\nMOUTHS\nThere will be ____________________________ to feed.\n8. Insects are very far from us in evolution.\nDISTANTLY\nInsects are ____________________________ to us.\n9. Ten kilograms of feed gives you only one kilogram of\nbeef.\nPRODUCES\nTen kilograms of feed ____________________________ of beef.\n10. A kilo of grasshoppers has the same energy as ten hot\ndogs.\nCALORIES\nA kilo of grasshoppers has ____________________________ ten hot dogs.","speaking1":"Exercise 1. Summarise the speaker’s argument fluently in your own words, and get\nfaster each time.\nStep 1: Make notes (5 minutes). Keywords only.\nPlan\nYour keywords\nThe global food problem\n(numbers)\nRising meat consumption\nPoint 1: disease risk\nPoint 2 and 3: feed and\nenvironment\nPlan\nYour keywords\nPoint 4: nutrition + my reaction\nExpressions from Vocabulary\nExercise 1 I will use (at least 5)\nStep 2: Record three times. Record your summary + reaction in 2 minutes. Then record\nit again in 1 minute 30 seconds, and finally in 1 minute. Keep all the key points each\ntime, cut the extra words, not the ideas.\nStep 3: Compare. Listen to Recording 1 and Recording 3. What became smoother?\nWhich expressions did you use without thinking?\nUSEFUL LANGUAGE\nSummarising\n• The speaker argues that insects could...\n• He makes four main points: ...\nUsing figures\n• For every 10 kg of feed...\n• Compared with beef...\nReacting\n• What struck me most was...\n• This makes me rethink...\n• I’m slightly sceptical about..., though.","speaking2":"Exercise 2. Use evidence and high-level vocabulary to persuade someone in a real-\nlife conversation.\nSITUATION\nYour school canteen is considering adding cricket-flour snacks. A classmate\nposts:\n“Insects in our canteen?! Gross 🤢 Who wants to eat bugs? Let’s sign a petition to\nstop it!”\nRound 1: Record a voice reply for the group (90-120 seconds). In your reply:\n• accept that the idea feels strange at first\n• give TWO facts from the talk\n• point out that many people already eat insects\n• suggest a fair way for students to decide\nRound 2: Listen to your Round 1 reply, choose two things to improve (e.g. a stronger\nopening, more precise vocabulary), and record it again in 90 seconds.\nUSEFUL LANGUAGE\nAccepting feelings\n• Haha, I get it, it sounds weird at first.\n• I felt the same, honestly.\nGiving facts\n• But I watched a talk by a scientist who...\n• Apparently...\nMaking a point\n• Actually, people in many countries already...\n• We eat shrimp, and they’re not that different.\nSuggesting\n• Why don’t we have a tasting day first?\n• Let’s try it before we decide.","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \n9 billion / nine \nbillion \n \n6 \nswine fever\nQ \nAnswer \nNote \nQ \nAnswer \nNote \n2 \n70 percent / 70% \n \n7 \n9 kg / nine \nkilograms \n \n3 \nmeat \n \n8 \nmanure \n \n4 \n120 \n \n9 \nBig Macs \n \n5 \n50 \n \n10 vegetarian","answer_l2":"1-2 A, B (any order)    3-4 A, B (any order)    5 B    6 B    7 B    8 B","answer_v1":"1 c    2 a    3 f    4 e    5 g    6 h    7 j    8 i    9 b    10 d","answer_v2":"Part A: 1 consumption    2 efficient    3 nutritious    4 agricultural    5 outbreak    6 \nenvironment   |   Part B: 7 a third more mouths    8 so distantly related    9 produces one \nkilogram    10 as many calories as","answer_speaking":": Model summary (2-minute version) \nThe speaker argues that insects could help feed the world. By 2050, there will be \nabout nine billion people, so we’ll need about 70 percent more food. At the same \ntime, meat consumption is rising: in the US, people eat about 120 kilos a year, and in \nChina it has more than doubled in twenty years. He makes four main points. First, \nlivestock like pigs are so closely related to us that they share our diseases, as the \nswine fever outbreak in the Netherlands showed, while insects are distantly related. \nSecond, insects are far more efficient: ten kilos of feed gives one kilo of beef but \nnine kilos of locust meat. Third, they produce much less manure and fewer \ngreenhouse gases. Fourth, they are just as nutritious, with similar protein, fat and\nvitamins; a kilo of grasshoppers has as many calories as six Big Macs. So he asks: \nwhy not eat insects? What struck me most was the difference in feed efficiency; I’d \nnever thought about it. \nSpeaking Exercise 2: Model voice reply \nHaha, I get it, it sounds weird at first. I felt the same, honestly. But I watched a talk \nby a scientist who studies insects, and he made some good points. Apparently, to get \none kilo of beef, you need ten kilos of feed, but the same feed gives you nine kilos of \ninsect meat! They also produce much less greenhouse gas, and they’re full of protein. \nActually, people in many countries, including parts of Vietnam, already eat insects \nand love them. And we eat shrimp, which aren’t that different, if you think about it. \nAnd cricket flour doesn’t even look like bugs. It’s just a powder in snacks. So instead \nof a petition, why don’t we have a tasting day first? Everyone tries it, then we vote. If \nmost people hate it, fine, but let’s try it before we decide.","flashcards":[{"word":"livestock","meaning":"farm animals such as cows, pigs and chickens"},{"word":"consumption","meaning":"the amount of something that is used or eaten"},{"word":"feed","meaning":"food given to farm animals"},{"word":"efficient","meaning":"producing good results without wasting resources"},{"word":"manure","meaning":"animal waste, often used on fields"},{"word":"greenhouse gas","meaning":"a gas that traps heat in the atmosphere"},{"word":"outbreak","meaning":"a sudden start of a disease"},{"word":"nutritious","meaning":"containing substances that help you grow and stay healthy"},{"word":"distantly related","meaning":"connected only through a very old common ancestor"},{"word":"protein","meaning":"a substance in food that builds muscle"}],"mcq_answers":{"5":"B","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1A5fxmgCGbOWUDV492gyT2-9EwEGOI_8N/view","media_preview":"https://drive.google.com/file/d/1A5fxmgCGbOWUDV492gyT2-9EwEGOI_8N/preview","media_type":"video","id":"a15"}];

function home(){document.getElementById('crumb').innerHTML='KHÔNG GIAN TỰ HỌC <strong> / Tổng quan</strong>';let total=countDone(),pct=Math.round(total/45*100);
 const recent=UNITS.find(u=>!done(u))||UNITS[0];
 let h=`<section class="hero"><div class="eyebrow">YOUR PERSONAL IELTS STUDIO</div><h1 class="h1">Học tiếng Anh thật.<br>Nói bằng ý của mình.</h1><p>Từ ngữ liệu thực · Listening & Speaking · Tập 1. Học nghe trước, hiểu ngữ cảnh, luyện từ vựng, nói lại không học thuộc.</p><div class="btnrow"><button class="primary" data-unit="${recent.id}">▶ Tiếp tục: ${esc(recent.title)}</button><a class="secondary" href="${PDF_URL}" target="_blank" rel="noopener">↗ Mở PDF gốc</a></div></section>`;
 h+=`<div class="statgrid"><div class="stat"><div class="value">45</div><div class="label">Unit từ tài liệu gốc</div></div><div class="stat"><div class="value">${total}<span class="muted" style="font-size:15px"> / 45</span></div><div class="label">Đã hoàn thành</div></div><div class="stat"><div class="value">${pct}%</div><div class="label">Tiến độ khóa học</div></div><div class="stat"><div class="value">2–3</div><div class="label">Unit / tuần được gợi ý</div></div></div>`;
 h+=`<div class="section-title"><h2>Chọn lộ trình của bạn</h2><span class="micro">Bắt đầu từ Beginner để xây nền</span></div><div class="levelgrid">`;
 for(const lev of LEVELS)h+=`<button class="levelcard" data-level="${lev.id}"><span class="levelicon ${lev.color}">${lev.icon}</span><strong>${lev.id}</strong><p>${lev.desc}<br>${lev.info}</p><span class="micro">${countDone(lev.id)} / 15 units</span>${iconProgress(lev.id)}</button>`;
 h+=`</div><div class="section-title"><h2>Phương pháp 80 phút / Unit</h2><span class="micro">Theo hướng dẫn tài liệu</span></div><div class="steps">`;
 for(const [a,b,c] of [['💭','Khởi động','5 phút'],['🎧','Nghe lần 1','15 phút'],['🧠','Nghe lần 2','15 phút'],['📚','Từ vựng','15 phút'],['🎙️','Luyện nói','20 phút'],['✅','Tự kiểm tra','10 phút']])h+=`<div class="step"><div class="icon">${a}</div><strong>${b}</strong><small>${c}</small></div>`;
 h+=`</div><div class="section-title"><h2>Học từ bài đầu tiên</h2></div><div class="unitsgrid">${UNITS.filter(x=>x.level==='Beginner').slice(0,6).map(unitCard).join('')}</div><div class="footer">Nội dung thực hành dựa trên sách IELTS Xuân Phi. Media được mở từ Google Drive / nguồn ghi trong sách.</div>`;return h}
function unitCard(u){return `<button class="unitcard" data-unit="${u.id}"><span class="utag">${u.level.toUpperCase()} · UNIT ${String(u.index).padStart(2,'0')}</span><h3>${esc(u.title)}</h3><div class="meta"><span>${esc(u.audio_title).slice(0,35)}${u.audio_title.length>35?'…':''}</span><span class="${done(u)?'done':''}">${done(u)?'✓ Done':'→'}</span></div></button>`}
function library(){let lev=state.level,arr=UNITS.filter(u=>(state.search||u.level===lev)&&u.title.toLowerCase().includes(state.search.toLowerCase()));document.getElementById('crumb').innerHTML=`KHÔNG GIAN TỰ HỌC <strong> / ${lev}</strong>`;
 return `<button class="back" data-home="1">← Tổng quan</button><div class="eyebrow" style="margin-top:22px">${state.search?'TÌM KIẾM 45 BÀI HỌC':'15 CHỦ ĐỀ'} · ${esc(LEVELS.find(l=>l.id===lev).desc)}</div><h1 class="h1">${state.search?'Kết quả: '+esc(state.search):esc(lev)+' course'}</h1><p class="sub">Chọn bài theo chủ đề hoặc học theo thứ tự. Mỗi Unit có bài nghe thực tế, bài tập từ sách và hai bài thực hành nói.</p><div class="btnrow">${LEVELS.map(l=>`<button class="${l.id===lev?'primary':'ghost'}" data-level="${l.id}">${l.id}</button>`).join('')}</div><div class="section-title"><h2>Danh sách Unit</h2><span class="micro">${state.search?arr.length+' kết quả':countDone(lev)+'/15 hoàn thành'}</span></div><div class="unitsgrid">${arr.map(unitCard).join('')||'<div class="empty">Không tìm thấy chủ đề phù hợp.</div>'}</div>`}
function textBlock(t,extra=''){return `<div class="book ${extra}">${esc(t||'Nội dung không tìm thấy trong trích xuất PDF.')}</div>`}
function studyHeader(u){let lev=LEVELS.find(l=>l.id===u.level);return `<div class="lessonhero"><div><div class="eyebrow">${u.level.toUpperCase()} · UNIT ${String(u.index).padStart(2,'0')} / 15</div><h1>${esc(u.title)}</h1><p>${esc(u.audio_title)}</p></div><div class="lessonbadge">${lev.desc}</div></div><div class="tabs">${[['overview','Tổng quan'],['listening','🎧 Listening'],['vocab','📚 Vocabulary'],['speaking','🎙️ Speaking'],['answers','✓ Đáp án']].map(([k,v])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('')}</div>`}
function sourceEmbed(u){try{let z=new URL(u.source_url);let id=z.hostname.includes('youtu.be')?z.pathname.slice(1):z.searchParams.get('v');if(!id||!(/^[A-Za-z0-9_-]{11}$/.test(id)))return '';return 'https://www.youtube-nocookie.com/embed/'+id+'?start='+(z.searchParams.get('t')||'0')}catch{return ''}}
function player(u){let source=sourceEmbed(u);let media=source&&state.mediaBySource?source:u.media_preview;return `<div class="media ${u.media_type==='audio'?'audio':''}"><iframe src="${esc(media)}" title="Media ${esc(u.title)}" loading="lazy" allow="autoplay;encrypted-media;fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe></div><div class="sources">${source?`<button class="ghost" data-action="switchplayer" style="padding:7px 10px;font-size:11px">${state.mediaBySource?'Phát từ Drive':'Phát từ YouTube'}</button>`:''}<a class="sourcelink" href="${esc(u.media_url)}" target="_blank" rel="noopener noreferrer">↗ Mở file nghe/video trên Drive</a>${u.source_url?`<a class="sourcelink" href="${esc(u.source_url)}" target="_blank" rel="noopener noreferrer">↗ Nguồn bài gốc</a>`:''}</div><p class="micro">Nếu trình phát không xuất hiện, chọn “Mở file trên Drive” và đăng nhập tài khoản có quyền truy cập.</p>`}
function overview(u){return `<div class="two"><section class="block"><span class="pill">BƯỚC 01 · 5 PHÚT</span><h3 style="margin-top:12px">Before you listen / watch</h3><p>Đọc câu hỏi trước khi nghe. Viết ý chính bằng tiếng Anh hoặc tiếng Việt; không cần viết câu hoàn chỉnh.</p>${textBlock(u.before)}<h3 style="margin-top:20px">Ghi chú dự đoán của bạn</h3><textarea class="qarea" data-note="${u.id}.warm" placeholder="I think they will talk about...">${esc(dbGet('note.'+u.id+'.warm'))}</textarea><p class="micro">Ghi chú tự lưu trong trình duyệt trên thiết bị này.</p></section><section class="block"><h3>🎬 Bài nghe thực tế</h3><p>${esc(u.audio_title)}</p>${player(u)}${u.watch?`<div class="note"><b>Đoạn cần nghe:</b> ${esc(u.watch)}</div>`:''}<div class="sources"><span class="pill">PDF trang ${u.page}–${u.page_end}</span><a class="sourcelink" href="${PDF_URL}#page=${u.page}" target="_blank" rel="noopener">↗ Xem trang sách</a></div></section></div><section class="block"><h3>Lộ trình hoàn thành Unit</h3><p>1. Nghe lần đầu và làm bài 1. 2. Nghe lại, làm bài 2. 3. Học từ trong ngữ cảnh. 4. Tóm tắt và gửi tin nhắn thoại bằng lời của bạn. 5. Mở đáp án cuối cùng.</p><div class="btnrow">${btn('Bắt đầu Listening →','listen','primary')}${btn('Luyện từ vựng','vocab','ghost')}</div></section>`}
function maxQ(s,def=8){let ids=[];for(const m of s.matchAll(/(?:^|\n)\s*(\d{1,2})\.\s/g))ids.push(Number(m[1]));for(const m of s.matchAll(/\((\d{1,2})\)\s*_{4,}/g))ids.push(Number(m[1]));let max=ids.length?Math.max(...ids):def;return Math.min(Math.max(max,3),20)}
function answersUI(u,part){let key=part==='l1'?'listening1':'listening2',raw=u[key],n=maxQ(raw,part==='l1'?8:6);let keyMap=part==='l2'?u.mcq_answers:(u.id==='b1'?{'1':'London','2':'countryside','3':'wildlife','4':'north','5':'south','6':'seaside','7':'city','8':'car'}:{});return `<div class="divider"></div><h3>Phiếu trả lời · ${part==='l1'?'Exercise 1':'Exercise 2'}</h3><p class="micro">Điền câu trả lời bên dưới. Bạn có thể sửa nhiều lần trước khi xem đáp án.</p><div class="answergrid">${Array.from({length:n},(_,i)=>`<label class="ansfield"><b>${i+1}.</b><input class="answerbox" data-answer="${u.id}.${part}.${i+1}" value="${esc(dbGet('answer.'+u.id+'.'+part+'.'+(i+1)))}" aria-label="Câu trả lời số ${i+1}"></label>`).join('')}</div><div class="btnrow"><button class="primary" data-check="${part}">Kiểm tra những câu có đáp án tự chấm</button><button class="ghost" data-key="${part}">Xem đáp án sách</button></div><div id="score-${part}"></div><div class="answerkey hidden" id="key-${part}">${textBlock(part==='l1'?u.answer_l1:u.answer_l2,'long')}</div><p class="micro">Một số dạng câu trong sách là điền từ, ghép đôi hoặc chọn nhiều đáp án; với dạng chưa tự chấm, đối chiếu đáp án sách để tự sửa.</p>`}
function listening(u){return `<div class="two"><div><section class="block"><span class="pill">BƯỚC 02 · NGHE LẦN 1</span><h3 style="margin-top:13px">Listening · Exercise 1</h3><p>Hãy đọc yêu cầu, dự đoán loại từ cần điền, rồi nghe. Chưa xem đáp án.</p>${textBlock(u.listening1)}${answersUI(u,'l1')}</section><section class="block"><span class="pill">BƯỚC 03 · NGHE LẦN 2</span><h3 style="margin-top:13px">Listening · Exercise 2</h3><p>Nghe lại toàn bộ đoạn, cố gắng không tạm dừng và hoàn thành bài 2.</p>${textBlock(u.listening2)}${answersUI(u,'l2')}</section></div><div><section class="block"><h3>🎧 Trình phát bài nghe</h3>${player(u)}${u.watch?`<div class="note"><b>Đoạn cần nghe:</b> ${esc(u.watch)}</div>`:''}<div class="note">Mẹo: ① Nghe không phụ đề → ② Nghe và đối chiếu câu hỏi → ③ Bật CC / transcript ở nguồn gốc sau khi tự làm.</div></section><section class="block"><h3>Ghi lại điều nghe được</h3><textarea class="qarea" data-note="${u.id}.listen" placeholder="Words I heard... / Main idea...">${esc(dbGet('note.'+u.id+'.listen'))}</textarea></section></div></div>`}
function vocab(u){let cards=u.flashcards,idx=Math.min(state.flashIndex,Math.max(0,cards.length-1)),card=cards[idx];let known=dbGet('known.'+u.id,[]);
 return `<div class="two"><div><section class="block"><span class="pill">BƯỚC 04 · 15 PHÚT</span><h3 style="margin-top:13px">Flashcards · Học từ trong ngữ cảnh</h3><p>Tự đoán nghĩa trước khi lật thẻ. Đặt một câu liên quan đến cuộc sống của bạn.</p>${cards.length?`<div class="flash" data-flip="1"><div>${state.flipped?`<div class="def">${esc(card.meaning)}</div>`:`<div class="word">${esc(card.word)}</div>`}</div><span class="hint">Nhấn thẻ để ${state.flipped?'xem từ':'xem định nghĩa'}</span></div><div class="flashctrl"><button class="ghost" data-action="prevcard">← Trước</button><span class="small muted">${idx+1} / ${cards.length} thẻ</span><button class="ghost" data-action="nextcard">Tiếp →</button></div><label class="mark"><input type="checkbox" data-known="${idx}" ${known.includes(idx)?'checked':''}> Tôi đã nhớ từ này <span class="micro">(${known.length}/${cards.length})</span></label><h3 style="margin-top:22px">Tự đặt câu</h3><textarea class="qarea" data-note="${u.id}.vocab" placeholder="Write your example sentences here...">${esc(dbGet('note.'+u.id+'.vocab'))}</textarea>`:`<div class="note">Unit này luyện biến đổi từ loại thay vì ghép từ với định nghĩa. Hãy làm bài trong sách ở bên cạnh.</div>`}</section></div><div><section class="block"><h3>Vocabulary · Exercise 1</h3>${textBlock(u.vocab1)}<button class="ghost" style="margin-top:12px" data-key="v1">Đối chiếu đáp án</button><div class="answerkey hidden" id="key-v1">${textBlock(u.answer_v1,'long')}</div></section><section class="block"><h3>Vocabulary · Exercise 2</h3>${textBlock(u.vocab2)}<button class="ghost" style="margin-top:12px" data-key="v2">Đối chiếu đáp án</button><div class="answerkey hidden" id="key-v2">${textBlock(u.answer_v2,'long')}</div></section></div></div>`}
function speaking(u){return `<div class="two"><div><section class="block"><span class="pill">BƯỚC 05 · 20 PHÚT</span><h3 style="margin-top:13px">Speaking · Exercise 1</h3><p>Nói theo ý hiểu: WHO / WHAT → 2 DETAILS → YOUR THOUGHTS. Chỉ ghi từ khóa, không học thuộc đoạn mẫu.</p>${textBlock(u.speaking1)}<h3 style="margin-top:18px">Từ khóa của bạn</h3><textarea class="qarea" data-note="${u.id}.speaking1" placeholder="Main idea / Useful vocabulary / 2 examples...">${esc(dbGet('note.'+u.id+'.speaking1'))}</textarea></section><section class="block"><h3>Speaking · Exercise 2</h3>${textBlock(u.speaking2)}<h3 style="margin-top:17px">Dàn ý bằng ý của mình</h3><textarea class="qarea" data-note="${u.id}.speaking2" placeholder="My opinion → Reason 1 → Example → Reason 2 → Finish...">${esc(dbGet('note.'+u.id+'.speaking2'))}</textarea></section></div><div><section class="block"><h3>🎙️ Phòng luyện ghi âm</h3><p>Lần 1: nói với các từ khóa. Nghe lại, chọn 1–2 điểm cần sửa rồi nói lần 2. Không cần thuộc lòng.</p><div class="recording"><div id="recordStatus" class="micro">Microphone chưa hoạt động.</div><div class="btnrow"><button class="primary" data-action="startrec" id="startRec">● Bắt đầu ghi âm</button><button class="ghost" data-action="stoprec" id="stopRec" disabled>■ Dừng</button></div><div id="audioOutput"></div></div><div class="note">Tính năng ghi âm hoạt động khi trình duyệt cho phép truy cập micro. Bản ghi được giữ trên thiết bị trong phiên mở trang, không tự tải lên mạng. Hãy tải bản ghi xuống nếu muốn lưu lâu dài.</div></section><section class="block"><h3>Gợi ý triển khai, không học thuộc</h3><p><b>Beginner:</b> I think ... because ... For example, ...</p><p><b>Intermediate:</b> The report is about ... One interesting point is ... Personally, ...</p><p><b>Advanced:</b> The speaker argues that ... This is supported by ... However, ...</p><div class="note">Tự hỏi sau khi ghi âm: Mình có nói đủ ý? Có dùng 3–5 từ mới? Mình có dừng quá lâu? Có lỗi chia thì hoặc âm cuối nào cần sửa?</div></section></div></div>`}
function showKey(u){let open=state.showAnswers['all'];return `<section class="block"><span class="pill">BƯỚC 06 · 10 PHÚT</span><h3 style="margin-top:12px">Tự kiểm tra và chữa bài</h3><p>Đáp án bên dưới được trích từ cuối tài liệu. Chỉ mở sau khi hoàn thành Listening, Vocabulary và tự ghi âm Speaking.</p><button class="${open?'ghost':'primary'}" data-action="toggleall">${open?'Ẩn đáp án':'Tôi đã làm xong — mở đáp án'}</button>${open?`<div style="margin-top:21px"><h3>Listening · Exercise 1</h3>${textBlock(u.answer_l1,'long')}<h3 style="margin-top:21px">Listening · Exercise 2</h3>${textBlock(u.answer_l2,'long')}<h3 style="margin-top:21px">Vocabulary · Exercise 1</h3>${textBlock(u.answer_v1,'long')}<h3 style="margin-top:21px">Vocabulary · Exercise 2</h3>${textBlock(u.answer_v2,'long')}<h3 style="margin-top:21px">Speaking · Câu trả lời tham khảo</h3>${textBlock(u.answer_speaking,'long')}</div>`:''}</section><section class="block"><h3>Tự đánh giá sau bài học</h3><textarea class="qarea" data-note="${u.id}.review" placeholder="Today I learned... / I still struggle with... / Next time I will...">${esc(dbGet('note.'+u.id+'.review'))}</textarea></section>`}
function unitView(){let u=getUnit();document.getElementById('crumb').innerHTML=`KHÔNG GIAN TỰ HỌC <strong> / ${esc(u.level)} / ${esc(u.title)}</strong>`;let content={overview, listening, vocab, speaking, answers:showKey}[state.tab](u);
 return `<div style="display:flex;justify-content:space-between;gap:9px;margin-bottom:12px;align-items:center"><button class="back" data-level="${u.level}">← ${u.level} · Danh sách bài</button><span class="micro">Unit ${u.index} of 15</span></div>${studyHeader(u)}${content}<div class="checkbar"><label><input type="checkbox" data-done="${u.id}" ${done(u)?'checked':''}> Đánh dấu đã hoàn thành Unit này</label><button class="ghost" data-action="nextunit">Unit tiếp theo →</button></div><div class="footer">© Nội dung tham khảo: IELTS Xuân Phi, Tự học IELTS từ ngữ liệu thực, Tập 1 · Nguồn và đáp án theo PDF gốc.</div>`}
function render(){nav();let app=document.getElementById('app');app.innerHTML=state.view==='home'?home():state.view==='library'?library():unitView()}
function switchUnit(id){if(!UNITS.some(u=>u.id===id))return;state={...state,view:'unit',unit:id,tab:'overview',flashIndex:0,flipped:false,showAnswers:{},mediaBySource:false};document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'})}
function switchTab(tab){state.tab=tab;state.showAnswers={};render();window.scrollTo({top:0,behavior:'instant'})}
function grade(part){let u=getUnit();let key=part==='l1'?(u.id==='b1'?{'1':'London','2':'countryside','3':'wildlife','4':'north','5':'south','6':'seaside','7':'city','8':'car'}:{}):u.mcq_answers;let ids=Object.keys(key);let result=document.getElementById('score-'+part);if(!ids.length){result.innerHTML='<div class="note">Dạng bài này cần đối chiếu đáp án sách (bấm “Xem đáp án sách”).</div>';return}
 let got=0,correct=0;for(const id of ids){let inpt=document.querySelector(`[data-answer="${u.id}.${part}.${id}"]`);if(!inpt)continue;let value=inpt.value.trim().toLowerCase().replace(/[.,]/g,'');if(!value)continue;got++;let good=value===String(key[id]).trim().toLowerCase();if(good)correct++;inpt.classList.toggle('good',good);inpt.classList.toggle('bad',!good)}result.innerHTML=`<div class="result">Đã chấm ${got}/${ids.length} câu có đáp án tự động · đúng ${correct}/${got||0}. ${got<ids.length?'Hãy điền hết rồi kiểm tra lại.':'Mở đáp án sách để đọc giải thích.'}</div>`}
async function recStart(){let status=document.getElementById('recordStatus');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Trình duyệt này không hỗ trợ ghi âm. Hãy dùng ứng dụng ghi âm trên điện thoại.';return}try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recordedParts=[];mediaRecorder=new MediaRecorder(recordStream);mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedParts.push(e.data)};mediaRecorder.onstop=()=>{let blob=new Blob(recordedParts,{type:mediaRecorder.mimeType||'audio/webm'});if(recordedUrl)URL.revokeObjectURL(recordedUrl);recordedUrl=URL.createObjectURL(blob);let out=document.getElementById('audioOutput');if(out)out.innerHTML=`<audio controls src="${recordedUrl}"></audio><a class="sourcelink" href="${recordedUrl}" download="RealEnglishLab_${getUnit().id}_speaking.${blob.type.includes('mp4')?'m4a':'webm'}">↓ Lưu bản ghi âm</a>`;recordStream?.getTracks().forEach(t=>t.stop());let st=document.getElementById('recordStatus');if(st){st.className='micro';st.textContent='Đã ghi xong. Nghe lại và sửa một điểm trước khi nói lại.'}};mediaRecorder.start();status.className='recstatus';status.textContent='Đang ghi âm...';document.getElementById('stopRec').disabled=false;document.getElementById('startRec').disabled=true}catch(e){status.textContent='Không thể truy cập micro: '+e.message}}
function recStop(){if(mediaRecorder&&mediaRecorder.state!=='inactive'){mediaRecorder.stop();document.getElementById('stopRec').disabled=true;document.getElementById('startRec').disabled=false}}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-flip]');if(!t)return;if(t.dataset.home!==undefined){state.view='home';render();scrollTo(0,0)}else if(t.dataset.unit){switchUnit(t.dataset.unit)}else if(t.dataset.level){state.view='library';state.level=t.dataset.level;render();scrollTo(0,0)}else if(t.dataset.tab){switchTab(t.dataset.tab)}else if(t.dataset.flip){state.flipped=!state.flipped;render()}else if(t.dataset.check){grade(t.dataset.check)}else if(t.dataset.key){let el=document.getElementById('key-'+t.dataset.key);if(el){el.classList.toggle('hidden');t.textContent=el.classList.contains('hidden')?'Xem đáp án sách':'Ẩn đáp án'}}else if(t.dataset.action){let u=getUnit();switch(t.dataset.action){case 'switchplayer':state.mediaBySource=!state.mediaBySource;render();break;case 'listen':switchTab('listening');break;case 'vocab':switchTab('vocab');break;case 'prevcard':state.flashIndex=(state.flashIndex-1+u.flashcards.length)%u.flashcards.length;state.flipped=false;render();break;case 'nextcard':state.flashIndex=(state.flashIndex+1)%u.flashcards.length;state.flipped=false;render();break;case 'toggleall':state.showAnswers.all=!state.showAnswers.all;render();break;case 'nextunit':{let ix=UNITS.indexOf(u);switchUnit(UNITS[Math.min(ix+1,UNITS.length-1)].id);break}case 'startrec':recStart();break;case 'stoprec':recStop();break}}});
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.note)dbSet('note.'+t.dataset.note,t.value);if(t.dataset.answer)dbSet('answer.'+t.dataset.answer,t.value)});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.done){dbSet('done.'+t.dataset.done,t.checked);nav()}if(t.dataset.known!==undefined){let u=getUnit();let known=dbGet('known.'+u.id,[]),n=+t.dataset.known;known=t.checked?[...new Set([...known,n])]:known.filter(x=>x!==n);dbSet('known.'+u.id,known);render()}});
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('searchInput').addEventListener('input',e=>{state.search=e.target.value.trim();if(state.search){state.view='library';state.level='Beginner'}render()});
window.addEventListener('hashchange',()=>{let id=location.hash.slice(1);if(UNITS.some(u=>u.id===id))switchUnit(id)});
if(UNITS.some(u=>u.id===location.hash.slice(1)))switchUnit(location.hash.slice(1));else render();
</script></body></html>
