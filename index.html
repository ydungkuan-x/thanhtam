, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat is the study? Who\nsupported it? Which countries?\nHow teens meet English outside\nschool (2 examples)\nTeachers’ worries + the\n“disconnect”\nInequity: who gets more\nEnglish?\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• This report describes a study about...\n• The researchers visited...\nExamples\n• For example, students in... / In the Netherlands...\nContrasting\n• On the other hand, teachers worry that...\n• However...\nFinishing\n• The main point is that...\n• This is true in Vietnam too, because...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour friend Phương sends you this message:\n“I watch English YouTube every day, so I don’t really need to study English at school\nanymore, right? 😎 I’m thinking of skipping my extra speaking class.”\nRound 1: Record a voice message to Phương (60-90 seconds). In your message:\n• agree with ONE good point about learning from videos\n• explain, using the report, why videos may not be enough\n• suggest ONE way to practise speaking or writing\n• finish in a friendly, encouraging way\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nAgreeing partly\n• You’re right that...\n• That’s a good point, but...\nUsing the report\n• I listened to a report that said...\n• Teachers think that...\nSuggesting\n• Why not...?\n• You could try...\nEncouraging\n• You’re already doing great!\n• Keep it up!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nexposure \n \n6 \nGreece \n \n2 \nfive / 5 \n \n7 \nNetherlands \n \n3 \nobserved \n \n8 \nteaching \n“teaching \nthem English” \n4 \n2025 \n \n9 \nrural areas \n \n5 \n22 / twenty-two \n \n10 speaking","answer_l2":"1 B    2 A    3 B    4 B    5 C    6 B","answer_v1":"1 i    2 j    3 e    4 c    5 h    6 a    7 b    8 f    9 g    10 d","answer_v2":"1 exposure    2 digital    3 obvious    4 transcend    5 inequity    6 motivation    7 self-\nconfidence    8 struggle    9 rural    10 got used to","answer_speaking":": Model summary \nThis report describes a study about how 15-year-olds learn English in Finland, \nGreece, Israel, the Netherlands and Portugal. The OECD supported it, and the \nfindings will help the 2025 PISA test, which will measure English in 22 countries. \nToday, teens get a lot of exposure to English through the internet, social media, \nmusic and digital games. For example, Greek students find it easier to search in \nEnglish, and half of Dutch students always use English online. On the other hand,\nteachers worry that this doesn’t really teach speaking. One teacher in Finland said \nstudents might think they don’t need English lessons. Researchers also noticed \ninequity: rich families can pay for travel and private lessons, and city children use \nEnglish more than rural children. Finally, students struggle most with writing and \nspeaking, partly because of low self-confidence. The main point is that English \ntranscends the classroom, but school still matters. \nSpeaking Exercise 2: Model voice message \nHey Phương! You’re right that YouTube is great, you hear real English every day, \nand it’s brilliant for listening. But I listened to a report about teenagers learning \nEnglish, and teachers said that kind of exposure doesn’t automatically improve \nspeaking. Most students struggle with speaking and writing because they only listen \nand read online. That’s exactly what your speaking class is for! Maybe don’t skip it. \nYou could also try recording a one-minute summary of a video you watched, it’s \nreally good practice and it builds self-confidence. You’re already doing great, so \nkeep it up!","flashcards":[{"word":"exposure","meaning":"the experience of seeing or hearing something often"},{"word":"digital","meaning":"connected with computers and the internet"},{"word":"obvious","meaning":"easy to see or understand"},{"word":"transcend","meaning":"to go beyond the normal limits of something"},{"word":"inequity","meaning":"an unfair difference between people or groups"},{"word":"motivation","meaning":"the reason or wish to do something"},{"word":"self-confidence","meaning":"belief in your own abilities"},{"word":"struggle","meaning":"to find something very difficult to do"},{"word":"rural","meaning":"connected with the countryside, not the city"},{"word":"get used to","meaning":"to become familiar with something after a while"}],"mcq_answers":{"1":"B","2":"A","3":"B","4":"B","5":"C","6":"B"},"media_url":"https://drive.google.com/file/d/1HiwZj48geui9QVnki1cchvbyfgVYOJJ5/view","media_preview":"https://drive.google.com/file/d/1HiwZj48geui9QVnki1cchvbyfgVYOJJ5/preview","media_type":"audio","id":"i5"},{"level":"Intermediate","index":6,"title":"Languages","audio_title":"Study of Polyglots Shows How Brain Deals with Language","source_url":"https://learningenglish.voanews.com/a/7526249.html","watch":"","page":137,"page_end":143,"before":"1. How many languages do you speak? Which one is easiest for you to understand?\n2. Do you know anyone who speaks three or more languages?\n3. Guess: when a person hears their first language, does the brain work harder or\nless hard?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. Most people around the world speak one or ______________ languages.\n2. People who can speak three or more languages are called ______________.\n3. The scientists studied the brain activity of ______________ polyglots.\n4. Some of the people in the study spoke as many as ______________ languages.\n5. The method used, fMRI, measures changes in ______________ in different parts of\nthe brain.\n6. When the polyglots heard a language they knew, activity increased in the\n______________.\n7. When people heard their native language, the brain response was on average about\n______________ lower.\n8. The people in the study were between 19 and ______________ years old.\n9. They listened to recordings in ______________ languages.\n10. Half of them heard stories from Alice in Wonderland, and the other half heard stories\nfrom the ______________.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. Why are polyglots useful for this research?\nA They learn languages faster than children.\nB They help scientists understand how the brain deals with language.\nC They can explain grammar rules clearly.\n2. What happened when the polyglots heard a language they did not know?\nA There was less activity in the language area.\nB There was no activity anywhere in the brain.\nC There was more activity than for their native language.\n3. What “exception” surprised the researchers?\nA Some polyglots could not understand any of the recordings.\nB The native language produced a smaller response than other known languages.\nC Men and women showed very different results.\n4. How does Olessia Jouravlev explain the exception?\nA People get bored by their native language.\nB The brain processes the native language more efficiently.\nC The recordings in the native language were too short.\n5. What did each person hear in the experiment?\nA only languages they spoke well\nB their native language, three languages they knew, and four they did not know\nC eight languages they had never heard before\n6. According to Evelina Fedorenko, what can scientists learn from “experts” like\npolyglots?\nA a lot about how language works in the brain\nB how to cure language difficulties\nC which language is the most difficult","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. polyglot\na. connected with language\n2. monitor\nb. a person who takes part in an activity or study\n3. native language\nc. a reaction to something\n4. exception\nd. the first language you learn as a child\n5. efficient\ne. speech or music that has been saved so you can\nplay it again\nWord / phrase\nMeaning\n6. participant\nf. a person who can speak several languages\n7. linguistic\ng. to watch or check something carefully over a\nperiod of time\n8. response\nh. usually; when you look at the typical amount\n9. on average\ni. something that does not follow the usual pattern\n10. recording\nj. working well without wasting time or energy","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. My aunt is a real ______________, she speaks Vietnamese, English, French and\nJapanese.\n2. Doctors will ______________ his heart for 24 hours.\n3. Although she lives in Canada, Vietnamese is still her ______________.\n4. Everyone in my class likes maths, with one ______________: me!\n5. Taking the metro to school is more ______________ than going by car.\n6. Each ______________ in the speaking contest has three minutes.\n7. Children develop their ______________ skills very quickly before the age of five.\n8. I sent her a message, but I haven’t had a ______________ yet.\n9. ______________, I spend about an hour a day on English homework.\n10. The teacher played a ______________ of a real conversation at a train station.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat was the study? Who took\npart? How was it done?\nMain finding for known and\nunknown languages\nThe surprising exception + why\nDetails of the experiment (age,\nlanguages, stories)\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• This report is about a study of...\n• Scientists used... to...\nResults\n• They found that when......\n• Surprisingly...\nExplaining\n• One scientist explains that...\n• In other words...\nFinishing\n• The study shows that...\n• I found it interesting because...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour younger sister Mai sends you this message:\n“My English teacher wants us to learn a third language next year. I already find\nEnglish hard! Isn’t it bad for my brain to learn so many languages? 😟”\nRound 1: Record a voice message to Mai (60-90 seconds). In your message:\n• show you understand her worry\n• tell her ONE interesting fact from the report about polyglots\n• explain why learning more languages is not bad for the brain\n• give ONE tip for learning a new language, and encourage her\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nUnderstanding\n• I know English feels hard right now.\n• It’s normal to feel worried.\nSharing a fact\n• I listened to a report about...\n• Scientists found that...\nReassuring\n• Don’t worry...\n• Your brain can definitely handle...\nEncouraging\n• Try to... every day.\n• You can do it!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \ntwo / 2 \n \n6 \ncerebral cortex \n \n2 \npolyglots \n \n7 \n25 percent / 25% \n \n3 \n34 / thirty-four \n \n8 \n71 \n \n4 \n54 / fifty-four \n \n9 \neight / 8 \n \n5 \nblood flow \n \n10 Bible","answer_l2":"1 B    2 A    3 B    4 B    5 B    6 A","answer_v1":"1 f    2 g    3 d    4 i    5 j    6 b    7 a    8 c    9 h    10 e","answer_v2":"1 polyglot    2 monitor    3 native language    4 exception    5 efficient    6 participant    7 \nlinguistic    8 response    9 On average    10 recording","answer_speaking":": Model summary \nThis report is about a study of polyglots, people who speak three or more languages. \nScientists monitored the brain activity of 34 polyglots, who spoke between five and \n54 languages, using fMRI, which measures blood flow in the brain. Each participant \nlistened to recordings in eight languages. The scientists found that when they heard a \nlanguage they knew, activity in the language area of the brain went up, but it was \nlower for languages they didn’t know. Surprisingly, there was an exception: their \nnative language produced a weaker response, about 25 percent lower on average. \nOne scientist explains that the brain is more efficient with the native language, so it \ndoesn’t need to work as hard. The study shows that we can learn a lot about \nlinguistic processes by studying language experts, not only people with language \ndifficulties. \nSpeaking Exercise 2: Model voice message \nHi Mai! I know English feels hard right now, and it’s totally normal to feel worried. \nBut guess what? I listened to a report about polyglots, some of them speak more than \nfifty languages! Scientists looked at their brains, and nothing bad happened. In fact, \nthe brain got really efficient with the languages they knew well. So learning another \nlanguage won’t hurt your brain, it’s more like exercise for it. My tip: learn ten new\nwords every day and use them in a sentence, or listen to a short song in the new \nlanguage. Little by little, it gets easier. You can do it, and I’ll help you!","flashcards":[{"word":"polyglot","meaning":"a person who can speak several languages"},{"word":"monitor","meaning":"to watch or check something carefully over a period of time"},{"word":"native language","meaning":"the first language you learn as a child"},{"word":"exception","meaning":"something that does not follow the usual pattern"},{"word":"efficient","meaning":"working well without wasting time or energy"},{"word":"participant","meaning":"a person who takes part in an activity or study"},{"word":"linguistic","meaning":"connected with language"},{"word":"response","meaning":"a reaction to something"},{"word":"on average","meaning":"usually; when you look at the typical amount"},{"word":"recording","meaning":"speech or music that has been saved so you can play it again"}],"mcq_answers":{"1":"B","2":"A","3":"B","4":"B","5":"B","6":"A"},"media_url":"https://drive.google.com/file/d/1hUt0HM5Yigbhrxv_pwokqiFTDOsXlCsd/view","media_preview":"https://drive.google.com/file/d/1hUt0HM5Yigbhrxv_pwokqiFTDOsXlCsd/preview","media_type":"audio","id":"i6"},{"level":"Intermediate","index":7,"title":"Food & Diet","audio_title":"Good Breakfast Equals Good Grades","source_url":"https://learningenglish.voanews.com/a/good-breakfast-equals-good-grades/4562118.html","watch":"","page":144,"page_end":150,"before":"1. What did you eat for breakfast this morning? Do you ever skip breakfast?\n2. How do you feel in class when you haven’t eaten?\n3. Guess: what makes a “healthy” breakfast?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. The 2015 study came from ______________.\n2. The researchers studied about ______________ children aged 9 to 11.\n3. Children who ate a healthy breakfast were ______________ as likely to do better\nthan average.\n4. Unhealthy foods, such as chips or ______________, did not help students get better\ngrades.\n5. Students who ate breakfast at school had higher scores in ______________ tests.\n6. Between 20 and 30 percent of ______________ students in the US skip breakfast.\n7. In a Canadian study, 39 percent of students ate breakfast fewer than\n______________ days in a usual school week.\n8. Health experts say the best breakfast is a mix of complex carbohydrates, protein and\n______________.\n9. The brain needs ______________, a simple sugar, for energy.\n10. A good breakfast should have about 350 to 500 ______________.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. What is the main idea of the report?\nA Breakfast is only important for young children.\nB Eating a healthy breakfast can help students do better at school.\nC Students should eat breakfast at home, not at school.\n2. Why does the report mention busy back-to-school mornings?\nA Because rushed mornings are one reason people skip breakfast.\nB Because schools start too early.\nC Because students are late for class.\n3. What does the report say about protein?\nA It gives the brain sugar very quickly.\nB It helps you feel full for longer.\nC It makes you feel tired.\n4. Why is oatmeal given as an example?\nA It is very cheap.\nB It is a good example of a healthy breakfast food.\nC Most children love it.\n5. What can happen if you eat too much in the morning?\nA You may feel tired and unable to think clearly.\nB You will not be hungry until dinner.\nC You will remember more in class.\n6. What did the University of Toronto study find?\nA Adults do not need breakfast.\nB A breakfast rich in protein and complex carbohydrates improved memory.\nC Coffee is better than food in the morning.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. skip\na. done too quickly because you do not have enough\ntime\n2. hurried\nb. the part of plants that helps food move through\nyour body\n3. perform above average\nc. containing a lot of something\n4. carbohydrate\nd. to do better than most people\n5. protein\ne. to have a clear, focused mind\n6. glucose\nf. a planned series of activities to achieve a goal\n7. fiber\ng. to not do or have something you usually do, e.g. a\nmeal\nWord / phrase\nMeaning\n8. rich in\nh. a substance in bread, rice and potatoes that gives\nyou energy\n9. think clearly\ni. a substance in meat, eggs and beans that the body\nneeds to grow\n10. campaign\nj. a simple sugar that gives the body and brain energy","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. I was late, so I had to ______________ breakfast again.\n2. We had a ______________ lunch because the bus was leaving in ten minutes.\n3. Students who read every day often ______________ in language tests.\n4. Rice and noodles are full of ______________.\n5. Eggs, tofu and fish are good sources of ______________.\n6. During long exams, your brain uses a lot of ______________.\n7. Brown rice has more ______________ than white rice.\n8. Oranges are ______________ vitamin C.\n9. I can’t ______________ when I’m hungry or tired.\n10. The school started a ______________ to get students to drink more water.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nMain message + why people\nskip breakfast\nTwo studies and their results\n(with numbers)\nHow many children skip\nbreakfast\nWhat makes a healthy breakfast\n+ why\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• This report explains why...\n• Many people skip breakfast because...\nReporting research\n• A study from... found that...\n• Another study showed...\nAdvice\n• Experts suggest that...\n• It’s also important not to...\nFinishing\n• So, the main message is...\n• After listening, I want to...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour friend Khang sends you this message at 6:45 a.m.:\n“Big maths test today 😬 No time for breakfast, I’ll just grab an energy drink and\nsome sweets on the way. That’s fine, right?”\nRound 1: Record a voice message to Khang (60-90 seconds). In your message:\n• wish him luck\n• explain why sweets alone are not a good idea before a test (use the report)\n• suggest TWO quick, healthy breakfast ideas\n• finish in a friendly way\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nWishing luck\n• Good luck today!\n• You’ve got this!\nExplaining\n• The thing is...\n• I heard that..., so...\nSuggesting\n• Why don’t you grab...?\n• Even just... is better than...\nFinishing\n• Let me know how it goes!\n• Text me after the test.","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nCardiff University \nin Wales \n6 \nhigh-school \nA hyphenated \nword counts \nas one word. \n2 \n5,000 / 5000 \n \n7 \nthree / 3 \n \n3 \ntwice \n“twice as \nlikely” \n8 \nfat \n \n4 \ndonuts / doughnuts \n \n9 \nglucose \n \n5 \nmath / maths \n \n10 calories","answer_l2":"1 B    2 A    3 B    4 B    5 A    6 B","answer_v1":"1 g    2 a    3 d    4 h    5 i    6 j    7 b    8 c    9 e    10 f","answer_v2":"1 skip    2 hurried    3 perform above average    4 carbohydrates    5 protein    6 glucose    \n7 fiber    8 rich in    9 think clearly    10 campaign","answer_speaking":": Model summary \nThis report explains why breakfast is important for students. Mornings are often \nhurried, so many people skip breakfast. A 2015 study from Cardiff University \nlooked at about 5,000 children and found that those who ate a healthy breakfast were \ntwice as likely to perform above average at school; unhealthy foods like chips \ndidn’t help. In the US, a campaign called No Kid Hungry found that school breakfast \nimproved math scores. Many children still skip breakfast, especially high-school \nstudents. Experts suggest a mix of complex carbohydrates, protein and fat. \nComplex carbohydrates release glucose slowly, so the brain gets energy for longer, \nand protein keeps you full. Oatmeal, which has lots of fiber, is a good example. It’s \nalso important not to eat too much, or you can’t think clearly, about 350 to 500 \ncalories is enough. So, the main message is that a breakfast rich in protein and good \ncarbohydrates helps your memory and your grades. \nSpeaking Exercise 2: Model voice message \nMorning Khang! Good luck today, you’ve got this! But please don’t just have sweets \nand an energy drink. I heard a report that said sugar gives you energy really fast, but \nthen you feel tired, and you can’t think clearly, not great for a maths test! What your \nbrain needs is protein and good carbohydrates, which give energy slowly. Why \ndon’t you grab a banana and a carton of milk on the way? Or even just a bánh mì \nwith egg is much better than sweets. It only takes two minutes. Text me after the test \nand tell me how it went!","flashcards":[{"word":"skip","meaning":"to not do or have something you usually do, e.g. a meal"},{"word":"hurried","meaning":"done too quickly because you do not have enough time"},{"word":"perform above average","meaning":"to do better than most people"},{"word":"carbohydrate","meaning":"a substance in bread, rice and potatoes that gives you energy"},{"word":"protein","meaning":"a substance in meat, eggs and beans that the body needs to grow"},{"word":"glucose","meaning":"a simple sugar that gives the body and brain energy"},{"word":"fiber","meaning":"the part of plants that helps food move through your body"},{"word":"rich in","meaning":"containing a lot of something"},{"word":"think clearly","meaning":"to have a clear, focused mind"},{"word":"campaign","meaning":"a planned series of activities to achieve a goal"}],"mcq_answers":{"1":"B","2":"A","3":"B","4":"B","5":"A","6":"B"},"media_url":"https://drive.google.com/file/d/1Rykk_R8EZt6SBzF2YgImlc6EBozwLltd/view","media_preview":"https://drive.google.com/file/d/1Rykk_R8EZt6SBzF2YgImlc6EBozwLltd/preview","media_type":"audio","id":"i7"},{"level":"Intermediate","index":8,"title":"Arts & Museums","audio_title":"A New Museum in Washington for Language Lovers","source_url":"https://learningenglish.voanews.com/a/a-new-museum-in-washington-for-language-lovers/5896434.html","watch":"","page":151,"page_end":157,"before":"1. When did you last visit a museum? What did you see?\n2. What makes a museum boring or exciting for teenagers?\n3. Imagine a museum all about words. What could visitors do there?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. The new museum is called Planet ______________.\n2. At the entrance, visitors hear voices from an art piece called the Speaking\n______________.\n3. The piece plays recorded speech in ______________ of languages.\n4. Almost every exhibit is ______________, and most ask visitors to speak aloud.\n5. One room shows babies saying their first ______________.\n6. The Wall of Words is ______________ tall and shows about one thousand words.\n7. The team spent two years creating the exhibit, starting from a list of\n______________ English words.\n8. In the language room, native speakers present 28 languages and two\n______________.\n9. The museum is in a historic building called the Franklin ______________.\n10. The museum’s main audience is ______________, but adults enjoy it too.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. What makes Planet Word different from many museums?\nA It only shows old books.\nB Visitors take part in activities, often by speaking.\nC It is only open to language teachers.\n2. Why does Ann Friedman want hands-on activities?\nA Because abstract ideas are easier to understand and remember that way.\nB Because they are cheaper than paintings.\nC Because visitors don’t like reading.\n3. What does the Japanese presenter explain?\nA how to write Japanese characters\nB how important politeness is in Japanese culture\nC why Japanese is hard to learn\n4. What is surprising about how the Quechua people talk about time?\nA They have no word for time.\nB They see the future as behind them and the past ahead.\nC They only talk about the present.\n5. Which of these activities is NOT mentioned?\nA singing karaoke and learning about song writing\nB recording a famous speech\nC writing a poem with a famous poet\n6. What does Ann Friedman hope visitors will take away?\nA a love of museums in general\nB a better understanding of everyday words and the world’s languages\nC the ability to speak a new language","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. interactive\na. to make a list smaller by removing some things\n2. immersive\nb. to have a strong effect on how something develops\n3. abstract\nc. making you feel completely surrounded by and\ninvolved in something\n4. exhibit\nd. showing good manners and respect\n5. participate\ne. based on general ideas rather than real objects\n6. polite\nf. a strong wish to know or learn something\n7. curiosity\ng. kept or located in a particular building\n8. narrow down\nh. an object or display shown in a museum\n9. housed in\ni. to take part in an activity\nWord / phrase\nMeaning\n10. shape\nj. allowing visitors to do things and get a response","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. The science museum has an ______________ screen where you can design your own\nrobot.\n2. The virtual reality show was so ______________ that I forgot where I was.\n3. “Freedom” is an ______________ idea, you can’t touch it or see it.\n4. My favourite ______________ was a 2,000-year-old drum.\n5. All students are welcome to ______________ in the English club.\n6. It’s ______________ to say “thank you” when someone helps you.\n7. Little children are full of ______________, they ask “why?” all the time!\n8. We had ten ideas for the class trip, but after a long discussion we ______________\nthe list to three.\n9. The history museum is ______________ an old French building.\n10. The books we read as children can ______________ the way we see the world.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat is Planet Word? Where is\nit?\nThe first thing visitors see + the\nmuseum’s idea\nThree rooms or activities\nInteresting facts (building,\nmoney, audience)\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• This report is about a new museum called...\n• It’s located in...\nDescribing\n• When you walk in, you...\n• In one room, visitors can...\n• Another exhibit...\nOpinions\n• The founder believes that...\nFinishing\n• I’d love to visit because...\n• Overall, it sounds...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour English teacher posts this in the class group:\n“Next month we have one free day for a class trip. Send me a voice note: which\nmuseum or place in our city should we visit, and why would it be good for learning\nEnglish?”\nRound 1: Record a voice note to your teacher (60-90 seconds). In your note:\n• suggest ONE museum or place in your city\n• describe TWO things students could see or do there\n• explain how it could help with English, using an idea from Planet Word\n• end politely\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nSuggesting\n• I’d like to suggest...\n• How about visiting...?\nDescribing\n• There’s a room where...\n• Visitors can...\nLinking to English\n• We could practise English by...\n• Like the museum in the report...\nEnding politely\n• Thank you for asking us!\n• I hope you like the idea.","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \nWord \n \n6 \n22 feet / 22-foot \n \n2 \nWillow \n \n7 \n28 / twenty-eight \n \n3 \nhundreds \n“hundreds of \nlanguages” \n8 \nsign languages \n \n4 \ninteractive \n \n9 \nSchool \n \n5 \nwords \n \n10 teenagers","answer_l2":"1 B    2 A    3 B    4 B    5 C    6 B","answer_v1":"1 j    2 c    3 e    4 h    5 i    6 d    7 f    8 a    9 g    10 b","answer_v2":"1 interactive    2 immersive    3 abstract    4 exhibit    5 participate    6 polite    7 curiosity    \n8 narrowed down    9 housed in    10 shape","answer_speaking":": Model summary \nThis report is about Planet Word, a new museum about words and language in \nWashington, D.C. When you walk in, you hear the Speaking Willow, an art piece \nwith voices in hundreds of languages. The museum is immersive and almost every \nexhibit is interactive; most ask visitors to speak aloud. The founder, Ann Friedman, \nbelieves abstract ideas are easier to understand when people participate. In one \nroom you can see babies saying their first words, and another shows where English\nwords come from, the team narrowed down a list to 28 words. In the language room, \nnative speakers explain how language shapes culture; for example, a Japanese \nspeaker talks about being polite. You can also sing karaoke or record a famous \nspeech. The museum is housed in an old school building, and Friedman hopes \nvisitors leave with more curiosity about everyday words and the world’s languages. \nSpeaking Exercise 2: Model voice message \nHello teacher! Thank you for asking us. I’d like to suggest the Museum of Ethnology. \nIt has houses from different ethnic groups, and there are lots of displays about \ntraditional clothes, music and festivals. I think it could really help our English, \nbecause the signs are in English, and we could work in groups and give each other \nshort tours in English, like a guide. In the report I heard about a language museum in \nAmerica, and the idea was that you learn more when you participate, not just look. \nWe could also interview foreign visitors politely about what they like there. I hope \nyou like the idea!","flashcards":[{"word":"interactive","meaning":"allowing visitors to do things and get a response"},{"word":"immersive","meaning":"making you feel completely surrounded by and involved in something"},{"word":"abstract","meaning":"based on general ideas rather than real objects"},{"word":"exhibit","meaning":"an object or display shown in a museum"},{"word":"participate","meaning":"to take part in an activity"},{"word":"polite","meaning":"showing good manners and respect"},{"word":"curiosity","meaning":"a strong wish to know or learn something"},{"word":"narrow down","meaning":"to make a list smaller by removing some things"},{"word":"housed in","meaning":"kept or located in a particular building"},{"word":"shape","meaning":"to have a strong effect on how something develops"}],"mcq_answers":{"1":"B","2":"A","3":"B","4":"B","5":"C","6":"B"},"media_url":"https://drive.google.com/file/d/11x2xPUCRsHwgyavTBeAvDL-oSsPxd1hW/view","media_preview":"https://drive.google.com/file/d/11x2xPUCRsHwgyavTBeAvDL-oSsPxd1hW/preview","media_type":"audio","id":"i8"},{"level":"Intermediate","index":9,"title":"Exercise","audio_title":"What Are the Good Effects of Walking?","source_url":"https://learningenglish.voanews.com/a/what-are-the-good-effects-of-walking-/7865636.html","watch":"","page":158,"page_end":164,"before":"1. How many steps do you think you walk on a normal school day?\n2. Do you prefer walking, running, sports or the gym? Why?\n3. Have you heard that people should walk 10,000 steps a day? Do you think it’s\ntrue?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. Dr Sarah Eby says that for walking you don’t need equipment or a ______________.\n2. Adults should get at least two and a half hours of ______________-intensity physical\nactivity every week.\n3. Walking is a low-______________ exercise that puts less pressure on the joints.\n4. James Blankenship joined a walking club at the Louisville ______________ after a\nheart attack.\n5. One expert says walking does not build enough muscle strength and\n______________.\n6. The goal of 10,000 steps a day comes from a 1960s marketing campaign in\n______________.\n7. The average American walks about 3,000 to ______________ steps a day.\n8. You can walk 30 minutes a day, or ______________ three times a day, five days a\nweek.\n9. If you can talk but not ______________, the exercise is moderate intensity.\n10. City Girls Who Walk started with a post on ______________.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. According to the experts, walking is\nA an easy first step toward a healthy life.\nB the only exercise most people need.\nC too slow to improve your health.\n2. Which benefit of walking is NOT mentioned?\nA better sleep\nB healthier bones\nC better eyesight\n3. Why does Anita Gust say walking is “not enough”?\nA It is boring for most people.\nB It does not include resistance training to build muscle.\nC It is bad for older people’s joints.\n4. What do experts say about the 10,000-step goal?\nA It is based on new scientific research.\nB It is only a guideline.\nC Everyone must reach it every day.\n5. How can walkers make the exercise harder?\nA by walking only at night\nB by walking faster or walking up hills\nC by carrying heavy bags\n6. Why are walking clubs mentioned at the end?\nA to show that walking is expensive\nB to show that walking with others helps people keep going\nC to advertise a zoo","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. vast\na. the ability to be physically active for a long time\n2. low-impact\nb. to become healthy again after an illness or injury\n3. endurance\nc. to stop something from happening\n4. flexibility\nd. not putting much force or pressure on the body\n5. treadmill\ne. not too much and not too little; medium\n6. guideline\nf. an exercise machine with a moving belt that you\nwalk or run on\nWord / phrase\nMeaning\n7. moderate\ng. a person who has stopped working because of their\nage\n8. prevent\nh. extremely large\n9. recover\ni. advice about how to do something, not a strict rule\n10. retiree\nj. the ability to bend and move your body easily","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. The benefits of regular exercise are ______________, for your body and your mind.\n2. Swimming is a ______________ sport, so it’s good for people with knee problems.\n3. Running a marathon needs a lot of ______________.\n4. Yoga can improve your ______________.\n5. When it rains, my dad walks on the ______________ at home.\n6. The 10,000-step goal is just a ______________, not a law.\n7. Doctors say a ______________ amount of exercise every day is enough for most\npeople.\n8. Washing your hands can help ______________ many illnesses.\n9. It took my grandmother three months to ______________ after her operation.\n10. My grandfather is a ______________ who walks in the park every morning.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhy experts like walking (no\nequipment, benefits)\nHow much exercise adults need\n+ how to split it\nExpert who says walking is not\nenough + why\nThe 10,000-step goal + walking\nclubs\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• According to the report, walking is...\n• Doctors say...\nBenefits\n• It can help you...\n• It’s also good for...\nContrasting\n• However, one expert believes...\n• That’s why it’s a good idea to also...\nFinishing\n• The key message is...\n• I’m going to try to...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour mum sends you this message:\n“The doctor says Dad needs more exercise, but he says he’s too busy and the gym is\ntoo expensive. Can you send him a voice message? He listens to you more than me!\n😅”\nRound 1: Record a voice message to your dad (60-90 seconds). In your message:\n• show you care about his health\n• tell him TWO benefits of walking from the report\n• suggest a simple, realistic plan (when, how long, with whom)\n• finish in a warm, encouraging way\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nCaring\n• Dad, I just want you to be healthy.\n• I know you’re really busy, but...\nBenefits\n• I heard that walking can...\n• And you don’t even need...\nPlan\n• How about we walk... every...?\n• You could start with just... minutes.\nEncouraging\n• I’ll come with you!\n• Let’s try it this week.","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \ngym membership \n \n6 \nJapan \n \n2 \nmoderate \n“moderate-\nintensity” \n7 \n4,000 / 4000 \n \n3 \nimpact \n \n8 \n10 minutes / ten \nminutes \n \n4 \nZoo \n \n9 \nsing\nQ \nAnswer \nNote \nQ \nAnswer \nNote \n5 \nendurance \n \n10 TikTok","answer_l2":"1 A    2 C    3 B    4 B    5 B    6 B","answer_v1":"1 h    2 d    3 a    4 j    5 f    6 i    7 e    8 c    9 b    10 g","answer_v2":"1 vast    2 low-impact    3 endurance    4 flexibility    5 treadmill    6 guideline    7 \nmoderate    8 prevent    9 recover    10 retiree","answer_speaking":": Model summary \nAccording to the report, walking is an easy way to improve your physical and mental \nhealth. Doctors say you don’t need equipment or a gym, and the benefits are vast: \nexercise helps prevent heart disease, high blood pressure and depression, and \nwalking helps you sleep better and lose weight. It’s also low-impact, so it’s kind to \nyour joints. One man used a walking club to recover after a heart attack. Adults \nshould do two and a half hours of moderate exercise a week, for example, 30 \nminutes a day, five days a week. However, one expert believes walking is not \nenough, because it doesn’t build muscle strength or endurance, so it’s a good idea to \nadd other exercise twice a week. The famous 10,000-step goal is just a guideline \nfrom an old Japanese marketing campaign. Finally, walking clubs, with friends or \neven dogs, help people keep going, many members are retirees. \nSpeaking Exercise 2: Model voice message \nHi Dad! I just want you to be healthy, so please listen to this, okay? I know you’re \nreally busy, and you don’t want to pay for a gym. But I heard a report that said\nwalking is one of the best things you can do, it helps your heart and your sleep, and \nyou don’t need any equipment. It’s low-impact, so it won’t hurt your knees. How \nabout this: we walk around the lake after dinner, just twenty minutes, four evenings a \nweek? You could also take the stairs at work. Doctors say a moderate amount is \nenough to start. I’ll come with you, let’s try it this week!","flashcards":[{"word":"vast","meaning":"extremely large"},{"word":"low-impact","meaning":"not putting much force or pressure on the body"},{"word":"endurance","meaning":"the ability to be physically active for a long time"},{"word":"flexibility","meaning":"the ability to bend and move your body easily"},{"word":"treadmill","meaning":"an exercise machine with a moving belt that you walk or run on"},{"word":"guideline","meaning":"advice about how to do something, not a strict rule"},{"word":"moderate","meaning":"not too much and not too little; medium"},{"word":"prevent","meaning":"to stop something from happening"},{"word":"recover","meaning":"to become healthy again after an illness or injury"},{"word":"retiree","meaning":"a person who has stopped working because of their age"}],"mcq_answers":{"1":"A","2":"C","3":"B","4":"B","5":"B","6":"B"},"media_url":"https://drive.google.com/file/d/1TEqPICb37OAYdBzFFXJPsJp9sniIrrBd/view","media_preview":"https://drive.google.com/file/d/1TEqPICb37OAYdBzFFXJPsJp9sniIrrBd/preview","media_type":"audio","id":"i9"},{"level":"Intermediate","index":10,"title":"Transport","audio_title":"Electric Bike Ban in New York Hurts Food Delivery Workers","source_url":"https://learningenglish.voanews.com/a/electric-bike-ban-in-new-york-hurting-food-delivery-workers/4256388.html","watch":"","page":165,"page_end":171,"before":"1. How do people deliver food in your city? What vehicles do they use?\n2. Have you ever tried an electric bike or scooter? What was it like?\n3. Should e-bikes be allowed on busy streets? Why / why not?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. In New York City it is legal to own an e-bike, but not legal to ______________ one.\n2. Many of the delivery workers who use e-bikes are ______________.\n3. E-bikes have foot-powered ______________ like other bicycles.\n4. Most e-bikes can reach a speed of about ______________.\n5. Aimin Liu delivers up to ______________ food orders a day.\n6. He cannot use a regular bike because he has ______________.\n7. E-bike riders can be fined ______________ for breaking the ban.\n8. Workers say their ______________ depend on how fast and good their service is.\n9. A union spokesperson says one violation could cost a worker more than\n______________.\n10. Do Lee says the ban unfairly targets low-paid workers from the Latino and\n______________ communities.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. What reason do city officials give for the ban?\nA E-bikes are too expensive.\nB People ride them dangerously on streets and sidewalks.\nC E-bikes make too much noise.\n2. Why is the ban especially hard for Aimin Liu?\nA He doesn’t know how to ride a normal bike.\nB His health makes a regular bicycle very difficult.\nC He lives far from Manhattan.\n3. What can the police do to riders who break the ban?\nA send them to prison\nB fine them and take away their bikes\nC stop them from working in restaurants\n4. Why can’t many workers afford to take a day off?\nA They depend on every day’s pay and tips.\nB Their bosses don’t allow holidays.\nC They work only at weekends.\n5. How do many New Yorkers feel about e-bike riders?\nA They think the riders are always careful.\nB Many blame them for not being safe.\nC They want more e-bikes in the city.\n6. What is Bill McGowan’s opinion?\nA E-bikes should be banned everywhere.\nB He understands the workers but wants them to be more careful around\npedestrians.\nC Delivery workers should use cars instead.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. delivery\na. to break a rule or law\n2. pedal\nb. extra money you give for good service\n3. arthritis\nc. having both positive and negative feelings about\nsomething\n4. tip\nd. a disease that makes your joints painful and\nswollen\n5. pedestrian\ne. to make someone pay money as a punishment\n6. fine\nf. to take something away using official power\n7. seize\ng. a person who is walking in a street\nWord / phrase\nMeaning\n8. violate\nh. bringing goods or food to a person’s home or\noffice\n9. sympathetic\ni. the part of a bicycle you push with your foot\n10. mixed feelings\nj. showing that you understand someone’s problems\nand care","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. The pizza ______________ took only twenty minutes.\n2. My bike chain came off, so the ______________ wouldn’t turn.\n3. My grandmother’s ______________ makes it hard for her to open jars.\n4. We left the waiter a ______________ because the service was excellent.\n5. Drivers must stop at crossings to let ______________ cross.\n6. He was ______________ for parking his motorbike on the pavement.\n7. The police ______________ the illegal goods at the market.\n8. If you ______________ the school rules, you may have to stay after class.\n9. My teacher was very ______________ when I told her my grandfather was ill.\n10. I have ______________ about moving to a new city, it’s exciting but scary.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat is the rule in New York?\nWhy did the city make it?\nWho is hurt by the ban? (Aimin\nLiu’s story)\nPunishments + cost for workers\nDifferent opinions (workers, Do\nLee, other New Yorkers)\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• This report is about a rule in New York that...\n• Officials say...\nExample\n• For example, one worker called...\n• He says that...\nTwo sides\n• On one hand...\n• On the other hand...\nFinishing\n• In my opinion, the city should...\n• It’s a difficult situation because...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour neighbourhood Zalo group. A neighbour writes:\n“Delivery motorbikes drive on our small street way too fast every evening. Some of\nus want to ban all delivery riders from the street. What does everyone think?”\nRound 1: Record a voice message for the group (60-90 seconds). In your message:\n• say that you understand the safety worry\n• explain why a total ban could hurt delivery workers (use ideas from the report)\n• suggest ONE fairer solution\n• end politely and invite replies\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nAgreeing partly\n• I agree that safety is really important.\n• I understand why people are worried.\nAnother view\n• But we should also think about...\n• Many riders depend on...\nSolutions\n• Maybe we could...\n• What about putting up...?\nEnding\n• What does everyone think?\n• Thanks for listening!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \noperate \n“operate” = \nride / use \n6 \narthritis \n \n2 \nimmigrants \n \n7 \n$500 / 500 dollars \n \n3 \npedals \n \n8 \ntips \n \n4 \n32 km/h / 32 \nkilometres per hour \n \n9 \n$1,000 / 1,000 \ndollars \n \n5 \n40 / forty \n \n10 Asian","answer_l2":"1 B    2 B    3 B    4 A    5 B    6 B","answer_v1":"1 h    2 i    3 d    4 b    5 g    6 e    7 f    8 a    9 j    10 c","answer_v2":"1 delivery    2 pedals    3 arthritis    4 tip    5 pedestrians    6 fined    7 seized    8 violate    \n9 sympathetic    10 mixed feelings","answer_speaking":": Model summary \nThis report is about a rule in New York City: people can own e-bikes, but they cannot \noperate them. Officials say riders go too fast on streets and sidewalks, which is \ndangerous for pedestrians. Riders can be fined 500 dollars, and the police can seize \ntheir bikes. The ban hurts delivery workers, many of them older immigrants who \ndepend on e-bikes to earn a living. For example, one worker, Aimin Liu, has \narthritis and can’t push the pedals of a normal bike for long, so without an e-bike he \ncould only do about half as many orders. Workers say their tips depend on speed, and \nif they violate the ban, they can lose more than a thousand dollars. On one hand, \nsome New Yorkers blame riders for unsafe driving. On the other hand, people like \nBill McGowan have mixed feelings: they are sympathetic to the workers but want \nthem to be more careful. \nSpeaking Exercise 2: Model voice message \nHi everyone! I agree that safety is really important, I’ve seen some riders go far too \nfast too. But I’m not sure a total ban is fair. I heard a report about New York, where \nthe city banned electric bikes, and lots of delivery workers lost money because they \ndepend on their bikes and on tips to earn a living. Many of them are just trying to \nsupport their families. Maybe we could put up a ‘Slow down, children’ sign at both \nends of the street, and ask the delivery apps to set a lower speed limit here. We could \nalso be sympathetic and talk to the riders politely. What does everyone think? \nThanks for listening!","flashcards":[{"word":"delivery","meaning":"bringing goods or food to a person’s home or office"},{"word":"pedal","meaning":"the part of a bicycle you push with your foot"},{"word":"arthritis","meaning":"a disease that makes your joints painful and swollen"},{"word":"tip","meaning":"extra money you give for good service"},{"word":"pedestrian","meaning":"a person who is walking in a street"},{"word":"fine","meaning":"to make someone pay money as a punishment"},{"word":"seize","meaning":"to take something away using official power"},{"word":"violate","meaning":"to break a rule or law"},{"word":"sympathetic","meaning":"showing that you understand someone’s problems and care"},{"word":"mixed feelings","meaning":"having both positive and negative feelings about something"}],"mcq_answers":{"1":"B","2":"B","3":"B","4":"A","5":"B","6":"B"},"media_url":"https://drive.google.com/file/d/1LEFjcY2z_lIeMNZE7aJ0llLbeeHEphnI/view","media_preview":"https://drive.google.com/file/d/1LEFjcY2z_lIeMNZE7aJ0llLbeeHEphnI/preview","media_type":"audio","id":"i10"},{"level":"Intermediate","index":11,"title":"Stress & Lifestyle","audio_title":"Deep Breathing Helps the Lungs","source_url":"https://learningenglish.voanews.com/a/deep-breathing-helps-the-lungs/5562324.html","watch":"","page":172,"page_end":178,"before":"1. What do you usually do when you feel stressed before a test?\n2. Notice your breathing right now. Is it fast or slow? From your chest or your\nstomach?\n3. Guess: how many breaths does a person take in one day, about 2,000, 20,000 or\n200,000?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. We take about ______________ breaths every day.\n2. James Hoyt is a ______________, a doctor who treats lung problems.\n3. The ______________ separates the chest from the abdominal cavity.\n4. When we breathe in, our lungs ______________.\n5. Harvard Medical School says deep breathing may slow the heartbeat and lower blood\n______________.\n6. Many people take shallow breaths from the ______________.\n7. Shallow breathing can cause shortness of breath and ______________.\n8. For the exercise, place one hand just below your ______________.\n9. Breathe in slowly through your ______________.\n10. Then breathe out slowly through your ______________.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. What is the report mainly about?\nA how to cure lung diseases\nB how deep breathing helps the body and how to practise it\nC why people should stop exercising\n2. What happens when the diaphragm relaxes?\nA Air comes into the lungs.\nB Air is pushed out of the lungs.\nC The heart beats faster.\n3. What is a sign of deep breathing?\nA Your shoulders go up.\nB Your lower belly rises.\nC You breathe very quickly.\n4. What can happen if we take shallow breaths for a long time?\nA Stale air can stay in the lungs.\nB Our lungs get bigger.\nC We sleep much better.\n5. According to the American Lung Association, repeating the exercise can\nA make you taller.\nB help remove stale air and raise oxygen levels.\nC replace all other exercise.\n6. Which piece of advice from Dr Hoyt is NOT mentioned?\nA avoid smoking\nB get help early for breathing problems\nC drink a lot of coffee","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. respiratory\na. to become less tight or less worried\n2. inhale\nb. not fresh or clean\n3. exhale\nc. difficulty getting enough air\n4. expand\nd. connected with breathing\n5. shallow\ne. to breathe out\n6. stale\nf. to become bigger\n7. relax\ng. to breathe in\n8. shortness of breath\nh. not deep\n9. blood pressure\ni. the gas in the air that we need to live\n10. oxygen\nj. the force of blood moving through your body","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. Smoking damages the ______________ system.\n2. ______________ slowly and count to four.\n3. Now ______________ and let all the air out.\n4. Metal ______________ when it gets hot.\n5. When I’m nervous, my breathing becomes fast and ______________.\n6. Open the window, the air in here is ______________.\n7. Listening to music helps me ______________ after school.\n8. My grandfather gets ______________ when he climbs the stairs.\n9. The nurse checked my ______________ before the check-up.\n10. Plants produce ______________ during the day.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat our breathing system does\n(+ one number)\nHow breathing in and out works\n(diaphragm, lungs)\nPlan\nYour keywords\nBenefits of deep breathing /\nproblems of shallow breathing\nThe breathing exercise (4 steps)\n+ Dr Hoyt’s advice\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• Most of us never think about...\n• This report explains...\nExplaining a process\n• When we breathe in... / When we breathe out...\nGiving instructions\n• First... Then... After that... Finally...\nFinishing\n• So, the main idea is that...\n• I’m going to try this before...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour classmate Trâm sends you this message the night before the speaking\nexam:\n“I’m SO nervous about tomorrow 😰 My heart is racing and I can’t calm down.\nWhat should I do??”\nRound 1: Record a voice message to Trâm (60-90 seconds). In your message:\n• calm her down and show you understand\n• teach her the breathing exercise from the report, step by step\n• explain why it helps\n• give ONE more tip and wish her luck\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nCalming\n• Hey, it’s okay, everyone feels nervous.\n• Take it easy.\nInstructions\n• First, sit down and...\n• Then breathe in slowly through...\n• Next...\nExplaining\n• It helps because...\n• Apparently, deep breathing can...\nWishing luck\n• You’re going to be great!\n• Good luck tomorrow!","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \n20,000 / 20000 \n \n6 \nchest \n“chest \nbreaths” \n2 \npulmonologist \na doctor for \nthe lungs \n7 \nanxiety \n \n3 \ndiaphragm \n \n8 \nribs \n \n4 \nexpand \n \n9 \nnose \n \n5 \npressure \n \n10 mouth","answer_l2":"1 B    2 B    3 B    4 A    5 B    6 C","answer_v1":"1 d    2 g    3 e    4 f    5 h    6 b    7 a    8 c    9 j    10 i","answer_v2":"1 respiratory    2 Inhale    3 exhale    4 expands    5 shallow    6 stale    7 relax    8 \nshortness of breath    9 blood pressure    10 oxygen","answer_speaking":": Model summary \nMost of us never think about breathing, but our respiratory system works hard, we \ntake about 20,000 breaths a day. This report explains how it works. When we inhale, \nthe diaphragm tightens and the lungs expand. When we exhale, the diaphragm \nrelaxes and pushes the air out. Deep breathing fills the lungs, and your lower belly \nrises. According to Harvard Medical School, it may slow your heartbeat, lower your\nblood pressure and reduce stress. But many people take shallow chest breaths, \nwhich can cause shortness of breath and anxiety, and over time stale air stays in the \nlungs. The report gives a simple exercise: sit or lie down, put one hand under your \nribs, breathe in slowly through your nose, and then breathe out slowly through your \nmouth. Repeating it removes stale air and raises oxygen levels. The doctor also \nadvises not smoking, eating and sleeping well, and getting help early. \nSpeaking Exercise 2: Model voice message \nHey Trâm, it’s okay, everyone feels nervous before a speaking exam. Let’s try \nsomething I learned from a report. First, sit down and put one hand just below your \nribs. Then inhale slowly through your nose, your stomach should go up under your \nhand. Next, exhale slowly through your mouth, all the way. Do it five or six times. It \nhelps because deep breathing can slow your heartbeat and help you relax, and it \ngives your brain more oxygen. Another tip: don’t study all night, just read your notes \nonce and go to bed early. You’re going to be great. Good luck tomorrow!","flashcards":[{"word":"respiratory","meaning":"connected with breathing"},{"word":"inhale","meaning":"to breathe in"},{"word":"exhale","meaning":"to breathe out"},{"word":"expand","meaning":"to become bigger"},{"word":"shallow","meaning":"not deep"},{"word":"stale","meaning":"not fresh or clean"},{"word":"relax","meaning":"to become less tight or less worried"},{"word":"shortness of breath","meaning":"difficulty getting enough air"},{"word":"blood pressure","meaning":"the force of blood moving through your body"},{"word":"oxygen","meaning":"the gas in the air that we need to live"}],"mcq_answers":{"1":"B","2":"B","3":"B","4":"A","5":"B","6":"C"},"media_url":"https://drive.google.com/file/d/1_tLmJ2xWVk90UgxWOKBP_2k1o4UlNXZf/view","media_preview":"https://drive.google.com/file/d/1_tLmJ2xWVk90UgxWOKBP_2k1o4UlNXZf/preview","media_type":"audio","id":"i11"},{"level":"Intermediate","index":12,"title":"Friendship & Loneliness","audio_title":"Top US Government Doctor Declares Loneliness a Big Health Problem","source_url":"https://learningenglish.voanews.com/a/top-us-government-doctor-declares-loneliness-a-big-health-problem/7077132.html","watch":"","page":179,"page_end":185,"before":"1. How much time do you spend with friends in person each day?\n2. Can you feel lonely even when you are with other people? When?\n3. Guess: is loneliness as bad for health as smoking? Why might that be?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. The surgeon general says loneliness is as dangerous as smoking ______________\ncigarettes a day.\n2. He says loneliness costs the health industry ______________ of dollars each year.\n3. About ______________ of US adults say they have experienced loneliness.\n4. Murthy compares loneliness to hunger or ______________.\n5. The number of single, unmarried households has doubled in ______________.\n6. In 2020, people spent about ______________ a day with friends in person.\n7. Young people aged 15 to 24 had a ______________ drop in time spent with friends.\n8. Loneliness raises the risk of early death by nearly ______________.\n9. Murthy suggests that people join community groups and put away their\n______________ when they are with friends.\n10. People who used social media for two hours or more a day were more than\n______________ as likely to feel lonely.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. What does Murthy mean when he says loneliness is “like hunger or thirst”?\nA It goes away quickly.\nB It is a signal that we are missing something we need.\nC It only affects poor people.\n2. What comes with the surgeon general’s declaration?\nA new money for programs\nB new laws about social media\nC no federal money or programs, it is meant to raise understanding\n3. Which change has made Americans lonelier, according to the report?\nA They are less involved in religion, community groups and family.\nB They travel more often.\nC They work fewer hours.\n4. Why did the COVID-19 pandemic make the problem worse?\nA People had to work longer hours.\nB Schools and workplaces closed and people were separated.\nC Hospitals stopped treating lonely people.\n5. What does Murthy ask employers to do?\nA give workers more holidays\nB look carefully at their remote work policies\nC ban phones at work\n6. What is Murthy’s view of technology?\nA It has no effect on loneliness.\nB It should be banned for children.\nC It should be designed to strengthen relationships, not weaken them.","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. epidemic\na. a sudden illness when blood cannot reach part of\nthe brain\n2. thirst\nb. not married\n3. survival\nc. an official public statement\n4. declaration\nd. a disease or problem that spreads quickly to many\npeople\n5. single\ne. a set of rules or plans of an organization\nWord / phrase\nMeaning\n6. stroke\nf. to know what something is when you see it\n7. interaction\ng. the feeling of needing something to drink\n8. recognize\nh. talking and doing things with other people\n9. struggle\ni. the state of continuing to live\n10. policy\nj. a long, difficult effort","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. Some doctors say that phone addiction among teenagers is becoming an\n______________.\n2. After the long run, I had a terrible ______________.\n3. In the desert, water is necessary for ______________.\n4. The government made an official ______________ about air pollution.\n5. My uncle is 40 and still ______________, he says he’s too busy to date.\n6. High blood pressure increases the risk of a ______________.\n7. Online games can’t replace real face-to-face ______________.\n8. Teachers are trained to ______________ signs that a student is unhappy.\n9. Many students quietly ______________ with stress before exams.\n10. Our school has a new ______________: no phones in the canteen.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWho made the declaration and\nwhat did he compare loneliness\nto?\nNumbers: how many people,\ntime with friends, young people\nHealth risks of loneliness\nAdvice for people, employers,\nhealth systems, tech companies\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• America’s top doctor has said that...\n• He compared loneliness to...\nNumbers\n• About half of... / In 2020, people spent only...\nAdvice\n• He suggests that people should...\n• He also wants employers to...\nFinishing\n• The main message is that...\n• I think this is also true for teenagers in Vietnam because...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nAn old friend from primary school, Duy, sends you this message:\n“Hey... I moved to a new school this year and I don’t really know anyone. I spend\nevery evening gaming alone. Kind of lonely tbh.”\nRound 1: Record a voice message to Duy (60-90 seconds). In your message:\n• thank him for telling you and show you care\n• tell him ONE thing you learned from the report about loneliness\n• suggest TWO small, practical steps to make new friends\n• suggest meeting up, and finish warmly\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nShowing care\n• Thanks for telling me, that means a lot.\n• I’m really sorry you feel that way.\nSharing information\n• I heard a report that said...\n• Did you know that...?\nSuggesting\n• Maybe you could join...\n• Why don’t you try...?\nFinishing\n• Let’s meet up this weekend!\n• I’m always here if you want to talk.","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \n15 / fifteen \n \n6 \n20 minutes / twenty \nminutes \n \n2 \nbillions \n“billions of \ndollars” \n7 \n70 percent / 70% \n \n3 \nhalf \n \n8 \n30 percent / 30% \n \n4 \nthirst \n \n9 \nphones\nQ \nAnswer \nNote \nQ \nAnswer \nNote \n5 \n60 years / sixty years  \n10 twice \n“twice as \nlikely”","answer_l2":"1 B    2 C    3 A    4 B    5 B    6 C","answer_v1":"1 d    2 g    3 i    4 c    5 b    6 a    7 h    8 f    9 j    10 e","answer_v2":"1 epidemic    2 thirst    3 survival    4 declaration    5 single    6 stroke    7 interaction    8 \nrecognize    9 struggle    10 policy","answer_speaking":": Model summary \nAmerica’s top doctor, the surgeon general Vivek Murthy, has made a declaration \nthat loneliness is a public health epidemic. He says it is as dangerous as smoking 15 \ncigarettes a day, and about half of American adults have felt lonely. He compares it \nto hunger or thirst, a signal that something we need for survival is missing. \nAmericans are less involved in religion and community groups, there are more single \npeople living alone, and the pandemic made things worse. In 2020, people spent only \n20 minutes a day with friends in person, and young people had a 70 percent drop. \nLoneliness increases the risk of early death, stroke, heart disease and depression. He \nsuggests that people join groups and put their phones away, that employers check \ntheir remote work policies, and that doctors learn to recognize loneliness. Finally, he \nwants technology that supports real interaction. The main message is that many \npeople struggle in silence.\nSpeaking Exercise 2: Model voice message \nHey Duy! Thanks for telling me, that means a lot, and I’m really sorry you feel that \nway. Starting at a new school is hard. I heard a report that said loneliness is really \ncommon, about half of adults in America have felt it, so you’re definitely not the only \none. And it can be bad for your health, so it’s good you’re talking about it. Maybe \nyou could join a club at your new school, like football or the English club? Or just \nask one classmate to eat lunch with you, small steps really help. Also, let’s meet up \nthis weekend and grab some bubble tea! I’m always here if you want to talk.","flashcards":[{"word":"epidemic","meaning":"a disease or problem that spreads quickly to many people"},{"word":"thirst","meaning":"the feeling of needing something to drink"},{"word":"survival","meaning":"the state of continuing to live"},{"word":"declaration","meaning":"an official public statement"},{"word":"single","meaning":"not married"},{"word":"stroke","meaning":"a sudden illness when blood cannot reach part of the brain"},{"word":"interaction","meaning":"talking and doing things with other people"},{"word":"recognize","meaning":"to know what something is when you see it"},{"word":"struggle","meaning":"a long, difficult effort"},{"word":"policy","meaning":"a set of rules or plans of an organization"}],"mcq_answers":{"1":"B","2":"C","3":"A","4":"B","5":"B","6":"C"},"media_url":"https://drive.google.com/file/d/1Kdw7hvQPgFli9cTc-ElV2B2eJnFUlkt_/view","media_preview":"https://drive.google.com/file/d/1Kdw7hvQPgFli9cTc-ElV2B2eJnFUlkt_/preview","media_type":"audio","id":"i12"},{"level":"Intermediate","index":13,"title":"Technology & AI","audio_title":"AI Chatbots to Help with Mental Health Struggles","source_url":"https://learningenglish.voanews.com/a/ai-chatbots-to-help-with-mental-health-struggles/7549449.html","watch":"","page":186,"page_end":192,"before":"1. Have you ever talked to a chatbot (for example, on a shopping website or an AI\napp)? What for?\n2. Would you tell a chatbot about your problems? Why / why not?\n3. What can a real person do that a chatbot cannot?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nlisten and complete the sentences.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. The Earkick chatbot greets users with a friendly-looking ______________.\n2. When users talk about anxiety, it might suggest ______________.\n3. There are ______________ of free mental health chatbots like Earkick.\n4. Because the apps don’t claim to diagnose or treat illness, they do not need\n______________ approval.\n5. The chatbots are free and available ______________ a day.\n6. Britain’s National Health Service offers a chatbot called ______________ to young\npeople.\n7. Dr Angela Skrzynski is a family doctor in New ______________.\n8. Woebot was founded in ______________ by a psychologist trained at Stanford.\n9. Woebot does not use AI; it uses structured language written by its ______________.\n10. Research suggests chatbots can help with ______________ in a short time.","listening2":"Exercise 2. Listen to the whole report again without stopping. Choose the correct\nletter, A, B or C.\n1. How do Earkick’s creators describe their chatbot?\nA as a medical treatment\nB They don’t feel comfortable calling it a therapy tool.\nC as a replacement for doctors\n2. Which is NOT given as an advantage of the chatbots?\nA They are free.\nB People can use them in private.\nC They are approved to treat depression.\n3. What worries psychologist Vaile Wright?\nA Users can’t know whether the chatbots really work.\nB The chatbots are too expensive.\nC Young people don’t like pandas.\n4. Why are chatbots already playing a role in mental health care?\nA There are not enough mental health professionals.\nB Doctors prefer computers.\nC Patients don’t want to see therapists.\n5. Why does Alison Darcy prefer a rules-based model?\nA It is cheaper to build.\nB It is safer than generative AI, which can tell people how to think.\nC It can speak more languages.\n6. What would Ross Koppel like to see?\nA more free chatbots in schools\nB the FDA reviewing and possibly regulating the chatbots\nC chatbots replacing medicine","vocab1":"Exercise 1. Match the words and phrases (1-10) with their meanings (a-j).\nWord / phrase\nMeaning\n1. chatbot\na. without other people seeing or hearing\n2. therapist\nb. producing the result you want\n3. diagnose\nc. able to be used or reached\n4. artificial intelligence\nd. very serious or bad\n5. psychologist\ne. computer systems that can copy intelligent human\nbehaviour\n6. available\nf. to find out what illness a person has\n7. in private\ng. a situation when there is not enough of something\n8. shortage\nh. a person who studies the mind and helps people\nwith mental problems\nWord / phrase\nMeaning\n9. effective\ni. a trained person who helps people with mental or\nemotional problems\n10. severe\nj. a computer program that has conversations with\npeople","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1. You may need to change the form.\n1. I asked the bank’s ______________ how to change my password.\n2. After her parents’ divorce, she talked to a ______________ every week.\n3. It took the doctor two hours to ______________ the problem.\n4. Many companies now use ______________ to answer customer questions.\n5. The school ______________ helps students who feel anxious.\n6. Our English teacher is ______________ for questions after class on Tuesdays.\n7. She didn’t want to talk about it in front of everyone, so we spoke ______________.\n8. There is a ______________ of nurses in many hospitals.\n9. Drinking water is an ______________ way to stay focused during exams.\n10. If the pain is ______________, go to the hospital immediately.","speaking1":"Exercise 1. Retell the main ideas of the report clearly in your own words, using new\nvocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat is Earkick? What does it\ndo?\nAdvantages and disadvantages\nof mental health chatbots\nWhy chatbots are being used\n(shortage; NHS, Woebot)\nExperts’ worries and what they\nwant\nWords from Vocabulary\nExercise 1 I will use (at least 4)\nStep 2: Record (60-90 seconds). Look only at your notes and record your summary on\nyour phone.\nStep 3: Listen and improve. Listen to your recording, notice long pauses and missing\nwords, then record again. Try to pause less and use more new words.\nUSEFUL LANGUAGE\nStarting\n• This report is about chatbots that...\n• One example is...\nPros and cons\n• On the plus side...\n• On the other hand...\nReporting opinions\n• A psychologist said that...\n• Some experts would like...\nFinishing\n• Overall, chatbots might..., but...\n• Personally, I would / wouldn’t...","speaking2":"Exercise 2. Use the ideas and words from this unit in a real-life message.\nSITUATION\nYour friend Ngân sends you this message:\n“I’ve been feeling really down lately. I don’t want to bother anyone, so I just talk to\nan AI chatbot every night. It’s basically the same as a therapist, right?”\nRound 1: Record a voice message to Ngân (60-90 seconds). In your message:\n• show that you care and that she is not bothering you\n• say ONE thing chatbots can be good for (use the report)\n• explain why a chatbot is not the same as real help\n• suggest a person she can talk to, and offer your support\nRound 2: Listen to your Round 1 recording, then record the message again without\nlooking at any notes, in 60 seconds.\nUSEFUL LANGUAGE\nCaring\n• Thank you for telling me.\n• You’re never bothering me!\nBeing fair\n• Chatbots can be useful for...\n• I get why you like it, it’s...\nGiving another view\n• But I heard that...\n• A chatbot can’t...\nSupporting\n• Maybe you could talk to...\n• I’m here for you, anytime.","answer_l1":"Q \nAnswer \nNote \nQ \nAnswer \nNote \n1 \npanda \n \n6 \nWysa \n \n2 \nbreathing exercises \n \n7 \nJersey \n \n3 \nhundreds \n“hundreds of \nfree chatbots” \n8 \n2017 \n \n4 \nFDA \nFood and Drug \nAdministration \n9 \nstaff \nand \nresearchers \n5 \n24 hours \n“24 hours a \nday” \n10 depression","answer_l2":"1 B    2 C    3 A    4 A    5 B    6 B","answer_v1":"1 j    2 i    3 f    4 e    5 h    6 c    7 a    8 g    9 b    10 d","answer_v2":"1 chatbot    2 therapist    3 diagnose    4 artificial intelligence    5 psychologist    6 \navailable    7 in private    8 shortage    9 effective    10 severe","answer_speaking":": Model summary \nThis report is about chatbots that help young people with mental health. One \nexample is Earkick, which has a friendly panda. When users talk about anxiety, it \nsays things a therapist might say and suggests breathing exercises. There are \nhundreds of these apps, but they don’t claim to diagnose or treat illness, so they don’t \nneed government approval. On the plus side, they are free, available 24 hours a day, \nand people can use them in private. On the other hand, there is little proof that they \nimprove mental health. A psychologist said users can’t know if they are really \neffective, although they may help people with less severe problems. Because of a \nshortage of mental health workers, Britain’s health service and some US doctors \nalready use chatbots like Wysa and Woebot. Some experts worry about artificial \nintelligence giving bad advice and want the government to check these apps. \nSpeaking Exercise 2: Model voice message \nHey Ngân, thank you for telling me, and you’re never bothering me, okay? I get why \nyou like the chatbot. It’s available any time and you can use it in private. I heard a \nreport that said chatbots can be useful for small things, like breathing exercises when \nyou feel stressed. But experts also said there’s no real proof they help with serious \nfeelings, and a chatbot can’t really understand you or notice if things get worse. \nMaybe you could talk to the school counsellor, or to your older sister? I can go with \nyou if you want. And let’s get a drink after school tomorrow, I’m here for you, \nanytime.","flashcards":[{"word":"chatbot","meaning":"a computer program that has conversations with people"},{"word":"therapist","meaning":"a trained person who helps people with mental or emotional problem
