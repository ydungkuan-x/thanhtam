ign:center;background:white;border:1px solid var(--line);border-radius:13px;padding:15px 8px}.step .icon{font-size:21px;margin-bottom:5px}.step small{display:block;color:#8c98ae}.step strong{font-size:12px}.lessonhero{background:linear-gradient(120deg,#14234c,#273e75);color:white;border-radius:18px;padding:29px 31px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.lessonhero .eyebrow{color:#8bd9d4}.lessonhero h1{margin:6px 0;font:800 31px Manrope,sans-serif;letter-spacing:-1px}.lessonhero p{margin:0;color:#bfd0ec;font-size:12px}.lessonbadge{padding:7px 12px;background:#ffffff17;border:1px solid #ffffff25;color:#e6f0ff;border-radius:40px;font-size:11px;white-space:nowrap}.tabs{display:flex;gap:5px;background:#e9eef8;padding:5px;border-radius:13px;margin-bottom:18px;overflow:auto}.tab{flex:1;border:0;background:transparent;padding:11px 12px;color:#71809b;font-size:12px;font-weight:800;white-space:nowrap;border-radius:9px}.tab.active{background:white;color:#3f55bf;box-shadow:0 3px 9px #3e4f8014}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.78fr);gap:17px}.media{background:#0d1934;padding:9px;border-radius:15px}.media iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#111a2c}.media.audio iframe{aspect-ratio:16/7}.micro{font-size:11px;color:#8d9aaf}.book{white-space:pre-wrap;word-break:break-word;font-family:'DM Sans',sans-serif;background:#f8faff;padding:18px;border:1px solid #e9eef7;border-radius:11px;color:#2f4265;line-height:1.74;font-size:13px;max-height:640px;overflow-y:auto}.book.long{max-height:none}.qarea{width:100%;min-height:115px;border:1px solid #dbe4f1;border-radius:12px;padding:13px 15px;background:#fafcff;color:#20314f;resize:vertical;outline:none}.qarea:focus,.answerbox:focus{border-color:#7186f0;box-shadow:0 0 0 3px #6075d81a}.sources{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px}.sourcelink{color:#4a60c8;font-size:12px;font-weight:700}.pill{font-size:10px;color:#61829c;background:#eff4ff;padding:5px 9px;border-radius:30px;font-weight:800}.answergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:13px 0}.ansfield{display:flex;gap:7px;align-items:center;padding:8px;background:#f8faff;border:1px solid var(--line);border-radius:9px}.ansfield b{font-size:11px;color:#788ca6;min-width:18px}.answerbox{min-width:0;width:100%;font-size:12px;border:0;background:transparent;color:#233657;outline:none}.answerbox.good{background:#e9faf3;border-radius:3px}.answerbox.bad{background:#fff0ec;border-radius:3px}.note{font-size:12px;color:#6d7d98;background:#f3f7fc;border-left:3px solid #97acd6;padding:12px 14px;border-radius:0 10px 10px 0;margin:13px 0}.result{padding:9px 12px;border-radius:9px;margin-top:10px;background:#edf7f4;color:#247761;font-weight:700;font-size:12px}.muted{color:var(--muted)}.divider{height:1px;background:var(--line);margin:21px 0}.flash{min-height:202px;border-radius:16px;background:linear-gradient(128deg,#dfe8ff,#e6f7f5);display:flex;justify-content:center;align-items:center;text-align:center;padding:35px;cursor:pointer;position:relative}.flash .word{font:800 clamp(22px,2vw,30px) Manrope,sans-serif;letter-spacing:-.7px}.flash .hint{position:absolute;bottom:14px;font-size:11px;color:#697a95}.flash .def{font-size:16px;color:#2d4467;font-weight:600;max-width:500px}.flashctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:15px 0}.small{font-size:12px}.mark{font-size:12px;display:flex;align-items:center;gap:9px}.mark input{accent-color:#43ab96}.recstatus{display:inline-flex;align-items:center;gap:6px;color:#a93b4a;font-weight:800;font-size:12px}.recstatus:before{content:'';width:8px;height:8px;background:#d63c4c;border-radius:50%;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}.recording{background:#fff7f6;border:1px solid #ffe1da;border-radius:13px;padding:17px}.recording audio{width:100%;margin-top:13px}.answerkey{background:#fbfcff;border:1px dashed #cad6e9;border-radius:14px;padding:17px;margin-top:10px}.answerkey.hidden{display:none}.back{text-decoration:none;color:#6d84d9;font-weight:700;font-size:12px}.checkbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#ecf5f2;padding:14px 17px;border-radius:13px;margin-top:18px}.checkbar label{display:flex;gap:9px;align-items:center;font-weight:800}.checkbar input{height:17px;width:17px;accent-color:#33a687}.footer{margin-top:35px;font-size:11px;color:#98a4b7;text-align:center}.empty{padding:36px;text-align:center;color:var(--muted)}

<script>
const UNITS=[{"level":"Beginner","index":1,"title":"Places","audio_title":"Talking about visiting places, Real Easy English","source_url":"https://youtu.be/MyWav72LcRg?t=22","watch":"From 00:22 to 04:06 (from “How are you today,\nBeth?” to “That’s very true.”)","page":10,"page_end":15,"before":"1. Do you live in a city or in the countryside?\n2. On holiday, do you like to visit big cities or quiet places in the countryside?\nWhy?\n3. Look at the title: “Talking about visiting places”. Write two things you think\nGeorgie and Beth will talk about.","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nwatch and complete the sentences.\nWrite ONE WORD ONLY for each answer.\n1. Georgie lives in ______________.\n2. Georgie is from the ______________.\n3. In the countryside, there is more green space and more ______________.\n4. Beth is from the ______________ of England.\n5. Kent is in the ______________ of England.\n6. Last year, Georgie went to the ______________ in Kent.\n7. When Beth goes abroad, she usually visits a ______________.\n8. To visit a village in another country, you often need to hire a ______________.","listening2":"Exercise 2. Watch the whole segment again without stopping. Choose the correct\nletter, A, B or C.\n1. What is the conversation mainly about?\nA places to live in London\nB visiting the city or the countryside\nC how to plan a cheap holiday\n2. Why does Beth like visiting the countryside in the UK?\nA She doesn’t like cities at all.\nB After a while, UK cities all seem similar.\nC It is cheaper than the city.\n3. What did Beth notice on the farms in Kent?\nA The animals were very big.\nB There were lots of tourists.\nC The buildings and roofs were different.\n4. Why does Beth usually choose a city when she goes abroad?\nA It is easy to travel by train or bus.\nB Hotels in cities are cheaper.\nC She loves shopping.\n5. According to the speakers, who can help you find a good restaurant in the\ncountryside?\nA the internet\nB the local people\nC a hotel worker","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. countryside\na. very pretty, like a picture\n2. rural\nb. animals and birds that live free in nature\n3. wildlife\nc. in or to another country\n4. hustle and bustle\nd. land outside towns and cities, with fields and few\nbuildings\n5. picturesque\ne. people who live in a particular place\n6. seaside\nf. the busy movement and noise of a city\n7. abroad\ng. an area next to the sea, often a place for holidays\n8. locals\nh. connected with the countryside, not the city","vocab2":"Exercise 2. Complete the sentences with words and phrases from Vocabulary\nExercise 1.\n1. My grandparents live in a small village in the ______________. They have a farm\nand two cows.\n2. I love Hội An. The old houses next to the river are very ______________.\n3. Every summer, my family goes to the ______________ in Nha Trang to swim.\n4. Ho Chi Minh City is exciting, but sometimes I want to escape the ______________.\n5. Have you ever travelled ______________? Yes, I went to Thailand last year.\n6. In the national park, we saw a lot of ______________: monkeys, birds and even a\ndeer.\n7. Life in ______________ areas is quiet, but there are not many jobs.\n8. Don’t look on the internet. Ask the ______________, they know the best places to\neat.","speaking1":"Exercise 1. Retell the conversation in your own words, using new vocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWho is talking? What is the topic?\nIn the UK: where does Georgie like\nto go? Why?\nBeth’s trip to Kent\nAbroad: city or countryside? Why?\nWords from Vocabulary Exercise 1\nI will use (at least 3)\nStep 2: Record (45-60 seconds). Look only at your notes and record yourself on your\nphone.\nStep 3: Listen and improve. Listen to your recording. Did you use at least 3 new words?\nRecord again and try to pause less.\nUSEFUL LANGUAGE\nStarting\n• This conversation is about...\n• Georgie and Beth talk about...\nGiving details\n• Georgie lives in..., but she is from...\n• She likes... because...\n• A few years ago, Beth went to...\nComparing\n• In the UK, they prefer..., but abroad they usually...\n• It is easier to... in a city.\nFinishing\n• In the end, they agree that...","speaking2":"Exercise 2. Voice message to a friend\nSITUATION\nYour friend Lan sends you this message:\n“Hi! I have three days off next month 😍 Should I go to Hà Nội or to a quiet village\nin Mộc Châu? I can’t decide! Can you help me?”\nRound 1: Record a voice message to Lan (45-60 seconds). In your message:\n• say which place you think is better for her\n• give TWO reasons (you can use ideas from the conversation, e.g. transport, green\nspace, hustle and bustle)\n• suggest ONE thing she can do there\n• finish in a friendly way\nRound 2: Record the message again without looking at any notes, in 45 seconds.\nUSEFUL LANGUAGE\nGiving your opinion\n• I think you should go to...\n• If I were you, I’d go to...\nGiving reasons\n• ...because...\n• It’s easier to...\n• There is / There are...\nMaking a suggestion\n• You can...\n• Why don’t you...?\nFinishing\n• Have a great trip!\n• Send me some photos!","answer_l1":"Q \nAnswer \nNote \n1 \nLondon \nCapital letter: London \n2 \ncountryside \nShe says, “I’m from the countryside.” \n3 \nwildlife \nOne word \n4 \nnorth \n \n5 \nsouth \n \n6 \nseaside \nKent also has “a bit of coastline”. \n7 \ncity \nBeth: “maybe the capital city or maybe a \nsmaller city” \n8 \ncar \nhire a car = pay to use a car for a short time","answer_l2":"1 B    2 B    3 C    4 A    5 B","answer_v1":"1 d    2 h    3 b    4 f    5 a    6 g    7 c    8 e","answer_v2":"1 countryside    2 picturesque    3 seaside    4 hustle and bustle    5 abroad    6 wildlife    7 \nrural    8 locals","answer_speaking":": Model summary \nThis conversation is about visiting places. Georgie and Beth talk about the city and \nthe countryside. Georgie lives in London, but she is from the countryside. In the UK, \nshe likes to go to the countryside because there is more green space and more \nwildlife, and she can escape the hustle and bustle of the city. Beth agrees. She says \nUK cities are all similar after a while. A few years ago, she went to Kent, in the south \nof England, and she loved the farm buildings. Georgie also went to Kent, to the \nseaside, and she thinks the villages are very picturesque. But when Beth goes \nabroad, she usually visits a city, because it is easier to travel by train or bus. In the \ncountryside, the locals can tell you where to find a good restaurant. \nSpeaking Exercise 2: Model voice message \nHi Lan! I think you should go to Mộc Châu. First, Hà Nội is great, but it’s very busy, \nand you need a break from the hustle and bustle. Second, Mộc Châu is very \npicturesque, with green hills and tea fields. You can walk in the countryside and \ntake lots of photos. Why don’t you ask the locals where to eat? They know the best \nplaces. Have a great trip and send me some photos!","flashcards":[{"word":"countryside","meaning":"land outside towns and cities, with fields and few buildings"},{"word":"rural","meaning":"connected with the countryside, not the city"},{"word":"wildlife","meaning":"animals and birds that live free in nature"},{"word":"hustle and bustle","meaning":"the busy movement and noise of a city"},{"word":"picturesque","meaning":"very pretty, like a picture"},{"word":"seaside","meaning":"an area next to the sea, often a place for holidays"},{"word":"abroad","meaning":"in or to another country"},{"word":"locals","meaning":"people who live in a particular place"}],"mcq_answers":{"1":"B","2":"B","3":"C","4":"A","5":"B"},"media_url":"https://drive.google.com/file/d/1HRoSR9EbfwKpOsznVeAuSwDSM4rlpENK/view","media_preview":"https://drive.google.com/file/d/1HRoSR9EbfwKpOsznVeAuSwDSM4rlpENK/preview","media_type":"video","id":"b1"},{"level":"Beginner","index":2,"title":"Family","audio_title":"How to talk about your family tree in English, Real Easy English","source_url":"https://youtu.be/W_yFHgHafKM?t=16","watch":"From 00:16 to 04:47 (from “Hi Georgie, how are\nyou?” to “I think that would be good.”)","page":16,"page_end":21,"before":"1. How many people are there in your family?\n2. Do you have many cousins, aunts and uncles? How often do you see them?\n3. What is a “family tree”? Have you ever seen one?","listening1":"Exercise 1. Read the sentences first. Then watch and decide: who says or thinks\nthis, Georgie, Phil or both? Put a tick (✓).\nWho says or thinks this?\nGeorgie\nPhil\nBoth\n1. My extended family is quite small.\n2. I have one sister.\n3. I have one brother.\nWho says or thinks this?\nGeorgie\nPhil\nBoth\n4. I have a cousin somewhere in Australia.\n5. Now I usually see my extended family at weddings\nand funerals.\n6. My two grandmothers lived quite close to me.\n7. My granddad came every week to do the shopping\nfor my mum.\n8. I haven’t researched my family tree myself.","listening2":"Exercise 2. Watch the whole segment again without stopping. Answer the questions.\nWrite NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.\n1. How many uncles does Georgie have? ______________\n2. How many aunts does Phil have? ______________\n3. How many cousins does Phil know? ______________\n4. At what time of year do they often see their extended family? ______________\n5. Georgie’s grandmothers were really funny, loving and ______________.\n6. Which country was one speaker’s great-grandmother from? ______________\n7. Where can you look up your family history? Name ONE place. ______________","vocab1":"Exercise 1. Match the family words (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. extended family\na. your parents’ parents\nWord / phrase\nMeaning\n2. cousin\nb. a diagram that shows your family history\n3. aunt\nc. the child of your aunt or uncle\n4. uncle\nd. people in your family who lived a long time ago\n5. grandparents\ne. the sister of your mother or father\n6. ancestors\nf. all your relatives, e.g. aunts, uncles and cousins, not\nonly parents and children\n7. generation\ng. the brother of your mother or father\n8. family tree\nh. all the people of about the same age in a family, e.g.\nyou and your cousins","vocab2":"Exercise 2. Choose the correct word in each sentence.\n1. My mother’s sister is my (aunt / uncle).\n2. My uncle’s son is my (cousin / brother).\n3. I’m very (close / near) to my grandmother. We talk every day.\n4. We see our (extended / extra) family at Tết.\n5. My great-grandparents and their parents are my (ancestors / children).\n6. I want to (look up / look after) my family history on the internet.\n7. My family is quite (small / few): just my parents, my brother and me.\n8. In some Vietnamese homes, three (generations / ages) live together.","speaking1":"Exercise 1. IELTS Speaking Part 1. Answer the questions about your family.\nStep 1: Prepare (3 minutes). Write 2-3 keywords for each question.\nQuestion\nYour keywords\n1. Do you have a big family?\n2. Who are you closest to in your\nfamily? Why?\n3. How often do you see your\nextended family?\n4. Would you like to know more\nabout your family history? Why /\nWhy not?\nStep 2: Record. Answer each question in 2-3 sentences (about 20 seconds each). Don’t\nread your notes.\nStep 3: Listen and improve. Listen. Did you give a reason for each answer? Record\nagain and add one more detail to each answer.\nUSEFUL LANGUAGE\nTalking about your family\n• Actually, my family is quite small / big.\n• I’ve got one brother, two aunts and...\nCloseness\n• I’m (really) close to my... because...\n• We get on really well.\nHow often\n• We usually see each other at Tết / at weddings.\n• Only a few times a year.\nWishes\n• I’d love to find out more about...\n• I think that would be really interesting.","speaking2":"Exercise 2. Mini talk: my family tree\nTalk about your family tree.\nYou should say:\n• who is in your close family\n• who is in your extended family\n• who you are closest to, and why\n• one interesting thing about your family (now or in the past)\nRound 1: You have 1 minute to make notes. Then talk for 1 minute.\nRound 2: Draw your family tree on paper and give the talk again, pointing to each\nperson.\nUSEFUL LANGUAGE\nStarting\n• I’d like to talk about my family.\n• There are ... people in my close family.\nDescribing people\n• My dad’s brother is my uncle. He lives in...\n• My cousin ... is the same age as me.\nClosest person\n• I’m closest to... because...\nFinishing\n• One interesting thing about my family is that...\n• That’s my family!","answer_l1":"Q \nAnswer \nNote \n1 \nBoth \n“So, we both have quite small extended \nfamilies.” \n2 \nGeorgie \n \n3 \nPhil\nQ \nAnswer \nNote \n4 \nPhil \n“a cousin somewhere lost in Australia” \n5 \nGeorgie \n \n6 \nGeorgie \n \n7 \nPhil \n \n8 \nBoth \nOther people in their families have done it, \nor they would like to.","answer_l2":"Q \nAnswer \nNote \n1 \ntwo / 2 \n“one aunt, two uncles” \n2 \ntwo / 2 \n“two aunts, three uncles” \n3 \nthree / 3 \nplus one cousin he doesn’t know in \nAustralia \n4 \n(at) Christmas \nNew Year is also mentioned. \n5 \ncaring \n \n6 \nItaly \nThe same speaker’s great-grandfather was \nfrom the US. \n7 \ngovernment offices / websites \nEither answer is correct.","answer_v1":"1 f    2 c    3 e    4 g    5 a    6 d    7 h    8 b","answer_v2":"1 aunt    2 cousin    3 close    4 extended    5 ancestors    6 look up    7 small    8 \ngenerations","answer_speaking":": Model answers \n1. Actually, my family is quite small. I’ve got my parents and one younger brother. \nBut my extended family is big, I have lots of cousins. \n2. I’m closest to my mum. She’s really funny and caring, and we talk about \neverything. \n3. Not very often. We usually see each other at Tết and at weddings, because my \naunts and uncles live in other cities. \n4. Yes, I’d love to. My grandfather tells stories about our ancestors, so I want to look \nup our family tree. I think that would be really interesting. \nSpeaking Exercise 2: Model talk \nI’d like to talk about my family. There are four people in my close family: my \nparents, my sister and me. My extended family is bigger. My dad has two brothers, \nso I have two uncles, and I have five cousins. I’m closest to my sister because we are \nonly two years apart and we share a room. One interesting thing about my family is \nthat my great-grandparents came from Huế, so three generations ago my family \nlived in the centre of Vietnam. One day, I want to make a family tree and find out \nmore about my ancestors. That’s my family!","flashcards":[{"word":"extended family","meaning":"all your relatives, e.g. aunts, uncles and cousins, not only parents and children"},{"word":"cousin","meaning":"the child of your aunt or uncle"},{"word":"aunt","meaning":"the sister of your mother or father"},{"word":"uncle","meaning":"the brother of your mother or father"},{"word":"grandparents","meaning":"your parents’ parents"},{"word":"ancestors","meaning":"people in your family who lived a long time ago"},{"word":"generation","meaning":"all the people of about the same age in a family, e.g. you and your cousins"},{"word":"family tree","meaning":"a diagram that shows your family history"}],"mcq_answers":{},"media_url":"https://drive.google.com/file/d/1DECPYAzWYYQWO8iittfg1i2-k4ZAavie/view","media_preview":"https://drive.google.com/file/d/1DECPYAzWYYQWO8iittfg1i2-k4ZAavie/preview","media_type":"video","id":"b2"},{"level":"Beginner","index":3,"title":"Friends","audio_title":"Talking about socialising, Real Easy English","source_url":"https://youtu.be/d0GKyzG9OWA?t=22","watch":"From 00:22 to 04:25 (from “So, Georgie, how are\nyou?” to “...just lacking energy.”)","page":22,"page_end":28,"before":"1. How often do you meet your friends? What do you do together?\n2. Do you prefer big parties or small groups of friends? Why?\n3. How do you feel when you meet new people?","listening1":"Exercise 1. Read the statements first. Then watch and tick (✓) True or False.\nStatement\nTrue\nFalse\n1. Georgie feels tired because she has had a lot of social plans.\n2. Neil sees his friends very often.\n3. Georgie likes big parties because she can meet new people and\ndance.\nStatement\nTrue\nFalse\n4. Georgie says smaller events are usually better for her because\nshe has a shy side.\n5. Neil enjoys parties where he doesn’t know many people.\n6. Neil likes small talk.\n7. Georgie gets more energy from spending time alone.\n8. Neil is happy to spend a long time alone.","listening2":"Exercise 2. Watch the whole segment again without stopping. Choose the correct\nletter, A, B or C.\n1. What does “socialising” mean?\nA working with other people\nB spending time with people for fun\nC talking on social media\n2. Why doesn’t Neil see his friends very often?\nA They live in another country.\nB They are all busy grown-ups with responsibilities.\nC He doesn’t like going out.\n3. Which of these is an example of small talk?\nA talking about the weather\nB talking about your problems\nC talking about your favourite film for an hour\n4. According to Georgie, what helps you feel less embarrassed with new people?\nA asking lots of questions\nB finding a topic that you both have in common\nC talking about yourself\n5. What is “social burnout”?\nA feeling exhausted after too much time with other people\nB feeling lonely at a party\nC having no friends","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. socialise\na. feeling silly because of something you did\n2. lonely\nb. sad because you are alone\n3. shy\nc. very, very tired\n4. small talk\nd. to spend time with other people for fun\n5. awkward\ne. nervous and quiet with people you don’t know\n6. embarrassed\nf. to share the same interests or ideas\n7. (have sth) in common\ng. polite conversation about unimportant things, e.g.\nthe weather\n8. exhausted\nh. not relaxed; making you feel strange","vocab2":"Exercise 2. Complete the conversation at a party with words and phrases from\nVocabulary Exercise 1.\nWORD BOX\nsmall talk | shy | in common | socialise | exhausted | lonely | embarrassed |\nawkward\nMai: Hi, I’m Mai. Lovely weather today, isn’t it?\nTom: Yes! Sorry, I’m not good at (1) ______________. I’m a bit (2) ______________.\nMai: Don’t worry! Do you like music? I play the guitar.\nTom: Really? Me too! So we have something (3) ______________.\nMai: Great! I (4) ______________ every night. Now I’m (5) ______________!\nTom: I usually stay at home. Sometimes I feel a bit (6) ______________.\nMai: I once sang at a party and forgot the words. I was so (7) ______________!\nTom: Oh no! That sounds really (8) ______________.","speaking1":"Exercise 1. Are you more like Georgie or Neil? Compare yourself with the speakers.\nStep 1: Make notes (5 minutes). Complete the table. Write keywords about Georgie and\nNeil from the video, and then about you.\nQuestion\nGeorgie\nNeil\nMe\nBig parties or small\nevents?\nSmall talk: OK or\nawkward?\nQuestion\nGeorgie\nNeil\nMe\nMeeting new people:\neasy or difficult?\nTime alone: energy or\nlonely?\nStep 2: Record (45-60 seconds). Talk about each question and say who you are more\nlike.\nStep 3: Listen and improve. Listen to your recording. Did you use at least 3 new words?\nRecord again and try to pause less.\nUSEFUL LANGUAGE\nComparing\n• I’m more like Georgie / Neil because...\n• Like Georgie, I...\n• Unlike Neil, I...\n• Both of them..., and so do I.\nGiving reasons\n• I prefer... because...\n• I find small talk...\nFinishing\n• So, I think I’m a bit like both of them!","speaking2":"Exercise 2. Role-play: an invitation\nStudent A\n• You are having a big birthday party on Saturday night with music and dancing.\n• Invite your friend (Student B). Tell him/her about the party.\n• Try to make your friend come. Agree on a plan together.\nStudent B\n• Your friend invites you to a party.\n• You are a bit shy and you don’t like big parties or small talk.\n• Say why politely, and suggest something different, e.g. a small dinner.\nRound 1: Practise the conversation with a partner (1-2 minutes). Then change roles.\nRound 2: Record the conversation on your phone and listen. Did you both give reasons?\nUSEFUL LANGUAGE\nInviting\n• Would you like to come to...?\n• Are you free on Saturday?\nSaying no politely\n• Thanks for asking, but...\n• I’d love to, but...\n• To be honest, I find big parties...\nSuggesting\n• How about...?\n• Why don’t we...?\n• What if we...?\nAgreeing\n• That sounds great!\n• OK, deal!","answer_l1":"Q \nAnswer \nNote \n1 \nTrue \n \n2 \nFalse \nHe doesn’t see them very often because \nthey have responsibilities. \n3 \nTrue \n \n4 \nTrue \nShe can have deeper conversations with \nfewer people. \n5 \nFalse \nHe really doesn’t like big groups of people \nhe doesn’t know. \n6 \nFalse \nHe finds it empty and awkward. \n7 \nTrue \n \n8 \nFalse \nIf he is alone for too long, he feels lonely.","answer_l2":"1 B    2 B    3 A    4 B    5 A","answer_v1":"1 d    2 b    3 e    4 g    5 h    6 a    7 f    8 c","answer_v2":"1 small talk    2 shy    3 in common    4 socialise    5 exhausted    6 lonely    7 \nembarrassed    8 awkward","answer_speaking":": Table answers and model talk \nGeorgie: big parties, but small events are better (shy side) | depends, OK if you find \nsomething in common | likes meeting new people | gets energy from time alone.  \nNeil: small groups he knows | doesn’t like small talk, empty, awkward | sometimes \nembarrassed | feels lonely if alone too long. \nI think I’m more like Neil. Like him, I prefer small groups of friends, because I’m \nquite shy with new people. I find small talk a bit awkward, too. But unlike Neil, I \nreally like spending time alone. Like Georgie, I get energy from relaxing at home and \nreading. If I socialise every day, I feel exhausted. So, I think I’m a bit like both of \nthem! \nSpeaking Exercise 2: Model role-play \nA: Hey! Are you free on Saturday night? It’s my birthday party, there’s music and \ndancing! \nB: Thanks for asking! But to be honest, I find big parties a bit awkward. I’m quite \nshy. \nA: Oh, come on! You know lots of people there. \nB: I’d love to celebrate with you, but why don’t we have a small dinner on Sunday \ninstead? Just a few friends. \nA: Hmm... What if you come to the party for one hour, and then we have dinner on \nSunday too? \nB: OK, deal! One hour on Saturday, and dinner on Sunday. That sounds great!","flashcards":[{"word":"socialise","meaning":"to spend time with other people for fun"},{"word":"lonely","meaning":"sad because you are alone"},{"word":"shy","meaning":"nervous and quiet with people you don’t know"},{"word":"small talk","meaning":"polite conversation about unimportant things, e.g. the weather"},{"word":"awkward","meaning":"not relaxed; making you feel strange"},{"word":"embarrassed","meaning":"feeling silly because of something you did"},{"word":"(have sth) in common","meaning":"to share the same interests or ideas"},{"word":"exhausted","meaning":"very, very tired"}],"mcq_answers":{"1":"B","2":"B","3":"A","4":"B","5":"A"},"media_url":"https://drive.google.com/file/d/1mCmCAb_tSLZa896hOtlnwq5ODEKRrbRO/view","media_preview":"https://drive.google.com/file/d/1mCmCAb_tSLZa896hOtlnwq5ODEKRrbRO/preview","media_type":"video","id":"b3"},{"level":"Beginner","index":4,"title":"Weekends & Days Out","audio_title":"Talking about days out, Real Easy English","source_url":"https://youtu.be/S7mfygW40Cs?t=47","watch":"From 00:47 to 04:47 (from “Very nice. Let’s get\nstarted then.” to “Perfect.”)","page":29,"page_end":35,"before":"1. What did you do last weekend?\n2. Where do people in your city go for a day out?\n3. Do you like exciting activities, like roller coasters? Why / Why not?","listening1":"Exercise 1. Read the table first. Then watch and complete the notes about Beth and\nNeil.\nWrite ONE WORD ONLY for each answer.\nBeth\nNeil\nLast weekend\nwent to a (1)\n______________ museum\nand the theatre\non Friday, watched a (2)\n______________ match all\nday\nBeth\nNeil\nSightseeing in London\nwalked past Big Ben, the\nLondon (3)\n______________ and\nTrafalgar Square\n,\nThrill seeker?\nno, roller coasters make her\nfeel scared and a bit (4)\n______________\nnot anymore, he used to like\n(5) ______________ parks\nDream day trip\n(6) ______________: the\nbeach, an ice cream, fish and\nchips\n(7) ______________ by\ntrain, through the tunnel\nExtra fact\n,\nhe used to (8)\n______________ in\nBrighton","listening2":"Exercise 2. Watch the whole segment again without stopping. Answer the questions.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO things does Neil say about days out with his children?\nA They used to go to the seaside in summer.\nB They went to a theme park every month.\nC His children don’t really want to go out with him now.\nD They often visited museums.\nE They went to Paris for the day.\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO things does Beth want to do in Brighton?\nA go to the beach\nB visit a museum\nC have an ice cream\nD go on a roller coaster\nE watch a cricket match\nQuestions 5-6. Choose the correct letter, A, B or C.\n5. When is Beth more adventurous?\nA at the weekend\nB on holiday abroad\nC when she is with her children\n6. Why does Neil like the idea of a day trip to Paris?\nA He really likes train travel.\nB He has friends there.\nC Hotels in Paris are cheap.","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. day out\na. a fast, exciting ride that goes up and down at a\ntheme park\n2. sightseeing\nb. a place to stay, e.g. a hotel\nWord / phrase\nMeaning\n3. sights\nc. a trip to a place and back home on the same day\n4. thrill seeker\nd. famous places that tourists visit\n5. theme park\ne. a person who loves exciting and a bit dangerous\nactivities\n6. roller coaster\nf. visiting famous places as a tourist\n7. adventurous\ng. a big park with rides and games\n8. accommodation\nh. happy to try new and exciting things","vocab2":"Exercise 2. Odd one out. Circle the word that does not belong in each group. Say\nwhy.\n1. museum / theatre / cricket / art gallery\n2. bungee jumping / parachuting / roller coaster / reading\n3. Big Ben / the London Eye / Trafalgar Square / the Eiffel Tower\n4. train / tunnel / bus / coach\n5. ice cream / fish and chips / beach / sandwich\n6. seaside / beach / coast / mountain","speaking1":"Exercise 1. Retell the conversation in your own words, using new vocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nBeth’s weekend\nNeil’s day out\nAre they thrill seekers?\nTheir dream day trips\nWords from Vocabulary Exercise 1\nI will use (at least 3)\nStep 2: Record (45-60 seconds). Look only at your notes and record yourself on your\nphone.\nStep 3: Listen and improve. Listen to your recording. Did you use at least 3 new words?\nRecord again and try to pause less.\nUSEFUL LANGUAGE\nStarting\n• Neil and Beth talk about...\n• First, Beth tells Neil about...\nPast events\n• Last weekend, she went to...\n• On Friday, he spent most of the day...\nLikes and dislikes\n• She doesn’t like... because they...\n• He used to like..., but not anymore.\nFinishing\n• Beth would like to..., and Neil would like to...","speaking2":"Exercise 2. Plan a day out for a friend\nSITUATION\nYour friend Tom sends you this message:\n“Great news, I’m coming to your city next Saturday! 🎉 I only have ONE day. What\nshould we do? I love food and I’m a bit of a thrill seeker!”\nRound 1: Record a voice message to Tom (45-60 seconds). In your message:\n• say what time to start\n• suggest ONE place for sightseeing\n• suggest ONE exciting activity for a thrill seeker\n• suggest a place to eat\n• finish in a friendly way\nRound 2: Record the message again and add one more idea.\nUSEFUL LANGUAGE\nPlanning\n• Let’s start at...\n• In the morning, we can...\n• After that...\n• In the evening...\nSuggesting\n• Why don’t we...?\n• If you’re a thrill seeker, you’ll love...\nFinishing\n• It’ll be a great day out!\n• See you on Saturday!","answer_l1":"Q \nAnswer \nNote \n1 \nprison \n“a prison museum about medieval \nEngland” \n2 \ncricket \n \n3 \nEye \nthe London Eye \n4 \nsick \n“they scare me and make me feel a bit \nsick” \n5 \ntheme \n \n6 \nBrighton \n \n7 \nParis \nthrough the tunnel under the sea \n8 \nlive \n“I used to live in Brighton.”","answer_l2":"1-2 A, C (in any order)    3-4 A, C (in any order)    5 B    6 A","answer_v1":"1 c    2 f    3 d    4 e    5 g    6 a    7 h    8 b","answer_v2":"1 cricket (a sport, not a place)    2 reading (not exciting or dangerous)    3 the Eiffel \nTower (in Paris, not London)    4 tunnel (not a vehicle)    5 beach (not food)    6 mountain \n(not next to the sea)","answer_speaking":": Model summary \nNeil and Beth talk about days out. Last weekend, Beth went to a prison museum. She \nsays it was a bit boring. She also went to the theatre and did some sightseeing: she \nwalked past Big Ben and the London Eye. Neil watched a cricket match on Friday. \nHe used to take his children to the seaside. Beth isn’t a thrill seeker. She doesn’t like \nroller coasters because they make her feel sick, but she is more adventurous on \nholiday. Neil used to like theme parks, but not anymore. For a day out, Beth wants \nto go to Brighton, and Neil wants to go to Paris by train. He doesn’t need to pay for \naccommodation! \nSpeaking Exercise 2: Model voice message \nHi Tom! That’s great news! Let’s start at eight o’clock with a bowl of phở. After that, \nwe can go sightseeing in the city centre, the old post office and the cathedral are \nbeautiful. You’re a thrill seeker, so in the afternoon, why don’t we go to the water \npark? There’s a really fast slide. In the evening, we can eat street food at the night \nmarket. It’ll be a great day out! See you on Saturday!","flashcards":[{"word":"day out","meaning":"a trip to a place and back home on the same day"},{"word":"sightseeing","meaning":"visiting famous places as a tourist"},{"word":"sights","meaning":"famous places that tourists visit"},{"word":"thrill seeker","meaning":"a person who loves exciting and a bit dangerous activities"},{"word":"theme park","meaning":"a big park with rides and games"},{"word":"roller coaster","meaning":"a fast, exciting ride that goes up and down at a theme park"},{"word":"adventurous","meaning":"happy to try new and exciting things"},{"word":"accommodation","meaning":"a place to stay, e.g. a hotel"}],"mcq_answers":{"5":"B","6":"A"},"media_url":"https://drive.google.com/file/d/1mKivBR6j3WCAVTJcIHXrvsBKcsxlOQu1/view","media_preview":"https://drive.google.com/file/d/1mKivBR6j3WCAVTJcIHXrvsBKcsxlOQu1/preview","media_type":"video","id":"b4"},{"level":"Beginner","index":5,"title":"Childhood","audio_title":"Talking about your childhood, Real Easy English","source_url":"https://youtu.be/yHNOHXFbP78?t=35","watch":"From 00:35 to 04:40 (from “Today we’re talking\nabout our childhoods.” to “...loads of memories for me.”)","page":36,"page_end":41,"before":"1. Where did you live when you were a child?\n2. What games or hobbies did you have when you were young?\n3. How is your childhood different from children’s lives today?","listening1":"Exercise 1. Read the notes first. Then watch and complete the notes about Neil and\nBeth.\nWrite ONE WORD AND/OR A NUMBER for each answer.\nNeil’s childhood\n• lived in (1) ______________ until he was (2) ______________ years old\n• summers: very hot and humid; winters: long, cold and (3) ______________\n• always had a (4) ______________ Christmas\n• sports: football, cricket and ice (5) ______________\nBeth’s childhood\n• her family moved (6) ______________ when she was ten\n• did gymnastics shows with her friends in the (7) ______________\n• recorded a song onto a (8) ______________ and sent it to a recording studio","listening2":"Exercise 2. Watch the whole segment again without stopping.\nQuestions 1-5. Put the topics in the order you hear them. Write the letters A-E.\nTopic\nA\nBeth’s shows and songs\nB\nNeil’s life in Canada\nC\nmobile phones and group chats\nD\nNeil’s sports and ice skating\nE\ntapes, CDs and DVDs\n1 ______________ 2 ______________ 3 ______________ 4 ______________\n5 ______________\nQuestions 6-8. Choose the correct letter, A, B or C.\n6. How good is Neil at ice skating now?\nA brilliant\nB better than most British people, but not brilliant\nC he can’t skate anymore\n7. What annoys Neil about his son?\nA He plays video games all day.\nB He tries to make plans in a group chat, but nothing happens.\nC He never goes to the park.\n8. What brings back amazing memories for Beth?\nA old photos\nB playing tapes and CDs\nC her school books","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. childhood\na. to make you remember things from the past\n2. humid\nb. the time when you are a child\n3. snowman\nc. to organise and perform something for people to\nwatch\n4. primary school\nd. hot and wet (about the weather)\n5. put on a show\ne. a school for children aged about 5 to 11\n6. record (a song)\nf. a figure of a person made of snow\n7. adventure\ng. to put sound or music onto a tape, CD or phone so\nyou can play it later\n8. bring back memories\nh. an exciting experience","vocab2":"Exercise 2. Neil and Beth use “used to” for past habits. Complete the sentences with\nused to + a verb from the box.\nWORD BOX\nplay | live | sing | make | watch | write | go | have\n1. When I was a child, I ______________ in a small village.\n2. My friends and I ______________ football after school.\n3. We ______________ cartoons every Sunday morning.\n4. My sister ______________ very loudly in the shower.\n5. In winter, Neil and his friends ______________ snowmen.\n6. Beth and her friend ______________ their own songs.\n7. I ______________ to the park with my grandfather every evening.\n8. My parents didn’t ______________ the internet when they were children.","speaking1":"Exercise 1. IELTS Speaking Part 1. Answer the questions about your childhood.\nStep 1: Prepare (3 minutes). Write 2-3 keywords for each question.\nQuestion\nYour keywords\n1. Where did you live when you\nwere a child?\n2. What did you like doing when\nyou were a child?\n3. Did you have a favourite toy or\ngame?\nQuestion\nYour keywords\n4. How is your childhood different\nfrom children’s lives today?\nStep 2: Record. Answer each question in 2-3 sentences. Try to use “used to” at least\ntwice.\nStep 3: Listen and improve. Listen. Did you use “used to” correctly? Record again with\none more detail in each answer.\nUSEFUL LANGUAGE\nPast habits\n• When I was a child, I used to...\n• My friends and I would...\nMemories\n• I remember...\n• It brings back great memories.\nThen and now\n• When I was young, we didn’t have...\n• Children today..., but we...","speaking2":"Exercise 2. Mini talk: a happy childhood memory\nDescribe a happy memory from your childhood.\nYou should say:\n• how old you were and where you were\n• who you were with\n• what you did\n• why you still remember it\nRound 1: You have 1 minute to make notes. Then talk for 1 minute.\nRound 2: Tell your memory to a partner. Your partner asks you two questions about it.\nUSEFUL LANGUAGE\nStarting\n• I’d like to talk about a time when I was... years old.\nTelling the story\n• First... Then... After that...\n• We used to... every summer.\nFeelings\n• I felt so happy / excited because...\nFinishing\n• I still remember it because...\n• It brings back amazing memories.","answer_l1":"Q \nAnswer \nNote \n1 \nCanada \nCapital letter \n2 \nten / 10 \n \n3 \nsnowy \n \n4 \nwhite \na white Christmas = snow at Christmas \n5 \nhockey \nice hockey\nQ \nAnswer \nNote \n6 \nhouse \n“my family moved house” \n7 \ngarden \n \n8 \ntape","answer_l2":"1 B    2 A    3 D    4 C    5 E    6 B    7 B    8 B","answer_v1":"1 b    2 d    3 f    4 e    5 c    6 g    7 h    8 a","answer_v2":"1 used to live    2 used to play    3 used to watch    4 used to sing    5 used to make    6 \nused to write    7 used to go    8 use to have (didn’t + use to)","answer_speaking":": Model answers \n1. When I was a child, I lived in a small village near Huế. Our house had a big garden \nwith a mango tree. \n2. I used to play outside with my friends every afternoon. We used to fly kites in the \nfields. \n3. Yes, I had a red bicycle. I rode it everywhere. It really brings back memories. \n4. It’s very different. When I was young, we didn’t have smartphones. Children today \nplay games on phones, but we used to play outside and have lots of adventures. \nSpeaking Exercise 2: Model talk \nI’d like to talk about a time when I was eight years old. Every summer, my family \nused to visit my grandparents in the countryside. One summer, my cousins and I \ndecided to put on a show for the whole family. First, we wrote a song. Then, we\npractised it every day in the garden. On the last evening, we sang and danced, and \neverybody laughed and clapped. I felt so proud and happy. I still remember it because \nmy grandfather recorded it on his old phone, and we still watch it at Tết. It brings \nback amazing memories.","flashcards":[{"word":"childhood","meaning":"the time when you are a child"},{"word":"humid","meaning":"hot and wet (about the weather)"},{"word":"snowman","meaning":"a figure of a person made of snow"},{"word":"primary school","meaning":"a school for children aged about 5 to 11"},{"word":"put on a show","meaning":"to organise and perform something for people to watch"},{"word":"record (a song)","meaning":"to put sound or music onto a tape, CD or phone so you can play it later"},{"word":"adventure","meaning":"an exciting experience"},{"word":"bring back memories","meaning":"to make you remember things from the past"}],"mcq_answers":{"1":"B","2":"A","3":"D","4":"C","5":"E","6":"B","7":"B","8":"B"},"media_url":"https://drive.google.com/file/d/1c6oS3iohpXMWG2Lq7vdy832FxOR6EKwj/view","media_preview":"https://drive.google.com/file/d/1c6oS3iohpXMWG2Lq7vdy832FxOR6EKwj/preview","media_type":"video","id":"b5"},{"level":"Beginner","index":6,"title":"Food","audio_title":"Talking about lunch, Real Easy English","source_url":"https://youtu.be/_5x_h23rXWE?t=55","watch":"From 00:55 to 04:31 (from “What have you got for\nlunch today?” to “I’d prefer the same, really.”)","page":42,"page_end":47,"before":"1. What did you have for lunch yesterday?\n2. Do you usually eat lunch at home, at school/work or in a restaurant?\n3. How do you feel when you are very hungry?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nwatch and complete the sentences.\nWrite ONE WORD AND/OR A NUMBER for each answer.\n1. Today, Beth’s lunch is chicken with potatoes and vegetables in a harissa\n______________.\n2. She heated up her lunch and brought it to work in a little ______________.\n3. Neil’s leftovers are a ______________ with vegetables.\n4. When Beth buys lunch, she usually chooses sushi or ______________.\n5. Neil likes sandwiches with smoked ______________.\n6. If Neil skips lunch, he is in a horrible ______________.\n7. “Hangry” means hungry and ______________.\n8. Brunch is a meal between breakfast and lunch, maybe at about ______________\no’clock.","listening2":"Exercise 2. Watch the whole segment again without stopping. Tick (✓) True or\nFalse.\nStatement\nTrue\nFalse\n1. Beth bought her lunch in a shop today.\n2. Both speakers have leftovers for lunch today.\n3. Beth usually brings leftovers to work because it’s easier.\n4. Neil never buys sandwiches for lunch.\n5. Neil sometimes skips lunch.\n6. One speaker likes the evening meal best because you can sit at\nthe table and chat.\n7. Beth likes eating lunch at her desk in the office.\n8. Neither speaker really likes working lunches.","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. leftovers\na. a meal between breakfast and lunch, late in the\nmorning\n2. heat up\nb. to not eat a meal\n3. flask\nc. food from an earlier meal that you didn’t finish\n4. skip (a meal)\nd. hungry and angry at the same time\n5. hangry\ne. the time in the middle of the working day when you\nstop to eat\n6. brunch\nf. to make food hot again\n7. working lunch\ng. eating lunch while you are working\n8. lunch break\nh. a container that keeps food or drinks hot or cold","vocab2":"Exercise 2. Complete the sentences with words and phrases from the box.\nWORD BOX\nleftovers | heat up | skip | hangry | brunch | flask | working lunch | lunch break\n1. We didn’t finish the rice, so I took the ______________ to school.\n2. I always ______________ my lunch in the microwave before I eat it.\n3. Don’t ______________ breakfast, you’ll be tired all morning.\n4. My little brother gets very ______________ when dinner is late!\n5. On Sundays, we have a big ______________ at 10 a.m., phở and coffee.\n6. My mum puts hot tea in a ______________ for my dad.\n7. I’m having a ______________ today: eating a bánh mì and writing emails.\n8. In my ______________, I eat quickly and then go for a short walk.","speaking1":"Exercise 1. Class survey. Ask a partner about lunch. Then report the answers.\nStep 1: Ask and write (5 minutes). Ask your partner the questions. Write short answers.\nQuestion\nMy partner’s answer\n1. What do you usually have for\nlunch?\n2. Do you ever eat leftovers?\nWhat?\n3. Have you ever skipped a meal?\nHow did you feel?\n4. What’s your favourite meal of\nthe day? Why?\n5. Do you like working lunches?\nWhy / Why not?\nStep 2: Report (45-60 seconds). Tell the class or record yourself: talk about your\npartner.\nStep 3: Listen and improve. Listen. Did you use he/she + verb-s correctly (e.g. “She\nusually has...”)? Record again.\nUSEFUL LANGUAGE\nAsking\n• What do you usually have for...?\n• Have you ever...?\n• Why?\nReporting\n• My partner..., usually has... for lunch.\n• She/He sometimes eats leftovers, for example...\n• Her/His favourite meal is... because...\nFinishing\n• So, she/he is quite similar to me / very different from me.","speaking2":"Exercise 2. Voice message: lunch advice\nSITUATION\nSam, a new colleague from the UK, sends you this message:\n“Hi! It’s my first week in Vietnam 🍜 Where should I go for lunch near the office?\nWhat should I try? I don’t want to get hangry this afternoon!”\nRound 1: Record a voice message to Sam (45-60 seconds). In your message:\n• recommend TWO dishes and say what they are\n• say where to buy them and how much they cost\n• give ONE tip (e.g. leftovers, lunch break, don’t skip lunch)\n• finish in a friendly way\nRound 2: Record the message again in 45 seconds, without notes.\nUSEFUL LANGUAGE\nRecommending\n• You should try...\n• I really recommend...\n• It’s a kind of... with...\nPlaces and prices\n• There’s a great place near...\n• It only costs about... dong.\nTips\n• Don’t skip lunch!\n• In your lunch break, you can...\nFinishing\n• Enjoy your lunch!\n• Let me know what you think!","answer_l1":"Q \nAnswer \nNote \n1 \npaste \nharissa paste: a spicy sauce \n2 \nflask \n \n3 \npasta \nNeil made it yesterday. \n4 \nramen \n \n5 \nsalmon \nsmoked salmon \n6 \nmood \n“I would be in a horrible mood” \n7 \nangry \n \n8 \n10 / ten \n“maybe 10:00”","answer_l2":"Q \nAnswer \nNote \n1 \nFalse \nHer lunch is leftovers. \n2 \nTrue \n \n3 \nTrue \nand then she doesn’t need to buy lunch\nQ \nAnswer \nNote \n4 \nFalse \nHe sometimes buys a sandwich. \n5 \nFalse \n“No. No way!” \n6 \nTrue \n \n7 \nFalse \nIn the office, she doesn’t want to eat at her \ndesk. \n8 \nTrue","answer_v1":"1 c    2 f    3 h    4 b    5 d    6 a    7 g    8 e","answer_v2":"1 leftovers    2 heat up    3 skip    4 hangry    5 brunch    6 flask    7 working lunch    8 \nlunch break","answer_speaking":": Model report \nMy partner, Linh, usually has rice with fish and vegetables for lunch. She often eats \nleftovers from dinner, her mum is a great cook! She skipped breakfast once and she \nfelt very hangry at school. Her favourite meal is dinner because her family sits at the \ntable and chats. She doesn’t like working lunches because she wants to relax in her \nlunch break. So, she is quite similar to me! \nSpeaking Exercise 2: Model voice message \nHi Sam! Welcome to Vietnam! You should try cơm tấm, it’s broken rice with grilled \npork. There’s a great place next to our office, and it only costs about 40,000 dong. I \nalso really recommend bánh mì. It’s a kind of sandwich with meat, vegetables and a\nlittle chilli. Here’s my tip: don’t skip lunch, our afternoons are busy and you’ll get \nhangry! Enjoy your lunch, and let me know what you think!","flashcards":[{"word":"leftovers","meaning":"food from an earlier meal that you didn’t finish"},{"word":"heat up","meaning":"to make food hot again"},{"word":"flask","meaning":"a container that keeps food or drinks hot or cold"},{"word":"skip (a meal)","meaning":"to not eat a meal"},{"word":"hangry","meaning":"hungry and angry at the same time"},{"word":"brunch","meaning":"a meal between breakfast and lunch, late in the morning"},{"word":"working lunch","meaning":"eating lunch while you are working"},{"word":"lunch break","meaning":"the time in the middle of the working day when you stop to eat"}],"mcq_answers":{},"media_url":"https://drive.google.com/file/d/1rWbG4sqVbCY8yv-neJhg162j5KZQEzOH/view","media_preview":"https://drive.google.com/file/d/1rWbG4sqVbCY8yv-neJhg162j5KZQEzOH/preview","media_type":"video","id":"b6"},{"level":"Beginner","index":7,"title":"Weather & Seasons","audio_title":"The best things about autumn in the UK, Improve your listening with Real Easy English","source_url":"https://youtu.be/UcfT3qOhyF0?t=41","watch":"From 00:41 to 05:07 (from “So, right now it is\nautumn in the UK.” to “That’s a whole new thing.”)","page":48,"page_end":53,"before":"1. What are the seasons like where you live?\n2. What is your favourite season? Why?\n3. What do you think autumn is like in the UK? Write three words.","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nwatch and complete the sentences.\nWrite ONE WORD ONLY for each answer.\n1. In some other English-speaking countries, autumn is called “______________”.\n2. The leaves on the ground are ______________, so they make a nice sound when you\nwalk on them.\n3. Before they fall, the leaves turn a beautiful orange-reddish ______________.\n4. In autumn, Becca is excited to wear jumpers and big ______________.\n5. This summer was very ______________, so both speakers are happy that autumn is\nhere.\n6. Halloween is at the end of ______________.\n7. Bonfire Night is on the 5th of ______________.\n8. When one speaker was younger, they cooked baked ______________ in the bonfire.","listening2":"Exercise 2. Correct the mistakes. Each sentence has ONE wrong word. Watch again\nand write the correct word.\n1. You can make big piles of leaves and sit on them. then ______________\n2. “Cosy” is the feeling of being warm when things around you are hot. then\n______________\n3. Halloween is more popular in the UK than in the USA. then ______________\n4. These days, Bonfire Night is more about music. then ______________\n5. One speaker doesn’t have a bonfire now because they live in the countryside. then\n______________\n6. You wrap the potato in paper and put it in the fire. then ______________\n7. When you open the potato, it is often completely white. then ______________","vocab1":"Exercise 1. Word building. Complete the table with the adjectives from the video.\nNoun\nAdjective\ne.g.\nautumn\nautumnal\n1\ncrunch\n______________\nNoun\nAdjective\n2\nnoise\n______________\n3\nscare\n______________\n4\nbeauty\n______________\n5\ntaste\n______________\n6\ndifficulty\n______________","vocab2":"Exercise 2. Complete the sentences with the adjectives from Vocabulary Exercise 1\nor the word “cosy”.\n1. I love sitting by the window with a hot drink on a rainy day. It feels so\n______________.\n2. At Tết, the streets are full of ______________ flowers.\n3. Don’t watch that film before bed, it’s really ______________!\n4. Our neighbours had a party until 2 a.m. It was very ______________.\n5. This bánh xèo is very ______________. Can I have another one?\n6. I like walking on dry, ______________ leaves in the park.\n7. Learning to ride a motorbike was ______________ at first.\n8. In September, the cool mornings in Hà Nội feel quite ______________.","speaking1":"Exercise 1. Retell the conversation in your own words, using new vocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat happens in the UK in\nautumn?\nHow do the speakers feel about\nautumn this year? Why?\nTwo special days in autumn\nA bonfire memory\nAdjectives I will use (at least 3)\nStep 2: Record (45-60 seconds). Look only at your notes and record yourself on your\nphone.\nStep 3: Listen and improve. Listen to your recording. Did you use at least 3 new words?\nRecord again and try to pause less.\nUSEFUL LANGUAGE\nStarting\n• Becca and Neil talk about autumn in the UK.\nDescribing\n• In autumn, the leaves...\n• Becca loves... because...\nFeelings\n• Usually Neil isn’t a big fan of autumn, but this year...\nSpecial days\n• At the end of October, there is...\n• On the 5th of November, people...\nFinishing\n• One of them used to..., but the other has never...","speaking2":"Exercise 2. Mini talk: my favourite season\nDescribe your favourite season in your city.\nYou should say:\n• what the weather is like\n• what you wear\n• what you like to do\n• why it is your favourite season\nRound 1: You have 1 minute to make notes. Then talk for 1 minute. Use at least 3\nadjectives from this unit.\nRound 2: Give your talk to a partner. Your partner says one thing they like and one thing\nthey don’t like about your season.\nUSEFUL LANGUAGE\nStarting\n• My favourite season is...\n• In my city, there are... seasons.\nWeather\n• It’s usually warm / cool / humid / rainy.\n• The mornings are...\nClothes and activities\n• I love wearing...\n• It’s the perfect time to...\nReasons\n• I love it because it feels...\n• It reminds me of...","answer_l1":"Q \nAnswer \nNote \n1 \nfall \nused in American English \n2 \ncrunchy \n \n3 \ncolour \n“color” is also accepted \n4 \nboots \n \n5 \nhot \n“it has been far too hot this summer” \n6 \nOctober \nCapital letter \n7 \nNovember \nCapital letter \n8 \npotatoes \nwrapped in foil","answer_l2":"Q \nAnswer \nNote \n1 \njump (into them) \n \n2 \ncold \n \n3 \nless \n“It’s not as popular in the UK as it is in the \nUSA.” \n4 \nfireworks\nQ \nAnswer \nNote \n5 \ncity \nIt’s not very nice for her neighbours. \n6 \nfoil \n \n7 \nblack","answer_v1":"1 crunchy    2 noisy    3 scary    4 beautiful    5 tasty    6 difficult","answer_v2":"1 cosy    2 beautiful    3 scary    4 noisy    5 tasty    6 crunchy    7 difficult    8 autumnal","answer_speaking":": Model summary \nBecca and Neil talk about autumn in the UK. In autumn, the leaves turn orange and \nred and then fall. They are crunchy on the ground. Becca loves autumnal things. \nShe wants to wear jumpers and boots and feel cosy. Usually Neil isn’t a big fan of \nautumn, because he loves summer, but this year the summer was too hot, so they are \nboth happy. There are two special days: Halloween at the end of October, which \nBecca loves because it’s a bit scary, and Bonfire Night on the 5th of November, with \nnoisy fireworks. When one of them was younger, they cooked potatoes in a bonfire, \nbut it was difficult to get them right! \nSpeaking Exercise 2: Model talk \nMy favourite season is autumn in Hà Nội. It’s usually from September to November. \nThe weather is cool and dry, and the mornings are fresh and beautiful. I love wearing \na light jacket and jeans. It’s the perfect time to walk around Hồ Gươm and eat cốm, a \ntasty green rice snack that you can only get in autumn. I love autumn because it feels\ncalm and cosy, and the streets smell of milk flowers. It’s not too hot and not too cold, \nit’s just perfect.","flashcards":[{"word":"crunch → adjective?","meaning":"crunchy"},{"word":"noise → adjective?","meaning":"noisy"},{"word":"scare → adjective?","meaning":"scary"},{"word":"beauty → adjective?","meaning":"beautiful"},{"word":"taste → adjective?","meaning":"tasty"},{"word":"difficulty → adjective?","meaning":"difficult"}],"mcq_answers":{},"media_url":"https://drive.google.com/file/d/1es3hdwwaVZKNHi1A8nfbqhKDqcgcDm2K/view","media_preview":"https://drive.google.com/file/d/1es3hdwwaVZKNHi1A8nfbqhKDqcgcDm2K/preview","media_type":"video","id":"b7"},{"level":"Beginner","index":8,"title":"Transport","audio_title":"Talking about public transport, Real Easy English","source_url":"https://youtu.be/Fxi4uYmCrPo?t=36","watch":"From 00:36 to 04:40 (from “And we’re actually\ntalking about transport today.” to “It was just exciting.”)","page":54,"page_end":59,"before":"1. How do you usually get to school or work? How long does it take?\n2. What is public transport like in your city?\n3. What is the best journey you have ever had?","listening1":"Exercise 1. Read the notes first. Then watch and complete the notes.\nWrite ONE WORD AND/OR A NUMBER for each answer.\nGeorgie’s commute\n• walks to the station for 15 to (1) ______________ minutes\n• gets the Tube, then she (2) ______________ and gets another train\nNeil’s commute\n• first takes a (3) ______________ to the Tube stop\n• lives about (4) ______________ kilometres from the station\nThe Tube\n• good: the trains go very (5) ______________\n• good: it’s the quickest way into central London because there’s so much (6)\n______________\n• bad: at rush hour, it’s very crowded or “(7) ______________”\n• one speaker always gets a (8) ______________ because they get on at the first stop","listening2":"Exercise 2. Watch the whole segment again without stopping. Choose the correct\nletter, A, B or C.\n1. Why does Neil think driving into central London is a bad idea?\nA Parking is expensive.\nB There is too much traffic.\nC The roads are closed.\n2. What does one speaker say about the trains on the Tube?\nA They are new and big.\nB They are old and small.\nC They are always late.\n3. Why are the buses near one speaker’s home often late?\nA There are roadworks and traffic lights.\nB There are not many buses.\nC The drivers stop for a break.\n4. Why does one speaker like the train for long journeys in the UK?\nA It’s cheaper and he can sleep.\nB It’s faster and relaxing.\nC He can work on his laptop.\n5. How long did the train journey from Prague to Moscow take?\nA about three hours\nB about three days\nC about three weeks","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. commute\na. the busy time when most people travel to or from\nwork\n2. the Tube\nb. the underground train system in London\n3. convenient\nc. very full of people\n4. frequent\nd. easy to use and useful for you\n5. reliable\ne. the journey you make to work or school every day\n6. rush hour\nf. when something happens later than planned\n7. packed\ng. happening often\n8. delay\nh. you can trust it to work well","vocab2":"Exercise 2. Choose the correct word in each sentence.\n1. The buses in my town are very (reliable / unreliable). They are often late.\n2. At rush hour, the metro is (packed / empty), there’s no space to stand!\n3. Buses come every five minutes. They’re very (frequent / slow).\n4. There are roadworks on Lê Lợi Street, so there are long (delays / tickets).\n5. My (commute / holiday) takes 40 minutes by motorbike every morning.\n6. Booking a Grab on your phone is very (convenient / packed).\n7. A long train journey can be very (relaxing / crowded), you can read and look out of\nthe window.\n8. I got on at the first stop, so I got a (seat / ticket).","speaking1":"Exercise 1. IELTS Speaking Part 1. Answer the questions about transport.\nStep 1: Prepare (3 minutes). Write 2-3 keywords for each question.\nQuestion\nYour keywords\n1. How do you usually get to\nschool or work?\n2. How long does your journey\ntake?\n3. What do you think of public\ntransport in your city?\n4. Do you prefer travelling by bus\nor by motorbike? Why?\nStep 2: Record. Answer each question in 2-3 sentences. Use at least 3 words from\nVocabulary","speaking2":"Exercise 1.\nStep 3: Listen and improve. Listen. Did you give a reason for each answer? Record\nagain.\nUSEFUL LANGUAGE\nYour journey\n• I usually go by bus / motorbike / metro.\n• My commute takes about... minutes.\nGood points\n• It’s convenient / cheap / quick because...\n• The buses are quite frequent.\nBad points\n• At rush hour, it’s really packed.\n• There are often delays because of...\nPreferences\n• I prefer... because...\nExercise 2. Role-play: helping a tourist\nStudent A, tourist\n• You are visiting Ho Chi Minh City. You are in District 1.\n• You need to get to Tân Sơn Nhất Airport at 5 p.m.\n• Ask a local person about the best way to go, the time and the price.\nStudent B, local person\n• A tourist asks you for help.\n• Suggest TWO ways to get to the airport (e.g. Grab, bus).\n• Warn him/her about rush hour and give ONE tip.\nRound 1: Practise the conversation with a partner (1-2 minutes). Then change roles.\nRound 2: Change the place: the tourist wants to go to your favourite place in your city.\nUSEFUL LANGUAGE\nAsking\n• Excuse me, what’s the best way to get to...?\n• How long does it take?\n• How much is it?\nGiving advice\n• I’d take...\n• You can also...\n• At rush hour, it’s better to...\nDescribing\n• It’s quick / cheap / convenient, but...\n• There’s a lot of traffic at...\nFinishing\n• Thanks so much!\n• You’re welcome. Have a good flight!","answer_l1":"Q \nAnswer \nNote \n1 \n20 / twenty \n \n2 \nchanges \n“then I change and then get another one” \n3 \nbus \n \n4 \nthree / 3 \n“A couple of miles... Three kilometres.” \n5 \nfrequently \n \n6 \ntraffic \n \n7 \npacked \n \n8 \nseat","answer_l2":"1 B    2 B    3 A    4 B    5 B","answer_v1":"1 e    2 b    3 d    4 g    5 h    6 a    7 c    8 f","answer_v2":"1 unreliable    2 packed    3 frequent    4 delays    5 commute    6 convenient    7 relaxing    \n8 seat","answer_speaking":": Model answers \n1. I usually go to work by motorbike, but sometimes I take the new metro. \n2. My commute takes about 30 minutes, but at rush hour it can take 45 minutes. \n3. It’s getting better. The metro is convenient and reliable, but the buses are often \npacked. \n4. I prefer the motorbike because I can go anywhere and stop when I want. But in the \nrain, the bus is better! \nSpeaking Exercise 2: Model role-play \nA: Excuse me, what’s the best way to get to the airport? \nB: I’d take a Grab. It’s convenient and it costs about 150,000 dong. You can also \ntake the 109 bus. It’s cheaper. \nA: How long does it take? \nB: Usually 30 minutes, but at 5 p.m. it’s rush hour, so there can be long delays. I’d \nleave at four. \nA: Great idea. Thanks so much! \nB: You’re welcome. Have a good flight!","flashcards":[{"word":"commute","meaning":"the journey you make to work or school every day"},{"word":"the Tube","meaning":"the underground train system in London"},{"word":"convenient","meaning":"easy to use and useful for you"},{"word":"frequent","meaning":"happening often"},{"word":"reliable","meaning":"you can trust it to work well"},{"word":"rush hour","meaning":"the busy time when most people travel to or from work"},{"word":"packed","meaning":"very full of people"},{"word":"delay","meaning":"when something happens later than planned"}],"mcq_answers":{"1":"B","2":"B","3":"A","4":"B","5":"B"},"media_url":"https://drive.google.com/file/d/1OMGUS9wKH6hjFRSqT8CPJ4Ya4Y0YPkr7/view","media_preview":"https://drive.google.com/file/d/1OMGUS9wKH6hjFRSqT8CPJ4Ya4Y0YPkr7/preview","media_type":"video","id":"b8"},{"level":"Beginner","index":9,"title":"Environment","audio_title":"The things we throw away, Real Easy English","source_url":"https://youtu.be/3FP-RbqWB_s?t=29","watch":"From 00:29 to 04:15 (from “Well, today we are\ntalking about waste.” to “...cut down on my use of clingfilm.”)","page":60,"page_end":65,"before":"1. What things do you throw away every day?\n2. Do people in your city recycle? What do they recycle?\n3. What is one thing you do to help the environment?","listening1":"Exercise 1. Read the sentences first and guess what kind of word is missing. Then\nwatch and complete the sentences.\nWrite ONE WORD ONLY for each answer.\n1. “Waste” means things that we don’t ______________ anymore.\n2. At home, one speaker recycles glass, plastic, metal and ______________.\n3. The other speaker has a separate ______________ for different things.\n4. In the supermarket, one speaker tries not to buy fruit and vegetables wrapped in\n______________.\n5. These days, almost everybody carries a ______________ water bottle.\n6. Beth likes having a ______________ to relax.\n7. Showers are better because they use less ______________.\n8. Neil wants to cut down on his use of ______________.","listening2":"Exercise 2. Watch the whole segment again without stopping. Answer the questions.\nQuestions 1-2. Choose TWO letters, A-E.\nWhich TWO things do the speakers say about plastic?\nA It can be difficult to find food that isn’t covered in plastic.\nB Plastic bottles of water are cheaper now.\nC Many people now carry their own bottle instead of buying plastic ones.\nD All plastic is easy to recycle.\nE Supermarkets don’t sell fruit in plastic any more.\nQuestions 3-4. Choose TWO letters, A-E.\nWhich TWO things are true about Beth?\nA She has a bath about once a week.\nB She never has showers.\nC She feels guilty because a bath uses a lot of water.\nD She wants to have more baths.\nE She uses clingfilm every day.\nQuestions 5-6. Choose the correct letter, A, B or C.\n5. Why is it hard for Neil to stop using clingfilm?\nA It’s very cheap.\nB It’s convenient and keeps food together.\nC His family likes it.\n6. What happened when one speaker was a child?\nA Their family recycled everything.\nB Everything went in the same bin.\nC They had four bins at home.","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. waste\na. things you throw away, e.g. an empty crisp packet\n2. rubbish\nb. to use something less\n3. recycle\nc. things that we don’t want or need anymore\n4. bin\nd. feeling bad because you did something wrong\n5. reusable\ne. used only one time and then thrown away\n6. single-use\nf. a container for rubbish\n7. cut down on\ng. can be used again and again\n8. guilty\nh. to make old things into new things","vocab2":"Exercise 2. Collocations. Match the verbs (1-6) with the words (a-f). Then write\nTHREE sentences about you.\nVerb\nWords\n1. recycle\na. a bath or a shower\nVerb\nWords\n2. carry\nb. fruit without plastic\n3. have\nc. glass and plastic\n4. cut down on\nd. single-use plastic\n5. avoid\ne. a reusable bottle\n6. buy\nf. clingfilm\n7. I always / sometimes / never ______________\n8. I want to ______________\n9. In my family, we ______________","speaking1":"Exercise 1. Retell the conversation in your own words, using new vocabulary.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhat is “waste”?\nWhat the speakers recycle at home\nPlastic: two things they talk about\nWater: baths and showers\nWhat each speaker wants to cut\ndown on\nStep 2: Record (45-60 seconds). Look only at your notes and record yourself on your\nphone.\nStep 3: Listen and improve. Listen to your recording. Did you use at least 3 new words?\nRecord again and try to pause less.\nUSEFUL LANGUAGE\nStarting\n• Neil and Beth talk about waste.\nAt home\n• They both recycle...\n• One speaker has a separate bin for...\nPlastic and water\n• It’s difficult to...\n• Today, most people carry...\n• Beth feels guilty because...\nPlans\n• Beth wants to..., and Neil wants to cut down on...","speaking2":"Exercise 2. Persuade your little brother\nSITUATION\nYour little brother Bin (10 years old) says:\n“Why do I have to put plastic and paper in different bins? It’s boring! I want to put\neverything in one bin.”\nRound 1: Talk to Bin for about 1 minute. In your talk:\n• explain what recycling is in simple words\n• give TWO reasons why it is important\n• suggest ONE easy thing he can do every day\n• finish in a kind and positive way\nRound 2: Your partner plays Bin and says “But why?” after each reason. Answer each\nquestion.\nUSEFUL LANGUAGE\nExplaining\n• Recycling means...\n• When we recycle, old bottles become...\nReasons\n• It’s important because...\n• If we put everything in one bin...\nSuggesting\n• Why don’t you...?\n• You could...\n• It’s really easy!\nFinishing\n• You’re helping the planet!\n• Let’s do it together.","answer_l1":"Q \nAnswer \nNote \n1 \nwant \n“things that we don’t want anymore” \n2 \ncard \n \n3 \nbin\nQ \nAnswer \nNote \n4 \nplastic \n \n5 \nreusable \n \n6 \nbath \n \n7 \nwater \n \n8 \nclingfilm \nthin plastic sheets to wrap food","answer_l2":"1-2 A, C (any order)    3-4 A, C (any order)    5 B    6 B","answer_v1":"1 c    2 a    3 h    4 f    5 g    6 e    7 b    8 d","answer_v2":"1 c    2 e    3 a    4 f    5 d    6 b. Sentences 7-9: students’ own answers.","answer_speaking":": Model summary \nNeil and Beth talk about waste, things we don’t want anymore. At home, they both \nrecycle glass, plastic and paper, and one speaker has a separate bin for food. They \nsay it’s difficult to find fruit and vegetables that aren’t in plastic. But today, most \npeople carry a reusable water bottle, so they don’t buy single-use plastic bottles. \nBeth loves having a bath, but she feels guilty because it uses a lot of water. In the \nfuture, she wants to have fewer baths, and Neil wants to cut down on clingfilm. \nSpeaking Exercise 2: Model talk \nBin, I know it’s boring, but listen. Recycling means we make old things into new \nthings. Your plastic bottle can become a new bottle or even a T-shirt! It’s important\nbecause we have too much rubbish. If we put everything in one bin, it goes into the \nground or the sea, and the fish eat it. Here’s an easy idea: after you drink your milk, \nwash the box and put it in the paper bin. And take your reusable bottle to school. It’s \nreally easy, and you’re helping the planet. Let’s do it together!","flashcards":[{"word":"waste","meaning":"things that we don’t want or need anymore"},{"word":"rubbish","meaning":"things you throw away, e.g. an empty crisp packet"},{"word":"recycle","meaning":"to make old things into new things"},{"word":"bin","meaning":"a container for rubbish"},{"word":"reusable","meaning":"can be used again and again"},{"word":"single-use","meaning":"used only one time and then thrown away"},{"word":"cut down on","meaning":"to use something less"},{"word":"guilty","meaning":"feeling bad because you did something wrong"}],"mcq_answers":{"5":"B","6":"B"},"media_url":"https://drive.google.com/file/d/16xn59wHQKUmWtQr-rcLxO9kwC1-GIuVK/view","media_preview":"https://drive.google.com/file/d/16xn59wHQKUmWtQr-rcLxO9kwC1-GIuVK/preview","media_type":"video","id":"b9"},{"level":"Beginner","index":10,"title":"Work","audio_title":"Neil’s difficult summer job in Canada, Real Easy English","source_url":"https://youtu.be/HHLfkHkUc14?t=40","watch":"From 00:40 to 04:00 (from “So Neil, tell us all\nabout your bad or difficult job.” to “And that’s some good\nadvice.”)","page":66,"page_end":70,"before":"1. Have you ever had a job, for example a part-time or summer job?\n2. What makes a job difficult?\n3. What job would you love to do? What job would you hate?","listening1":"Exercise 1. Neil’s story. Read the events (A-F). Then watch and put them in the\norder Neil tells them.\nEvents in Neil’s story:\nA He weighed his beans.\nB He got paid $8.\nC He found a job picking beans in Canada.\nD He found out that workers were paid for the amount they picked.\nE He paid $10 for the coach.\nF He worked hard all day in the heat.\n1 ______________ 2 ______________ 3 ______________ 4 ______________ 5\n______________ 6 ______________","listening2":"Exercise 2. Georgie’s story. Watch again and answer the questions.\nWrite NO MORE THAN TWO WORDS for each answer.\n1. What kind of job did Georgie have? ______________\n2. Was the job permanent or temporary? ______________\n3. How did most of the customers feel? ______________\n4. The company changed the warehouse and which other company? The\n______________ company\n5. How did the job make Georgie feel? (one word) ______________\n6. Complete Georgie’s advice: “Don’t take it to ______________.”\n7. What does Neil say you should do before you say yes to a job? Do some\n______________","vocab1":"Exercise 1. Match the words and phrases (1-8) with their meanings (a-h).\nWord / phrase\nMeaning\n1. temporary\na. making you very tired\n2. customer service\nb. worried and nervous\n3. warehouse\nc. a big building where a company keeps its products\n4. stressful\nd. for a short time only, not forever\nWord / phrase\nMeaning\n5. anxious\ne. to feel very hurt or upset by what someone says\n6. exhausting\nf. the part of a company that helps customers with\nproblems\n7. annoying\ng. making you feel a little angry\n8. take it to heart\nh. making you feel worried and under pressure","vocab2":"Exercise 2. -ed or -ing? Choose the correct word in each sentence.\nUse -ing to describe a thing or a situation (The job was exhausting). Use -ed to describe\nhow a person feels (I was exhausted).\n1. Picking beans all day in the heat was (exhausting / exhausted).\n2. After my night shift, I’m always (exhausting / exhausted).\n3. The angry phone calls were very (annoying / annoyed).\n4. Neil was (annoying / annoyed) when he got only $8.\n5. My first day at the café was really (interesting / interested).\n6. I’m (interesting / interested) in working in a hotel.\n7. The news about my pay was (surprising / surprised).\n8. I felt (boring / bored) at my summer job because there was nothing to do.","speaking1":"Exercise 1. Retell ONE of the two stories (Neil’s or Georgie’s) in your own words.\nStep 1: Make notes (5 minutes). Complete the plan with keywords only, not full\nsentences.\nPlan\nYour keywords\nWhose story? What was the job?\nWhere? When?\nWhat happened?\nHow did he/she feel?\nHis/her advice\nStep 2: Record (45-60 seconds). Look only at your notes and record yourself on your\nphone.\nStep 3: Listen and improve. Listen to your recording. Did you use at least 3 new words?\nRecord again and try to pause less.\nUSEFUL LANGUAGE\nStarting\n• Neil / Georgie had a difficult job.\n• When he was a student, he...\nTelling the story\n• First... Then... In the end...\nFeelings\n• It was really exhausting / stressful.\n• She felt anxious because...\nAdvice\n• His/her advice is to...","speaking2":"Exercise 2. Mini talk: a job I wouldn’t like to do\nDescribe a job you wouldn’t like to do.\nYou should say:\n• what the job is\n• what people do in this job\n• how you think the job feels\n• why you wouldn’t like to do it\nRound 1: You have 1 minute to make notes. Then talk for 1 minute. Use at least 3\nadjectives from this unit.\nRound 2: Talk about a job you WOULD like to do. Change the adjectives.\nUSEFUL LANGUAGE\nStarting\n• I wouldn’t like to be a...\n• A job I would never do is...\nDescribing the job\n• People in this job have to...\n• They work... hours a day.\nFeelings\n• I think it’s very stressful / exhausting / boring.\n• I would feel anxious because...\nReasons\n• The main reason is that...\n• Also...","answer_l1":"1 C    2 D    3 E    4 F    5 A    6 B","answer_l2":"Q \nAnswer \nNote \n1 \ncustomer service \n \n2 \ntemporary \n“it was just a temporary one” \n3 \nunhappy / angry \n \n4 \ndelivery \n \n5 \nanxious / stressed \n“It made me feel very anxious.” \n6 \nheart \n \n7 \nresearch","answer_v1":"1 d    2 f    3 c    4 h    5 b    6 a    7 g    8 e","answer_v2":"1 exhausting    2 exhausted    3 annoying    4 annoyed    5 interesting    6 interested    7 \nsurprising    8 bored","answer_speaking":": Model retelling \nWhen Neil was a student, he found a job picking beans on a farm in Canada. It was \nfar away, so he paid $10 for the coach. When he got there, he found out that workers \nwere paid for the amount they picked. He worked hard all day in the heat. In the end, \nhe weighed his beans and got only $8, less than the coach! It was exhausting and \nvery annoying. Now it’s a funny story. His advice is to do some research before you \nsay yes to a job. \nSpeaking Exercise 2: Model talk \nI wouldn’t like to be a call centre worker. People in this job answer the phone all day \nand help customers with problems. Many customers are angry, so I think it’s very \nstressful. I would feel anxious and I would take it to heart. Also, you have to sit in \nthe same chair for eight hours, and that sounds boring and exhausting. The main \nreason I wouldn’t like it is that I prefer to work with people face to face.","flashcards":[{"word":"temporary","meaning":"for a short time only, not forever"},{"word":"customer service","meaning":"the part of a company that helps customers with problems"},{"word":"warehouse","meaning":"a big building where a company keeps its products"},{"word":"stressful","meaning":"making you feel worried and under pressure"},{"word":"anxious","meaning":"worried and nervous"},{"word":"exhausting","meaning":"making you very tired"},{"word":"annoying","meaning":"making you feel a little angry"},{"word":"take it to heart","meaning":"to feel very hurt or upset by what someone says"}],"mcq_answers":{},"media_url":"https://drive.google.com/file/d/1mi9ua3AGjYHEFhEcVqRcdQIiZYE2PUPQ/view","media_preview":"https://dri
